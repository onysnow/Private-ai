[tool.black]
line-length = 88
target-version = ["py312"]
# Start with modules that already match Black cleanly today.
include = 'app/(connectors/.*\.py|core/(access|config|time)\.py)$'
extend-exclude = '/__pycache__/'

[tool.ruff]
line-length = 88
target-version = "py312"
include = [
    "app/connectors/*.py",
    "app/core/access.py",
    "app/core/config.py",
    "app/core/time.py",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app/connectors", "app/core/access.py", "app/core/config.py", "app/core/time.py"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

# Deferred until the remaining backend packages are ready for broader type-checking.
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"
