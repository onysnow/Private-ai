[tool.black]
line-length = 88
target-version = ["py312"]
# Start with modules that already match Black cleanly today.
include = 'app/(connectors/.*\.py|core/(access|config|time)\.py)$'
extend-exclude = '/__pycache__/'

[tool.ruff]
line-length = 88
target-version = "py312"
include = [
    "app/connectors/*.py",
    "app/core/access.py",
    "app/core/config.py",
    "app/core/time.py",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = [
    "app/connectors", "app/core/access.py", "app/core/config.py", "app/core/time.py",
    "app/models", "app/schemas",
    # STRUCT-0013 widening, cycle 2: the smallest safely-completable app/services slice
    # (6 files with 1-2 mypy errors each, plus their 2 transitively-imported dependencies
    # that mypy analyzes regardless of whether they are listed here).
    "app/services/sources.py", "app/services/lifecycle.py", "app/services/entity_merge.py",
    "app/services/connector_findings.py", "app/services/claims.py", "app/services/timeline.py",
    "app/services/relationships.py", "app/services/post_merge_reconciliation.py",
    # STRUCT-0013 widening, cycle 3: the next-smallest slice (13 errors across 3 files).
    "app/services/resolution.py", "app/services/external_relationships.py",
    "app/services/openaleph_corpus.py",
]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

# Deferred until the remaining backend packages are ready for broader type-checking
# (STRUCT-0013, cycle 3 update): 11 app/services files brought under coverage above.
# The rest of app/services now stands at 270 errors across 9 files (re-measured
# this cycle; was 282/12 files before this widening) -- dominated by search.py alone
# (106 errors), then documents.py (41), leads.py (38), provenance.py (35), dossier.py
# (17), investigations.py/exports.py/entities.py/consolidation.py (8 each). app/ai
# (134 errors, not yet investigated) and app/api remain untouched widening targets.
# The 11 files added across cycles 2-3 are NOT yet clean under disallow_untyped_defs=true
# (missing return-type/arg annotations, mostly on route-payload `body` params whose
# concrete Pydantic schema type needs to be threaded through) -- left under the relaxed
# default rather than rushing those annotations in this cycle; a future cycle can flip
# them to the strict override alongside app.models.*/app.schemas.* once annotated.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# app/models and app/schemas are newly covered (STRUCT-0013) and clean under
# the stricter check -- hold them to it per-module rather than waiting for
# every package to reach this bar before enabling it anywhere.
module = ["app.models.*", "app.schemas.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
