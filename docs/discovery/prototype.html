<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discovery prototype</title>
<style>
:root{--page:#13131d;--card:#1a2328;--card2:#1c262b;--well:#26272b;--rule:#2e3a40;--rule2:#393941;--border:#4e4234;
--ink:#f3e9d7;--text:#caaf9c;--muted:#927e5d;--soft:#bc9574;--night:#010005;
--gold:#b98d34;--amber:#d4a152;--sage:#baac91;--copper:#a16948;--steel:#4d7a9b;--parch:#caaf9c;--tan:#bc9574;--plum:#312237;--brick:#9f3632;--forest:#3a5c52;--umber:#61503e}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}
.top{height:54px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:22px;padding:0 22px;position:sticky;top:0;z-index:20}
.top b{font:600 17px Georgia,serif;color:var(--ink);white-space:nowrap}
.sbox{flex:1;max-width:720px;display:flex;align-items:center;gap:8px;background:var(--well);border:1px solid var(--rule2);border-radius:10px;padding:0 10px;height:36px}
.sbox:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(212,161,82,.18)}
.sbox input{all:unset;flex:1;color:var(--ink)}
.sbox kbd,.kbd{border:1px solid var(--rule2);border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted)}
.inv{font-size:12px;color:var(--muted);white-space:nowrap}.inv b{font:600 13px Inter;color:var(--text)}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) 420px;gap:18px;padding:18px 22px 40px;max-width:1500px;margin:0 auto}
/* facets */
.facets{position:sticky;top:72px;align-self:start;font-size:12.5px}
.fg{margin-bottom:16px}.fg h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fr{all:unset;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;width:100%;padding:3px 6px;border-radius:6px;color:var(--text)}
.fr:hover{background:#202a2f}.fr.on{background:#2a2a22;color:var(--ink)}.fr.zero{opacity:.38}
.fr .sw{width:10px;height:10px;border-radius:3px}.fr .n{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fr .bar{display:inline-block;height:4px;border-radius:2px;background:currentColor;opacity:.5}
.sortrow{display:flex;gap:4px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1px solid var(--rule2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text);white-space:nowrap}
.chip.on{border-color:var(--border);background:#2a2a22;color:var(--amber)}
/* results */
.rhead{display:flex;align-items:baseline;gap:12px;margin:2px 0 10px}.rhead h2{margin:0;font:600 20px Georgia,serif;color:var(--ink)}.rhead span{color:var(--muted);font-size:12.5px}
.grp{margin-bottom:16px}
.gh{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:6px 2px;border-bottom:2px solid;margin-bottom:8px}
.gh b{font-size:11px;letter-spacing:.09em;text-transform:uppercase}.gh span{font-size:12px;color:var(--muted)}.gh i{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.res{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:12px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;outline:none}
.res:hover,.res.kb{background:#1f2a30;border-color:#3a4a52;border-left-color:var(--edge)}.res.sel{box-shadow:0 0 0 2px var(--amber)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--well)}
.res .t{color:var(--ink);font-weight:600;font-size:14px;line-height:1.35}
.res mark{background:rgba(212,161,82,.28);color:var(--ink);border-radius:3px;padding:0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.kl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:600;line-height:19px;white-space:nowrap}
.pd{display:inline-flex;align-items:center;gap:5px;color:var(--text)}.pd i{width:9px;height:9px;border-radius:50%;display:inline-block;border:2px solid}
.sn{margin-top:4px;font-size:12.5px;color:var(--text);line-height:1.45}
.why{margin-top:3px;font-size:11.5px;color:#7d6c50}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{border-radius:999px;padding:0 8px;font-size:11px;font-weight:600;line-height:18px;color:var(--ink)}
.notec{margin-top:6px;font-size:12px;color:var(--soft);border-left:2px solid var(--border);padding-left:8px}
.acts{display:flex;gap:4px;align-items:flex-start;opacity:0;transition:opacity .12s}.res:hover .acts,.res.kb .acts,.res.sel .acts{opacity:1}
.ab{all:unset;cursor:pointer;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.ab:hover{background:var(--well);color:var(--ink);border-color:var(--rule2)}
.ab[data-tip]:hover::after{content:attr(data-tip);position:absolute;transform:translate(-40%,-30px);background:#10161a;border:1px solid var(--border);color:var(--ink);font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;z-index:9}
.flagdot{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--plum);border:1px solid #6f5e44;color:var(--ink);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* panel */
.panel{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--rule2)}
.tab{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 6px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--amber)}.tab .c{display:inline-block;min-width:18px;border-radius:9px;background:var(--plum);color:var(--ink);font-size:10.5px;font-weight:700;margin-left:5px;padding:0 5px}
.pbody{overflow:auto;padding:14px}
.ph{font:600 15px Georgia,serif;color:var(--ink);margin:0 0 4px}.psub{font-size:12px;color:var(--muted);margin:0 0 12px}
.flag{border:1px solid var(--rule);border-left:4px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card2)}
.flag .ft{display:flex;gap:8px;align-items:baseline}.flag .rk{font:700 12px Inter;color:var(--night);background:var(--amber);border-radius:6px;padding:0 6px}
.flag .fn{font-weight:700;color:var(--ink);font-size:13.5px;line-height:1.35}
.flag .who{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.flag .row{font-size:12px;margin:5px 0;line-height:1.45}.flag .row b{color:var(--amber);font-weight:600}
.flag a{color:#c8a46a}
.score{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:6px 0}
.score .track{flex:1;height:6px;border-radius:3px;background:var(--well);display:flex;overflow:hidden}
.fa{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.btn{all:unset;cursor:pointer;border:1px solid var(--rule2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--text);white-space:nowrap;background:var(--well)}
.btn:hover{border-color:var(--border);color:var(--ink)}.btn.p{background:var(--amber);color:var(--night);border-color:var(--amber);font-weight:600}
.sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px;display:flex;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:9px;overflow:hidden}.seg button{all:unset;cursor:pointer;white-space:nowrap;font-size:12px;padding:5px 11px;color:var(--muted);border-right:1px solid var(--rule2)}.seg button:last-child{border:0}.seg button.on{background:#3a2f1f;color:var(--amber)}
.party{border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;overflow:hidden}
.party>.h{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:8px 10px;width:100%;box-sizing:border-box;background:var(--card2)}
.party>.h b{color:var(--ink);font-size:13px}.party>.h span{font-size:11.5px;color:var(--muted)}.party>.h em{margin-left:auto;font-style:normal;font-size:11.5px}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 10px;border-top:1px solid var(--rule);font-size:12px}
.srow .why2{grid-column:1/3;color:var(--muted);font-size:11.5px}
.find{border:1px solid #4a3a55;background:linear-gradient(90deg,rgba(49,34,55,.9),rgba(49,34,55,.35));border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:12.5px}
.find .fh{display:flex;justify-content:space-between;gap:8px;color:var(--ink);font-weight:600}.find .fs{color:#b39cc0;font-size:11.5px}
.ex{display:inline-block;border:1px dashed #b39cc0;color:#b39cc0;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;margin-left:6px}
.coll{border:1px solid var(--rule);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.coll .ch{display:flex;justify-content:space-between;align-items:center}.coll .ch b{color:var(--ink)}
.ci{display:flex;gap:7px;align-items:center;font-size:12px;padding:3px 0;border-top:1px solid #222c31}
/* popovers */
.pop{position:fixed;z-index:50;background:#10161a;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px #000a;padding:12px;width:300px;font-size:12.5px;display:none}
.pop h5{margin:0 0 8px;font:600 14px Georgia,serif;color:var(--ink)}
.peek{pointer-events:none;width:330px}
.peek .pt{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600}
.peek .pr{display:flex;justify-content:space-between;border-top:1px solid #222c31;padding:4px 0;font-size:12px}.peek .pr span:first-child{color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.swatches button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:6px;border:2px solid transparent}.swatches button.on{border-color:var(--ink)}
.pop input,.pop textarea{width:100%;background:var(--well);border:1px solid var(--rule2);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit}
.pop textarea{min-height:70px;resize:vertical}
.tagpick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tagpick button{all:unset;cursor:pointer;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;color:var(--ink);opacity:.55}.tagpick button.on{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10161a;border:1px solid var(--amber);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;display:none;z-index:60}
.note-bar{max-width:1500px;margin:0 auto;padding:0 22px 30px;font-size:12px;color:var(--muted)}
svg text{font-family:Inter,system-ui,sans-serif}

function match(r,q){if(!q)return{score:1,where:''};const t=q.toLowerCase().split(/\s+/).filter(Boolean);let s=0,where=[];
  for(const w of t){if(r.title.toLowerCase().includes(w)){s+=3;where.push('name or text')}else if((r.source||'').toLowerCase().includes(w)){s+=2;where.push('source')}else if(r.text.toLowerCase().includes(w)){s+=1;where.push('details')}else return null}
  return{score:s,where:[...new Set(where)].join(', ')}}
const hi=(s,q)=>{let o=esc(s);for(const w of (q||'').split(/\s+/).filter(x=>x.length>1))o=o.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');return o};
const kindGroup=k=>k==='event'?'claim':k;
function sureOf(r){return r.kind==='lead'?'open':r.sure||(r.kind==='party'?null:null)}
function results(){
  const q=S.q.trim();let rs=[];
  for(const r of [...REC,...findingsAsRecords()]){const m=match(r,q);if(!m)continue;rs.push({...r,score:m.score,where:m.where})}
  const all=rs;
  rs=rs.filter(r=>(!S.f.kind.size||S.f.kind.has(kindGroup(r.kind)))&&(!S.f.party.size||r.parties.some(id=>S.f.party.has(P(id)?.schema)))&&(!S.f.sure.size||S.f.sure.has(sureBucket(r)))&&(!S.f.tag.size||(S.recTags[r.key]||[]).some(t=>S.f.tag.has(t))));
  const rank={disputed:0,unverified:1,asserted:1,open:2,supported:3,verified:3,documented:3};
  if(S.sort==='unsure')rs.sort((a,b)=>(rank[sureOf(a)]??2)-(rank[sureOf(b)]??2)||b.score-a.score);
  else if(S.sort==='date')rs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  else rs.sort((a,b)=>b.score-a.score);
  return{all,rs};
}
function sureBucket(r){const s=sureOf(r);return s==='supported'||s==='verified'||s==='documented'?'shown':s==='disputed'?'disputed':s==='open'||!s?'none':'notyet'}

function patterns(){
  const L=DATA.links,F=facts(),out=[],maybe=[];
  const owns=L.filter(l=>l.schema==='Ownership');
  // circular ownership
  const adj={};owns.forEach(l=>(adj[l.from]=adj[l.from]||[]).push(l.to));
  let cycle=null;const seen=new Set();const dfs=(n,stack)=>{if(cycle)return;if(stack.includes(n)){cycle=stack.slice(stack.indexOf(n));return}if(seen.has(n))return;seen.add(n);for(const m of adj[n]||[])dfs(m,[...stack,n])};
  Object.keys(adj).forEach(n=>dfs(n,[]));
  // chain tops: owned companies whose owner chain ends at a company/org with no owner
  const ownerOf=id=>owns.filter(l=>l.to===id).map(l=>l.from);
  const chainTop=id=>{let x=id,path=[id];for(let i=0;i<20;i+=1){const o=ownerOf(x);if(!o.length)break;x=o[0];path.push(x)}return path};
  for(const l of owns){const top=chainTop(l.to),t=P(top[top.length-1]);

  // secrecy jurisdiction in a chain

  for(const l of L.filter(x=>x.schema==='Payment')){
    out.push({id:'pay:'+l.id,n:12,name:`${money(l.props.amount,l.props.currency)} payment with a disputed purpose and no invoice or contract on record`,who:[l.from,l.to],rule:`${P(l.from).name} paid ${P(l.to).name} on ${dateW(l.props.date)} for “${l.props.purpose}”. No invoice or contract is attached, and the evidence for it is not yet reviewed.`,why:'Payments with no stated purpose, or only a vague one, and no matching paperwork are a common sign of moving money for something other than the stated reason.',src:['D','A'],innocent:'The paperwork may exist and simply not be in the file yet.',confirm:'The invoice and the consulting agreement; Meridian\'s accounts for 2023.',base:1,unreviewed:l.needsReview,lookups:[l.from,l.to]});
    if(+l.props.amount%1000===0)out.push({id:'round:'+l.id,n:11,name:'Round-number payment',who:[l.from,l.to],rule:`${money(l.props.amount,l.props.currency)} is an exact multiple of 1,000.`,why:'Large round sums are one of the signs listed for shell-company transfers.',src:['D'],innocent:'Fees, loans and deposits are often round. Weak on its own.',confirm:'What the sum was for.',base:1,weak:true,unreviewed:l.needsReview,lookups:[]});
    // company formed shortly before payment: needs incorporation date
    const inc=F['inc:'+l.to];
    if(inc){const days=Math.round((Date.parse(l.props.date)-Date.parse(inc))/864e5);if(days>=0&&days<365)out.push({id:'young:'+l.to,n:6,name:`${P(l.to).name} was formed ${days} days before the payment`,who:[l.to,l.from],rule:`Incorporated ${dateW(inc)}; paid ${money(l.props.amount,l.props.currency)} on ${dateW(l.props.date)}.`,why:'Companies younger than a year when they receive large sums are treated as high risk in procurement research.',src:['H','I','A'],innocent:'A new joint venture or start-up.',confirm:'Why the company was set up, and who asked for it.',base:1,unreviewed:false,fresh:true,lookups:[]})}
    else maybe.push({id:'young?:'+l.to,n:6,name:`Was ${P(l.to).name} formed shortly before it was paid?`,need:`Its incorporation date. The router would ask Companies House (${P(l.to).country==='gb'?'it is a UK company':'—'}).`,who:[l.to],src:['H','A'],lookups:[l.to]});
  }
  if(!F['appts:'+ALA])maybe.push({id:'mass?',n:3,name:'Does Alaric Voss direct many other companies?',need:'His officer appointments. The router would ask Companies House (UK national).',who:[ALA],src:['A','C','I'],lookups:[ALA]});
  else if(F['appts:'+ALA]>100)out.push({id:'mass:'+ALA,n:3,name:`Alaric Voss is an officer of ${F['appts:'+ALA]} companies`,who:[ALA,MER],rule:`Companies House lists ${F['appts:'+ALA]} appointments for him: more than the 100 that Global Witness used to pick out mass officers.`,why:'“Mass” nominee directors appear in a large majority of the FATF/Egmont concealment cases.',src:['A','C','I'],innocent:'A professional company secretary or fund manager.',confirm:'Whether he is paid as a nominee; who instructs him.',base:1,unreviewed:false,fresh:true,lookups:[]});

function route(p){

  add('ICIJ Offshore Leaks (local copy)','Every party: offshore entities, officers, intermediaries','auto','Cite ICIJ');
  if(p.schema==='Company'||p.schema==='Organization'){
    if(p.country==='gb'){add('Companies House: profile, officers, people with significant control','UK company',"auto",'',{fact:'inc:'+p.id,label:'Incorporated 2 Oct 2023',val:'2023-10-02'});add('OpenOwnership BODS data','UK ownership chains','auto','CC0');add('Contracts Finder and Find a Tender','UK public contracts','auto','')}
    else if(p.country==='us'){add('SEC EDGAR','US company filings','auto','');add('USAspending','US federal money','auto','');add('SAM.gov','US contractor registration','click','10 a day')}
    else{add('GLEIF','Company identifier and parent links, any country','auto','Open');add('OCCRP Aleph Pro','Leaks and registries','auto','Free for non-profit journalism');add('OpenCorporates','Registry record in '+(COUNTRY[p.country]||'its country'),'key','Paid key or journalist grant')}

  if(p.schema==='Person'){

function renderFacets(all){

// ---------- events ----------
$('q').addEventListener('input',e=>{S.q=e.target.value;S.kb=-1;render()});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus();$('q').select();return}

  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.kb=Math.max(0,Math.min(VIS.length-1,S.kb+(e.key==='ArrowDown'?1:-1)));const el=document.querySelectorAll('.res')[S.kb];document.querySelectorAll('.res').forEach(x=>x.classList.remove('kb'));if(el){el.classList.add('kb');el.scrollIntoView({block:'nearest'})}return}

  const k=cur.dataset.key;if(e.key==='Enter'){S.sel=k;render()}if(e.key.toLowerCase()==='t')openPop('tag',k,cur);if(e.key.toLowerCase()==='n')openPop('note',k,cur);if(e.key.toLowerCase()==='c')openPop('collect',k,cur);
});
$('results').addEventListener('mousemove',e=>{const c=e.target.closest('.res');if(!c||e.target.closest('.acts')){peek(null);return}const r=recByKey(c.dataset.key)||findingsAsRecords().find(x=>x.key===c.dataset.key);peek(r,e)});
$('results').addEventListener('mouseleave',()=>peek(null));
$('results').addEventListener('click',e=>{const c=e.target.closest('.res');if(!c)return;const k=c.dataset.key,a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;if(act==='tag'||act==='note'||act==='collect')openPop(act,k,a);
    if(act==='trace')toast('Opens the provenance trail for this record in a side drawer');
    if(act==='lookup'){S.tab='look';S.open.add(k.slice(2));render()}
    if(act==='accept'){S.accepted.add(k.slice(2));render();toast('Accepted. Patterns re-checked: see Dig here next');S.tab='dig';render()}
    if(act==='aside'){S.dismissed.add('f'+k.slice(2));FINDINGS.splice(FINDINGS.findIndex(f=>f.id===k.slice(2)),1);render()}
    return}
  S.sel=k;render()});
$('facets').addEventListener('click',e=>{const b=e.target.closest('[data-facet],[data-sort]');if(!b)return;if(b.dataset.sort)S.sort=b.dataset.sort;else{const s=S.f[b.dataset.facet],v=b.dataset.val;s.has(v)?s.delete(v):s.add(v)}render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;renderPanel()}});
$('pbody').addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-mode],[data-party-toggle]');if(!b)return;
  if(b.dataset.mode){S.lookupMode=b.dataset.mode;if(S.lookupMode!=='auto'){for(let i=FINDINGS.length-1;i>=0;i-=1)if(!S.accepted.has(FINDINGS[i].id))FINDINGS.splice(i,1)}render();return}
  if(b.dataset.partyToggle){const id=b.dataset.partyToggle;S.open.has(id)?S.open.delete(id):S.open.add(id);renderPanel();return}
  const a=b.dataset.act;
  if(a==='accept'){S.accepted.add(b.dataset.find);render();toast('Accepted into the record. Patterns re-checked.');S.tab='dig';render()}
  if(a==='aside'){S.dismissed.add('f'+b.dataset.find);render()}
  if(a==='dismiss'){S.dismissed.add(b.dataset.flag);render();toast('Marked not relevant. It stays in the record of decisions.')}
  if(a==='lead')toast('A lead is made with the pattern, its parties and its source attached');
  if(a==='show')toast('Opens the network with these parties lit and the rest dimmed');
  if(a==='runlook'||a==='runone'){const id=b.dataset.party;const was=S.lookupMode;S.lookupMode='auto';ensureFindings();S.lookupMode=was==='off'?'off':was;S.tab='look';S.open.add(id);render();toast('Lookups run for '+P(id).name)}
  if(a==='chartcoll')chartColl(b.dataset.coll);
  if(a==='filtercoll')toast('Every chart lights this collection and dims the rest');
  if(a==='newcoll'){const n='New collection '+(Object.keys(S.colls).length+1);S.colls[n]=[];renderPanel()}
  if(a==='notelead')toast('A lead is made from this note, linked to its record');
});
render();
</script></body></html>
