name: Render service CI

# The render service's own tests (render/*.test.mjs): the ECharts route, the
# map route's request checks, its view arithmetic, the place dots, and what
# the base map is allowed to answer. The live map draw (map.live.test.mjs)
# needs MapLibre Native's GL libraries, an X display and a 45 MB+ base map,
# so it is skipped here and run by hand where those are (render/README.md).
on:
  push:
    paths:
      - 'render/**'
      - '.github/workflows/render-ci.yml'
      - 'frontend/.nvmrc'
  pull_request:
    paths:
      - 'render/**'
      - '.github/workflows/render-ci.yml'
      - 'frontend/.nvmrc'

jobs:
  render:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The one Node version: frontend/.nvmrc (also what backend/Dockerfile and render/Dockerfile build on).
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
