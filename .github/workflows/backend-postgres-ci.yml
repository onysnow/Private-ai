name: Backend PostgreSQL CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: journalism_test
          POSTGRES_USER: journalism
          POSTGRES_PASSWORD: journalism
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U journalism -d journalism_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+psycopg://journalism:journalism@127.0.0.1:5432/journalism_test"
      POSTGRES_TEST_URL: "postgresql+psycopg://journalism:journalism@127.0.0.1:5432/journalism_test"

    steps:
      - uses: actions/checkout@v7

      # The Authority System Suite comes from the authority-suite-sdk package in
      # backend/requirements.txt (private repository; the "Let pip read" step below
      # gives git the read-only deploy key, secret AUTHORITY_SDK_DEPLOY_KEY).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Let pip read the private authority-suite-sdk repository
        uses: ./.github/actions/authority-sdk-access
        with:
          deploy-key: ${{ secrets.AUTHORITY_SDK_DEPLOY_KEY }}

      - name: Install backend dependencies
        # STRUCT-0026: requirements.txt is now production-only (no pytest/
        # pytest-cov, which the Dockerfile-built image never runs); this job
        # actually runs the test suite, so it installs requirements-test.txt,
        # which layers pytest/pytest-cov on top of requirements.txt.
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Set up Rust for the native module
        # ADR-0021: backend/native compiles code from the ArtCraft apps into the workbench_native module.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the native module's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/native/target
          key: native-${{ runner.os }}-${{ hashFiles('backend/native/Cargo.lock', 'backend/native/src/**') }}
          restore-keys: native-${{ runner.os }}-

      - name: Build and install the native module
        run: CARGO_TARGET_DIR=native/target python -m pip install ./native

      - name: Install the web-capture browser
        # ADR-0018: the capture tests drive a real Chromium against a page served on this runner.
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Fetch the transcription model the tests use
        # ADR-0020: the recording tests transcribe a short file with Whisper's smallest English model.
        run: TRANSCRIPTION_MODEL_DIR="$HOME/whisper-models" python -m app.services.transcription fetch tiny.en

      - name: Verify Alembic migration chain has a single head
        # STRUCT-0006: the chain forked into two heads once already this
        # session (two independently-merged PRs, neither aware of the
        # other's migration) and went unnoticed until someone ran alembic
        # locally. Fail fast in CI instead.
        run: |
          heads="$(python -m alembic heads)"
          count="$(echo "$heads" | grep -c .)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Alembic migration chain has $count heads, expected exactly 1:"
            echo "$heads"
            exit 1
          fi
          echo "Single migration head confirmed:"
          echo "$heads"

      - name: Apply Alembic migrations on PostgreSQL
        run: python -m alembic upgrade head

      - name: Run backend pytest suite on PostgreSQL
        run: python run_postgres_gate.py
