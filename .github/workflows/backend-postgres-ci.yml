name: Backend PostgreSQL CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: journalism_test
          POSTGRES_USER: journalism
          POSTGRES_PASSWORD: journalism
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U journalism -d journalism_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+psycopg://journalism:journalism@127.0.0.1:5432/journalism_test"
      POSTGRES_TEST_URL: "postgresql+psycopg://journalism:journalism@127.0.0.1:5432/journalism_test"
      # Job-level (not step-level) so the "Fetch TAS submodule" step's `if:`
      # below can read it via `env.TAS_REPO_TOKEN` -- the `secrets` context is
      # not a valid named-value inside an `if:` condition at all (a documented
      # Actions runner limitation, https://github.com/actions/runner/issues/520;
      # confirmed as this workflow's actual root cause for task #35's
      # "Invalid workflow file" dispatch failure, "Unrecognized named-value:
      # 'secrets'"). `env:` blocks (unlike `if:`) can read `secrets` directly.
      TAS_REPO_TOKEN: ${{ secrets.TAS_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Dependabot-triggered runs never receive repository secrets (by GitHub's
      # design, to stop a malicious dependency bump from exfiltrating them), so
      # TAS_REPO_TOKEN is empty in that context. actions/checkout@v6+ hard-fails
      # ("Input required and not supplied: token") if handed an explicitly-empty
      # token, where v4 tolerated it - so the submodule is fetched as its own
      # step here instead of via checkout's `submodules:` input, gated on the
      # secret actually being present, so a Dependabot PR's checkout still
      # succeeds (just without the submodule) instead of failing outright.
      - name: Fetch TAS submodule
        if: ${{ env.TAS_REPO_TOKEN != '' }}
        working-directory: ${{ github.workspace }}
        env:
          TAS_REPO_TOKEN: ${{ secrets.TAS_REPO_TOKEN }}
        run: |
          git config submodule.backend/app/ai/tas_spec.url "https://x-access-token:${TAS_REPO_TOKEN}@github.com/onysnow/topic-authority-system.git"
          git submodule update --init --recursive backend/app/ai/tas_spec
        continue-on-error: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify Alembic migration chain has a single head
        # STRUCT-0006: the chain forked into two heads once already this
        # session (two independently-merged PRs, neither aware of the
        # other's migration) and went unnoticed until someone ran alembic
        # locally. Fail fast in CI instead.
        run: |
          heads="$(python -m alembic heads)"
          count="$(echo "$heads" | grep -c .)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Alembic migration chain has $count heads, expected exactly 1:"
            echo "$heads"
            exit 1
          fi
          echo "Single migration head confirmed:"
          echo "$heads"

      - name: Apply Alembic migrations on PostgreSQL
        run: python -m alembic upgrade head

      - name: Run backend pytest suite on PostgreSQL
        run: python run_postgres_gate.py
