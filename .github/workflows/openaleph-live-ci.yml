name: OpenAleph live CI

# The Workbench used with a real OpenAleph (ADR-0006): the compose stack's
# OpenAleph 5.3.x services start, and the live tests upload real files
# through the Workbench, wait for OpenAleph to read them and ftm-analyze to
# find their names, push confirmed records and read cross-references back
# (backend/tests/test_openaleph_live.py, test_openaleph_live_corpus.py).
# Every other workflow runs against the fakes in backend/tests; this one
# catches what only the real services can show. It takes several minutes
# (`aleph upgrade` on a fresh database), so it runs when the code that talks
# to OpenAleph or the compose stack changes, once a week, and on request.

on:
  push:
    paths:
      - "backend/app/services/openaleph*.py"
      - "backend/app/services/corpus*.py"
      - "backend/app/services/document_formats.py"
      - "backend/app/jobs/corpus.py"
      - "backend/tests/test_openaleph_live*.py"
      - "docker-compose.yml"
      - ".github/workflows/openaleph-live-ci.yml"
      - ".github/openaleph-ci.compose.yml"
  pull_request:
    paths:
      - "backend/app/services/openaleph*.py"
      - "backend/app/services/corpus*.py"
      - "backend/app/services/document_formats.py"
      - "backend/app/jobs/corpus.py"
      - "backend/tests/test_openaleph_live*.py"
      - "docker-compose.yml"
      - ".github/workflows/openaleph-live-ci.yml"
      - ".github/openaleph-ci.compose.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  openaleph-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Every `docker compose` call adds the CI settings for Elasticsearch's
      # disk use (.github/openaleph-ci.compose.yml says why).
      COMPOSE_FILE: docker-compose.yml:.github/openaleph-ci.compose.yml

    steps:
      - uses: actions/checkout@v7

      - name: Start OpenAleph
        # The API, its worker, ingest-file and ftm-analyze, with what they
        # depend on: PostgreSQL, Elasticsearch, Redis, and the one-shot
        # `openaleph-setup` (`aleph upgrade`), which the others wait for.
        run: docker compose up --detach --wait --wait-timeout 1200 api worker ingest analyze

      - name: Wait for the OpenAleph API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/api/2/metadata >/dev/null; then echo "OpenAleph answers."; exit 0; fi
            sleep 5
          done
          echo "::error::OpenAleph's API did not answer on http://127.0.0.1:8001 within five minutes"
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Run the live OpenAleph tests
        working-directory: backend
        env:
          OPENALEPH_LIVE_URL: http://127.0.0.1:8001
          TZ: UTC
        # Only these tests: the coverage floor (pyproject.toml) is for the whole suite.
        run: python -m pytest tests/test_openaleph_live.py tests/test_openaleph_live_corpus.py --no-cov -p no:cacheprovider -rs

      - name: Keep the services' logs
        if: failure()
        run: docker compose logs --no-color --timestamps postgres elasticsearch redis openaleph-setup api worker ingest analyze > openaleph-logs.txt

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: openaleph-logs
          path: openaleph-logs.txt
          retention-days: 7

      - name: Stop OpenAleph
        if: always()
        run: docker compose down --volumes
