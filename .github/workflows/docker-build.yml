name: Docker Build

"on":
  push:
  pull_request:

jobs:
  docker-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Compose's bake builder refuses a build secret read from outside the repository
    # (the deploy key in ~/.ssh) unless granted --allow=fs.read; the plain builder
    # passes it as docker-compose.yml says.
    env:
      COMPOSE_BAKE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The backend image installs the private authority-suite-sdk, so the build
      # gets the read-only deploy key as a Docker build secret (docker-compose.yml).
      - name: Let the image build read the private authority-suite-sdk repository
        uses: ./.github/actions/authority-sdk-access
        with:
          deploy-key: ${{ secrets.AUTHORITY_SDK_DEPLOY_KEY }}

      # One image (ADR-0004): its first stage builds the workbench screen,
      # its second runs the API that serves it.
      - name: Build the workbench image (API + screen)
        run: docker compose build backend

      # The render service (ADR-0005, line 2) draws chart images for exports.
      - name: Build the render image
        run: docker compose build render
