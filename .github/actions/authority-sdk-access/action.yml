name: Authority SDK access
description: >-
  Lets git, pip and Docker read the private onysnow/authority-suite-sdk repository
  with a read-only deploy key (the Actions secret AUTHORITY_SDK_DEPLOY_KEY).
inputs:
  deploy-key:
    description: The private half of the read-only deploy key.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "::error::AUTHORITY_SDK_DEPLOY_KEY is empty. Add it as a repository secret; pull requests from forks and Dependabot cannot read repository secrets."
          exit 1
        fi
        install -d -m 700 "$HOME/.ssh"
        key="$HOME/.ssh/authority_sdk"
        printf '%s\n' "$DEPLOY_KEY" > "$key"
        chmod 600 "$key"
        # docker-compose.yml reads this file as the build secret.
        echo "AUTHORITY_SDK_DEPLOY_KEY_FILE=$key" >> "$GITHUB_ENV"
        git config --global core.sshCommand "ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        git config --global url."git@github.com:onysnow/authority-suite-sdk".insteadOf "https://github.com/onysnow/authority-suite-sdk"
