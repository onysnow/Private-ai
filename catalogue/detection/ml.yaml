# Detection specs for the ML area (money laundering). See bo.yaml.

- indicator: ML-021
  family: count_in_band
  params: {link: Payment, property: amount, currency: [USD, EUR], low: 9000, high: 10000, by: source}
  bands:
    - {level: faint, from: 2, reason: "Two or more payments by the same payer, in one currency, between 9,000 and 10,000 dollars or euros: the dollar band US Treasury reports show in past structuring cases, and just under the \u20ac10,000 line EU law draws for cash (declared at the border, Regulation (EU) 2018/1672; the most a trader may take in cash, Regulation (EU) 2024/1624). Not a rule"}
  summary: "{party} made {count} payments between {sign}9,000 and {sign}10,000 ({sign}{total_text} in all){period}, each just under the {sign}10,000 line."
  not_shown: ["whether the money was cash", "whether it was split to avoid the report"]
  examples:
    - name: two payments in the band
      parties: [{id: p, schema: Person}, {id: b, schema: Company}]
      links: [{schema: Payment, source: p, target: b, properties: {amount: ["9,500"], currency: ["USD"]}}, {schema: Payment, source: p, target: b, properties: {amount: ["9900"], currency: ["usd"]}}]
      expect: faint
    - name: one in the band, one at the threshold
      parties: [{id: p, schema: Person}, {id: b, schema: Company}]
      links: [{schema: Payment, source: p, target: b, properties: {amount: ["9500"], currency: ["USD"]}}, {schema: Payment, source: p, target: b, properties: {amount: ["10000"], currency: ["USD"]}}]
      expect: null
    - name: two euro payments in the band
      parties: [{id: p, schema: Person}, {id: b, schema: Company}]
      links: [{schema: Payment, source: p, target: b, properties: {amount: ["9,800"], currency: ["EUR"]}}, {schema: Payment, source: p, target: b, properties: {amount: ["9800"], currency: ["eur"]}}]
      expect: faint
    - name: a dollar and a euro payment are not two in one currency
      parties: [{id: p, schema: Person}, {id: b, schema: Company}]
      links: [{schema: Payment, source: p, target: b, properties: {amount: ["9500"], currency: ["USD"]}}, {schema: Payment, source: p, target: b, properties: {amount: ["9500"], currency: ["EUR"]}}]
      expect: null
    - name: sterling is not in the band's currencies
      parties: [{id: p, schema: Person}, {id: b, schema: Company}]
      links: [{schema: Payment, source: p, target: b, properties: {amount: ["9500"], currency: ["GBP"]}}, {schema: Payment, source: p, target: b, properties: {amount: ["9500"], currency: ["GBP"]}}]
      expect: null

- indicator: ML-023
  family: cycle
  params: {link: Payment, min_parties: 2}
  level: textbook   # money that leaves and comes back meets the definition as worded
  summary: "Money goes round and back: {path}."
  examples:
    - name: there and back
      parties: [{id: a, schema: Company}, {id: b, schema: Company}]
      links: [{schema: Payment, source: a, target: b}, {schema: Payment, source: b, target: a}]
      expect: textbook
    - name: one way
      parties: [{id: a, schema: Company}, {id: b, schema: Company}]
      links: [{schema: Payment, source: a, target: b}]
      expect: null
