  related: []
  indicators: []
  areas:
  - DA
- term: One Chance rule
  definition: The principle that professionals may only get one chance to speak to a forced-marriage victim,
    and so must act at once.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/322307/HMG_MULTI_AGENCY_PRACTICE_GUIDELINES_v1_180614_FINAL.pdf
