- term: '''Honour''-based abuse'
  definition: Violence, threats or coercion committed to protect a family's or community's honour for
    a supposed breach of its code of behaviour.
  examples: []
  source_url: https://cps.gov.uk/legal-guidance/honour-based-violence-and-forced-marriage-guidance-identifying-and-flagging-cases
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Forced marriage
  definition: A marriage in which one or both spouses do not consent and are coerced; in England and Wales
    any marriage of a child under 18 is also covered.
  examples: []
  source_url: https://www.gov.uk/government/publications/the-right-to-choose-government-guidance-on-forced-marriage/multi-agency-statutory-guidance-for-dealing-with-forced-marriage-and-multi-agency-practice-guidelines-handling-cases-of-forced-marriage-accessible
