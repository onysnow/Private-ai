- term: Domestic abuse (statutory definition)
  definition: Abusive behaviour between people aged 16 or over who are personally connected, including
    physical, sexual, controlling, economic or psychological abuse, either one incident or a pattern.
  examples: []
  source_url: https://www.legislation.gov.uk/ukpga/2021/17/section/1
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Economic abuse
  definition: Behaviour that seriously harms someone's ability to get, use or keep money or property,
    or to obtain goods and services.
  examples: []
  source_url: https://www.legislation.gov.uk/ukpga/2021/17/section/1
  cases: []
  related: []
  indicators: []
  areas:
  - DA
