area: DA
terms:
- term: Controlling or coercive behaviour
  definition: A pattern of acts that isolate, monitor, regulate and frighten a partner or family member;
    a criminal offence in England and Wales under s.76 Serious Crime Act 2015.
  examples: []
  source_url: https://www.gov.uk/government/publications/controlling-or-coercive-behaviour-statutory-guidance-framework/controlling-or-coercive-behaviour-statutory-guidance-framework-accessible
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Personally connected
  definition: 'The legal relationship needed for the coercive-control offence: current or former spouses,
    intimate partners, co-parents or relatives.'
  examples: []
  source_url: https://www.gov.uk/government/publications/controlling-or-coercive-behaviour-statutory-guidance-framework/controlling-or-coercive-behaviour-statutory-guidance-framework-accessible
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Serious effect
  definition: 'The harm the coercive-control offence requires: fear of violence on two or more occasions,
    or serious alarm or distress that substantially affects daily life.'
  examples: []
  source_url: https://www.gov.uk/government/publications/controlling-or-coercive-behaviour-statutory-guidance-framework/controlling-or-coercive-behaviour-statutory-guidance-framework-accessible
  cases: []
  related: []
  indicators: []
  areas:
