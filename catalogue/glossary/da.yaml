- term: Sex ratio at birth
  definition: Male births per 100 female births; the biological norm is 104 to 106.
  examples: []
  source_url: https://www.unfpa.org/sites/default/files/pub-pdf/Sex%20Imbalances%20at%20Birth.%20PDF%20UNFPA%20APRO%20publication%202012.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Child sex ratio
  definition: The ratio of boys to girls among young children in a census, used alongside the birth ratio
    to track imbalance.
  examples: []
  source_url: https://www.unfpa.org/sites/default/files/pub-pdf/Sex%20Imbalances%20at%20Birth.%20PDF%20UNFPA%20APRO%20publication%202012.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Gender-biased (prenatal) sex selection
  definition: Choosing the sex of a child before birth, usually to have a son, which skews the sex ratio
    at birth.
  examples: []
  source_url: https://www.who.int/publications/i/item/9789241501460
  cases: []
  related: []
  indicators: []
  areas:
  - DA
- term: Son preference
  definition: A cultural preference for sons over daughters, which UNFPA calls the main driver of sex
    selection.
  examples: []
  source_url: https://www.unfpa.org/sites/default/files/pub-pdf/Sex%20Imbalances%20at%20Birth.%20PDF%20UNFPA%20APRO%20publication%202012.pdf
  cases: []
