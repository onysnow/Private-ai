- term: Need-to-know
  definition: The rule that a cleared person may only see classified information that their duties require;
    seeking information without it is reportable.
  examples: []
  source_url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
