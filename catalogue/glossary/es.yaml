- term: Foreign intelligence entity (FIE)
  definition: Any known or suspected foreign organisation, person or group, public or private, that carries
    out intelligence activities against the United States.
  examples: []
  source_url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/524006p.pdf
  cases: []
  related: []
  indicators: []
  areas:
