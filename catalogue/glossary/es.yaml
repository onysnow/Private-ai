- term: Adjudicative guidelines
  definition: The official US criteria for deciding whether someone can hold a security clearance, covering
    areas such as foreign influence (Guideline B), financial considerations (F), security violations (K)
    and misuse of IT (M).
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/32/147.4
  cases: []
  related: []
  indicators: []
  areas:
  - ES
- term: Security clearance
  definition: Official permission to access classified information at a given level (Confidential, Secret,
    Top Secret, plus compartments such as SCI and SAP).
  examples: []
  source_url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
