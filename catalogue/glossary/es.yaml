- term: Data exfiltration
  definition: Moving data out of an organisation's control without authorisation, for example by email
    to a personal account, cloud upload or removable media.
  examples: []
  source_url: https://www.sei.cmu.edu/blog/developing-controls-to-prevent-theft-of-intellectual-property
