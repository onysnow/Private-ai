- term: National defense information (NDI)
  definition: Information relating to US national defence whose unauthorised gathering, retention or transmission
    is a crime under 18 U.S.C. 793 ('Gathering, transmitting or losing defense information').
  examples:
  - Teixeira, Rahman and Winner were all charged over NDI.
  source_url: https://www.law.cornell.edu/uscode/text/18/793
  cases: []
  related: []
  indicators: []
  areas:
  - ES
- term: Economic espionage
  definition: Stealing trade secrets knowing or intending that it will benefit a foreign government, foreign
    instrumentality or foreign agent (18 U.S.C. 1831).
  examples: []
  source_url: https://www.law.cornell.edu/uscode/text/18/1831
  cases: []
  related:
  - Trade secret
  indicators: []
  areas:
  - ES
- term: Trade secret
  definition: Business, scientific, technical or engineering information that the owner keeps secret and
    that has value because it is not generally known (18 U.S.C. 1839).
  examples: []
  source_url: https://www.law.cornell.edu/uscode/text/18/1839
  cases: []
  related: []
  indicators: []
  areas:
  - ES
- term: Restricted Data
  definition: A US legal category of protected nuclear information, including the design of naval nuclear
    reactors, which the Toebbes conspired to communicate.
  examples: []
  source_url: https://justice.gov/archives/opa/pr/maryland-nuclear-engineer-and-wife-sentenced-espionage-related-offenses
  cases: []
  related: []
  indicators: []
  areas:
  - ES
- term: Dead drop
  definition: A hidden spot where one person leaves an item, such as an SD card, for another to collect
    later so they never meet.
  examples: []
  source_url: https://justice.gov/archives/opa/pr/maryland-nuclear-engineer-and-wife-sentenced-espionage-related-offenses
