area: ES
terms:
- term: Insider
  definition: Anyone who has or had authorised access to, or knowledge of, an organisation's people, places,
    systems or information.
  examples: []
  source_url: https://www.cisa.gov/topics/physical-security/insider-threat-mitigation/defining-insider-threats
  cases: []
  related:
  - Insider threat
  indicators: []
  areas:
  - ES
- term: Insider threat
  definition: 'The risk that an insider uses their access, knowingly or not, to harm the organisation.
    CDSE says: ''An Insider Threat is anyone with authorized access who uses that access to wittingly
    or unwittingly harm the organization and its resources.'''
  examples: []
  source_url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
  cases: []
  related:
  - Insider
  - Potential risk indicator
  indicators: []
  areas:
  - ES
- term: Potential risk indicator (PRI)
  definition: 'A behaviour or circumstance that can come before insider harm. It is not proof: CDSE notes
    ''not everyone who exhibits these behaviors is doing something wrong.'''
  examples: []
  source_url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
  cases: []
  related: []
  indicators: []
  areas:
