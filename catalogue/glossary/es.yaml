- term: Volunteer spy (walk-in)
  definition: A person who offers secrets to a foreign power on their own initiative instead of being
    recruited; PERSEREC found twice as many US spies volunteered as were recruited.
  examples: []
  source_url: https://apps.dtic.mil/sti/pdfs/ADA411004.pdf
