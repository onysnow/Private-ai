- term: Unintentional insider threat
  definition: Harm caused by carelessness or accident, not malice, such as losing a laptop or clicking
    a phishing link.
  examples: []
  source_url: https://www.cisa.gov/topics/physical-security/insider-threat-mitigation/defining-insider-threats
  cases: []
  related: []
  indicators: []
  areas:
