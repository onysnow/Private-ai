- term: Collusive threat
  definition: One or more insiders working together with an outside actor, such as a foreign service or
    criminal group, to compromise an organisation.
  examples: []
  source_url: https://www.cisa.gov/topics/physical-security/insider-threat-mitigation/defining-insider-threats
  cases: []
  related: []
  indicators: []
  areas:
