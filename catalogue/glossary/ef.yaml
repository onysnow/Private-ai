- term: Fiduciary
  definition: Someone with legal authority and a duty to manage another person's money or property for
    that person's benefit, such as an agent under a power of attorney, guardian, trustee or benefits payee.
  examples: []
  source_url: https://files.consumerfinance.gov/f/documents/cfpb_suspicious-activity-reports-elder-financial-exploitation_report.pdf
  cases: []
