- term: Power of attorney (agent)
  definition: A legal document letting one person (the agent) act on another's behalf in money matters;
    its abuse is a common route to elder theft.
  examples:
  - 'US v Hampton: an exterminator got a widow to sign over her power of attorney.'
  source_url: https://files.consumerfinance.gov/f/documents/cfpb_suspicious-activity-reports-elder-financial-exploitation_report.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Guardian / conservator
  definition: A person appointed by a court to manage the affairs or property of someone found unable
    to do so; courts are responsible for overseeing them.
  examples: []
  source_url: https://gao.gov/assets/a310745.html
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Representative payee
  definition: A person or organisation the Social Security Administration appoints to receive and manage
    benefits for someone who cannot manage them.
  examples: []
  source_url: https://oig-files.ssa.gov/audits/full/A-09-08-38055.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Conduit payee
  definition: A representative payee who simply passes the full benefit on without managing or accounting
    for it.
  examples: []
  source_url: https://oig-files.ssa.gov/audits/full/A-09-08-38055.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: De facto representative payee
  definition: Someone who manages a beneficiary's benefits without being formally appointed by the SSA.
  examples: []
  source_url: https://oig-files.ssa.gov/audits/full/A-09-08-38055.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Undue influence
  definition: Excessive pressure that overcomes a person's free will and leads to an unfair result; California's
    statute weighs vulnerability, the influencer's authority, tactics and fairness of outcome.
  examples: []
  source_url: https://law.justia.com/codes/california/code-wic/division-9/part-3/chapter-11/article-2/section-15610-70/
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Specified adult
  definition: Under FINRA Rule 2165, a person aged 65 or older, or an adult the firm reasonably believes
    has an impairment that stops them protecting their own interests.
  examples: []
  source_url: https://www.finra.org/industry/notices/17-11
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Trusted contact person
  definition: Someone a brokerage or bank customer names whom the firm may contact if it suspects the
    customer is being exploited.
  examples: []
  source_url: https://www.finra.org/industry/notices/17-11
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Temporary hold
  definition: A pause a firm may place on a disbursement from a specified adult's account when it reasonably
    believes exploitation is happening; under FINRA Rule 2165 it expires within 15 business days, extendable
    by 10.
  examples: []
  source_url: https://www.finra.org/industry/notices/17-11
  cases: []
  related: []
  indicators: []
  areas:
  - EF
- term: Account takeover
  definition: Deliberate compromise of a victim's account to remove or steal their money; the most cited
    typology in elder scam reports.
  examples: []
