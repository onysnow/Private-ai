- term: FinCEN
  definition: The US Treasury's Financial Crimes Enforcement Network, which collects SARs and issues advisories
    with red flags.
  examples: []
  source_url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
