- term: Adult Protective Services (APS)
  definition: A state social-service programme, authorised by law in every US state, that receives and
    investigates reports of abuse, neglect or exploitation of vulnerable adults.
  examples: []
  source_url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
  cases: []
  related: []
  indicators: []
  areas:
