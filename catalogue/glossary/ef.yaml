- term: Money mule
  definition: A person, knowing or not, who moves illicit money at someone else's direction; scam victims
    are often recruited as mules.
  examples: []
  source_url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
