- term: Suspicious Activity Report (SAR)
  definition: A confidential report a US financial institution must file with FinCEN when it suspects
    a transaction involves crime or has no apparent lawful purpose.
  examples: []
  source_url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
