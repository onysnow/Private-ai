- term: Elder scam
  definition: A trick in which an older person sends money to a stranger or impostor for something promised
    that never arrives.
  examples: []
  source_url: https://www.fincen.gov/sites/default/files/shared/FTA_Elder_Financial_Exploitation_508Final.pdf
  cases: []
  related: []
  indicators: []
