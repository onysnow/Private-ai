- term: Elder theft
  definition: Theft of an older person's assets, money or income by someone they know and trust, such
    as a relative or carer.
  examples: []
  source_url: https://www.fincen.gov/sites/default/files/shared/FTA_Elder_Financial_Exploitation_508Final.pdf
  cases: []
  related: []
  indicators: []
