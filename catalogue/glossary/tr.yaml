  definition: Iran's Islamic Revolutionary Guard Corps, whose members directed the plot against journalist
    Masih Alinejad according to DOJ.
  examples: []
  source_url: https://www.justice.gov/opa/pr/two-eastern-european-organized-crime-leaders-convicted-murder-hire-targeting-us-based
  cases: []
  related: []
  indicators: []
  areas:
