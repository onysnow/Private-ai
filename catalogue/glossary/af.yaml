  examples: []
  source_url: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - AF
- term: EPS Initiative
  definition: An SEC programme that uses data analytics to find earnings management, such as small adjustments
