- term: Concerted practice
  definition: Coordination between firms that stops short of a formal agreement but knowingly replaces
    competition with cooperation; public announcements can form part of one.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52023XC0721(01)
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Unilateral public announcement (signalling)
  definition: A firm's public statement, such as about future pricing intentions, that can tell rivals
    its strategy without committing it to customers.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52023XC0721(01)
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Hub-and-spoke arrangement
  definition: Indirect information sharing between competitors through a common supplier, distributor,
    platform or software provider at the centre.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52023XC0721(01)
  cases: []
  related: []
  indicators: []
