- term: Algorithmic collusion
  definition: Use of pricing algorithms to make an explicit cartel more stable, to coordinate through
    shared software, or to reach collusive prices without human agreement.
  examples: []
  source_url: https://www.gov.uk/government/publications/algorithms-how-they-can-reduce-competition-and-harm-consumers/algorithms-how-they-can-reduce-competition-and-harm-consumers
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Autonomous tacit collusion
  definition: Pricing algorithms learning on their own to keep prices high without any information sharing
    or agreement between firms.
  examples: []
  source_url: https://www.gov.uk/government/publications/algorithms-how-they-can-reduce-competition-and-harm-consumers/algorithms-how-they-can-reduce-competition-and-harm-consumers
  cases: []
