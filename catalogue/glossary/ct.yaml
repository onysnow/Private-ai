area: CT
terms:
- term: Price fixing
  definition: An agreement between competitors to raise, lower, hold or stabilise prices or price-related
    terms.
  examples: []
  source_url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/price-fixing
  cases: []
  related:
  - Cartel
  - Per se violation
  indicators: []
  areas:
  - CT
- term: Market division (market allocation)
  definition: An agreement between competitors to share out customers, products or territories so they
    do not compete for them.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related:
  - Customer allocation
  indicators: []
  areas:
  - CT
- term: Customer allocation
  definition: A type of market division where each competitor is given particular customers or customer
    types and the others leave them alone.
  examples: []
  source_url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/market-division-or-customer-allocation
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Bid rigging
  definition: Competitors agree in advance who will win a contract that the buyer puts out to competitive
    bidding.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related:
  - Complementary bidding
  - Bid rotation
  indicators: []
  areas:
  - CT
- term: Complementary (cover or courtesy) bid
  definition: A bid submitted only to look like competition, priced too high or with terms the buyer will
    not accept.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Bid rotation
  definition: Conspirators all bid but take turns being the lowest bidder.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Sherman Act
  definition: The 1890 US federal law that bans agreements among competitors to fix prices, rig bids or
    divide markets; breaking it is a felony.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Per se violation
  definition: Conduct that is illegal in itself, so it cannot be excused by arguing the agreed prices
    were reasonable.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Policing mechanism
  definition: A way for cartel members to check that everyone keeps to the agreement.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CT
- term: Fringe sellers
  definition: Small sellers that hold only a small share of a market dominated by a few major sellers.
  examples: []
  source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  cases: []
  related: []
  indicators: []
  areas:
