- term: Athlete Biological Passport (ABP)
  definition: An electronic record of an athlete's blood and urine markers over time, used to spot doping
    indirectly through abnormal changes.
  examples:
  - Haemoglobin, haematocrit, reticulocytes, OFF-score
  - Steroid profile
  source_url: https://www.usada.org/spirit-of-sport/education/athlete-biological-passport/
  cases: []
  related: []
  indicators: []
  areas:
  - SP
- term: OFF-score
  definition: A blood measure combining haemoglobin and reticulocytes, monitored in the biological passport;
    extreme values were cited in the IAAF blood data inquiry.
  examples: []
  source_url: https://www.usada.org/spirit-of-sport/education/athlete-biological-passport/
  cases: []
