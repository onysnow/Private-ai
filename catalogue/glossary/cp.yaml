  source_url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: Mandatory reporter
  definition: A person, usually a professional such as a teacher or doctor, whom state law requires to
    report suspected child abuse or neglect.
