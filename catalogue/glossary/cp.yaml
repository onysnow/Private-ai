  source_url: https://www.nice.org.uk/guidance/cg89/chapter/Recommendations
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: '''Consider'' and ''suspect'' (NICE)'
  definition: 'The two levels NICE uses for alerting features: ''consider'' means maltreatment is one
    possible explanation, while ''suspect'' indicates stronger evidence of child abuse and neglect.'
  examples: []
  source_url: https://www.nice.org.uk/guidance/ng76/chapter/Recommendations
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: Fabricated or induced illness (FII)
  definition: A form of maltreatment in which a carer reports, invents or causes illness in a child, so
    that the child's presentation does not match any recognised clinical picture.
  examples: []
  source_url: https://www.nice.org.uk/guidance/cg89/chapter/Recommendations
  cases: []
  related: []
  indicators: []
