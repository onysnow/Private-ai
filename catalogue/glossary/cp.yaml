  source_url: https://www.childwelfare.gov/resources/what-child-abuse-and-neglect-recognizing-signs-and-symptoms/
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: NCANDS
  definition: The US National Child Abuse and Neglect Data System, to which states report maltreatment
    data, including deaths; the CECANF commission considered its fatality counts an undercount.
  examples: []
  source_url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
  cases: []
  related: []
  indicators: []
