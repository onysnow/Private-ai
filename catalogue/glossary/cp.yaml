  related: []
  indicators: []
  areas:
  - CP
- term: Professional curiosity
  definition: Practitioners' willingness to question what they are told and look beyond first appearances;
    case reviews often find it lacking.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: Cumulative neglect
  definition: Harm that builds up over time from repeated, often low-level, failures of care; it is missed
    when each incident is treated alone.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: SUDI (sudden unexpected death in infancy)
  definition: The sudden and unexpected death of a baby; the Panel reports it among the main categories
