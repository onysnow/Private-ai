area: CP
terms:
- term: Child abuse and neglect (US federal minimum definition)
  definition: Under US federal law, at minimum any recent act or failure to act by a parent or caretaker
    that results in death, serious physical or emotional harm, sexual abuse or exploitation, or an imminent
    risk of serious harm.
  examples: []
  source_url: https://www.childwelfare.gov/resources/what-child-abuse-and-neglect-recognizing-signs-and-symptoms/
  cases: []
  related:
  - CAPTA
  indicators: []
  areas:
  - CP
- term: CAPTA
  definition: The Child Abuse Prevention and Treatment Act, the US federal law that sets the minimum definition
    of child abuse and neglect and funds state child-protection systems.
  examples: []
  source_url: https://www.childwelfare.gov/resources/what-child-abuse-and-neglect-recognizing-signs-and-symptoms/
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: CPS (child protective services)
  definition: The US state or county agency that receives reports of suspected child abuse or neglect
    and investigates or assesses them.
