- term: Section 47 enquiry
  definition: An enquiry that English local authorities must make under section 47 of the Children Act
    1989 when they believe a child has suffered, or is likely to suffer, significant harm.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1078488/ALH_SH_National_Review_26-5-22.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CP
- term: Strategy discussion
  definition: A multi-agency discussion held in England when there is reasonable cause to suspect significant
    harm, to decide whether to start child-protection enquiries.
