  areas:
  - CP
- term: LCSPR (local child safeguarding practice review)
  definition: A review that local safeguarding partners in England carry out after a serious incident
    to find lessons for practice.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
