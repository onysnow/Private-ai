- term: Worst forms of child labour
  definition: Slavery-like practices including child trafficking and debt bondage, using children for
    prostitution or pornography, for illicit activities like drug trafficking, and hazardous work likely
    to harm them.
  examples: []
  source_url: https://hrlibrary.law.umn.edu/links/ilo182.html
  cases: []
  related:
  - Hazardous child labour
  - Child
  indicators: []
  areas:
