- term: Difference between smuggling and trafficking
  definition: Smuggling involves people choosing to migrate illegally and always a border crossing; trafficking
    involves force or coercion and exploitation and needs no border crossing.
  examples: []
  source_url: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A008.pdf
