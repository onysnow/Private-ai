- term: Debt bondage (bonded labour)
  definition: Working off a pledged debt where the work's value is not fairly counted against the debt,
    or the length and nature of the work are not limited.
  examples: []
  source_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/supplementary-convention-abolition-slavery-slave-trade-and
  cases: []
