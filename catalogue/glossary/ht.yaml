- term: Forced labour
  definition: All work or service taken from a person under threat of a penalty and which the person did
    not offer voluntarily (ILO Convention No. 29).
  examples: []
  source_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
  cases: []
  related:
  - ILO indicators of forced labour
  - Debt bondage
  indicators: []
  areas:
  - HT
- term: ILO indicators of forced labour
  definition: 'The ILO''s 11 warning signs: abuse of vulnerability, deception, restriction of movement,
    isolation, violence, threats, retained ID documents, withheld wages, debt bondage, abusive conditions
    and excessive overtime; one may be enough or several may be needed.'
  examples: []
  source_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
  cases: []
  related:
