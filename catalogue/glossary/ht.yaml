- term: Front company
  definition: A business that looks legitimate and mixes criminal money with real business income to hide
    the crime and its owners.
  examples:
  - Massage businesses, escort services, bars, restaurants, cantinas
  source_url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
