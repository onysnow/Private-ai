area: HT
terms:
- term: Trafficking in persons (human trafficking)
  definition: Recruiting, moving, harbouring or receiving people by force, coercion, deception, abuse
    of vulnerability or payments, in order to exploit them.
  examples:
  - Sexual exploitation, forced labour, servitude, organ removal
  source_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/protocol-prevent-suppress-and-punish-trafficking-persons
  cases: []
  related:
  - Exploitation
  - Consent (irrelevance)
  - Migrant smuggling
  indicators: []
  areas:
  - HT
- term: Exploitation (Palermo Protocol)
  definition: 'At minimum: exploiting others'' prostitution or other sexual exploitation, forced labour
    or services, slavery or similar practices, servitude, or removal of organs.'
  examples: []
  source_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/protocol-prevent-suppress-and-punish-trafficking-persons
  cases: []
  related:
  - Trafficking in persons
  indicators: []
  areas:
  - HT
- term: Consent (irrelevance in trafficking)
  definition: A victim's agreement to the exploitation does not count if force, deception or another listed
    means was used.
  examples: []
  source_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/protocol-prevent-suppress-and-punish-trafficking-persons
  cases: []
  related:
  - Trafficking in persons
