- term: Suspicious Activity Report (SAR)
  definition: A report a US financial institution files with FinCEN when it suspects a transaction has
    no lawful purpose; FinCEN asks for keywords 'ADVISORY HUMAN TRAFFICKING' or 'ADVISORY HUMAN SMUGGLING',
    and says victims should not be named as the subject.
