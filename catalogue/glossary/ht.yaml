- term: Hazardous child labour
  definition: Work that by its nature or conditions is likely to harm a child's health, safety or morals
    (ILO C182 Article 3(d)).
  examples:
  - Overnight cleaning of meat-plant saws by 13-17 year olds (PSSI case)
  source_url: https://hrlibrary.law.umn.edu/links/ilo182.html
  cases: []
  related:
