- term: Group psychological abuse
  definition: The systematic, continued use of pressure, control, manipulation and coercion strategies
    by a group to dominate members and secure their submission.
  examples: []
  source_url: https://journals.copmadrid.org/ejpalc/art/j.ejpal.2017.01.002
