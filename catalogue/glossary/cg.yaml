area: CG
terms:
- term: Dérive sectaire (cultic deviance)
  definition: The French official term for a group or individual using pressure or techniques to put someone
    in a state of psychological or physical subjection that harms them, those around them or society.
  examples:
  - Miviludes' 17 indicative criteria
  source_url: https://www.miviludes.interieur.gouv.fr/comprendre-prevenir-et-lutter/comment-identifier-derive-sectaire
  cases: []
  related:
  - Sujétion psychologique
  - Miviludes
  indicators: []
  areas:
  - CG
- term: Sujétion psychologique ou physique (psychological or physical subjection)
  definition: A state in which a person's judgement is altered by serious or repeated pressure or techniques
    so that they lose part of their free will; French law since 2024 punishes placing or keeping someone
    in that state.
  examples: []
  source_url: https://www.miviludes.interieur.gouv.fr/comprendre-et-prevenir/que-dit-loi
  cases: []
  related:
  - Abus frauduleux de l'état de faiblesse
  indicators: []
  areas:
  - CG
- term: Abus frauduleux de l'état de faiblesse (About-Picard law, 2001)
  definition: The French criminal offence (Code pénal articles 223-15-2 to 223-15-4) of fraudulently exploiting
    a person's weakness, including weakness from psychological or physical subjection.
  examples: []
  source_url: https://www.miviludes.interieur.gouv.fr/comprendre-et-prevenir/que-dit-loi
  cases: []
  related:
  - Sujétion psychologique
  indicators: []
  areas:
  - CG
- term: Miviludes
  definition: France's Interministerial Mission for Vigilance and Combat against Cultic Deviances, a government
    body that monitors cultic harm and publishes criteria and annual reports.
