area: SA
terms:
- term: SLAPP (Strategic Lawsuit Against Public Participation)
  definition: A legal action threatened or brought mainly to harass, intimidate or financially drain a
    critic, not to win a genuine legal claim.
  examples: []
  source_url: https://www.coe.int/en/web/freedom-expression/-/council-of-europe-adopts-recommendation-on-countering-the-use-of-slapps
  cases: []
  related:
  - Abusive court proceedings against public participation
  - Forum shopping
  indicators: []
  areas:
  - SA
- term: Public participation
  definition: Any statement or activity in exercise of free expression, information, arts, science, assembly
    or association on a matter of public interest, including preparatory work such as journalism.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401069
  cases: []
  related: []
  indicators: []
  areas:
  - SA
- term: Abusive court proceedings against public participation
  definition: EU term for court cases not brought to assert a right but mainly to prevent, restrict or
    punish public participation, often exploiting a power imbalance and pursuing unfounded claims.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401069
  cases: []
  related:
  - SLAPP
  indicators: []
  areas:
  - SA
- term: Forum shopping
  definition: Choosing a court or country to sue in because it favours the claimant or burdens the defendant,
    not because it is the natural place for the case; the EU lists abusive forum shopping as a sign of
    a SLAPP.
  examples: []
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401069
  cases: []
  related: []
  indicators: []
  areas:
