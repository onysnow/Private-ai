- term: Coercion-by-proxy
  definition: Pressuring a critic by threatening or harming their relatives or contacts, often in the
    home country.
  examples: []
  source_url: https://freedomhouse.org/report/transnational-repression
  cases: []
  related: []
  indicators: []
  areas:
  - SA
- term: Mercenary spyware
  definition: Commercial surveillance software sold, usually to governments, to secretly break into phones
    of selected people such as journalists and activists.
  examples:
  - Pegasus (NSO Group)
  - Predator (Cytrox/Intellexa)
