- term: Admiralty Code / NATO source and information grading (A–F, 1–6)
  definition: 'A two-part grade for intelligence: a letter rates how reliable the source is (A completely
    reliable, B usually reliable, C fairly reliable, D not usually reliable, E unreliable, F cannot be
    judged) and a number rates how credible the information is (1 completely credible, 2 probably true,
    3 possibly true, 4 doubtful, 5 improbable, 6 truth cannot be judged).'
  examples:
  - B2 = usually reliable source, information probably true
  source_url: https://jadl.act.nato.int/ILIAS/data/testclient/lm_data/lm_152845/Linear/JISR04222102/sharedFiles/AJP21.pdf
  cases: []
  related:
  - Independence of reliability and credibility
  indicators: []
  areas:
  - CY
- term: Independence of reliability and credibility
  definition: NATO doctrine says source reliability and information credibility must be graded separately
    so one does not sway the other.
  examples: []
  source_url: https://jadl.act.nato.int/ILIAS/data/testclient/lm_data/lm_152845/Linear/JISR04222102/sharedFiles/AJP21.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CY
- term: 3x5x2 grading (UK police)
  definition: 'UK police intelligence grading: source rated 1 reliable, 2 untested, 3 not reliable; information
    rated A known directly, B known indirectly but corroborated, C known indirectly, D not known, E suspected
    false; and a handling code P (sharing permitted) or C (sharing with conditions).'
  examples: []
  source_url: https://www.college.police.uk/app/intelligence-management/completing-intelligence-report
  cases: []
  related: []
  indicators: []
  areas:
  - CY
- term: Handling code
  definition: In the UK 3x5x2 system, a code saying whether and on what conditions a piece of intelligence
    may be shared.
  examples: []
  source_url: https://www.college.police.uk/app/intelligence-management/completing-intelligence-report
