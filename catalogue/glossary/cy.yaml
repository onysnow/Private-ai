- term: Mixer / tumbler
  definition: A service that pools many users' coins and pays out different coins so it is hard to trace
    where funds came from.
  examples:
  - Bitcoin Fog
  - Helix
  - Tornado Cash
  - Samourai Whirlpool
  source_url: https://www.justice.gov/usao-sdny/pr/founders-samourai-wallet-cryptocurrency-mixing-service-sentenced-five-and-four-years
  cases: []
  related: []
  indicators: []
  areas:
  - CY
- term: CoinJoin (Whirlpool)
  definition: A mixing method that bundles payments from many users into one transaction; Samourai's Whirlpool
    coordinated such batches.
  examples: []
  source_url: https://www.justice.gov/usao-sdny/pr/founders-samourai-wallet-cryptocurrency-mixing-service-sentenced-five-and-four-years
  cases: []
  related: []
