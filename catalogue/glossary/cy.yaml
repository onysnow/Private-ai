  - Double extortion
  indicators: []
  areas:
  - CY
- term: Ransomware-as-a-service (affiliate model)
  definition: A ransomware group's developers rent their tools to 'affiliates' who carry out break-ins
    and share each ransom with the developers (LockBit's administrator allegedly took 20%).
  examples:
  - LockBit
  source_url: https://www.justice.gov/archives/opa/pr/two-foreign-nationals-plead-guilty-participating-lockbit-ransomware-group
  cases: []
  related: []
  indicators: []
  areas:
  - CY
- term: Double extortion / leak site
  definition: Attackers both encrypt and steal data, then threaten to publish it on a public site they
    control if the victim will not pay.
  examples: []
  source_url: https://www.justice.gov/archives/opa/pr/two-foreign-nationals-plead-guilty-participating-lockbit-ransomware-group
  cases: []
  related: []
  indicators: []
