- term: Expressions of likelihood (ICD 203)
  definition: 'US intelligence standard words for probability with ranges: almost no chance 1–5%, very
    unlikely 5–20%, unlikely 20–45%, roughly even chance 45–55%, likely 55–80%, very likely 80–95%, almost
    certain 95–99%.'
  examples: []
  source_url: https://archive.dni.gov/files/documents/ICD/ICD-203.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CY
- term: Confidence level vs likelihood (ICD 203)
  definition: Confidence describes how solid the evidence and reasoning are; likelihood describes how
    probable an event is; ICD 203 says the two must not be combined in one statement.
  examples: []
  source_url: https://archive.dni.gov/files/documents/ICD/ICD-203.pdf
