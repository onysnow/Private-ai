area: CY
terms:
- term: Ransomware
  definition: Malicious software that locks or encrypts a victim's systems or data and demands payment
    to restore access.
  examples: []
  source_url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
  cases: []
