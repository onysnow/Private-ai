area: ML
terms:
- term: Money laundering
  definition: 'Hiding where criminal money came from so it can be used as if it were legitimate, usually
    in three stages: placement, layering and integration.'
  examples: []
  source_url: https://www.fatf-gafi.org/en/pages/frequently-asked-questions.html
  cases: []
  related:
  - Placement
  - Layering
  - Integration
  indicators: []
  areas:
  - ML
- term: Placement
  definition: The first stage of laundering, when criminal money is first put into the financial system
    (for example cash deposits).
  examples:
  - Structuring cash deposits
  source_url: https://www.fatf-gafi.org/en/pages/frequently-asked-questions.html
  cases: []
  related: []
  indicators: []
  areas:
  - ML
- term: Layering
  definition: The second stage, when money is moved and converted repeatedly to distance it from its source.
  examples: []
  source_url: https://www.fatf-gafi.org/en/pages/frequently-asked-questions.html
  cases: []
  related: []
  indicators: []
  areas:
  - ML
- term: Integration
  definition: The final stage, when laundered money re-enters the legitimate economy, for example through
    property or business investment.
  examples: []
  source_url: https://www.fatf-gafi.org/en/pages/frequently-asked-questions.html
