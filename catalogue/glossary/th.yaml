  indicators: []
  areas:
  - TH
- term: Organised theft group (OTG)
  definition: A group whose thefts happen repeatedly or across jurisdictions, carried out by two or more
    people or by one person who both steals and sells.
  examples: []
  source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
  cases: []
