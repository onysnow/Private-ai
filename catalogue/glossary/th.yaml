area: TH
terms:
- term: Organised retail crime (ORC)
  definition: Theft or fraud carried out by a group, over several incidents or places, to obtain shop
    merchandise and turn it into money.
  examples: []
  source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
  cases: []
