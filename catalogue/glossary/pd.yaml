  source_url: https://www.govinfo.gov/content/pkg/FR-2016-07-28/html/2016-17721.htm
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Benzodiazepine
  definition: A class of sedative / anti-anxiety drugs (e.g. Xanax) that, with opioids, raises overdose
    risk.
