  source_url: https://www.govinfo.gov/content/pkg/FR-2016-07-28/html/2016-17721.htm
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Order to Show Cause / revocation
  definition: DEA's formal notice asking a registrant to explain why its registration should not be revoked;
    revocation removes the right to handle controlled drugs.
