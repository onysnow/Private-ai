  source_url: https://www.govinfo.gov/content/pkg/FR-2016-07-28/html/2016-17721.htm
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: DEA registration
  definition: The federal registration a doctor, pharmacy, distributor or manufacturer must hold to handle
    controlled drugs; DEA can suspend or revoke it.
