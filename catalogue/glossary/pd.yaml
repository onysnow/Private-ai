area: PD
terms:
- term: Diversion (prescription drug diversion)
  definition: Moving a legally made controlled drug out of legitimate medical channels into misuse or
    illegal sale.
  examples: []
  source_url: https://www.deadiversion.usdoj.gov/GDP/(DEA-DC-13) Preventing Diversion.pdf
  cases: []
  related:
  - Pill mill
  - Controlled substance
  indicators: []
  areas:
  - PD
- term: Pill mill
  definition: Informal name for a clinic, doctor or pharmacy that hands out controlled drugs, mostly opioids,
    without legitimate medical need, usually for cash.
  examples:
  - Atlanta Medical Group, Cartersville GA
  source_url: https://www.justice.gov/usao-ndga/pr/two-pill-mill-owners-convicted
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Controlled substance
  definition: A drug whose making, prescribing and dispensing is regulated by the US Controlled Substances
    Act and DEA rules because of its abuse potential (e.g. oxycodone, hydrocodone, benzodiazepines).
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/21/1306.04
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Legitimate medical purpose / usual course of professional practice
  definition: 'The legal test a controlled-drug prescription must meet to be valid: issued for a real
    medical need by a practitioner acting in normal professional practice.'
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/21/1306.04
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Corresponding responsibility
  definition: The pharmacist's own legal duty, alongside the prescriber's, to fill only prescriptions
    issued for a legitimate medical purpose.
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/21/1306.04
  cases: []
  related:
  - Red flag
  indicators: []
  areas:
  - PD
- term: Red flag (diversion)
  definition: A warning sign that a prescription or order may not be legitimate, which a pharmacist or
    distributor must resolve before filling or shipping.
