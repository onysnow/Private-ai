  source_url: https://www.law.cornell.edu/cfr/text/21/1301.74
  cases: []
  related: []
  indicators: []
  areas:
  - PD
- term: Suspicious order monitoring (SOM) and the shipping requirement
  definition: A distributor's system for flagging suspicious orders; after flagging, it must decline the
    order or do due diligence and ship only if diversion is unlikely.
