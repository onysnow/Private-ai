- term: Misclassification
  definition: Treating a worker who is legally an employee as an independent contractor, which denies
    them the minimum wage, overtime and other protections.
  examples: []
  source_url: https://www.dol.gov/agencies/whd/flsa/misclassification
  cases: []
  related:
  - Sham contracting
  - Economic reality test
  indicators: []
  areas:
