- term: National Minimum Wage (Australia)
  definition: The wage floor for employees not covered by an award or agreement. The guidance cites $23.23
    an hour at the time of the survey; award rates are often higher.
  examples: []
  source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
