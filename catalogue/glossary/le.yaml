  indicators: []
  areas:
  - LE
- term: Unlawful deduction
  definition: Money taken from wages without a lawful basis. In Australia a deduction is generally allowed
    only with written agreement mainly for the employee's benefit, or under an award, agreement, law or
    court order.
  examples: []
  source_url: https://www.fairwork.gov.au/pay-and-wages/deductions-and-related-issues/deducting-pay
  cases: []
