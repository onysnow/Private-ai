  - Modern award
  indicators: []
  areas:
  - LE
- term: Wage theft offence (Australia)
  definition: Criminal offence from 1 January 2025 for employers who intentionally engage in conduct that
    results in underpaying employees. Small businesses can avoid prosecution by following the Voluntary
    Small Business Wage Compliance Code.
  examples: []
  source_url: https://www.dewr.gov.au/node/16708
  cases: []
