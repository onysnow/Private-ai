- term: Wage theft
  definition: 'Not paying workers the full wages the law entitles them to: minimum wage, overtime, off-the-clock,
    meal-break, tip, deduction and misclassification violations.'
  examples: []
  source_url: https://www.epi.org/publication/wage-theft-2021-23/
  cases: []
