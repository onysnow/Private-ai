area: LE
terms:
- term: Labour exploitation (short of forced labour)
  definition: Breaking employment law to the worker's cost (underpayment, misclassification, unlawful
    deductions) without the threats or coercion that make it forced labour. UK enforcement sees it as
    a range running from compliant through negligent and exploitative to severe abuse.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1143364/uk-labour-market-enforcement-strategy-2022-2023.pdf
  cases: []
  related:
  - Forced labour
  - Wage theft
  indicators: []
  areas:
  - LE
- term: Forced labour
  definition: Work a person has not freely or knowingly agreed to and faces a threat, coercion or penalty
    for refusing. The ILO lists 11 indicators, including deception, debt bondage and withholding of wages.
  examples: []
  source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  cases: []
  related:
  - Modern slavery
  - Debt bondage
  indicators: []
  areas:
  - LE
- term: Modern slavery
  definition: Umbrella term for severe exploitation including forced labour, debt bondage and trafficking.
    Australia's Modern Slavery Act 2018 created the Anti-Slavery Commissioner.
  examples: []
  source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  cases: []
  related:
  - Forced labour
  indicators: []
  areas:
  - LE
- term: Debt bondage
  definition: Working to pay off a debt, often recruitment or travel fees, where the debt is used to keep
    the worker in the job. It is one of the ILO forced-labour indicators.
  examples: []
  source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  cases: []
  related:
  - Recruitment fees
  - Forced labour
  indicators: []
  areas:
