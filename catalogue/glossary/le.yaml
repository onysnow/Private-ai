- term: Independent contractor
  definition: A worker who runs their own business, controls how, when and where they work, can delegate
    the work and uses their own tools, as opposed to an employee.
  examples: []
  source_url: https://www.fairwork.gov.au/find-help-for/independent-contractors
  cases: []
  related:
  - Misclassification
  indicators: []
  areas:
