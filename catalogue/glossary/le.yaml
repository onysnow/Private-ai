- term: Free and clear / kickback (US)
  definition: The US rule (29 CFR 531.35) that wages count only if paid unconditionally. Any kickback
    of wages to the employer, including making workers buy the tools of the job, breaches it if it cuts
    into the minimum or overtime wages.
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/29/531.35
  cases: []
  related:
