- term: Cashback scheme
  definition: An arrangement where an employee is paid correctly on paper but must hand back part of the
    wage to the employer. It is unlawful in Australia, and US law requires wages to be paid 'free and
    clear'.
  examples: []
  source_url: https://www.fairwork.gov.au/pay-and-wages/deductions-and-related-issues/requirements-to-spend-or-pay-back-money
  cases: []
