- term: Sham contracting
  definition: Deliberately presenting an employee as a contractor when the business knew or should have
    known they were an employee. It is illegal under Australia's Fair Work Act 2009 and attracts penalties
    per contravention.
  examples: []
  source_url: https://www.fairwork.gov.au/find-help-for/independent-contractors
  cases: []
  related:
  - Misclassification
  indicators: []
  areas:
  - LE
- term: Economic reality test
  definition: 'The US test for employee status. It weighs six factors: opportunity for profit or loss,
    investments, permanence, control, whether the work is integral to the business, and skill and initiative.
    Labels and titles do not decide it.'
  examples: []
  source_url: https://www.dol.gov/agencies/whd/fact-sheets/13-flsa-employment-relationship
  cases: []
  related:
