- term: Australian Business Number (ABN)
  definition: An Australian registration number for people and businesses running an enterprise. Workers
    on an ABN are treated as contractors, not employees, so employee pay and record rules do not apply.
  examples: []
  source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
