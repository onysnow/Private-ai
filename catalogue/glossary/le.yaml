- term: Pay slip
  definition: A record of each pay period's hours, rates, loadings, deductions and super. In Australia
    it must be given within 1 working day of pay day, and giving one the employer knows is false is unlawful.
  examples: []
  source_url: https://www.fairwork.gov.au/pay-and-wages/paying-wages/pay-slips
