area: PS
terms:
- term: Substantial product hazard
  definition: Under US consumer product law, a product defect that, because of how often it occurs, how
    many units are out there or how bad the injury could be, creates a substantial risk of injury to the
    public.
  examples: []
  source_url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
  cases: []
  related:
  - Section 15(b) report
  - Defect
  indicators: []
  areas:
  - PS
- term: Defect (CPSC)
  definition: A fault, flaw or irregularity that makes a product weak, fail or fall short in form or function.
