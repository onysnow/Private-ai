- term: Four-or-fewer breeding females exemption
  definition: People with four or fewer breeding female pet animals who sell only offspring born and raised
    on their premises do not need a federal licence; the limit applies across the household.
  examples: []
  source_url: https://www.law.cornell.edu/cfr/text/9/2.1
  cases: []
  related: []
  indicators: []
  areas:
  - AN
