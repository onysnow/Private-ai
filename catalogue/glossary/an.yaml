- term: Duty of care (UK Animal Welfare Act 2006, s.9)
  definition: A person responsible for an animal commits an offence if they do not take reasonable steps
    to meet its needs for environment, diet, normal behaviour, housing with or apart from others, and
    protection from pain, injury and disease.
  examples: []
  source_url: https://www.legislation.gov.uk/ukpga/2006/45/section/9
  cases: []
  related: []
  indicators: []
