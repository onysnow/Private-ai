- term: Animal Welfare Act (US)
  definition: Federal law (7 U.S.C. 2131-2159) setting minimum care standards for animals exhibited to
    the public, sold as pets, used in research or transported commercially; enforced by USDA APHIS.
  examples: []
  source_url: https://www.aphis.usda.gov/awa
  cases: []
  related: []
  indicators: []
  areas:
  - AN
- term: APHIS Animal Care
  definition: The USDA unit that licenses, registers and inspects facilities under the Animal Welfare
    Act.
  examples: []
  source_url: https://www.aphis.usda.gov/awa
  cases: []
  related: []
  indicators: []
  areas:
  - AN
- term: Dealer / exhibitor licence
  definition: The USDA licence needed by anyone operating as a dealer, exhibitor or auction operator under
    the Animal Welfare Act, unless exempt.
