- term: Animal welfare (WOAH)
  definition: The physical and mental state of an animal in relation to the conditions in which it lives
    and dies.
  examples: []
  source_url: https://www.woah.org/en/what-we-do/animal-health-and-welfare/animal-welfare/
  cases: []
  related: []
  indicators: []
  areas:
  - AN
- term: Five Freedoms
  definition: Freedom from hunger and thirst, from fear and distress, from heat stress and physical discomfort,
    and from pain, injury and disease, plus freedom to express normal behaviour.
  examples: []
  source_url: https://www.woah.org/en/what-we-do/animal-health-and-welfare/animal-welfare/
  cases: []
  related: []
  indicators: []
  areas:
