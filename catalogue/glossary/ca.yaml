- term: Situational risk
  definition: Risk created when the setting gives adults the chance to be alone with children or form
    close relationships with them.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/media-centre/media-releases/2017-06/research-identifies-four-dimensions-of-risk-of-chi
