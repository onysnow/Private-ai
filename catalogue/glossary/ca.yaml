  indicators: []
  areas:
  - CA
- term: Royal Commission into Institutional Responses to Child Sexual Abuse
  definition: Australia's national public inquiry (2013-2017) into how institutions responded to child
    sexual abuse; its Final Report has 17 volumes.
  examples: []
  source_url: https://www.royalcommission.gov.au/child-abuse/final-report
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: IICSA (Independent Inquiry into Child Sexual Abuse)
  definition: The statutory inquiry for England and Wales, chaired by Professor Alexis Jay, which published
    its final report in 2022.
  examples: []
  source_url: https://www.iicsa.org.uk/reports-recommendations/publications/inquiry/final-report/executive-summary
  cases: []
