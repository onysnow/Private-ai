- term: Mandatory reporting
  definition: A legal duty on certain people, such as those in positions of trust, to report known or
    suspected child sexual abuse; IICSA recommended making it law in England and Wales.
  examples: []
  source_url: https://www.iicsa.org.uk/reports-recommendations/publications/inquiry/final-report/executive-summary
  cases: []
