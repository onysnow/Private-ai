- term: Closed institution / total institution
  definition: A setting where children live or spend most of their time cut off from outside contact and
    scrutiny, such as boarding houses, residential homes and detention.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/schools
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Clericalism
  definition: The idea that clergy hold a special status above lay people; the Royal Commission placed
    it at the centre of the factors that enabled abuse in religious institutions.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/religious-institutions
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Harmful sexual behaviours
  definition: Sexual behaviour by children that is outside what is developmentally expected and can harm
    other children.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/schools
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Low-level concern
  definition: Under English school guidance, any worry, however small, that an adult has acted against
    the staff code of conduct without reaching the harm threshold.
  examples:
  - being overfriendly with children
  - having favourites
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Harm threshold
  definition: 'The English guidance test for a serious allegation: the adult harmed or may have harmed
    a child, may have committed an offence against a child, or behaved in a way showing risk or unsuitability.'
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: LADO (Local Authority Designated Officer)
  definition: The local council officer in England who must be consulted about allegations that staff
    or volunteers have harmed or may pose a risk to children.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: DBS (Disclosure and Barring Service)
  definition: The body in England and Wales that runs criminal-record checks and bars unsuitable people
    from working with children; employers have a legal duty to refer certain cases to it.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Settlement (compromise) agreement
  definition: A deal where an employee resigns, the employer drops discipline, and both agree wording
    for future references; English guidance says it must not be used where there is a risk to children.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Position of trust (offence)
  definition: Under section 16 of the Sexual Offences Act 2003 (England and Wales), it is an offence for
    an adult in a position of trust to have sexual activity with a person under 18 in their care, even
    if consensual.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Transferable risk
  definition: Behaviour outside work that may make a person unsuitable to work with children.
  examples: []
  source_url: https://assets.publishing.service.gov.uk/media/6ac3c09c11ed58342ad8e4ac/Keeping_children_safe_in_education_2026.pdf
  cases: []
