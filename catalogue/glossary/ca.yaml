- term: MAAPP (Minor Athlete Abuse Prevention Policies)
  definition: Mandatory rules from the U.S. Center for SafeSport for Olympic and Paralympic sport bodies,
    covering one-on-one contact, messaging, travel, lodging, massage and locker rooms.
  examples: []
  source_url: https://maapp.uscenterforsafesport.org/wp-content/uploads/2025/01/Weightlifting_2025-MAAPP_01.01.25.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Observable and interruptible
  definition: MAAPP standard that any one-on-one contact between an adult and a minor athlete must happen
    where others can see it and walk in.
  examples: []
  source_url: https://maapp.uscenterforsafesport.org/wp-content/uploads/2025/01/Weightlifting_2025-MAAPP_01.01.25.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Open and Transparent (communications)
  definition: MAAPP rule that one-to-one electronic messages with a minor athlete must copy a parent,
    another family adult or another adult participant.
  examples: []
  source_url: https://maapp.uscenterforsafesport.org/wp-content/uploads/2025/01/Weightlifting_2025-MAAPP_01.01.25.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Clery Act
  definition: US federal law requiring colleges receiving federal aid to report campus crimes and issue
