- term: Vulnerability risk
  definition: Risk that comes from the characteristics of the children in a setting, such as age, disability
    or earlier maltreatment.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/media-centre/media-releases/2017-06/research-identifies-four-dimensions-of-risk-of-chi
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Propensity risk
  definition: Risk from a concentration of adults inclined to abuse, or of children with harmful sexual
    behaviours, in one setting.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/media-centre/media-releases/2017-06/research-identifies-four-dimensions-of-risk-of-chi
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Institutional risk
  definition: Risk from how an organisation is run, such as putting reputation first or not listening
    to children.
  examples: []
  source_url: https://www.childabuseroyalcommission.gov.au/media-centre/media-releases/2017-06/research-identifies-four-dimensions-of-risk-of-chi
  cases: []
  related: []
  indicators: []
  areas:
