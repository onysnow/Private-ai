- term: Grooming
  definition: Deliberate steps an abuser takes to build trust with a child and the people around them,
    to make abuse possible and avoid being caught.
  examples: []
  source_url: https://childabuseroyalcommission.gov.au/getattachment/b8c8cc19-ad65-44f5-951e-3b1705156da2/Grooming-and-child-sexual-abuse-in-institutional-c
  cases: []
  related: []
  indicators: []
  areas:
  - CA
- term: Institutional grooming
  definition: Grooming aimed at an organisation itself, using its features and trust to get around its
    safety measures.
  examples: []
  source_url: https://childabuseroyalcommission.gov.au/getattachment/b8c8cc19-ad65-44f5-951e-3b1705156da2/Grooming-and-child-sexual-abuse-in-institutional-c
  cases: []
  related:
