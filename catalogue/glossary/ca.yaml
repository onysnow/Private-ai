- term: Child Safe Standards / National Principles for Child Safe Organisations
  definition: Ten standards recommended by the Australian Royal Commission, adopted as national principles
    that set out what a child-safe organisation does, from leadership to complaint handling.
  examples: []
  source_url: https://humanrights.gov.au/resource-hub/resources-for-organisations-businesses/child-safe-organisations
  cases: []
  related: []
  indicators: []
  areas:
