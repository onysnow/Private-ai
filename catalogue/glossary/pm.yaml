area: PM
terms:
- term: Early intervention system (EIS)
  definition: A database a police agency uses to spot officers whose records show a pattern of problems,
    so supervisors can act before something serious happens.
  examples: []
  source_url: https://cops.usdoj.gov/RIC/Publications/cops-p105-pub.pdf
  cases: []
  related:
  - Threshold
  - Peer officer comparison
  indicators: []
  areas:
  - PM
- term: Threshold
  definition: The count of incidents (for example complaints in a set period) that triggers a review of
    an officer in an early intervention system.
  examples:
  - 'Miami-Dade: two or more citizen complaints in a quarter'
  source_url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - PM
- term: Peer officer comparison
  definition: Judging an officer's numbers against officers with the same assignment, so busy beats are
    not unfairly flagged.
