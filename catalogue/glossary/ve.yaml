- term: TRAP-18 (Terrorist Radicalization Assessment Protocol)
  definition: A structured professional tool that codes 8 proximal warning behaviours and 10 longer-term
    distal characteristics to organise information about a person of concern.
  examples: []
  source_url: https://drreidmeloy.com/training/trap-18/
  cases: []
  related: []
  indicators: []
  areas:
  - VE
- term: Proximal warning behaviour
  definition: A near-term behaviour in TRAP-18 suggesting risk is rising now (pathway, fixation, identification,
    novel aggression, energy burst, leakage, last resort, directly communicated threat).
  examples: []
  source_url: https://www.dcjs.virginia.gov/sites/dcjs.virginia.gov/files/training-events/4193/summaryofproximalanddistalwarningbehaviors.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - VE
- term: Distal characteristic
  definition: A longer-term background factor in TRAP-18, such as grievance, ideology or a history of
    violence, that raises concern only together with other signs.
  examples: []
  source_url: https://www.dcjs.virginia.gov/sites/dcjs.virginia.gov/files/training-events/4193/summaryofproximalanddistalwarningbehaviors.pdf
  cases: []
  related: []
  indicators: []
  areas:
  - VE
- term: Leakage
  definition: Telling a third party about an intent to harm a target through an attack.
