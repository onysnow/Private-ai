area: OH
terms:
- term: Prevention of Future Deaths (PFD) report
  definition: A report a coroner in England and Wales sends to organisations when an inquest reveals a
    risk that further deaths could happen unless action is taken; recipients must respond within 56 days.
  examples:
  - PFD 2023-0534 required responses within 56 days of 19 December 2023.
  source_url: https://www.judiciary.uk/prevention-of-future-death-reports/chloe-macdermott-prevention-of-future-deaths-report/
  cases: []
  related: []
  indicators: []
  areas:
  - OH
