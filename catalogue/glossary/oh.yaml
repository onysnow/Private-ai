- term: Encouraging or assisting serious self-harm
  definition: A UK criminal offence of doing an act capable of, and intended to, encourage or assist another
    person's self-harm at the level of grievous bodily harm.
  examples: []
  source_url: https://www.legislation.gov.uk/ukpga/2023/50/section/184
