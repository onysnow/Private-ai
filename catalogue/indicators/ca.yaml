  (2015), NZ Royal Commission into Abuse in Care final report (2024): not opened'
- 'CIASE (Sauvé) report itself: not opened; only Vatican News coverage was read'
- 'U.S. Department of Education primary press releases for the Penn State (2016) and MSU (2019) fines:
  not opened; news coverage was used instead (the Campus Safety Magazine link redirected away)'
- 'Boy Scouts of America ''ineligible volunteer files'': no primary source opened'
- 'Opening pages of the ''Risk profiles for institutional child sexual abuse'' attachment: the title page
