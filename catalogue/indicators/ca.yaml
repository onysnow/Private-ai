key: CA
name: Child sexual abuse in institutions
scope: 'Child sexual abuse in institutions (churches, schools, sport, care). Risk framework from the Australian
  Royal Commission into Institutional Responses to Child Sexual Abuse, ''Risk profiles for institutional
  child sexual abuse'' (2017), in four dimensions. Situational: chances for adults to be alone with children
  or form close relationships with them. Vulnerability: the child''s age, disability, earlier maltreatment,
  or a reason to stay silent. Propensity: a concentration of adults inclined to abuse, or of children
  with harmful sexual behaviours. Institutional: putting the institution''s reputation ahead of children''s
  protection, and a culture of not listening to children.'
indicators:
- id: CA-001
  name: Reputation put ahead of children's safety
  definition: Leaders respond to abuse concerns mainly to protect the institution's name, finances or
    standing, rather than to protect children.
  areas:
  - CA
  typology: 'Institutional risk: culture and leadership'
  status: verified
  sources:
  - title: Research identifies four dimensions of risk of child sexual abuse in institutions (media release)
    publisher: Royal Commission into Institutional Responses to Child Sexual Abuse
    year: '2017'
    url: https://www.childabuseroyalcommission.gov.au/media-centre/media-releases/2017-06/research-identifies-four-dimensions-of-risk-of-chi
    locator: Institutional risk
    quote: placing greater importance on the protection of reputation than on the wellbeing and protection
      of children
    quote_verified: true
    checked: '2026-10-09'
  - title: 'The Report of the Independent Inquiry into Child Sexual Abuse: Executive summary'
    publisher: Independent Inquiry into Child Sexual Abuse (IICSA)
    year: '2022'
    url: https://www.iicsa.org.uk/reports-recommendations/publications/inquiry/final-report/executive-summary
    locator: Executive summary
    quote: The protection of personal and institutional reputations above the protection of children
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Final Report: Schools (Volume 13) summary page'
    publisher: Royal Commission into Institutional Responses to Child Sexual Abuse
    year: '2017'
    url: https://www.childabuseroyalcommission.gov.au/schools
    locator: Leadership, governance and culture
    quote: cultures that prioritised protecting the school over the safety of children
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Internal memos discussing 'avoiding scandal' when a complaint arrives
  - Board minutes about press handling with no item on the child's safety
  cases:
  - name: Ampleforth and Downside (English Benedictine Congregation)
    year: '2018'
    jurisdiction: England and Wales
    what_happened: IICSA found that safeguarding children was treated as less important than the reputation
      of the Church and the wellbeing of abusive monks.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.iicsa.org.uk/news/inquiry-publishes-report-ampleforth-and-downside
    source_title: Inquiry publishes report into Ampleforth and Downside
  - name: Catholic Diocese of Ballarat (Case Study 28)
    year: '2017'
    jurisdiction: Australia (Victoria)
    what_happened: The Royal Commission found Bishop Mulkearns' overwhelming concern was to protect the
      diocese and the Church from further scandal, as reported by The Australian.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.bishop-accountability.org/2017/12/ballarat-catholic-diocese-catastrophic-abuse-royal-commission-finds/
    source_title: Ballarat Catholic diocese catastrophic, abuse royal commission finds (The Australian,
      reposted)
  data_needed:
  - Document (minutes, memos, correspondence)
  - Email
  - Person (leaders, accused)
  - Organization
  - PublicBody (police, child-protection agency)
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: IICSA found undue deference by police and prosecutors toward people in public life helped
      keep allegations quiet.
    source_url: https://www.iicsa.org.uk/reports-recommendations/publications/inquiry/final-report/executive-summary
  innocent_explanations:
  - Institutions legitimately manage media and legal exposure alongside a proper safeguarding response
  - Confidentiality may protect the child's identity, not the institution
  - Concern for reputation can coexist with prompt reporting to police
  jurisdictions: Australia, England and Wales; applies generally
  version: 1
