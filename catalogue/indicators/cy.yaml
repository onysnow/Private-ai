  - name: Helix (Larry Dean Harmon)
    year: '2024'
    jurisdiction: US (D.D.C.)
    what_happened: Harmon pleaded guilty in 2021 to money laundering conspiracy for running Helix, which
      laundered about 354,468 bitcoin; sentenced to three years; FinCEN separately assessed a $60 million
      civil penalty.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/operator-helix-darknet-cryptocurrency-mixer-sentenced-money-laundering-conspiracy-and
    source_title: Operator of Helix Darknet Cryptocurrency Mixer Sentenced
  - name: Tornado Cash (Roman Storm)
    year: '2025'
    jurisdiction: US (S.D.N.Y.)
