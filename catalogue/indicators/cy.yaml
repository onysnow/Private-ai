    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 10
    quote: This may be indicative of attempts to break the chain of custody on the respective blockchains
      or further obfuscate the transaction.
    quote_verified: true
    checked: '2026-10-09'
