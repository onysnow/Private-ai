    source_url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Alert_Pig_Butchering_FINAL_508c.pdf
  innocent_explanations:
  - People do start investing in crypto for their own reasons
  - A large first purchase may follow an inheritance or bonus
