  cases:
  - name: Bitcoin Fog (Roman Sterlingov)
    year: '2024'
    jurisdiction: US (D.D.C.)
    what_happened: A jury convicted the operator of money laundering conspiracy, money laundering and
      unlicensed money transmission; the mixer processed over 1.2 million bitcoin (about $400 million).
      Sentenced to 12 years 6 months.
