- id: CY-011
  name: Use of a crypto mixing or tumbling service
  definition: Funds are sent to or come from a mixer, which pools and reshuffles coins to hide where they
    came from.
  areas:
  - CY
  - ML
  typology: Obfuscation
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 11
    quote: A customer initiates a transfer of funds involving a mixing service.
    quote_verified: true
    checked: '2026-10-08'
  - title: 'Virtual Assets: Red Flag Indicators'
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-Assets-Red-Flag-Indicators.pdf
