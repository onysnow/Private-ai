- id: CY-009
  name: Use of exchanges in jurisdictions with weak or no crypto regulation
  definition: Funds come from or go to crypto exchanges that are unregistered where they operate or are
    based in places with no or weak anti-money-laundering rules for crypto.
  areas:
  - CY
  - FR
  - ML
  typology: High-risk jurisdiction
  status: verified
  sources:
