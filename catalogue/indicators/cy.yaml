- id: CY-009
  name: Use of exchanges in jurisdictions with weak or no crypto regulation
  definition: Funds come from or go to crypto exchanges that are unregistered where they operate or are
    based in places with no or weak anti-money-laundering rules for crypto.
  areas:
  - CY
  - FR
  - ML
  typology: High-risk jurisdiction
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 9
    quote: A customer uses a foreign-located CVC exchanger in a high-risk jurisdiction lacking, or known
      to have inadequate, AML/CFT regulations for CVC entities.
    quote_verified: true
    checked: '2026-10-08'
  - title: 'Virtual Assets: Red Flag Indicators'
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-Assets-Red-Flag-Indicators.pdf
    locator: Para 16 (geographical risks)
    quote: Customer sends funds to VASPs operating in jurisdictions that have no VA regulation
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Withdrawals routed to an offshore exchange that advertises no identity checks.
  cases:
