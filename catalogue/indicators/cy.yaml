  cases:
  - name: Samourai Wallet (Keonne Rodriguez and William Lonergan Hill)
    year: '2025'
    jurisdiction: US (S.D.N.Y.)
    what_happened: Founders of the Samourai Wallet mixing service were sentenced to five and four years
      for conspiracy to operate a money transmitting business; DOJ says over $237 million in criminal
      proceeds passed through it.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-sdny/pr/founders-samourai-wallet-cryptocurrency-mixing-service-sentenced-five-and-four-years
    source_title: Founders Of Samourai Wallet Cryptocurrency Mixing Service Sentenced
  data_needed:
  - Company
  - UserAccount
  - Payment
  - CryptoWallet
  - Document (MSB registration)
  checkable: lookups
  lookup_sources:
  - FinCEN MSB registration search
  - Exchange account records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - High-frequency or arbitrage traders make many offsetting trades for their own account
