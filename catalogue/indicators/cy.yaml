    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Alert_Pig_Butchering_FINAL_508c.pdf
    locator: Behavioral red flags, p.6
    quote: A customer with no history or background of using, exchanging, or otherwise interacting with
      virtual currency…
    quote_verified: true
    checked: '2026-10-09'
  - title: FIN-2023-Alert005
    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Alert_Pig_Butchering_FINAL_508c.pdf
    locator: Behavioral red flags, p.6
    quote: A customer appears distressed or anxious to access funds to meet demands or the timeline…
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A retiree who has never owned crypto asks the bank to wire $150,000 to a crypto exchange the same
