    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-sdny/pr/founder-tornado-cash-crypto-mixing-service-convicted-knowingly-transmitting-criminal
    source_title: Founder Of Tornado Cash Crypto Mixing Service Convicted
  data_needed:
