- id: CY-008
  name: Unregistered broker using an exchange's liquidity for many offsetting trades
  definition: A customer who has not identified itself as a money transmitter makes large numbers of offsetting
    trades through an exchange, suggesting it is acting as an unlicensed over-the-counter (OTC) or peer-to-peer
    broker.
  areas:
  - CY
  - FR
  - ML
  typology: Unlicensed money transmission / nested services
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 8
    quote: A customer that has not identified itself to the CVC exchanger, or registered with FinCEN as
      a money transmitter, appears to be using the liquidity provided by the exchange to execute large
      numbers of offsetting transactions between various CVCs, which may indicate that the customer is
      acting as an unregistered MSB.
    quote_verified: true
    checked: '2026-10-08'
  - title: FinCEN Alert on Scam Centers (FIN-2026-Alert005)
    publisher: FinCEN
    year: '2026'
    url: https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf
    locator: Red Flags Related to Laundering Techniques, p.12
    quote: A customer of a digital asset exchange appears to be using liquidity provided by the digital
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - An account trades back and forth between USDT, BTC and ETH thousands of times a month with balanced
