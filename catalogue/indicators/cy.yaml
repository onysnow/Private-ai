key: CY
name: Cybercrime and judging sources
scope: ransomware, online fraud networks, scam compounds (which link to trafficking), business email compromise,
  crypto fraud and mixers. Separately, collect the published systems for grading source reliability and
  information credibility (the Admiralty Code / NATO system and similar) as glossary entries, not as indicators
  about people.
indicators:
- id: CY-001
  name: Network activity linked to known ransomware indicators or actors
  definition: The organisation's own IT logs, network traffic or files show activity that matches published
    ransomware technical indicators or known ransomware groups.
  areas:
  - CY
  typology: Ransomware
  status: verified
  sources:
  - title: Advisory on Ransomware and the Use of the Financial System to Facilitate Ransom Payments (FIN-2021-A004)
    publisher: FinCEN, US Treasury
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Financial Red Flag Indicators, item 1
    quote: A financial institution or its customer detects IT enterprise activity that is connected to
      ransomware cyber indicators or known cyber threat actors.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - Incident-response logs from a hospital show a beacon to a server listed in a government ransomware
    alert.
  cases: []
  data_needed:
  - Document (log files, incident reports)
  - Company
  - Event
  checkable: lookups
  lookup_sources:
  - 'Government cyber advisories (CISA/FBI #StopRansomware)'
  - Threat-intelligence indicator feeds
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Indicator lists contain shared hosting IPs or common tools also used legitimately
  - Security testing (red-team exercises) can trigger the same indicators
  - Scanning traffic from the internet hits almost every network
  jurisdictions: US (FinCEN guidance; widely used internationally)
  version: 1
- id: CY-002
  name: Payer says a payment is a ransom
  definition: A customer or organisation states, when opening an account or arranging a payment, that
    the money is to pay a ransomware demand.
  areas:
  - CY
  typology: Ransomware
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 2
    quote: When opening a new account or during other interactions with the financial institution, a customer
      provides information that a payment is in response to a ransomware incident.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Colonial Pipeline paid a ransom of about 75 bitcoin in May 2021 (DOJ).
  cases:
  - name: Colonial Pipeline ransom and DarkSide seizure
    year: '2021'
    jurisdiction: US (N.D. California seizure warrant)
    what_happened: Colonial Pipeline paid about 75 bitcoin after a ransomware attack; DOJ traced the payment
      on the public Bitcoin ledger and seized 63.7 bitcoin (about $2.3 million). This was a seizure, not
      a conviction.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/department-justice-seizes-23-million-cryptocurrency-paid-ransomware-extortionists-darkside
    source_title: Department of Justice Seizes $2.3 Million in Cryptocurrency Paid to the Ransomware Extortionists
      Darkside
  data_needed:
  - Payment (payer, beneficiary, amount, purpose)
  - CryptoWallet
  - Company
  - Document
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: Paying or facilitating a ransom to a sanctioned person or group may breach US sanctions on
      a strict-liability basis.
    source_url: https://ofac.treasury.gov/media/912981/download?inline=
  innocent_explanations:
  - The victim is the payer and may be acting lawfully; paying a ransom is not itself a crime in most
    places
  - The statement may describe a payment for decryption tools or negotiation services rather than the
    ransom itself
  jurisdictions: US
  version: 1
- id: CY-003
  name: Wallet or address linked to ransomware, fraud or extortion
  definition: An account, bank card or crypto address used by the subject, or by its counterparties, has
    been publicly or commercially linked to ransomware, fraud or extortion.
  areas:
  - CY
  - FR
  - ML
  typology: Proceeds of cybercrime
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 3
    quote: A customer’s CVC address, or an address with which a customer conducts transactions is connected
      to ransomware variants, payments, or related activity.
    quote_verified: true
    checked: '2026-10-08'
  - title: 'Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing'
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-Assets-Red-Flag-Indicators.pdf
    locator: Para 15 (source of funds or wealth)
    quote: Transacting with VA addresses or bank cards that are connected to known fraud, extortion, or
      ransomware schemes
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A wallet receives funds from an address that blockchain-analytics firms label as a ransomware cash-out.
  cases: []
  data_needed:
  - CryptoWallet (publicKey, holder)
  - Payment
  - BankAccount
  - Sanction
  - Document (analytics report)
  checkable: lookups
  lookup_sources:
  - Blockchain analytics / block explorers
  - OFAC SDN list (includes digital currency addresses)
  - Government advisories listing addresses
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Exchanges and payment hubs touch huge numbers of addresses, so indirect links are common
  - Analytics attributions can be wrong or out of date
  - A victim's own wallet will show links to the ransom address
  jurisdictions: US; FATF members (international)
  version: 1
- id: CY-004
  name: Unusual payment from a high-risk-sector organisation to an incident-response or cyber-insurance
    firm
  definition: An organisation in a sector often hit by ransomware makes an irregular payment to a digital
    forensics/incident response (DFIR) firm or cyber insurer, especially one known to pay ransoms on clients'
    behalf.
  areas:
  - CY
  typology: Ransomware payment facilitation
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 4
    quote: An irregular transaction occurs between an organization, especially an organization from a
      sector at high risk for targeting by ransomware (e.g., government, financial, educational, healthcare)
      and a DFIR or CIC, especially one known to facilitate ransomware payments.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A school district wires an unbudgeted sum to an incident-response firm days after a system outage.
  cases: []
  data_needed:
  - Payment
  - Company
  - Contract
  - Document (invoices, board minutes)
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: OFAC names DFIR firms, cyber insurers and financial institutions as facilitators who may face
      strict-liability penalties if a ransom reaches a sanctioned person.
    source_url: https://ofac.treasury.gov/media/912981/download?inline=
  innocent_explanations:
  - Organisations routinely hire DFIR firms for audits and breaches that involve no ransom
  - Insurance premiums and claims payments are ordinary
  jurisdictions: US
  version: 1
- id: CY-005
  name: 'Pass-through: incident-response or insurer receives funds then quickly sends the same amount
    to a crypto exchange'
  definition: A DFIR firm or cyber insurer receives money from a client and soon after sends an equal
    amount to a crypto exchange, consistent with buying crypto to pay a ransom.
  areas:
  - CY
  typology: Ransomware payment facilitation
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 5
    quote: A DFIR or CIC customer receives funds from a counterparty and shortly after receipt of funds
      sends equivalent amounts to a CVC exchange.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A $400,000 inbound wire from a hospital is followed within a day by a $400,000 wire to a crypto exchange.
  cases: []
  data_needed:
  - Payment (amount, date, payer, beneficiary)
  - BankAccount
  - Company
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Some firms legitimately buy crypto for clients for lawful purposes
  - Matching amounts may be coincidental pass-through billing
  jurisdictions: US
  version: 1
- id: CY-006
  name: Person new to crypto suddenly buys or sends large amounts, often under time pressure
  definition: Someone with little or no crypto experience urgently converts large sums into crypto or
    sends large transfers to a crypto platform, which can mean they are a ransomware or scam victim.
  areas:
  - CY
  - FR
  typology: Victim-side signal
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 6
    quote: A customer shows limited knowledge of CVC during onboarding or via other interactions with
      the financial institution, yet inquires about or purchases CVC (particularly if in a large amount
      or rush requests), which may indicate the customer is a victim of ransomware.
    quote_verified: true
    checked: '2026-10-08'
  - title: FinCEN Alert on Prevalent Virtual Currency Investment Scam Commonly Known as 'Pig Butchering'
      (FIN-2023-Alert005)
    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Alert_Pig_Butchering_FINAL_508c.pdf
    locator: Behavioral red flags, p.6
    quote: A customer with no history or background of using, exchanging, or otherwise interacting with
      virtual currency…
    quote_verified: true
    checked: '2026-10-08'
  - title: FIN-2023-Alert005
    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Alert_Pig_Butchering_FINAL_508c.pdf
    locator: Behavioral red flags, p.6
    quote: A customer appears distressed or anxious to access funds to meet demands or the timeline…
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A retiree who has never owned crypto asks the bank to wire $150,000 to a crypto exchange the same
