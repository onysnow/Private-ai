    quote_verified: true
    checked: '2026-10-09'
  - title: 'Virtual Assets: Red Flag Indicators'
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-Assets-Red-Flag-Indicators.pdf
    locator: Para 16 (geographical risks)
    quote: Customer sends funds to VASPs operating in jurisdictions that have no VA regulation
    quote_verified: true
    checked: '2026-10-09'
