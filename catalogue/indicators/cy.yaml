- id: CY-007
  name: Business with little crypto history makes a large crypto transfer
  definition: A company with no or limited crypto activity sends a large crypto transaction outside its
    normal business, which can indicate a ransom payment.
  areas:
  - CY
  typology: Ransomware
  status: verified
  sources:
  - title: FIN-2021-A004 Ransomware Advisory
    publisher: FinCEN
    year: '2021'
    url: https://www.fincen.gov/sites/default/files/advisory/2021-11-08/FinCEN%20Ransomware%20Advisory_FINAL_508_.pdf
    locator: Red flag item 7
    quote: A customer that has no or limited history of CVC transactions sends a large CVC transaction,
