- id: HR-245
  name: 'Persecution: severe deprivation of fundamental rights because of group identity'
  definition: People are deliberately and severely stripped of basic rights because they belong to an
    identifiable group, linked to other crimes against humanity.
  areas:
  - HR
  typology: Persecution (crime against humanity)
  status: verified
  sources:
