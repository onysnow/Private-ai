- id: HR-009
  name: Non-state armed group controls mine sites, routes or trading points
  definition: An armed group (or its affiliates) oversees extraction, grants access to mines, controls
    transport routes or trading points, or holds ownership or director roles in upstream companies.
  areas:
  - HR
  typology: Conflict financing through natural resources
  status: verified
  sources:
  - title: OECD Due Diligence Guidance - Annex II Model Supply Chain Policy
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Annex II, para. 3(i) and footnote 5, p. 21
    quote: illegally control mine sites or otherwise control transportation routes, points where minerals
      are traded and upstream actors in the supply chain
    quote_verified: true
    checked: '2026-10-09'
  - title: Final report of the Group of Experts on the DRC (S/2024/432)
    publisher: United Nations Security Council
    year: '2024'
    url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
    locator: para. 138
    quote: Mining sites in the Rubaya area remained under the control of the armed group Coalition des
      patriotes résistants congolais-Force de frappe (PARECO-FF)
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Rubaya (DRC) coltan sites under PARECO-FF, with M23 controlling the smuggling route (S/2024/432).
  - Mai-Mai Yakutumba controlling gold mining in Fizi territory (S/2024/432, para 189).
  cases:
  - name: M23 seizure of the Rubaya coltan mining area
    year: '2024'
    jurisdiction: DR Congo (North Kivu)
    what_happened: M23 rebels said they had seized Rubaya for its tantalum deposits (AP, 3 May 2024).
      The town was reported to be still under M23 control in March 2026 (BBC). This rests on news reporting
      cited by Wikipedia. I could not open the UN Group of Experts report.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://en.wikipedia.org/wiki/Rubaya
    source_title: Wikipedia, 'Rubaya' (citing AP 3 May 2024 and BBC 5 March 2026)
  data_needed:
  - Organization (armed group)
  - Ownership / Directorship (armed group members in upstream companies)
  - Address (mine site)
  - Event (control, clashes)
  - Sanction (listing of group or leader)
  checkable: lookups
  lookup_sources:
  - UN Group/Panel of Experts reports
  - UN sanctions lists
  - IPIS mine-site maps
  - ACLED conflict event data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded (OECD Annex II para. 3 and fn. 5).
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: Leaders of such groups are often on UN sanctions lists (e.g. CDi.043).
    source_url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
  innocent_explanations:
  - Local community defence groups or state forces may be present without controlling extraction.
  - Control can change quickly; old reports may be out of date.
  jurisdictions: Global
  version: 1
- id: HR-010
  name: Illegal taxation or extortion by armed actors along the supply chain
  definition: Armed groups or security forces demand money or minerals, under threat, for access to mines,
    roads, trading points, or from traders and exporters.
  areas:
  - HR
  typology: Conflict financing; extortion
  status: verified
  sources:
  - title: OECD Due Diligence Guidance - Annex II Model Supply Chain Policy
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Annex II, para. 3(ii)-(iii), para. 5, p. 21-22
    quote: illegally tax or extort money or minerals at point of access to mine sites, along transportation
      routes or at points where minerals are traded
    quote_verified: true
    checked: '2026-10-09'
  - title: Final report of the Group of Experts on the DRC (S/2024/432)
    publisher: United Nations Security Council
    year: '2024'
    url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
    locator: para. 190
    quote: All armed groups in Fizi territory maintained an illegal taxation system on various economic
      activities, in particular gold mining
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Fizi territory gold taxation by armed groups (S/2024/432).
  - Lafarge Cement Syria paid ISIS 750 Syrian pounds per ton of cement sold, which executives likened
    to taxes (DOJ, 2022).
  cases:
  - name: M23 taxes on coltan export and transport at Rubaya
    year: '2026'
    jurisdiction: DR Congo (North Kivu)
    what_happened: After taking Rubaya, the rebels were reported to have imposed taxes on the export and
      transport of coltan (AP, 5 March 2026).
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://en.wikipedia.org/wiki/Rubaya
    source_title: Wikipedia, 'Rubaya' (citing AP explainer, 5 March 2026)
  - name: 'Chiquita Brands International: payments to the AUC'
    year: '2007'
    jurisdiction: United States / Colombia
    what_happened: Chiquita's Colombian subsidiary Banadex made over 100 payments totalling more than
      $1.7m to the AUC paramilitaries (1997-2004). The AUC leader implied that not paying could bring
      harm to staff and property. Chiquita pleaded guilty to transactions with a specially designated
      global terrorist and paid a $25m fine.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archive/opa/pr/2007/March/07_nsd_161.html
    source_title: US DOJ press release, March 2007
  data_needed:
  - Payment (payer, beneficiary, purpose, amount, date)
  - Document (receipts, roadblock tickets)
  - Organization (armed group)
  - Address (checkpoint location)
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded (OECD Annex II).
    threshold_source: none
  threshold_verified: true
  cross_hints:
