  cases:
  - name: Prosecutor v. Bagosora et al. (Military I), ICTR-98-41
    year: '2008'
    jurisdiction: International Criminal Tribunal for Rwanda
    what_happened: The Trial Chamber found that Bagosora, Kabiligi and Nsengiyumva played a role in the
      creation, arming and training of civilian militia, but that it was not proven beyond reasonable
      doubt that this was aimed at genocide, so all four accused were acquitted of conspiracy to commit
      genocide. Bagosora was convicted of other crimes; his 35-year sentence was affirmed on appeal on
      14 December 2011; Kabiligi was acquitted on all counts.
    outcome: convicted
    outcome_verified: true
    source_url: https://unictr.irmct.org/sites/unictr.org/files/case-documents/ictr-98-41/trial-judgements/en/081218.pdf
    source_title: Bagosora et al. Trial Judgement, 18 December 2008, paras. 9-11
  - name: Kenya - Commission of Inquiry into Post-Election Violence (CIPEV / Waki Commission)
    year: '2008'
    jurisdiction: Kenya
    what_happened: The Commission found that armed militias formed during the 1990s ethnic clashes were
      never demobilised, which made it easy for political and business leaders to reactivate them for
      the 2007-08 post-election violence.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://reliefweb.int/report/kenya/kenya-commission-inquiry-post-election-violence-cipev-final-report
    source_title: CIPEV final report, executive summary (ReliefWeb)
