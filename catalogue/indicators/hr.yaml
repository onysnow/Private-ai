- id: HR-084
  name: Impunity for past atrocities or serious violations
  definition: Past atrocities or serious abuses have gone unpunished or are tolerated, which makes repetition
    more likely.
  areas:
  - HR
  typology: Atrocity early warning - Risk factors 2 and 9 (merged)
  status: verified
  sources:
  - title: Framework of Analysis for Atrocity Crimes (A/70/741-S/2016/71)
    publisher: United Nations
    year: '2016'
    url: https://documents.un.org/doc/undoc/gen/n16/042/32/pdf/n1604232.pdf
    locator: Risk factor 2, para. 23(b)-(c), p. 8
    quote: (c) Policy or practice of impunity for or tolerance of serious violations of international
      human rights and humanitarian law, of atrocity crimes, or of their incitement;
    quote_verified: true
    checked: '2026-10-09'
  - title: Framework of Analysis for Atrocity Crimes (A/70/741-S/2016/71)
    publisher: United Nations
    year: '2016'
    url: https://documents.un.org/doc/undoc/gen/n16/042/32/pdf/n1604232.pdf
    locator: Risk factor 9, para. 41(c), p. 15
    quote: (c) History of atrocity crimes committed with impunity against protected groups;
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Officers accused of massacres promoted rather than prosecuted
  - Amnesty laws covering atrocity crimes
  cases:
  - name: Bosnia and Herzegovina v. Serbia and Montenegro (Application of the Genocide Convention)
    year: '2007'
    jurisdiction: International Court of Justice
    what_happened: The ICJ found the Srebrenica killings of July 1995 were genocide and held that Serbia
      violated its obligations to prevent that genocide and to punish its perpetrators, including by not
      fully cooperating with the ICTY over Ratko Mladic. This is a ruling on State responsibility, not
      a criminal conviction.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.icj-cij.org/case/91
    source_title: ICJ, Judgment of 26 February 2007 (case page)
  data_needed:
  - CourtCase (status)
  - Person (accused) with Position / Occupancy after the events
  - Document (amnesty laws)
  checkable: lookups
  lookup_sources:
  - Court records
  - Official appointment records
  - UN reports
