    locator: Article 7(2)(g)
    quote: “Persecution” means the intentional and severe deprivation of fundamental rights contrary to
      international law by reason of the identity of the group or collectivity;
    quote_verified: true
    checked: '2026-10-10'
  - title: Rome Statute of the International Criminal Court
    publisher: International Criminal Court
    year: '1998'
