  areas:
  - HR
  typology: Conflict minerals
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, 'Red flag circumstances', pp. 79 and 88
    quote: Anomalies or unusual circumstances are identified through the information collected in Step
      1 which give rise to a reasonable suspicion that the gold may contribute to conflict or serious
      abuses associated with the extraction, transport or trade of gold.
    quote_verified: true
    checked: '2026-10-09'
  examples: []
  cases:
  - name: Sudan-to-UAE gold flows tied to Darfur militias (Kaloti)
    year: '2020'
    jurisdiction: Sudan / UAE
    what_happened: Global Witness cited a UN estimate that at least 30 of 65 tonnes of Sudanese gold exported
      to the UAE in 2012 were tied to Darfur militias. It also reported that in 2019 the Central Bank
      of Sudan appeared to buy gold from mines occupied by the SLA/Abdul Wahid armed group.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://globalwitness.org/en/campaigns/conflict-resources/beneath-shine-tale-two-gold-refiners/
    source_title: Global Witness, 'Beneath the shine' (16 July 2020)
