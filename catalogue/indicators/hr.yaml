key: HR
name: Human rights abuses, war crimes and cultural property
scope: documentation of human rights abuses and war crimes (Berkeley Protocol on Digital Open Source Investigations
  and similar), atrocity financing, conflict resources, trafficking of cultural property and antiquities.
indicators:
- id: HR-001
  name: Mineral or metal originates from, or passed through, a conflict-affected or high-risk area
  definition: The declared or traced origin or transit route of tin, tantalum, tungsten or gold runs through
    an area of armed conflict, widespread violence or other serious risk of harm to people.
  areas:
  - HR
  typology: Conflict minerals
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals from Conflict-Affected
      and High-Risk Areas (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Supplement on Tin, Tantalum and Tungsten, 'Red flags triggering the application of this supplement',
      p. 33; Supplement on Gold, Step 2(B), p. 87
    quote: The minerals originate from or have been transported via a conflict-affected or high-risk area.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - UN Group of Experts (S/2024/432) found Rubaya minerals in DRC were moved via Mushaki under M23 control
    and became ineligible for trade.
  cases: []
  data_needed:
  - Address (country, region) for mine site, trader and exporter
  - Contract or Payment between supplier and buyer (date, amount, purpose)
  - Document (certificate of origin, export permit)
  - Ownership linking upstream companies to mines
  - Vessel/Vehicle or route data where available
  checkable: lookups
  lookup_sources:
  - UN Security Council sanctions committee and Group/Panel of Experts reports
  - EU indicative list of conflict-affected and high-risk areas
  - Customs/trade statistics (e.g. UN Comtrade)
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: origin or transit in an area meeting the OECD
      CAHRA definition.'
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: Armed groups taxing the trade may be UN-sanctioned (e.g. William Amuri Yakutumba, CDi.043,
      controlling gold in Fizi).
    source_url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
  innocent_explanations:
  - Many legitimate, certified mines and traders operate inside high-risk areas; origin alone is a trigger
    for due diligence, not proof of conflict financing.
  - Transit through a neighbouring country can be the only practical export route.
  jurisdictions: Global (OECD Recommendation); EU Regulation 2017/821 and US Dodd-Frank s.1502 build on
    it
  version: 1
- id: HR-002
  name: Declared origin out of keeping with the country's known reserves or production
  definition: A country is declared as the origin of more mineral or gold than its known reserves, stocks
    or expected production could supply, suggesting relabelled origin.
  areas:
  - HR
  typology: Conflict minerals; origin laundering
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: 3T Supplement p. 33; Gold Supplement p. 88
    quote: The minerals are claimed to originate from a country that has limited known reserves, likely
      resources or expected production levels of the mineral in question (i.e. the declared volumes of
      mineral from that country are out of keeping with its known reserves or expected production levels).
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - UN Group of Experts reported circulation of fraudulently imported DRC gold to Kigali and Kampala as
    transit routes (S/2024/432, paras 208-209).
  cases: []
  data_needed:
  - Document (export declarations, certificates of origin) with country and quantity
  - Company (exporter, refiner) jurisdiction
  - Payment/Contract volumes over time
  checkable: lookups
  lookup_sources:
  - National geological surveys and production statistics
  - UN Comtrade / national export statistics
  - UN Group of Experts reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: declared volumes out of keeping with known reserves
      or expected production.'
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: Misdeclared origin is a form of trade misrepresentation used to launder proceeds.
    source_url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
  innocent_explanations:
  - Production statistics may lag or under-count artisanal output.
  - Re-export of legitimately imported material can be recorded under the wrong origin by clerical error.
  - New discoveries may not yet appear in reserve estimates.
  jurisdictions: Global
  version: 1
- id: HR-003
  name: Origin claimed in a known transit country for conflict minerals or gold
  definition: The declared origin is a country through which minerals or gold from conflict areas are
    known or reasonably suspected to pass.
  areas:
  - HR
  typology: Conflict minerals; transit laundering
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, Step 2(B), p. 88
    quote: The gold is claimed to originate from a country through which gold from conflict-affected and
      high-risk areas is known or reasonably suspected to transit.
    quote_verified: true
    checked: '2026-10-08'
  - title: Final report of the Group of Experts on the Democratic Republic of the Congo (S/2024/432)
    publisher: United Nations Security Council
    year: '2024'
    url: https://www.ecoi.net/en/file/local/2112471/n2411880.pdf
    locator: para. 209
    quote: Several sources reported that Kampala remained a transit route for gold illegally imported
      from the Democratic Republic of the Congo
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Kampala and Kigali named as transit routes for DRC gold (S/2024/432).
  cases: []
  data_needed:
  - Document (certificate of origin, airway bill)
  - Company (exporter, refiner) with Address
  - Payment (buyer, seller, amount)
  checkable: lookups
  lookup_sources:
  - UN Group/Panel of Experts reports
  - Trade statistics
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded.
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Transit countries also have genuine domestic production.
  - Regional hubs legitimately refine and re-export material from many sources.
  jurisdictions: Global
  version: 1
- id: HR-004
  name: Recycled, scrap or mixed gold refined in a known transit country
  definition: Gold is described as recycled, scrap or of mixed origin and was refined in a country where
    conflict gold is known or suspected to pass, a way to hide mined origin.
  areas:
  - HR
  typology: Conflict gold
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, Step 2(B), p. 88
    quote: The gold is claimed to originate from recyclable/scrap or mixed sources and has been refined
      in a country where gold from conflict-affected and high-risk areas is known or reasonably suspected
      to transit.
    quote_verified: true
    checked: '2026-10-08'
  examples: []
  cases: []
  data_needed:
  - Document (refinery intake records, assay reports)
  - Company (refiner) with Address
  - Payment/Contract for scrap purchases
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded.
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Recasting gold as scrap is a known way to disguise origin of illicit gold proceeds.
    source_url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
  innocent_explanations:
  - Genuine jewellery and industrial scrap is refined in large volumes in regional hubs.
  - Mixed lots are common in small refineries for cost reasons.
  jurisdictions: Global
  version: 1
- id: HR-005
  name: Supplier has sourced from a red-flag location in the last 12 months
  definition: A supplier or another known upstream company is known to have bought minerals or gold from
    a red-flag origin or transit location within the past year.
  areas:
  - HR
  typology: Conflict minerals
  status: verified
