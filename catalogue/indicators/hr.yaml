    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, 'Supplier red flags', p. 88; 3T Supplement p. 34
    quote: Suppliers or other known upstream companies are known to have sourced gold from a red flag
      location of gold origin and transit in the last 12 months.
    quote_verified: true
    checked: '2026-10-08'
  examples: []
  cases: []
  data_needed:
  - Company (supplier)
  - Contract/Payment with date and counterparty
  - Address of counterparties
  checkable: lookups
  lookup_sources:
  - Customs records
  - UN expert panel reports
  - Responsible Minerals Initiative / LBMA refiner lists
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: A known purchase from a red-flag location dated within the last 12 months (OECD).
    threshold_source: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The supplier may have sourced from a certified, audited site in that location.
  - Older relationships may have ended.
  jurisdictions: Global
  version: 1
- id: HR-006
  name: Supplier or upstream company owns interests in, or operates in, a red-flag location
  definition: A supplier or upstream company has shareholdings or other interests in companies operating
    in, or supplying from, a red-flag location.
  areas:
  - HR
  typology: Conflict minerals
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, 'Supplier red flags', p. 88; 3T Supplement p. 34
    quote: Suppliers or other known upstream companies operate in one of the above-mentioned red flag
      locations of gold origin and transit, or have shareholder or other interests in suppliers of gold
      from one of the above-mentioned red flag locations of gold origin and transit.
    quote_verified: true
    checked: '2026-10-08'
  examples: []
  cases: []
  data_needed:
  - Ownership (owner, asset, percentage)
  - Directorship
  - Company (jurisdiction, address)
  checkable: lookups
  lookup_sources:
  - Company registries
  - Beneficial ownership registers
  - OpenCorporates / OpenSanctions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded.
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Diversified mining groups often hold legitimate licensed assets in high-risk countries.
  jurisdictions: Global
