- id: HR-007
  name: Weak AML, customs and oversight with heavy cash use along the route
  definition: The origin or transit environment has weakly enforced anti-money-laundering, anti-corruption
    and customs laws, informal banking and extensive cash use, which raises location risk.
  areas:
  - HR
  typology: Conflict minerals
  status: verified
  sources:
  - title: OECD Due Diligence Guidance for Responsible Supply Chains of Minerals (3rd ed.)
    publisher: OECD
    year: '2016'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
    locator: Gold Supplement, p. 88
    quote: In each of these location-based red flag considerations, the risk is increased when anti-money
      laundering laws, anti-corruption laws, customs controls and other relevant governmental oversight
      laws are weakly enforced; informal banking systems operate, and cash is extensively used.
    quote_verified: true
    checked: '2026-10-09'
  examples: []
  cases: []
  data_needed:
  - Payment (method, currency, cash)
  - Address (country)
  checkable: lookups
  lookup_sources:
  - FATF mutual evaluations and grey/black lists
  - Basel AML Index
  - Transparency International CPI
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded.
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Same conditions are FATF-recognised money-laundering risk factors.
    source_url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2016/04/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_g1g65996/9789264252479-en.pdf
  innocent_explanations:
  - Cash is the normal means of payment for artisanal miners in many regions with few banks.
  jurisdictions: Global
  version: 1
- id: HR-008
  name: Anomalies giving reasonable suspicion that minerals fund conflict or abuse
  definition: Information gathered on a supply chain shows unusual circumstances that reasonably suggest
