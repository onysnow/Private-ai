- id: HR-079
  name: Census, elections or related processes, or measures that destabilise them
  definition: Elections, a census, or disputes about them act as triggers for violence, especially where
    results are contested.
  areas:
  - HR
  typology: Atrocity early warning - Risk factor 8
  status: verified
  sources:
  - title: Framework of Analysis for Atrocity Crimes (A/70/741-S/2016/71)
    publisher: United Nations
    year: '2016'
    url: https://documents.un.org/doc/undoc/gen/n16/042/32/pdf/n1604232.pdf
    locator: Risk factor 8, para. 38(h), p. 14
    quote: (h) Census, elections, pivotal activities related to those processes, or measures that destabilize
      them;
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Contested presidential result followed by organised ethnic attacks
  cases:
  - name: Kenya - 2007-08 post-election violence (CIPEV)
    year: '2008'
    jurisdiction: Kenya
    what_happened: The Commission found the violence after the 2007 elections was spontaneous in some
      areas and planned and organised in others, often involving politicians and business leaders, and
      amounted to systematic attacks on Kenyans based on ethnicity and political leaning.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://reliefweb.int/report/kenya/kenya-commission-inquiry-post-election-violence-cipev-final-report
    source_title: CIPEV final report, executive summary (ReliefWeb)
  data_needed:
  - Event (election or census dates, location)
  - PublicBody (electoral commission)
  - Document (results, complaints)
  checkable: lookups
  lookup_sources:
  - Electoral commission data
  - Election observer reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Ordinary, peaceful elections
  - Disputes resolved through courts
  jurisdictions: Any country
  version: 1
