    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/tips-advice/business-center/guidance/avoid-fake-degree-burns-researching-academic-credentials
    locator: 'Tell-tale signs of a bogus degree: Out of sequence degrees'
    quote: If an applicant claims a master's or doctoral degree, but no bachelor's degree
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - An official's CV lists a PhD and an MBA but no undergraduate study.
  cases: []
  data_needed:
  - Person
  - Document
  - Employment
  - Organization
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
