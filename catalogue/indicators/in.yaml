  - name: MPS '912 Special Project Working Group'
    year: '2023'
    jurisdiction: United States (EDNY)
    what_happened: A criminal complaint charged 34 PRC national police officers with running thousands
      of fake online personas, some posing as U.S. persons. The DOJ states these are allegations and defendants
      are presumed innocent.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.justice.gov/usao-edny/pr/34-officers-peoples-republic-china-national-police-charged-perpetrating-transnational
    source_title: 34 Officers of the PRC National Police Charged
  - name: Internet Research Agency
    year: '2019'
    jurisdiction: United States
    what_happened: Special Counsel found IRA employees operated accounts using fictitious U.S. personas.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.justice.gov/archives/sco/file/1373816/dl
    source_title: Mueller Report Vol. I
  data_needed:
  - UserAccount (username, country, createdAt, ipAddress, phone, email)
  - Person (nationality, country)
  - Address
  - UnknownLink
  - Associate
  checkable: lookups
  lookup_sources:
  - Platform takedown reports
  - Reverse image search
  - Account-creation and IP metadata (only via platforms or court records)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: The 912 group personas were allegedly used to harass Chinese dissidents abroad.
    source_url: https://www.justice.gov/usao-edny/pr/34-officers-peoples-republic-china-national-police-charged-perpetrating-transnational
  innocent_explanations:
  - Diaspora members and expatriates genuinely post about their home country from abroad.
  - People use pseudonyms for safety, especially activists and abuse survivors.
  - VPN use makes a real local user appear to be elsewhere.
  jurisdictions: Global
  version: 1
- id: IN-003
  name: AI-generated (GAN) profile photo
  definition: An account's profile picture is a computer-generated face of a person who does not exist.
  areas:
  - IN
  typology: Fake identities
  status: verified
  sources:
  - title: Q4 2024 Adversarial Threat Report
    publisher: Meta
    year: '2025'
    url: https://transparency.meta.com/sr/Q4-2024-Adversarial-threat-report
    locator: Benin network
    quote: profile photos likely generated using AI
    quote_verified: true
    checked: '2026-10-09'
  - title: That smiling LinkedIn profile face might be a computer-generated fake (NPR)
    publisher: NPR / MPR News
    year: '2022'
    url: https://www.mprnews.org/story/2022/03/27/npr-fake-linkedin-profiles
    locator: Body
    quote: Her eyes were aligned right in the middle of the image.
    quote_verified: true
    checked: '2026-10-09'
  - title: DISARM Red Framework
    publisher: DISARM Foundation
    url: https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/disarm_red_framework.md
    locator: TA15 Establish Assets
    quote: T0145.002 AI-Generated Account Imagery
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Eyes centred in the same spot, a single earring, hair that disappears and reappears, vague background
    (NPR on Stanford Internet Observatory research).
  cases:
  - name: GAN-faced LinkedIn sales profiles
    year: '2022'
    jurisdiction: Global (LinkedIn)
    what_happened: Researchers Renée DiResta and Josh Goldstein reported finding more than a thousand
      accounts that appeared to be fake with GAN-generated images; LinkedIn removed profiles that broke
      its rules.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.mprnews.org/story/2022/03/27/npr-fake-linkedin-profiles
    source_title: 'NPR: That smiling LinkedIn profile face might be a computer-generated fake'
  data_needed:
  - UserAccount
  - Image (contentHash)
  - Person
  checkable: person
  lookup_sources:
  - Reverse image search
  - GAN-face detection tools
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: DISARM lists 'Romantic Suitor Persona' and 'Scam' among goals; fake faces support such personas.
    source_url: https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/disarm_red_framework.md
  innocent_explanations:
  - Some people use avatars or AI portraits openly for privacy or style.
  - Heavily filtered or retouched real photos can show similar artefacts.
  - Professional headshots are often centred.
  jurisdictions: Global
  version: 1
