  name: Author or lab with a record of retractions or misconduct findings
  definition: A researcher, lab or institution has prior retractions, corrections or formal misconduct
    findings.
  areas:
  - FR
  - IN
  typology: Research misconduct history
  status: verified
  sources:
  - title: Retraction guidelines
    publisher: Committee on Publication Ethics
    url: https://publicationethics.org/guidance/guideline/retraction-guidelines
    locator: When to retract
    quote: any form of misrepresentation (eg, fraud, identity theft or fictitious authorship)
    quote_verified: true
    checked: '2026-10-09'
  - title: Definition of Research Misconduct
    publisher: U.S. Office of Research Integrity
    url: https://ori.hhs.gov/definition-research-misconduct
    locator: Definition
    quote: Research misconduct means fabrication, falsification, or plagiarism in proposing, performing,
      or reviewing research
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - 'Stapel: fraud found in 55 publications (2012).'
  - 'Tessier-Lavigne: at least five papers to be retracted or corrected (2023).'
  cases:
  - name: Diederik Stapel
    year: '2012'
    jurisdiction: Netherlands
    what_happened: Joint committees found fraud with certainty in 55 publications.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.rug.nl/news/2012/11/171-stapel
    source_title: University of Groningen news
  data_needed:
  - Person
  - Document
  - Organization
  - Employment
  checkable: lookups
  lookup_sources:
  - Retraction Watch Database
  - ORI case summaries
  - PubPeer
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Honest-error retractions are a sign of good practice, not misconduct.
  - Co-authors of a misconduct case are often not responsible (the Stanford panel found no evidence Tessier-Lavigne
    himself manipulated data).
  - Same-name confusion between different researchers.
  jurisdictions: Global
  version: 1
- id: IN-048
  name: Account timeline that mostly amplifies others (retweets, quotes, headline shares) with little
    or no original content
  definition: An account whose posts are almost all reposts, likes or quotes of other users, often of
    a narrow set of sources, rather than its own words.
  areas:
  - IN
  typology: Bot / automated amplification account
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: Atlantic Council Digital Forensic Research Lab (DFRLab), Ben Nimmo
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: Section 3, 'Amplification'
    quote: One main role of bots is to boost the signal from other users by retweeting, liking or quoting
      them.
    quote_verified: true
    licence: Medium article; quoted under fair use
    checked: '2026-10-09'
  examples:
  - 'DFRLab: @Sunneversets100 had 195 retweets among its last 200 posts, many from RT and Sputnik (DFRLab,
    section 3).'
  - 'DFRLab: @ProletStrivings shared headlines without comment (DFRLab, section 3).'
  cases: []
  data_needed:
  - UserAccount (service, username, owner, createdAt)
  - Message (sender, bodyText, date) with a flag for repost/quote vs original
  - Message source account of each repost (sender of the original)
  checkable: lookups
  lookup_sources:
  - Platform timeline / API data
  - Bot-analysis tools that compute repost share
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Many real users mostly retweet and rarely write their own posts.
  - Fan, news-aggregator and organisational accounts repost by design.
  - Activists or staff may deliberately boost a campaign's content.
  jurisdictions: Global (platform behaviour)
  version: 1
- id: IN-049
  name: 'Low posts, high results: idle account whose single post gets implausibly large reach'
  definition: An account with very few posts, followers or follows whose post nevertheless receives thousands
    of reposts and likes, suggesting a botnet boosted it.
  areas:
  - IN
  typology: Botnet amplification of a single post
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: Atlantic Council Digital Forensic Research Lab (DFRLab), Ben Nimmo
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: Section 4, 'Low posts / high results'
    quote: Such botnets can quickly be identified when they are used to amplify a single post
    quote_verified: true
    licence: Medium article; quoted under fair use
    checked: '2026-10-09'
  examples:
  - 'DFRLab: @KirstenKellog_ had posted 12 times (11 deleted), had 76 followers and followed no one, yet
    its post attacking ProPublica drew over 23,000 retweets and likes (section 4).'
  - 'DFRLab: @yoiyakujimin had six tweets and followed five accounts, yet its post drew more than 20,000
    retweets and likes by 28 August 2017 (section 4).'
  cases: []
  data_needed:
  - UserAccount (username, createdAt, follower and following counts, post count)
  - Message (sender, date, repost count, like count)
  checkable: lookups
  lookup_sources:
  - Platform account and post metrics
  - Archived snapshots of the account (e.g. web archives)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - A genuine post from a small account can go viral after a celebrity or large account shares it.
  - Users sometimes delete old posts, leaving a low post count on an otherwise real account.
  - A new account created by a real eyewitness to a news event can get huge reach.
  jurisdictions: Global (platform behaviour)
  version: 1
- id: IN-050
  name: Near-identical repost and like counts from the same accounts in the same order
  definition: A post whose repost and like totals are almost equal and come from the same list of accounts
    at the same time, which points to accounts programmed to do both together.
  areas:
  - IN
  typology: Coordinated automated engagement
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: Atlantic Council Digital Forensic Research Lab (DFRLab), Ben Nimmo
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: Section 12, 'Retweets and likes'
    quote: Some bots are programmed to both retweet and like the same tweet
    quote_verified: true
    licence: Medium article; quoted under fair use
    checked: '2026-10-09'
  examples:
  - 'DFRLab: for the second account attacking ProPublica, retweets and likes differed by only 11 across
    roughly 13,000 users (under 0.1 percent), and the same accounts retweeted and liked in the same order
    (section 12).'
  cases: []
  data_needed:
  - Message (repost count, like count, date)
  - UserAccount list of reposters and likers with timestamps
  checkable: lookups
  lookup_sources:
  - Platform API lists of reposters and likers
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Loyal followers of an account often both like and repost its posts, so the counts can be close.
  - Totals can be similar by coincidence without the same accounts or order behind them.
  jurisdictions: Global (platform behaviour)
  version: 1
- id: IN-051
  name: Commercial or advertising-heavy accounts amplifying political posts
  definition: Accounts that mainly post advertisements or commercial spam but also boost a political post,
    suggesting a commercial botnet was hired to amplify it.
  areas:
  - IN
  typology: Commercial botnet for hire
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: Atlantic Council Digital Forensic Research Lab (DFRLab), Ben Nimmo
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: Section 10, 'Commercial content'
    quote: Advertising, indeed, is a classic indicator of botnets.
    quote_verified: true
    licence: Medium article; quoted under fair use
    checked: '2026-10-09'
  examples:
  - 'DFRLab: the accounts that retweeted a political post from the gambling account @every1bets claimed
    varied identities and posted many advertisements; DFRLab judged them most probably members of commercial
    botnets hired out for amplification (section 10).'
  cases: []
  data_needed:
  - UserAccount (username, description)
  - Message (sender, bodyText, date) classified as advertising or political
  - Payment or Representation if a buyer of the amplification can be identified
  checkable: lookups
  lookup_sources:
  - Platform timelines of reposting accounts
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Small businesses and marketers post ads and may also share political views.
  - An ad-heavy account may share a viral political post on its own, without being paid.
  jurisdictions: Global (platform behaviour)
  version: 1
- id: IN-052
  name: Automation software or auto-post shorteners throughout a timeline
  definition: An account whose posts are all published through an automation service (for example links
    shortened with ift.tt from IFTTT), suggesting no person is posting by hand.
  areas:
  - IN
  typology: Automated posting
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: Atlantic Council Digital Forensic Research Lab (DFRLab), Ben Nimmo
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: Section 11, 'Automation software'
    quote: A timeline which is full of ift.tt shorteners is therefore likely to be a bot.
    quote_verified: true
    licence: Medium article; quoted under fair use
    checked: '2026-10-09'
  examples:
  - 'DFRLab: an account named ''Angee Dixson'', using a model''s photo, shared far-right posts that all
    used the ift.tt shortener (section 11).'
  cases: []
  data_needed:
  - Message (bodyText, sourceUrl / link domains, posting client)
  - UserAccount (username)
  checkable: lookups
  lookup_sources:
  - Platform post metadata (posting client)
  - Link-expansion services
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Businesses, news outlets and busy people use scheduling tools such as HootSuite or TweetDeck legitimately
    (DFRLab notes ow.ly and bit.ly are used by these tools).
  - Automation of an account is not itself deception if the account is open about it.
  jurisdictions: Global (platform behaviour)
  version: 1
- id: IN-053
  name: 'Plagiarism: another person''s ideas, methods, results or words used without credit'
  definition: Text, ideas, processes or results in a paper, grant or report that are copied from someone
    else without proper credit, one of the three types of research misconduct.
  areas:
  - IN
  typology: Research misconduct
  status: verified
  sources:
  - title: Definition of Research Misconduct
    publisher: Office of Research Integrity, U.S. Department of Health and Human Services
    url: https://ori.hhs.gov/definition-misconduct
    locator: Definition, 'Plagiarism'
    quote: Plagiarism is the appropriation of another person's ideas, processes, results, or words without
      giving appropriate credit.
    quote_verified: true
    licence: US government work
    checked: '2026-10-09'
  examples:
  - Paragraphs of a methods section matching an earlier paper by other authors with no citation.
  - A grant proposal reusing another lab's unpublished results as its own.
  cases: []
  data_needed:
  - Document (title, author, publishedAt, bodyText)
  - Person (authors of both documents)
  - UnknownLink or a similarity record between the two Documents
  checkable: lookups
  lookup_sources:
  - Text-similarity / plagiarism-detection services
  - Literature databases (to find the earlier source)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Standard phrases and method descriptions are often reused across a field.
  - Authors may reuse their own earlier wording (text recycling), which is treated differently from plagiarism.
  - Honest error such as a dropped citation; ORI states research misconduct does not include honest error
    or differences of opinion.
  - Text may be properly quoted and cited in a version the checker did not see.
  jurisdictions: United States federal definition (42 CFR Part 93); similar definitions used elsewhere
  version: 1
- id: IN-054
  name: Reported means or summary statistics impossible for the sample size and scale (GRIM / SPRITE inconsistency)
  definition: A paper reports an average of whole-number data (such as a Likert scale) that cannot be
    produced with the stated number of people and items, or summary statistics for which no plausible
    underlying data set exists.
  areas:
  - IN
  typology: Data fabrication, falsification or misreporting in research
  status: verified
  sources:
  - title: 'The GRIM test: A simple technique detects numerous anomalies in the reporting of results in
      psychology'
    publisher: PeerJ Preprints (Nicholas J. L. Brown and James A. J. Heathers)
    year: '2016'
    url: https://peerj.com/preprints/2064.pdf
    locator: Abstract
    quote: This technique evaluates whether the reported means of integer data such as Likert-type scales
      are consistent with the given sample size and number of items.
    quote_verified: true
    licence: CC BY (PeerJ Preprints)
    checked: '2026-10-09'
  - title: 'Recovering data from summary statistics: Sample Parameter Reconstruction via Iterative TEchniques
      (SPRITE)'
    publisher: PeerJ Preprints (Heathers et al.)
    year: '2018'
    url: https://peerj.com/preprints/26968/
    locator: Abstract
    quote: a heuristic method for reconstructing plausible samples from descriptive statistics of granular
      data
    quote_verified: true
    licence: CC BY (PeerJ Preprints)
    checked: '2026-10-09'
  examples:
  - Brown and Heathers tested 71 amenable psychology articles; 36 (50.7%) had at least one reported mean
    inconsistent with the sample size and scale, and 16 had several (GRIM abstract).
  - Of 9 data sets the authors received, all confirmed at least one reporting error, and 2 articles needed
    extensive corrections (GRIM abstract).
  cases: []
  data_needed:
  - Document (title, author, publishedAt)
  - Reported statistics extracted from the Document (mean, standard deviation, sample size, number of
    items, scale range)
  - Person (authors)
  checkable: records
  lookup_sources:
  - The paper itself; GRIM/SPRITE calculators; request to authors for raw data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Typing or rounding errors in the paper.
  - Sample size changed for some analyses (dropouts, missing answers) without being reported.
  - The data were not actually whole numbers (for example averaged or weighted scores), so GRIM does not
    apply.
  - The GRIM paper itself found reporting errors, not necessarily fraud, when data were obtained.
  jurisdictions: Global (research publishing)
  version: 1
- id: IN-055
  name: Fabrication or falsification of research data or results (general)
  definition: Research results that were made up, or data, materials or processes that were changed or
    left out so the research record is not accurate; this generalises the image-specific indicators IN-031
    and IN-032.
  areas:
  - IN
  typology: Research misconduct
  status: verified
  sources:
  - title: Definition of Research Misconduct
    publisher: Office of Research Integrity, U.S. Department of Health and Human Services
    url: https://ori.hhs.gov/definition-misconduct
    locator: Definitions, 'Fabrication' and 'Falsification'
    quote: Fabrication is making up data or results and recording or reporting them.
    quote_verified: true
    licence: US government work
    checked: '2026-10-09'
  examples:
  - Results reported for experiments that the lab records show were never run.
  - Data points dropped without disclosure to reach a desired result.
  cases:
  - name: Ariel Fernandez (Rice University)
    year: '2025'
    jurisdiction: United States
    what_happened: ORI found he intentionally, knowingly, or recklessly fabricated and/or falsified research
      results and images; the finding became final in 2025 and an HHS debarment notice followed in March
      2026.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://ori.hhs.gov/content/case-summary-fernandez-ariel
    source_title: 'Case Summary: Fernandez, Ariel'
  - name: Chen-Yeh 'George' Ke (Icahn School of Medicine at Mount Sinai)
    year: '2026'
    jurisdiction: United States
    what_happened: ORI found he intentionally and knowingly falsified and/or fabricated western blot images;
      administrative actions took effect 6 February 2026.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://ori.hhs.gov/content/case-summary-ke-chen-yeh
    source_title: 'Case Summary: Ke, Chen-Yeh'
  - name: Brian Wansink (Cornell University)
    year: '2018'
    jurisdiction: United States
    what_happened: A Cornell faculty committee found he committed academic misconduct, including misreporting
      of research data and problematic statistical techniques; he resigned.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://statements.cornell.edu/2018/20180920-statement-provost-michael-kotlikoff.cfm
    source_title: Statement of Cornell University Provost Michael I. Kotlikoff
  data_needed:
  - Document (papers, lab records, raw data files)
  - Person (authors, lab members)
  - Organization (institution)
  - Employment (author to institution)
  checkable: person
  lookup_sources:
  - ORI case summaries
  - Institutional investigation reports
  - Retraction databases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Honest error or differences of opinion, which ORI excludes from research misconduct.
  - Data excluded for documented, legitimate reasons (equipment failure, pre-registered exclusion rules).
  - Poor record-keeping that makes real results hard to verify.
  jurisdictions: United States federal definition (42 CFR Part 93); similar definitions used elsewhere
  version: 1
- id: IN-056
  name: Degrees out of sequence (advanced degree with no earlier degree)
