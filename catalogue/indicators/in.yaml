key: IN
name: Information integrity
scope: disinformation and influence operations (DISARM framework, platform takedown reports), fake identities
  and sock-puppet accounts, coordinated inauthentic behaviour, forged or manipulated documents and media
  (document forensics, image verification), scientific and academic fraud (retractions, paper mills, predatory
  journals, tortured phrases).
indicators:
- id: IN-001
  name: Coordinated inauthentic behaviour network
  definition: A group of accounts, Pages or sites that work together to mislead people about who is behind
    them and what they want, usually with fake accounts at the centre.
  areas:
  - IN
  typology: Coordinated inauthentic behaviour (CIB) / platform manipulation
  status: verified
  sources:
  - title: Q4 2024 Adversarial Threat Report
    publisher: Meta
    year: '2025'
    url: https://transparency.meta.com/sr/Q4-2024-Adversarial-threat-report
    locator: Introduction / CIB definition
    quote: coordinated efforts to manipulate public debate for a strategic goal
    quote_verified: true
    checked: '2026-10-09'
  - title: Platform manipulation and spam policy
    publisher: X Corp.
    url: https://help.x.com/en/rules-and-policies/platform-manipulation
    locator: Coordinated activity
    quote: We prohibit coordinated inauthentic activity that artificially influences conversations or
      disrupts
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Meta removed networks from Benin, Ghana and China in Q4 2024 and kept tracking the Russia-origin Doppelganger
    operation (Meta Q4 2024 report).
  - Facebook identified 470 IRA-controlled accounts (Mueller report Vol. I, p.15).
  cases:
  - name: Internet Research Agency social media campaign
    year: '2019'
    jurisdiction: United States
    what_happened: The Special Counsel's report found IRA employees ran social media accounts and group
      pages using fictitious U.S. personas; Facebook identified 470 IRA-controlled accounts and Twitter
      3,814 IRA-associated accounts.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.justice.gov/archives/sco/file/1373816/dl
    source_title: Report on the Investigation into Russian Interference in the 2016 Presidential Election,
      Vol. I
  - name: Meta Q4 2024 takedowns (Benin, Ghana, China networks)
    year: '2025'
    jurisdiction: Benin; Ghana; China (platform enforcement)
    what_happened: Meta reported removing small networks of Facebook and Instagram accounts, Pages and
      Groups that it judged to be coordinated inauthentic behaviour.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://transparency.meta.com/sr/Q4-2024-Adversarial-threat-report
    source_title: Q4 2024 Adversarial Threat Report
  data_needed:
  - UserAccount (username, service, owner, createdAt, email, phone, ipAddress)
  - Person
  - Organization
  - LegalEntity (website)
  - UnknownLink (between accounts)
  - Associate
  - Article
  - Document (sourceUrl, publishedAt)
  checkable: lookups
  lookup_sources:
  - Platform takedown reports (Meta Adversarial Threat Reports, OpenAI threat reports)
  - Platform transparency archives
  - Social media monitoring tools
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: PP
    reason: CIB networks often target elections; the IRA staged U.S. political activity.
    source_url: https://www.justice.gov/archives/sco/file/1373816/dl
  innocent_explanations:
  - Real activist groups and campaigns often coordinate posting times and messages openly.
  - Fan communities and marketing teams legitimately run several brand accounts.
  - Volunteers sharing a template message can look coordinated.
  jurisdictions: Global (platform policy, not law)
  version: 1
- id: IN-002
  name: Fictitious persona posing as a local or national of the target country
  definition: An account presents itself as an ordinary local person or citizen of the audience's country,
    but is run by an outside actor.
  areas:
  - IN
  typology: Fake identities / sock puppets
  status: verified
  sources:
  - title: Report on the Investigation into Russian Interference in the 2016 Presidential Election, Vol.
      I
    publisher: U.S. Department of Justice, Special Counsel's Office
    year: '2019'
    url: https://www.justice.gov/archives/sco/file/1373816/dl
    locator: p.14
    quote: Using fictitious U.S. personas, IRA employees operated social media accounts and group pages
    quote_verified: true
    checked: '2026-10-09'
  - title: 34 Officers of the People's Republic of China National Police Charged
    publisher: U.S. Attorney's Office, EDNY
    year: '2023'
    url: https://www.justice.gov/usao-edny/pr/34-officers-peoples-republic-china-national-police-charged-perpetrating-transnational
    locator: Press release body
    quote: created thousands of fake online personas on social media sites, including Twitter
    quote_verified: true
    checked: '2026-10-09'
  - title: DISARM Red Framework
    publisher: DISARM Foundation
    url: https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/disarm_red_framework.md
    locator: TA16 Establish Legitimacy
    quote: T0097.101 Local Persona
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Personas that 'purport to be U.S. persons' (EDNY 2023 complaint, alleged).
  - Doppelganger profiles 'posing as U.S. (or other non-Russian) citizens' (DOJ 2024).
