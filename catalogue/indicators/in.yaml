  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: US FTC rule bars buying or selling fake indicators of social media influence for commercial
      purposes.
    source_url: https://www.ftc.gov/news-events/news/press-releases/2024/08/federal-trade-commission-announces-final-rule-banning-fake-reviews-testimonials
  innocent_explanations:
  - Lurkers who only like and share are a normal part of every platform.
