    publisher: Graphika
    year: '2020'
    url: https://secondaryinfektion.org/downloads/secondary-infektion-report.pdf
    locator: Executive Summary
    quote: it typically created, used and abandoned each account in less than an hour
    quote_verified: true
    checked: '2026-10-09'
  examples:
