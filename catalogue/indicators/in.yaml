- id: IN-008
  name: Identical or near-identical content posted by many accounts at the same time
  definition: Several accounts publish the same text, image or link within a short window, often copied
    word for word.
  areas:
  - IN
  typology: Coordinated inauthentic behaviour / copypasta
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: DFRLab
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: 'Indicator 5: Common content'
    quote: the same content, or type of content, at the same time.
    quote_verified: true
    checked: '2026-10-09'
  - title: Platform manipulation and spam policy
    publisher: X Corp.
    url: https://help.x.com/en/rules-and-policies/platform-manipulation
    locator: Multiple accounts
    quote: Operating multiple accounts that interact with the same or substantially similar content
    quote_verified: true
    checked: '2026-10-09'
  - title: DISARM Red Framework
    publisher: DISARM Foundation
    url: https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/disarm_red_framework.md
    locator: TA06 Develop Content
    quote: T0084.001 Use Copypasta
    quote_verified: true
    checked: '2026-10-09'
  - title: Facebook's Architecture Undermines Vaccine Misinformation Removal Efforts
    publisher: Broniatowski, Gu, Jamison, Simons & Abroms (George Washington University); peer-reviewed
      version in Science Advances (2023)
    year: '2022'
    url: https://arxiv.org/pdf/2202.02172
    locator: 'Methods, ''Analysis of Facebook''s System Architecture''. Also: ''We also tested several
      threshold values ranging from 25 - 41 seconds and found that results qualitatively replicated.'''
    quote: a URL shared by two venues in under 33 seconds is more likely to have originated from the "near-simultaneous"
    quote_verified: true
    licence: Not stated on the page read
    checked: '2026-10-10'
  examples:
  - Dozens of accounts posting the same sentence with the same typo within minutes.
  cases: []
  data_needed:
  - UserAccount
  - Article / Mention (publishedAt, bodyText)
  - UnknownLink
  checkable: records
  lookup_sources:
  - Platform search / social listening tools
  levels:
    faint: Two or more accounts share the identical link or content within 41 seconds of each other (the
      top of the range the study tested).
    strong: Two or more accounts share the identical link or content in under 33 seconds of each other,
      more than once.
    textbook: Several accounts repeatedly share the same link or content in under 33 seconds of each other,
      the published cutoff for 'near-simultaneous' coordinated sharing.
    threshold_source: https://arxiv.org/pdf/2202.02172
    threshold_note: 'Global, from a peer-reviewed study of Facebook link sharing (Broniatowski et al.,
      published in Science Advances in 2023; arXiv copy read). Coordination was defined as two venues
      sharing the same URL within a cutoff fitted from the data, which came out at 33 seconds. The authors
      tested cutoffs from 25 to 41 seconds and the results held. Other numbers: de-Lima-Santos & Ceron,
      ''Disinformation Echo-Chambers on Facebook'' (arXiv 2309.07745), used a 30-second threshold and
      say the window can stretch to about one minute. The CooRnet method (Giglietto et al., AoIR 2021)
      estimates a window for each dataset and publishes no fixed figure. DFRLab Botspot gives no time
      window. These cutoffs are for links. Identical text or images are judged the same way by analogy.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Campaigns and unions openly ask supporters to share a template message.
  - Share buttons on news sites generate identical text.
  - Memes and quotes spread organically in identical form.
  jurisdictions: Global
  version: 2
