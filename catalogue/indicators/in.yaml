- id: IN-005
  name: Abnormally high posting volume
  definition: An account posts far more often than a person plausibly could, suggesting automation.
  areas:
  - IN
  typology: Bots / automation
  status: verified
  sources:
  - title: '#BotSpot: Twelve Ways to Spot a Bot'
    publisher: DFRLab (Atlantic Council)
    year: '2017'
    url: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
    locator: 'Indicator 1: Activity'
    quote: The most obvious indicator that an account is automated is its activity.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - DFRLab treats 72 tweets per day as suspicious and over 144 as highly suspicious; the Oxford Internet
    Institute uses more than 50 a day.
  cases: []
  data_needed:
  - UserAccount (createdAt, messagesSent)
  - Mention
  - Article
  checkable: records
  lookup_sources:
  - Platform APIs or archives for post counts
  levels:
    faint: More than 50 posts a day (Oxford Internet Institute benchmark cited by DFRLab)
    strong: 72 posts per day averaged over the account's life (DFRLab 'suspicious')
    textbook: Over 144 posts per day (DFRLab 'highly suspicious')
    threshold_source: https://medium.com/dfrlab/botspot-twelve-ways-to-spot-a-bot-aedc7d9c110c
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - News outlets, emergency services and weather services post automatically by design.
  - Very active real users during breaking events.
  - Declared bots used for scheduling or service alerts.
  jurisdictions: Global
  version: 1
