  sources:
  - title: XV. Early Intervention Systems (EIS)
    publisher: Council on Criminal Justice
    url: https://policing.counciloncj.org/assessing-the-evidence/xv-early-intervention-systems-eis
    quote: the ratio of two indicators (e.g., use-of-force reports to arrests),
    quote_verified: true
    checked: '2026-10-09'
  - title: Early Intervention Systems for Law Enforcement Agencies
    publisher: US DOJ COPS (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: p. 37 and pp. 32-33
    quote: At present, there is no consensus regarding the best set of thresholds.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Early Intervention Systems for Law Enforcement Agencies: A Planning and Management Guide'
    publisher: US DOJ Office of Community Oriented Policing Services (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: Chapter 2, p. 31 (worked example of performance indicators)
    quote: Officer A used force in more than half of the arrests he made. The ratio of force to arrests
      is cause for departmental concern and probable intervention.
    quote_verified: true
    licence: Not stated (US DOJ-funded publication)
    checked: '2026-10-10'
  examples:
  - Officer uses force in 20 percent of arrests while unit peers use it in 5 percent.
  cases: []
  data_needed:
  - Person
  - Event (arrests and force incidents)
  - Document (arrest reports, force reports)
  checkable: lookups
  lookup_sources:
  - Agency arrest and force datasets
  levels:
    faint: The officer's force-to-arrest ratio is clearly above unit peers. No published number exists
      for this level in this source.
    strong: The officer uses force in close to half of arrests. No separate published cut-off exists for
      this level.
    textbook: The officer used force in more than half of the arrests made, which Walker calls cause for
      concern and probable intervention
    threshold_source: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    threshold_note: 'This is a worked example in the DOJ COPS guide, not a binding standard. The same
      guide says ''there is no consensus regarding the best set of thresholds''. Other figures in the
      same guide: Pittsburgh''s PARS flags officers ''one or more standard deviations greater than their
      peer officers'' (p. 58), and officers selected by Miami-Dade''s EIS ''averaged twice as many use-of-force
      incidents per year as their peers'' (p. 48). The quote was read through a fetched-page extract,
      so check the exact wording against the PDF before publishing.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Units that arrest violent suspects have higher force rates
  - Small numbers make ratios unstable
  jurisdictions: US
  version: 2
