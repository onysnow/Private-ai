    faint: The officer misses more scheduled hearings than the published police-officer average of 14%
      of hearings.
    strong: The officer misses at least one hearing in more than 31% of their cases, above the published
      police-officer average.
    textbook: Meets the published definition as worded. The study gives average rates only, not a cut-off
      for 'repeatedly'.
    threshold_source: https://www.law.upenn.edu/live/files/13151-court-no-shows-a-systemic-issue
    threshold_note: This is a benchmark, not a disciplinary threshold. It covers Philadelphia criminal
      cases from January 2010 to March 2020 (341,417 cases), and the figures are averages for all officers,
      so an officer above them is only a first sign. The research is in a student-edited law review, not
      a peer-reviewed journal. Seattle PD's EIS has a '1 within 12 months' trigger, but that is for missed
      mandatory training, not court, so it is not used here. The cited Walker/COPS early-warning guide
      could not be opened (host blocked by proxy).
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Scheduling conflicts, leave, or poor notice from courts
