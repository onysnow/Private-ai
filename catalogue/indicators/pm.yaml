- id: PM-011
  name: Racial disparities in stops, citations, arrests or force
  definition: An officer's or agency's enforcement falls on one racial group far more than that group's
    share of the population or comparable benchmarks.
  areas:
  - PM
  typology: Discriminatory policing
  status: verified
  sources:
  - title: Investigation of the Ferguson Police Department (summary)
    publisher: US DOJ Civil Rights Division
    year: '2015'
    url: https://www.justice.gov/sites/default/files/crt/legacy/2015/03/04/ferguson_findings_summ_3-4-15.pdf
    locator: p. 4-5
    quote: African Americans account for 85% of vehicle stops, 90% of citations, and 93% of arrests
    quote_verified: true
    checked: '2026-10-09'
  - title: Early Intervention Systems for Law Enforcement Agencies
    publisher: US DOJ COPS (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: Box 2.2, p. 28
    quote: All motor vehicle stops and pedestrian stops made by subject officer
    quote_verified: true
    checked: '2026-10-09'
  - title: State of Connecticut Traffic Stop Data Analysis and Findings, 2014-15
    publisher: Connecticut Racial Profiling Prohibition Project (Institute for Municipal and Regional
      Policy, Central Connecticut State University) with Connecticut Economic Resource Center
    year: '2016'
    url: https://imrp.dpp.uconn.edu/wp-content/uploads/sites/3351/2021/09/May-2016.pdf
    locator: PDF page 45, estimated driving population (EDP) benchmark section; the same 10-point / 5-point
      / 1.75 rule is restated for the resident-population benchmark and in the summary of findings
    quote: 'Departments that exceed their EDP percentages by greater than 10 percentage points in any
      of the three categories: (1) Minority (all race/ethnicity), (2) Black non-Hispanic, and (3) Hispanic,
      were identified in our tier one group. In addition, departments that exceeded their EDP percentage
      by more than five but less than 10 percentage points were identified in our tier two group for this
      benchmark if the ratio of the percentage of stops for the target group compared to the baseline
      measure for that group also was 1.75 or above (percentage of stops divided by benchmark percentage
      equals 1.75 or more)'
    quote_verified: true
    licence: Not stated
    checked: '2026-10-10'
  examples:
  - 'Ferguson: 93% of arrests were of African Americans, who were 67% of residents (population share per
    the full DOJ report).'
  cases:
  - name: Ferguson Police Department pattern-or-practice investigation
    year: '2015'
    jurisdiction: Ferguson, Missouri, US
    what_happened: DOJ found a pattern of stops without reasonable suspicion, arrests without probable
      cause, excessive force and racial disparities driven by a focus on revenue.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.justice.gov/crt/file/764731/dl
    source_title: Investigation of the Ferguson Police Department
  data_needed:
  - Person (officer)
  - Event (stop, citation, arrest with demographics of the person stopped)
  - Document (stop data)
  checkable: lookups
  lookup_sources:
  - State traffic-stop data reporting (e.g. racial profiling laws)
  - Census population data
  - Agency stop and arrest datasets
  levels:
    faint: The group's share of stops is more than 5 percentage points above its benchmark share (the
      published tier-two floor).
    strong: The stop share is more than 5 but less than 10 percentage points above the benchmark, and
      the ratio of stop share to benchmark share is 1.75 or above (published tier two).
    textbook: The stop share is more than 10 percentage points above the benchmark share (published tier
      one).
    threshold_source: https://imrp.dpp.uconn.edu/wp-content/uploads/sites/3351/2021/09/May-2016.pdf
    threshold_note: These are Connecticut's state traffic-stop thresholds, set at agency level against
      an estimated driving population (EDP) or resident benchmark. They are a descriptive screen, not
      proof of bias. The report itself says the margins of error in the EDP estimates are why it uses
      thresholds. The Ferguson figures cited already (85% of stops, 90% of citations and 93% of arrests)
      are findings from one investigation, not cut-offs.
