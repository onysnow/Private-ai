key: PM
name: Police misconduct and state violence
scope: 'Police misconduct and state violence (officer-level). Early intervention system indicators used
  to flag officers at risk of misconduct or excessive force: use-of-force incidents; officer-involved
  shootings; community complaints; internal disciplinary actions; reassignment history; civil suits or
  administrative claims against the officer; suspected or reported misconduct; vehicle pursuits and crashes.'
indicators:
- id: PM-001
  name: Repeated use-of-force incidents by one officer
  definition: An officer is involved in more use-of-force incidents than the agency's set threshold or
    than peers with the same assignment.
  areas:
  - PM
  typology: Excessive force / early intervention
  status: verified
  sources:
  - title: 'Early Intervention Systems for Law Enforcement Agencies: A Planning and Management Guide'
    publisher: US DOJ Office of Community Oriented Policing Services (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: Box 2.3, p. 29; p. 32
    quote: All officer-involved use-of-force incidents
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Early Intervention Systems for Law Enforcement Agencies: A Planning and Management Guide'
    publisher: US DOJ COPS (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: p. 32
    quote: In the Miami-Dade EIS, an officer is identified if in any quarter he or she has two or more
      citizen complaints or three or more use-of-force reports in the previous 90 days (or quarter).
    quote_verified: true
    checked: '2026-10-09'
  - title: XV. Early Intervention Systems (EIS)
    publisher: Council on Criminal Justice, Policing assessment
    url: https://policing.counciloncj.org/assessing-the-evidence/xv-early-intervention-systems-eis
    locator: Section on performance indicators
    quote: the most common performance indicators examined are use-of-force incidents, officer-involved
      shooting incidents,
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Officer has four use-of-force reports in one quarter while squad peers average one.
  cases:
  - name: Christopher Commission inquiry into the Los Angeles Police Department
    year: '1991'
    jurisdiction: Los Angeles, US
    what_happened: The independent commission found a significant number of LAPD officers who repetitively
      misused force and that the department's efforts to control or discipline them were inadequate; 63
      officers had 20 or more use-of-force reports each.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://libraryarchives.metro.net:443/DPGTL/publications/1991-ChristopherCommission-LAPD.pdf
    source_title: Report of the Independent Commission on the Los Angeles Police Department
  data_needed:
  - Person (officer)
  - Employment (officer to PublicBody, with role and unit)
  - 'Event (use-of-force incident: date, location, involved)'
  - Document (use-of-force report)
  checkable: lookups
  lookup_sources:
  - Agency use-of-force data released under public records law
  - Consent-decree monitor reports
  - Civilian oversight agency data portals
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets a published agency threshold, e.g. Miami-Dade: three or more use-of-force reports
      in the previous 90 days (one agency''s rule, not a national standard)'
    threshold_source: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Assignment to high-crime areas, night shifts or specialist units that make more arrests (the guide
    recommends peer comparison for this reason)
  - Some agencies count low-level force such as handcuffing resistance
  - Proactive officers make more arrests and so more force reports
  jurisdictions: US (model used widely; thresholds are agency-specific)
  version: 1
- id: PM-002
  name: Repeated civilian complaints against one officer
  definition: An officer draws many civilian complaints, particularly about force, compared with peers.
  areas:
  - PM
  typology: Excessive force / early intervention
  status: verified
  sources:
  - title: Early Intervention Systems for Law Enforcement Agencies
    publisher: US DOJ COPS (Samuel Walker)
    year: '2003'
    url: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
    locator: p. 46
    quote: represented only 12 percent of all officers receiving complaints but accounted for 41 percent
      of all complaints.
    quote_verified: true
    checked: '2026-10-09'
  - title: Report of the Independent Commission on the Los Angeles Police Department
    publisher: Independent Commission (Christopher Commission)
    year: '1991'
    url: https://libraryarchives.metro.net:443/DPGTL/publications/1991-ChristopherCommission-LAPD.pdf
    locator: The Problem of Excessive Force, p. 4
    quote: But 183 officers had four or more allegations, 44 had six or more
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Police Misconduct: Civilian allegations predict serious misconduct (policy brief)'
    publisher: 'Northwestern Institute for Policy Research (Schanzenbach and Rozema); published in American
      Economic Journal: Economic Policy 11(2) 2019'
    year: '2018'
    url: https://www.ipr.northwestern.edu/documents/policy-briefs/schanzenbach-max-police-misconduct.pdf
    locator: Findings
    quote: Civilian allegations can predict which police officers pose the highest risk for serious misconduct.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Officer in the top 3 percent of civilian complaints in a city over 12 years (as the study found for
    Jason Van Dyke).
  cases:
  - name: Jason Van Dyke (Chicago Police Department)
    year: '2018'
    jurisdiction: Chicago, Illinois, US
    what_happened: Researchers found the complaints against Van Dyke from 2002 to 2014 put him in the
      top three percent of Chicago officers; in 2018 a jury found him guilty of second-degree murder and
      aggravated battery in the shooting of Laquan McDonald.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.law.uchicago.edu/node/68601
    source_title: 'Study by Kyle Rozema: Van Dyke''s complaint history could have foretold shooting of
      McDonald (UChicago Law); ABC7 verdict report'
  data_needed:
  - Person (officer)
  - Employment
  - 'Document (complaint record: category, date, finding)'
  - Event (incident complained of)
  checkable: lookups
  lookup_sources:
  - Civilian oversight agency complaint data
  - Public complaint databases such as the Invisible Institute Citizens Police Data Project (Chicago)
  - Public records requests for internal affairs files
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets a published agency threshold, e.g. Miami-Dade: two or more citizen complaints in
      a quarter; Minneapolis (originally): three complaints in a twelve-month period'
    threshold_source: https://corpora.tika.apache.org/base/docs/govdocs1/263/263288.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - High-contact assignments draw more complaints
  - Complaints can be filed to retaliate against an arrest
  - Complaint rates differ by shift, district and unit, so raw counts mislead without peer comparison
  jurisdictions: US
  version: 1
