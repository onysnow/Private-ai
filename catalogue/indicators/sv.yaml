  - SV
  typology: Workplace risk factor (EEOC 2016)
  status: verified
  sources:
  - title: Select Task Force on the Study of Harassment in the Workplace
    publisher: US EEOC
    year: '2016'
    url: https://www.eeoc.gov/select-task-force-study-harassment-workplace
    locator: Part Two, Section E
    quote: Workplaces Where Some Workers Do Not Conform to Workplace Norms
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Women in construction, firefighting or the military
  - Openly LGBTQ staff in a conservative workplace culture
  cases: []
  data_needed:
  - Organization
  - Employment
  - Person
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
