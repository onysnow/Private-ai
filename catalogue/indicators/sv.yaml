key: SV
name: Sexual harassment and sexual violence against adults
scope: Workplace and institutional sexual harassment; rape and the police response (unfounded cases, untested
  kits); sexual abuse of adults by clergy, aid workers and others; non-consensual intimate images, deepfake
  porn and stalkerware; non-consensual or underage content on porn platforms.
indicators:
- id: SV-001
  name: Homogeneous workforce
  definition: A workplace where nearly everyone shares the same sex, background or profile, so the few
    who differ are isolated and more easily targeted.
  areas:
  - SV
  typology: Workplace risk factor (EEOC 2016)
  status: verified
  sources:
  - title: Select Task Force on the Study of Harassment in the Workplace
    publisher: US EEOC
    year: '2016'
    url: https://www.eeoc.gov/select-task-force-study-harassment-workplace
    locator: Part Two, Section E, Risk Factors for Harassment
    quote: Homogenous Workforces
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A trade or engineering team with one or two women among dozens of men
  - A newsroom or executive floor with almost no staff from minority groups
  cases: []
  data_needed:
  - Organization
  - Company
  - Employment
  - Person
  - Document
  checkable: records
  lookup_sources:
  - EEO-1 or equivalent workforce diversity disclosures
  - Company annual or ESG reports
  - UK gender pay gap filings
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Industry labour pools are themselves homogeneous
  - Small employers with few hires
  - Recent diversity hiring not yet reflected in figures
  jurisdictions: US (applies generally)
  version: 1
- id: SV-002
  name: Workers who do not fit workplace norms
  definition: Staff who depart from what is expected in a workplace (for example, the first women in a
    male-dominated job) face higher harassment risk.
