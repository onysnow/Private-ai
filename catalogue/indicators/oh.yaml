  - OH
  typology: User support
  status: verified
  sources:
  - title: Prevention of Future Deaths report, ref 2023-0534
    publisher: Courts and Tribunals Judiciary (Coroner)
    year: '2023'
    url: https://www.judiciary.uk/prevention-of-future-death-reports/chloe-macdermott-prevention-of-future-deaths-report/
    locator: Matters of concern, (6)
    quote: No prominent signposting is in place to organisations from whom help is available to prevent
      suicide.
