key: OH
name: Online encouragement of suicide and self-harm
scope: Pro-suicide forums, online sellers of lethal substances, and platform features that push users
  toward self-harm.
indicators:
- id: OH-001
  name: Service is a dedicated forum or chat space where suicide is encouraged or assisted
  definition: A website, forum or chat service whose discussion spaces are used by members to encourage
    or assist suicide or serious self-harm, rather than to support recovery.
  areas:
  - OH
  typology: Pro-suicide forums
  status: verified
  sources:
  - title: Draft Updated Register of Risks (relevant extracts)
    publisher: Ofcom
    year: '2026'
    url: https://www.ofcom.org.uk/siteassets/resources/documents/consultations/category-1-10-weeks/199101-new-priority-offences/main-docs/draft-updated-register-of-risks-relevant-extracts.pdf?v=414981
    locator: p.14, 'Online services'
    quote: discussion forums and chat room services can act as spaces where suicide and self-harm is assisted
      or encouraged
    quote_verified: true
    checked: '2026-10-10'
  - title: Ofcom investigates online suicide forum
    publisher: Ofcom
    year: '2025'
    url: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/ofcom-investigates-online-suicide-forum
    locator: Investigation announcement, 9 April 2025
    quote: Due to its nature, we have decided not to name the provider and forum.
    quote_verified: true
    checked: '2026-10-10'
  - title: Children's Risk Assessment Guidance and Children's Risk Profiles
    publisher: Ofcom
    year: '2025'
    url: https://www.ofcom.org.uk/siteassets/resources/documents/consultations/category-1-10-weeks/statement-protecting-children-from-harms-online/main-document/childrens-risk-assessment-guidance-and-childrens-risk-profiles.pdf?v=396653
    locator: Children's U2U Risk Profile, row 1c 'Discussion forums and chat room services', p.42
    quote: eating disorder content as well as suicide and self-harm content
    quote_verified: true
    checked: '2026-10-10'
  - title: Prevention of Future Deaths report, ref 2023-0534 (Inner West London)
    publisher: Courts and Tribunals Judiciary (Coroner)
    year: '2023'
    url: https://www.judiciary.uk/prevention-of-future-death-reports/chloe-macdermott-prevention-of-future-deaths-report/
    locator: Matters of concern, (3)
    quote: is a forum that permits material to be exchanged and viewed within its open chatrooms
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A UK coroner's report (ref 2023-0534) described a forum hosting open chatrooms where suicide material
    was exchanged.
  - Ofcom opened an Online Safety Act investigation into the provider of an unnamed online suicide forum
    in April 2025.
  cases:
  - name: Inner West London coroner, Prevention of Future Deaths report ref 2023-0534
    year: '2023'
    jurisdiction: England and Wales
    what_happened: An assistant coroner reported concerns that a forum allowed suicide material to be
      exchanged in open chatrooms, with no age restrictions, no prominent help signposting and no effective
      moderation; the report went to Ofcom, government departments, Google and Amazon.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.judiciary.uk/prevention-of-future-death-reports/chloe-macdermott-prevention-of-future-deaths-report/
    source_title: Prevention of Future Deaths report 2023-0534
  - name: Swansea and Neath Port Talbot coroner, Prevention of Future Deaths report ref 2025-0139
    year: '2025'
    jurisdiction: Wales
    what_happened: The coroner reported that the deceased (aged 24) accessed an online 'suicide forum'
      and a social media platform, and was concerned about the risk to life posed by both; the report
      went to Ofcom and DSIT.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.judiciary.uk/prevention-of-future-death-reports/rhiannon-williams-prevention-of-future-deaths-report/
    source_title: Prevention of Future Deaths report 2025-0139
  data_needed:
  - Organization
  - Company
  - Person
  - Address
  - Document
  - Event
  - Note
  checkable: lookups
  lookup_sources:
  - Coroners' Prevention of Future Deaths reports (judiciary.uk)
  - Ofcom enforcement announcements
  - Domain registration and hosting records (WHOIS, passive DNS)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HO
    reason: Ofcom treats suicide forums as an illegal-harms risk under the Online Safety Act, the same
      regime used for other online harms.
    source_url: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/ofcom-investigates-online-suicide-forum
  innocent_explanations:
  - Peer-support and recovery forums discuss suicide openly to help members stay safe.
  - Research, journalism or bereavement communities may discuss suicide without encouraging it.
  - A general forum may hold isolated harmful posts that its moderators remove.
  jurisdictions: UK (Online Safety Act); pattern recognised internationally
  version: 1
- id: OH-002
  name: No age or vulnerability restrictions on a service hosting suicide or self-harm content
  definition: A service that carries suicide or self-harm content lets anyone in, including children and
    vulnerable adults, with no age check or other access control.
  areas:
  - OH
  typology: Access controls
  status: verified
  sources:
  - title: Prevention of Future Deaths report, ref 2023-0534
    publisher: Courts and Tribunals Judiciary (Coroner)
    year: '2023'
    url: https://www.judiciary.uk/prevention-of-future-death-reports/chloe-macdermott-prevention-of-future-deaths-report/
    locator: Matters of concern, (5)
    quote: No age or other restrictions are in place to prevent access to children, vulnerable teenagers
      and vulnerable adults.
    quote_verified: true
    checked: '2026-10-10'
  - title: Prevention of Future Deaths report, ref 2022-0315 (North London)
    publisher: Courts and Tribunals Judiciary (Coroner)
    year: '2022'
    url: https://www.judiciary.uk/wp-content/uploads/2022/10/Molly-Russell-Prevention-of-future-deaths-report-2022-0315_Published.pdf
    locator: Matters of concern, 2
    quote: There was no age verification when signing up to the on-line platform.
    quote_verified: true
    checked: '2026-10-10'
  - title: Protection of Children Code of Practice for user-to-user services
    publisher: Ofcom
    year: '2025'
    url: https://www.ofcom.org.uk/siteassets/resources/documents/consultations/category-1-10-weeks/statement-protecting-children-from-harms-online/main-document/protection-of-children-code-of-practice-for-user-to-user-services.pdf?v=403579
    locator: Measure PCU B2
    quote: use highly effective age assurance to target access controls to prevent all United Kingdom
      users of the service
    quote_verified: true
    checked: '2026-10-10'
  - title: New rules for a safer generation of children online
    publisher: Ofcom
    year: '2025'
    url: https://www.ofcom.org.uk/online-safety/protecting-children/new-rules-for-a-safer-generation-of-children-online
    locator: Age checks
    quote: The riskiest services must use highly effective age assurance to identify which users are children.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A coroner found a forum had no age or other restrictions protecting children and vulnerable adults
    (PFD 2023-0534).
  - A coroner noted no age verification at sign-up on the platform used by a 14-year-old (PFD 2022-0315).
  cases:
  - name: North London coroner's inquest and Prevention of Future Deaths report ref 2022-0315
    year: '2022'
    jurisdiction: England and Wales
    what_happened: The coroner found that online material viewed by a 14-year-old contributed to her death
      in a more than minimal way and listed concerns including no age verification and no separation of
      adult and child content.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.judiciary.uk/wp-content/uploads/2022/10/Molly-Russell-Prevention-of-future-deaths-report-2022-0315_Published.pdf
    source_title: Prevention of Future Deaths report 2022-0315
  data_needed:
  - Organization
  - Company
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Platform sign-up flow and terms of service
  - Ofcom enforcement and age-assurance reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HO
    reason: Age assurance failures are the same control Ofcom's children's codes require across all primary
      priority content.
    source_url: https://www.ofcom.org.uk/online-safety/protecting-children/new-rules-for-a-safer-generation-of-children-online
  innocent_explanations:
  - Adult-only general services may rely on self-declared age because they are not designed for children.
  - Age assurance may be in the process of being rolled out to meet new legal deadlines (UK duties applied
    from 25 July 2025).
  - Support services may deliberately avoid barriers so people in crisis can reach help.
  jurisdictions: UK
  version: 1
- id: OH-003
  name: No prominent signposting to crisis help
  definition: A service where users post, search for or report suicide or self-harm content does not point
    them clearly to help and support organisations.
