key: HO
name: Homicide and suspicious deaths
scope: 'homicide and suspicious deaths: deaths wrongly classified or poorly investigated, unsolved killings
  and possible serial killings, wrongful convictions in homicide cases, killings commissioned or meant
  to silence someone and impunity, and homicide risk in families.'
indicators:
- id: HO-001
  name: Death in custody or state detention
  definition: A person died while held by police, prison, immigration or another state body, which the
    standards treat as a death the state must explain and investigate.
  areas:
  - HO
  - HR
  - PM
  typology: Potentially unlawful death - custody
  status: verified
  sources:
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN Office of the High Commissioner for Human Rights
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 2(b)
    quote: The death occurred when a person was detained by, or was in the custody of, the State,
    quote_verified: true
    checked: '2026-10-10'
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN Office of the High Commissioner for Human Rights
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 17
    quote: there is a general presumption of state responsibility in such cases.
    quote_verified: true
    checked: '2026-10-10'
  - title: Coroners and Justice Act 2009, section 1
    publisher: UK Parliament (legislation.gov.uk)
    year: '2009'
    url: https://www.legislation.gov.uk/ukpga/2009/25/section/1
    locator: s.1(2)(c)
    quote: the deceased died while in custody or otherwise in state detention.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Strengthening the U.S. Medicolegal Death Investigation System: Lessons from Deaths in Custody'
    publisher: National Academies of Sciences, Engineering, and Medicine
    year: '2025'
    url: https://www.nationalacademies.org/read/29232/chapter/8
    locator: Chapter 5, Data Collection on Deaths in Custody
    quote: Autopsies are not performed for all for in-custody deaths.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A prisoner found dead in a cell with the death certificate not noting that the death occurred in custody.
  - A detainee death certified without an autopsy.
  cases:
  - name: Elijah McClain
    year: 2019 (amended autopsy 2021, released 2022)
    jurisdiction: Colorado, United States
    what_happened: The original autopsy listed cause and manner as undetermined; the amended report gave
      cause as ketamine administration following forcible restraint after the pathologist received body
      camera footage and records he had not obtained originally.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://cpr.org/2022/09/23/elijah-mcclain-death-by-ketamine-autopsy-report-changed
    source_title: Elijah McClain death by ketamine, autopsy report changed (Colorado Public Radio)
  data_needed:
  - Person
  - Event
  - PublicBody
  - Address
  - Document
  - Note
  checkable: lookups
  lookup_sources:
  - death records
  - coroner and medical examiner records
  - prison and police custody death statistics
  - court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: death while detained by or in the custody of
      the state (Minnesota Protocol para. 2(b); CJA 2009 s.1(2)(c)).'
    threshold_source: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: Deaths in custody and after police action carry a presumption of state responsibility and
      overlap with police misconduct review.
    source_url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
  - target_area: HR
    reason: A failure to investigate a potentially unlawful death is itself treated as a breach of the
      right to life.
    source_url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
  innocent_explanations:
  - People in custody die of natural disease, including chronic illness and old age in long-term prisons.
  - Suicide in custody is a recognised cause of death that may be properly investigated.
  - Drug toxicity from substances taken before arrest.
  jurisdictions: International (UN Minnesota Protocol); England and Wales (Coroners and Justice Act 2009);
    United States (NAME standards, NASEM 2025)
  version: 1
- id: HO-002
  name: Death associated with police action or restraint
  definition: A death followed police contact, restraint, use of force or sedation during an arrest, which
    standards say always needs a forensic autopsy and independent investigation.
  areas:
  - HO
  - PM
  typology: Potentially unlawful death - state agents
  status: verified
  sources:
  - title: Forensic Autopsy Performance Standards (as listed by Washoe County Regional Medical Examiner)
    publisher: National Association of Medical Examiners, via Washoe County
    url: https://washoecounty.gov/coroner/faq/when_is_autopsy_performed.php
    locator: Standard B3 list, item 3
    quote: The death is associated with police action.
    quote_verified: true
    checked: '2026-10-10'
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 2(a)
    quote: The death may have been caused by acts or omissions of the State, its organs or agents,
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A man dies hours after an arrest and officers' report says he was found injured elsewhere.
  - A death after restraint certified as undetermined without body camera footage being reviewed by the
    pathologist.
  cases:
  - name: Raymond Robair (officers Melvin Williams and Matthew Dean Moore)
    year: 2005 (convictions 2011)
    jurisdiction: New Orleans, Louisiana, United States
    what_happened: Officer Williams was convicted of beating Robair, who died within hours; both officers
      were convicted of obstruction for a false incident report. ProPublica reported the coroner had concluded
      the death was accidental and a second autopsy found 23 injuries he overlooked.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/2011/April/11-crt-463.html
    source_title: US Department of Justice press release 11-crt-463; ProPublica, NOPD officers convicted
      in handyman's beating death
  data_needed:
  - Person
  - Event
  - PublicBody
  - Employment
  - Document
  - CourtCase
  checkable: lookups
  lookup_sources:
  - court records
  - use-of-force and police complaint records
  - medical examiner records
  - death records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: death associated with police action (NAME Standard
      B3).'
    threshold_source: https://washoecounty.gov/coroner/faq/when_is_autopsy_performed.php
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: Officers in the Robair case were convicted of obstructing justice through a false report.
    source_url: https://www.justice.gov/opa/pr/2011/April/11-crt-463.html
  innocent_explanations:
  - Pre-existing heart disease or drug intoxication can cause sudden death during an arrest.
  - Police may have been responding to a medical emergency already under way.
  - Injuries may come from events before police arrived.
  jurisdictions: International; United States
  version: 1
- id: HO-003
  name: Cause of death given as 'excited delirium'
  definition: A death after restraint or police contact is attributed to 'excited delirium', a label the
    US medical examiners' body says it does not endorse, instead of the underlying cause.
  areas:
  - HO
  - PM
  typology: Classification - disputed diagnostic label
  status: verified
  sources:
  - title: NAME Position Statement on Excited Delirium (6 March 2023)
    publisher: National Association of Medical Examiners
    year: '2023'
    url: https://www.thename.org/assets/docs/PositionPaperUpdates/Excited%20Delirium%20Statement%20March%206%2C%202023.pdf
    quote: these terms are not endorsed by NAME or recognized in renewed classifications
    quote_verified: true
    checked: '2026-10-10'
  - title: NAME Position Statement on Excited Delirium (6 March 2023)
    publisher: National Association of Medical Examiners
    year: '2023'
    url: https://www.thename.org/assets/docs/PositionPaperUpdates/Excited%20Delirium%20Statement%20March%206%2C%202023.pdf
    quote: NAME endorses that the underlying cause, natural or unnatural (to include trauma), for the
      delirious state be determined
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - An autopsy report naming excited delirium as the cause of death of a man who died during a prone restraint.
  cases: []
  data_needed:
  - Person
  - Event
  - Document
  - PublicBody
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: excited delirium used as the cause of death after
      the 2023 NAME statement, without an underlying cause determined.'
    threshold_source: https://www.thename.org/assets/docs/PositionPaperUpdates/Excited%20Delirium%20Statement%20March%206%2C%202023.pdf
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: The term has been used chiefly in deaths following police restraint; NAME asks that the underlying
      cause, including trauma, be determined.
    source_url: https://www.thename.org/assets/docs/PositionPaperUpdates/Excited%20Delirium%20Statement%20March%206%2C%202023.pdf
  innocent_explanations:
  - Older reports (before 2023) used the term under then-common practice.
  - The underlying cause may be stated elsewhere in the report, with the term used only descriptively.
  - Genuine drug-induced delirium may be present and properly documented.
  jurisdictions: United States
  version: 1
- id: HO-004
  name: No autopsy where standards require one
  definition: A death falling into a category that standards say needs a forensic autopsy (violence, custody,
    police action, unexplained child death, drowning, poisoning, unidentified or burned body) was certified
    without one, or without a written reason.
  areas:
  - HO
  typology: Investigation failure - autopsy
  status: verified
  sources:
  - title: Forensic Autopsy Performance Standards (as listed by Washoe County)
    publisher: National Association of Medical Examiners, via Washoe County
    url: https://washoecounty.gov/coroner/faq/when_is_autopsy_performed.php
    locator: Standard B3 list, item 1
    quote: The death is known or suspected to have been caused by apparent criminal violence.
    quote_verified: true
    checked: '2026-10-10'
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 25
    quote: A decision not to undertake an autopsy should be justified in writing and should be subject
      to judicial review.
    quote_verified: true
    checked: '2026-10-10'
  - title: Chronic dysfunction found in death investigations
    publisher: NPR (with ProPublica and Frontline)
    year: '2011'
    url: https://www.npr.org/2011/02/08/133595702/chronic-dysfunction-found-in-death-investigations
    quote: we don't have the staff to autopsy them.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A suspected drowning certified on external examination only.
  - An unidentified body released for burial without autopsy.
  cases: []
  data_needed:
  - Person
  - Event
  - Document
  - PublicBody
  - Note
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: The death falls within one of the 13 NAME Standard B3 categories and no forensic autopsy
      was performed, or (Minnesota Protocol para. 25) no written justification exists for not performing
      one.
    threshold_source: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
      ; https://www.npr.org/2011/02/08/133595702/chronic-dysfunction-found-in-death-investigations
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: NASEM found autopsies are not performed in all in-custody deaths, undermining cause and manner
      findings.
    source_url: https://www.nationalacademies.org/read/29232/chapter/8
  innocent_explanations:
  - Religious or family objection lawfully honoured, with reasons recorded.
  - Long hospital stay with well-documented medical findings (NAME B3 item 7 exception).
  - Resource shortages leading to external examination plus toxicology under a written office policy.
  jurisdictions: United States (NAME); International (Minnesota Protocol)
  version: 1
- id: HO-005
  name: Death examined or certified by an unqualified person
  definition: The autopsy or the cause-and-manner ruling was made by someone without forensic pathology
    training, such as an elected lay coroner or an uncertified pathologist.
  areas:
  - HO
  typology: Investigation failure - competence
  status: verified
  sources:
  - title: Improving forensic death investigation
    publisher: National Institute of Justice
    url: https://nij.ojp.gov/topics/articles/improving-forensic-death-investigation
    quote: Coroners — often elected officials who fulfill state requirements — may or may not be physicians
      or have medical training.
    quote_verified: true
    checked: '2026-10-10'
  - title: Organizational and Foundational Standard for Medicolegal Death Investigation (OSAC Proposed
      Standard v1.0)
    publisher: OSAC for Forensic Science / NIST
    year: '2019'
    url: https://www.nist.gov/document/organizational-and-foundational-standard-mdi
    locator: s.4.4.1
    quote: All reported deaths shall be assessed and investigated by a certified forensic pathologist
      and/or a certified medicolegal death investigator
    quote_verified: true
    checked: '2026-10-10'
  - title: Judge urges better training and standards for pathologists
    publisher: Canadian Medical Association Journal
    year: '2008'
    url: https://www.cmaj.ca/content/179/10/995
    quote: unqualified as a forensic pathologist
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - An elected coroner with no medical degree rules a death accidental without referring it to a forensic
    pathologist.
  cases:
  - name: Dr Charles Smith (Goudge Inquiry into Pediatric Forensic Pathology in Ontario)
    year: '2008'
    jurisdiction: Ontario, Canada
    what_happened: The inquiry found Smith unqualified as a forensic pathologist; a review found serious
      errors in at least 20 cases, 12 of which led to criminal convictions of parents.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.cmaj.ca/content/179/10/995
    source_title: Judge urges better training and standards for pathologists (CMAJ)
  data_needed:
  - Person
  - Employment
  - PublicBody
  - Document
  checkable: lookups
  lookup_sources:
  - medical licensing and board-certification registries
  - coroner election records
  - court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: assessment of a reported death not made by a
      certified forensic pathologist (OSAC proposed standard 4.4.1).'
    threshold_source: https://www.nist.gov/document/organizational-and-foundational-standard-mdi
  threshold_verified: true
  cross_hints:
  - target_area: CA
    reason: The Goudge Inquiry concerned pediatric deaths where flawed pathology led to parents' wrongful
      convictions.
    source_url: https://jaapl.org/content/40/1/81
  innocent_explanations:
  - Many US jurisdictions lawfully use lay coroners who refer autopsies to qualified pathologists.
  - Rural areas may lack certified forensic pathologists and use hospital pathologists under supervision.
  jurisdictions: United States; Ontario, Canada
  version: 1
- id: HO-006
  name: Death scene not secured or no scene log
  definition: The place where the body was found was not sealed off quickly, or there is no record of
    who entered and when, so evidence could have been lost or contaminated.
  areas:
  - HO
  typology: Investigation failure - scene
  status: verified
  sources:
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 59
    quote: A crime scene should be secured at the earliest possible opportunity
    quote_verified: true
    checked: '2026-10-10'
  - title: The Minnesota Protocol on the Investigation of Potentially Unlawful Death (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 60
    quote: A record of all personnel entering the scene should be kept with the corresponding date and
      time of their visit.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024 Technical Update, NCJ 308955)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section B.2
    quote: The MDI must endeavor to protect the evidence against contamination or loss.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Family and multiple officers walk through the room before investigators arrive and no entry log is
    kept.
  cases: []
  data_needed:
  - Event
  - Address
  - Document
  - Person
  - Note
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: scene not secured at the earliest opportunity
      and/or no entry log (Minnesota Protocol paras. 59-60).'
    threshold_source: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Paramedics must enter and move the person to attempt resuscitation.
  - Safety hazards (fire, collapse) may prevent securing the scene.
  - Deaths first believed natural are not normally treated as crime scenes.
  jurisdictions: International; United States
  version: 1
- id: HO-007
  name: Body moved or not photographed before examination
  definition: The body was moved, or not photographed and examined where it was found, before the death
    investigator documented it.
  areas:
  - HO
  typology: Investigation failure - scene
  status: verified
  sources:
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024 Technical Update)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section D.1
    quote: Photograph the body and immediate surroundings as initially found by the MDI.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024 Technical Update)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section D.2(E)
    quote: Document and photograph the presence or absence of injury/trauma.
    quote_verified: true
    checked: '2026-10-10'
  - title: The Minnesota Protocol (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 62
    quote: All relevant material should be recorded in documentary and photographic form
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Scene photographs begin only after the body was taken to the mortuary.
  cases: []
  data_needed:
  - Event
  - Document
  - Address
  - Note
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: no photographs of the body as found or no documented
      examination for injury before moving (NIJ D.1, D.2).'
    threshold_source: https://ojp.gov/pdffiles1/nij/308955.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Resuscitation attempts require moving the body.
  - Bodies in public places or hazardous conditions may need prompt removal.
  jurisdictions: United States; International
  version: 1
- id: HO-008
  name: Broken chain of custody or lost evidence
  definition: Evidence or samples from a death cannot be traced from collection to analysis, or were lost,
    destroyed or never sent for testing.
  areas:
  - HO
  typology: Investigation failure - evidence
  status: verified
  sources:
  - title: The Minnesota Protocol (2016)
    publisher: UN OHCHR
    year: '2017'
    url: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
    locator: para. 65
    quote: Chain of custody is a legal, evidentiary concept requiring that any prospective item of evidence
      be conclusively documented
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section B.6
    quote: This will safeguard against subsequent allegations of tampering, theft, planting, contamination,
      and loss of evidence.
    quote_verified: true
    checked: '2026-10-10'
  - title: Jury finds Metropolitan Police failings led to deaths
    publisher: Doughty Street Chambers
    year: '2021'
    url: https://www.doughtystreet.co.uk/news/jury-finds-metropolitan-police-failings-led-deaths
    quote: send evidence to be scientifically examined
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Toxicology samples taken but never tested; a phone or laptop held for months unexamined.
  cases:
  - name: Stephen Port inquests (deaths of four young men, Barking)
    year: '2021'
    jurisdiction: England and Wales
    what_happened: The inquest jury found Metropolitan Police failings probably contributed to deaths;
      police admitted failing to carry out basic checks and send evidence to be scientifically examined;
      the coroner's report cited delay in examining Port's laptop.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.doughtystreet.co.uk/news/jury-finds-metropolitan-police-failings-led-deaths
    source_title: Jury finds Metropolitan Police failings led to deaths (Doughty Street Chambers)
  data_needed:
  - Document
  - Event
  - PublicBody
  - Note
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: an item of evidence not conclusively documented
      from collection onward (Minnesota Protocol para. 65).'
    threshold_source: https://www.ohchr.org/sites/default/files/Documents/Publications/MinnesotaProtocol.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Laboratory backlogs delay testing without loss.
  - Documentation may exist but not be released to the public or family.
  jurisdictions: International; United States; England and Wales
  version: 1
- id: HO-009
  name: Unresolved discrepancies between body, scene and witness accounts
  definition: Signs on the body (rigor, lividity, temperature, injuries, trace evidence) or statements
    do not fit the account given of the death, and the file does not record or resolve the conflict.
  areas:
  - HO
  typology: Classification - contrary signs
  status: verified
  sources:
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section C.3(D)
    quote: Check the body, clothing, and scene for consistency/ inconsistency of trace evidence and indicate
      the location where artifacts are found.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section C.5(E)
    quote: Check the body, clothing, and scene for consistency/ inconsistency of trace evidence and indicate
      the location where artifacts are found.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Death Investigation: A Guide for the Scene Investigator (2024)'
    publisher: National Institute of Justice
    year: '2024'
    url: https://ojp.gov/pdffiles1/nij/308955.pdf
    locator: Section C.3(E)
    quote: Check the body, clothing, and scene for consistency/ inconsistency of trace evidence and indicate
      the location where artifacts are found.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Lividity pattern suggests the body was moved after death, but the file records the death as occurring
    where found.
  cases: []
  data_needed:
  - Event
  - Document
  - Person
  - Note
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: discrepancies present and not recorded or explained
      (NIJ C.3(D), C.5(E)).'
    threshold_source: https://ojp.gov/pdffiles1/nij/308955.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Witnesses under shock often give inconsistent times and details.
  - Environmental temperature and medical conditions alter post-mortem changes.
  - Resuscitation and transport can create marks and move the body.
  jurisdictions: United States
  version: 1
- id: HO-010
  name: Death labelled non-suspicious or 'unexplained' from the outset
  definition: Police or investigators decided early that a death was not suspicious (for example a drug
    overdose) and stopped short of a full investigation, instead of treating it as suspicious until shown
    otherwise.
  areas:
  - HO
  typology: Classification - premature closure
  status: verified
  sources:
  - title: An inspection of the Metropolitan Police Service's response to lessons from the Stephen Port
