    quote: Frequent foreign travel (excluding official travel)
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Mallory travelled to Shanghai in March and April 2017 to meet a suspected intelligence officer.
  - Xiaolang Zhang bought a last-minute round-trip ticket to China with no co-travellers and was arrested
    at San Jose airport (indictment, 2018).
  cases:
  - name: United States v. Xiaolang Zhang
    year: 2018 (indictment), 2022 (plea)
    jurisdiction: US, Northern District of California
    what_happened: Apple engineer resigned saying he was returning to China, bought a last-minute ticket
      to Beijing, and was arrested at the airport; his network activity had increased notably and he had
      downloaded data from project databases. Fortune reported court documents showing he pleaded guilty
      to one count of theft of trade secrets.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://justice.gov/usao-ndca/pr/former-apple-employee-indicted-theft-trade-secrets
    source_title: Former Apple Employee Indicted On Theft Of Trade Secrets (DOJ, 2018); Fortune, 23 Aug
      2022
