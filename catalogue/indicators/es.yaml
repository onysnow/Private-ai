- id: ES-009
  name: Unexplained affluence
  definition: The person spends or owns much more than their known income can explain.
  areas:
  - ES
  typology: Financial considerations
  status: verified
  sources:
  - title: Insider Threat - Potential Risk Indicators (PRI) job aid
    publisher: CDSE
    url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
    locator: Financial Considerations
    quote: Displaying signs of unexplained affluence
    quote_verified: true
    checked: '2026-10-09'
  - title: DoD Directive 5240.06
    publisher: US Department of Defense
    url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/524006p.pdf
    locator: Enclosure 4, Table 1, item 24a
    quote: Expensive purchases an individual's income does not logically support.
    quote_verified: true
    checked: '2026-10-09'
  - title: 32 CFR 147.8 Guideline F - Financial considerations
    publisher: Cornell LII
    url: https://www.law.cornell.edu/cfr/text/32/147.8
    locator: 147.8(a)
    quote: Unexplained affluence is often linked to proceeds from financially profitable criminal acts.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Ames bought a new Jaguar and a $540,000 home in Arlington with cash while earning less than $70,000
    a year (SSCI, 1994).
  - Hanssen received cash payments of at least $500,000 and three diamonds from the KGB (DOJ OIG, 2003).
  cases:
  - name: Aldrich Ames
    year: '1994'
    jurisdiction: US
    what_happened: Senate Intelligence Committee found Ames's large cash purchases on a salary under $70,000
      did not draw attention, and the story that his wife came from a wealthy family 'seemed to diffuse
      any security concern'. Ames pleaded guilty on 28 April 1994.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://irp.fas.org/congress/1994_rpt/ssci_ames.htm
    source_title: SSCI Assessment of the Aldrich H. Ames Espionage Case (1994)
  - name: Robert Philip Hanssen
    year: 2001 (plea), 2003 (OIG review)
    jurisdiction: US
    what_happened: FBI agent spied in 1979-81, 1985-91 and 1999-2001, received at least $500,000 in cash
      and diamonds; he was never asked to complete a detailed financial disclosure form. Pleaded guilty
      6 July 2001, sentenced to life on 10 May 2002.
    outcome: convicted
    outcome_verified: true
    source_url: https://oig.justice.gov/special/0308/index.htm
    source_title: A Review of the FBI's Performance in Deterring, Detecting, and Investigating the Espionage
      Activities of Robert Philip Hanssen (DOJ OIG, 2003)
  data_needed:
  - Person
  - Payment
  - RealEstate
  - Vehicle
  - Ownership
  - Employment
  - CryptoWallet
  checkable: lookups
  lookup_sources:
  - property and land registry
  - vehicle records
  - court financial filings
  - salary scales for public posts
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Unexplained wealth relative to declared income is also a core money-laundering and corruption
      red flag; espionage proceeds are often cash, gems or cryptocurrency.
    source_url: https://www.law.cornell.edu/cfr/text/32/147.8
  innocent_explanations:
  - Inheritance, spouse's income or family wealth.
  - Lawful side business, investments or lottery win.
  - Debt-financed spending that looks like wealth.
  jurisdictions: United States (cleared personnel); general financial-crime concept
  version: 1
