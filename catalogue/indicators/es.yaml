- id: ES-011
  name: Sudden reversal of a bad financial situation
  definition: A person in financial trouble suddenly pays off large debts or recovers without a clear
    source of money.
  areas:
  - ES
  typology: Financial considerations
  status: verified
  sources:
  - title: DoD Directive 5240.06
    publisher: US Department of Defense
    url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/524006p.pdf
    locator: Enclosure 4, Table 1, item 24c
    quote: Sudden reversal of a bad financial situation or repayment of large debts.
    quote_verified: true
    checked: '2026-10-09'
  - title: Required Reporting for Clearance Holders
    publisher: US Nuclear Regulatory Commission (implementing ODNI Security Executive Agent Directive
      3)
    year: '2026'
    url: https://www.nrc.gov/security/required-reporting-for-clearance-holders
    locator: Section listing SEAD 3 reportable information, item 'Financial issues and anomalies'
    quote: Financial issues and anomalies including, but not limited to, bankruptcy, foreclosure, tax
      liens, failure to pay Federal or State taxes, garnishment, over 120 days delinquent on any debt,
      and any unusual infusion of $10,000 or greater, such as an inheritance, winnings, or similar financial
      gain.
    quote_verified: true
    licence: US federal government work (no licence stated; generally public domain)
    checked: '2026-10-10'
  examples: []
  cases: []
  data_needed:
  - Person
  - Debt
  - Payment
  - CourtCase
  checkable: lookups
  lookup_sources:
  - court judgments and lien records (satisfaction filings)
  - bankruptcy dockets
  - credit-related court filings
  levels:
    faint: A person with known money trouble (for example a debt over 120 days delinquent, bankruptcy
      or garnishment) begins clearing debts, and the source of the money is not yet clear.
    strong: The person receives or uses an unexplained infusion of money that approaches the $10,000 reporting
      level, or several smaller ones, while clearing large debts.
    textbook: There is an unusual infusion of $10,000 or greater (such as an inheritance or winnings)
      that SEAD 3 requires to be reported, it coincides with the sudden repayment of large debts, and
      it was not reported or has no clear source.
    threshold_source: https://www.nrc.gov/security/required-reporting-for-clearance-holders
    threshold_note: The $10,000 figure is SEAD 3's reporting threshold for unusual financial infusions,
      as an agency restates it. The ODNI SEAD 3 PDF itself could not be downloaded because of a bot block.
      Confirm the wording against SEAD 3 (dni.gov). The 120-day delinquency figure in the same sentence
