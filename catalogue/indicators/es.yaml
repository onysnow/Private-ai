- id: ES-004
  name: Foreign trips that are short, illogical or unaffordable
  definition: The person makes frequent unofficial foreign trips, or short trips that do not look like
    holidays, or trips they could not afford on their income.
  areas:
  - ES
  typology: Foreign considerations / travel
  status: verified
  sources:
  - title: DoD Directive 5240.06
    publisher: US Department of Defense
    url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/524006p.pdf
    locator: 'Enclosure 4, Table 1, item 23a (also 23b: trips inconsistent with financial ability)'
    quote: Short trips inconsistent with logical vacation travel or not part of official duties.
    quote_verified: true
    checked: '2026-10-09'
