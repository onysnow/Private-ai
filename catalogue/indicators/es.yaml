not_reached:
- 'FBI brochure ''The Insider Threat: An Introduction to Detecting and Deterring an Insider Spy'' (fbi.gov/file-repository/insider_threat_brochure.pdf):
  WebFetch returned no indicator text, so its personal and organisational factor lists were not used.'
- 'FBI counterintelligence insider threat page (fbi.gov/investigate/counterintelligence/the-insider-threat):
  fetch error.'
- 'SEAD 4 National Security Adjudicative Guidelines (archive.dni.gov PDF): no machine-readable text. The
  older 32 CFR Part 147 guidelines were used instead; SEAD 4 wording may differ.'
- 'eCFR 32 CFR part 147: fetch error (Cornell LII copy used).'
- 'PERSEREC ''The Expanding Spectrum of Espionage by Americans, 1947-2015'' (irp.fas.org/eprint/spectrum.pdf):
  empty response. The 2002 PERSEREC report was used instead.'
- Direct curl of the CDSE PDF and justice.gov pages was blocked by bot checks; quotes came through WebFetch,
  which returns quoted extracts, not the raw file. Spot-check the wording against the originals before
  publishing.
- Air Force IG directed inspection PDF (afinspectorgeneral.af.mil) was not opened; only the af.mil summary
  article was read.
- 'Xiaolang Zhang guilty plea: no DOJ plea or sentencing release was opened; the plea rests on Fortune''s
  report of court documents (23 Aug 2022).'
- CERT Common Sense Guide to Mitigating Insider Threats (7th ed.) and the CISA Insider Threat Mitigation
  Guide PDF were not opened.
- UK NPSA / CPNI insider-risk guidance and Five Eyes 'Think Before You Link' material were not reached
  (non-US coverage gap).
- The PERSEREC finding that about one-fourth of spies had a personal crisis beforehand (ES-040) is paraphrased
  from WebFetch output and not quoted exactly.
- 'FBI Insider Threat brochure (https://www.fbi.gov/file-repository/insider_threat_brochure.pdf): fetch
  returned a generic FBI page, not the brochure.'
- 18 U.S.C. Chapter 115 index page not fetched separately; sections 2381 and 2382 and Article III were
  read instead. Sections 2383 to 2390 (rebellion, seditious conspiracy and others) not reviewed.
- 'NSPM-33 implementation guidance (whitehouse.gov PDF): fetch error.'
- 'UK NPSA Trusted Research guidance for academia: fetch error; the overview page has no indicators.'
- 'MI5 Director General threat-update speeches: fetch errors.'
- 'UK National Security Act 2023 factsheets on gov.uk: fetch error.'
- 'US NCSC talent-recruitment fact sheet: URL guessed, fetch error.'
- 'DOJ Oath Keepers seditious conspiracy release: fetch error.'
- 'Web search budget ran out partway through, so no further European sabotage cases were sourced: German,
  Polish and Lithuanian arson and sabotage prosecutions, and a final outcome for the Paris Shoah Memorial
  case.'
- 'Wimbledon stabbing of Pouria Zeraati: the Home Office pack mentions it, but no court outcome was verified,
  so it was left out.'
- 'Shahsavani and Farasati (charged under NSA s.3(2), Iran): charge only and the CPS warns against comment,
  so they were left out of the cases.'
- 'Hall KC report: the extracts read gave no Telegram, crypto or 2024-arrest detail; a full read of the
  case chapter may hold more.'
