key: ES
name: Espionage and insider threat
scope: 'Espionage and insider threat (national security). CDSE Insider Threat Potential Risk Indicators
  in 9 categories: Access Attributes; Professional Lifecycle and Performance; Foreign Considerations (foreign
  passport, frequent unofficial foreign travel); Security and Compliance Incidents; Technical Activity
  (unapproved USB device, transferring data to a personal or suspicious account); Criminal, Violent or
  Abusive Conduct; Financial Considerations (delinquent debt, unexplained affluence); Substance Abuse
  and Addictive Behaviours; Judgement, Character and Psychological Conditions.'
indicators:
- id: ES-001
  name: Unauthorized contact with a foreign intelligence officer or agent
  definition: The person meets or talks with someone known or believed to work for a foreign intelligence
    service, without authorization or official reason.
  areas:
  - ES
  typology: Foreign considerations
  status: verified
  sources:
  - title: Insider Threat - Potential Risk Indicators (PRI) job aid
    publisher: Center for Development of Security Excellence (CDSE), DCSA
    url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
    locator: Foreign Considerations
    quote: Unauthorized contact with an officer or agent of a foreign intelligence entity (FIE)
    quote_verified: true
    checked: '2026-10-09'
  - title: DoD Directive 5240.06, Counterintelligence Awareness and Reporting
    publisher: US Department of Defense
    year: 2011 (Change 2, 2017)
    url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/524006p.pdf
    locator: Enclosure 4, Table 1, item 2
    quote: Contact with an individual who is known or suspected of being associated with a foreign intelligence
    quote_verified: true
    checked: '2026-10-09'
  - title: 32 CFR 147.4 Guideline B - Foreign influence
    publisher: US Code of Federal Regulations (via Cornell LII)
    url: https://www.law.cornell.edu/cfr/text/32/147.4
    locator: 147.4(b)
    quote: Unauthorized association with a suspected or known collaborator or employee of a foreign intelligence
      service;
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Kevin Mallory travelled to Shanghai in 2017 to meet a man he assessed to be a Chinese intelligence
    officer (DOJ, 2019).
  cases:
  - name: United States v. Kevin Patrick Mallory
    year: 2018 (conviction), 2019 (sentence)
    jurisdiction: US, Eastern District of Virginia
    what_happened: Former CIA officer travelled to Shanghai to meet a man he assessed to be a Chinese
      intelligence officer, received a covert communications device, and scanned Secret and Top Secret
      documents onto a micro SD card. Jury convicted him of conspiracy to deliver national defense information;
      sentenced to 20 years.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/former-cia-officer-sentenced-prison-espionage
    source_title: Former CIA Officer Sentenced to Prison for Espionage
  data_needed:
  - Person
  - UnknownLink
  - Associate
  - Event
  - Message
  - Email
  checkable: person
  lookup_sources:
  - court records and indictments
  - official inquiry reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The person did not know the contact was an intelligence officer (approaches are often disguised as
    business, academic or social contacts).
  - Contact was authorised or part of official duties and reported.
  - Diplomats and liaison officers are legitimately met in many jobs.
  jurisdictions: United States (DoD and cleared industry); concept applies to any state
  version: 1
- id: ES-002
  name: Failure to report required foreign contacts or associations
  definition: The person has contact with foreign nationals or foreign officials that their rules require
    them to report, and does not report it.
  areas:
  - ES
  typology: Foreign considerations / security compliance
  status: verified
  sources:
  - title: 32 CFR 147.4 Guideline B - Foreign influence
    publisher: US Code of Federal Regulations (via Cornell LII)
    url: https://www.law.cornell.edu/cfr/text/32/147.4
    locator: 147.4(b)
    quote: Failing to report, where required, associations with foreign nationals;
    quote_verified: true
    checked: '2026-10-09'
  - title: Insider Threat - Potential Risk Indicators (PRI) job aid
    publisher: CDSE
    url: https://www.information.marines.mil/Portals/224/Docs/BTAC/CDSE_insider_threat_indicators_job_aid.pdf
    locator: Security and Compliance Incidents
    quote: Failure to self-report required information associated with holding a security clearance
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Ames met Soviet officials and the required contact reports were never filed; neither CIA nor FBI followed
    up (Senate Intelligence Committee, 1994).
  cases:
  - name: Aldrich Ames
    year: '1994'
    jurisdiction: US
    what_happened: The Senate Select Committee on Intelligence found that reports of Ames's meetings with
      Soviet officials were never filed and not followed up. Ames and his wife pleaded guilty to espionage-related
      charges on 28 April 1994.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://irp.fas.org/congress/1994_rpt/ssci_ames.htm
    source_title: An Assessment of the Aldrich H. Ames Espionage Case and Its Implications for U.S. Intelligence
      (SSCI, 1994)
  data_needed:
  - Person
  - Associate
  - UnknownLink
  - Event
  - Document
  checkable: records
  lookup_sources:
  - agency personnel security files (rarely public)
  - court records
  - official inquiry reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The person did not know the reporting rule applied to that contact.
  - Administrative delay in filing paperwork.
  - The contact was trivial or incidental.
  jurisdictions: United States (cleared personnel)
  version: 1
