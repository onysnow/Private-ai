  status: verified
  sources:
  - title: Examples of Fraud Risk Factors (Appendix 2, ASA 240)
    publisher: AUASB
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Attitudes/Rationalisations
    quote: Recurring attempts by management to justify marginal or inappropriate accounting on the basis
      of materiality.
    quote_verified: true
    checked: '2026-10-09'
  - title: SEC press release 2020-226
    publisher: US Securities and Exchange Commission
    year: '2020'
    url: https://www.sec.gov/news/press-release/2020-226
    locator: Fulton Financial findings
    quote: created the misleading appearance of consistent earnings across multiple reporting periods
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Staff Accounting Bulletin No. 99: Materiality'
    publisher: US Securities and Exchange Commission
    year: '1999'
    url: https://www.sec.gov/interps/account/sab99.htm
    locator: Topic 1.M, section 1 'Assessing Materiality'
    quote: One rule of thumb in particular suggests that the misstatement or omission of an item that
      falls under a 5% threshold is not material in the absence of particularly egregious circumstances
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-10'
  examples:
  - EPS beats consensus by exactly one cent repeatedly
  cases:
  - name: Fulton Financial Corporation
    year: '2020'
    jurisdiction: United States (SEC)
    what_happened: SEC found a mortgage-servicing-rights valuation allowance inconsistent with its stated
      method, later reversed, raising EPS by a penny in a quarter it would otherwise have missed; $1.5
      million penalty, neither admitting nor denying.
    outcome: settled
    outcome_verified: true
    source_url: https://www.sec.gov/news/press-release/2020-226
    source_title: SEC press release 2020-226
  data_needed:
  - Company (EPS by quarter, analyst consensus; not FTM properties)
  - Document
  checkable: lookups
  lookup_sources:
  - Analyst consensus history
  - Quarterly filings
  levels:
    faint: Management calls a questionable item immaterial because it is below 5% of the relevant figure
    strong: An adjustment below 5% that lets the company meet analysts' consensus expectations or turns
      a loss into income, which SEC staff say can still be material
    textbook: 'Meets the published definition as worded: recurring attempts to justify marginal or inappropriate
      accounting on the basis of materiality'
    threshold_source: https://www.sec.gov/interps/account/sab99.htm
    threshold_note: US SEC Staff Accounting Bulletin 99. SEC staff describe 5% as a rule of thumb for
      a preliminary assumption only, and warn that 'there are numerous circumstances in which misstatements
      below 5% could well be material', including hiding a failure to meet analysts' consensus expectations
      or changing a loss into income. The 5% therefore marks the line management tends to hide behind;
      it is not a safe harbour.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Materiality judgements are a normal and required part of accounting
  version: 3
