      estimates keep changing without changed circumstances'
    threshold_source: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
    threshold_note: Peer-reviewed benchmark for share of soft assets (Dechow et al. 2011, US public companies).
      These are group averages, not a regulatory threshold. The quote reports table values, not a sentence,
      because the copyright notice prevented getting the exact table text. The medians are 0.696 vs 0.616.
      No published number was found for how often estimates change (AUASB gives none).
