      requirements.
    quote_verified: true
    checked: '2026-10-09'
  - title: Examples of Fraud Risk Factors (Appendix 2, ASA 240)
    publisher: AUASB
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Incentives/Pressures
    quote: Need to obtain additional debt or equity financing, or qualify for government assistance or...
    quote_verified: true
    checked: '2026-10-09'
  - title: Predicting Material Accounting Misstatements (Dechow et al. 2011)
    publisher: Contemporary Accounting Research
    year: '2011'
    url: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
    locator: 'Findings: financing'
    quote: we find that misstating firms are actively raising financing in misstating years
    quote_verified: true
    checked: '2026-10-09'
  - title: Nasdaq Rule 5550 (Continued Listing Requirements, Capital Market); with Rule 5810(c)(3)(A)
    publisher: The Nasdaq Stock Market LLC
    year: '2026'
    url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    locator: Rule 5550(a)(2); deficiency period in Rule 5810(c)(3)(A) at https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5800-series
    quote: (2) Minimum bid price of at least $1 per share;
    quote_verified: true
    licence: Not stated
    checked: '2026-10-10'
  examples:
  - Results improve just before a bond or share issue
  - Covenant ratios sit just above the limit
  cases: []
  data_needed:
  - Company
  - Debt
  - Security
  checkable: lookups
  lookup_sources:
  - Loan agreements and covenant disclosures in filings
  - Stock exchange notices
  levels:
    faint: Share price trading below the $1 minimum bid price
    strong: Bid price below $1 for 30 consecutive business days (the point at which Nasdaq says a deficiency
      exists)
    textbook: 'Meets the published definition as worded: marginal ability to meet listing or debt-covenant
      requirements, or a need for new debt or equity financing'
    threshold_source: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    threshold_note: 'The number covers only the listing-requirement part (Nasdaq bid-price rule, US).
      Rule 5810(c)(3)(A): the deficiency exists ''if the deficiency continues for a period of 30 consecutive
      business days'', followed by a 180-calendar-day compliance period. The Nasdaq page notes that the
      SEC has stayed the approval order for a filing on this rule, so check the current status. No published
      number was found for how close to a loan-covenant breach counts as a warning sign. Dechow et al.
      (2011) say misstating firms are raising financing but give no figure in the text.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Growing companies raise money routinely
  - Many firms operate near covenant limits without misreporting
  version: 3
