key: AF
name: Corporate accounting fraud
scope: 'Corporate accounting and financial-statement fraud. Fraud risk factors from the auditing standard
  (ISA/ASA 240, ''Examples of Fraud Risk Factors''), grouped as incentives or pressures, opportunities,
  and attitudes or rationalisations. Fraudulent financial reporting: heavy pressure on management to meet
  investor or analyst profit expectations; significant related-party transactions outside the normal course
  of business; management with an unusually high tolerance for risk. Misappropriation of assets: employees
  with access to valuable assets who face personal financial obligations; weak segregation of duties or
  independent checks; tolerance of petty theft. A US equivalent is PCAOB AU 316.85.'
indicators:
- id: AF-001
  name: Company's financial stability or profitability under threat
  definition: The company is losing money, burning cash, losing customers or facing strong outside shocks,
    which gives managers a reason to dress up the numbers.
  areas:
  - AF
  typology: 'Fraudulent financial reporting: incentive or pressure'
  status: verified
  sources:
  - title: Examples of Fraud Risk Factors (Appendix 2 to the fraud auditing standard, ASA 240)
    publisher: Auditing and Assurance Standards Board (AUASB)
    year: ''
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Fraudulent financial reporting, Incentives/Pressures, first bullet group
    quote: Operating losses making the threat of bankruptcy, foreclosure, or hostile takeover imminent.
    quote_verified: true
    checked: '2026-10-09'
  - title: Examples of Fraud Risk Factors (Appendix 2, ASA 240)
    publisher: AUASB
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Incentives/Pressures
    quote: High degree of competition or market saturation, accompanied by declining margins.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Recurring negative operating cash flow while reported earnings grow
  - Declining margins in a saturated market
  - Pandemic, war or sanctions disrupting the business (listed in the same group)
  cases: []
  data_needed:
  - 'Company (financial statement figures, not an FTM schema: revenue, margin, operating cash flow)'
  - Debt
  - Sanction (where sanctions affect the jurisdiction)
  checkable: lookups
  lookup_sources:
  - Company annual reports and filings (e.g. SEC EDGAR, Companies House)
  - Industry data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Whole industry in a downturn
  - Normal losses of a start-up or turnaround
  - Honest companies under pressure far outnumber those that commit fraud
  jurisdictions: Auditing standard used in Australia; mirrors the international standard ISA 240 and US
    AS 2401
  version: 1
- id: AF-002
  name: Rapid growth or unusual profitability compared with peers
  definition: The company grows or earns far faster than similar companies, which can mean the numbers
    are inflated.
  areas:
  - AF
  typology: 'Fraudulent financial reporting: incentive or pressure'
  status: verified
  sources:
  - title: Examples of Fraud Risk Factors (Appendix 2, ASA 240)
    publisher: AUASB
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Incentives/Pressures
    quote: Rapid growth or unusual profitability especially compared to that of other companies in the
      same industry.
    quote_verified: true
    checked: '2026-10-09'
  - title: Predicting Material Accounting Misstatements (Dechow, Ge, Larson and Sloan, Contemporary Accounting
      Research 2011)
    publisher: Contemporary Accounting Research (copy hosted by the Center for Audit Quality)
    year: '2011'
    url: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
    locator: Findings on cash sales
    quote: we find that cash sales are increasing during misstatement periods
    quote_verified: true
    checked: '2026-10-09'
  - title: Predicting Material Accounting Misstatements (Dechow, Ge, Larson, Sloan)
    publisher: Contemporary Accounting Research (Canadian Academic Accounting Association); copy hosted
      by the Center for Audit Quality
    year: '2011'
    url: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
    locator: 'Table 4, p. 44; text p. 43: ''cash sales significantly increase (rather than decline) during
      misstatement years.'''
    quote: 'Table 4 row: "Change in cash sales 263 0.466 0.233 263 0.257 0.165 ) 0.209 0.001 3.88" (columns:
      Misstatement years N, Mean, Median; Nonmisstatement years N, Mean, Median; pred sign; diff in mean;
      p-value; t-stat). Text p. 43: "Contrary to our expectations, cash sales significantly increase (rather
      than decline) during misstatement years."'
    quote_verified: true
    licence: Copyright CAAA; further reproduction not permitted
    checked: '2026-10-10'
  examples:
  - Luckin Coffee reported fast sales growth later found by the SEC (in a settled complaint) to include
    more than $300 million of fabricated sales
  cases:
  - name: Luckin Coffee Inc.
    year: '2020'
    jurisdiction: United States (SEC)
    what_happened: The SEC alleged Luckin intentionally fabricated more than $300 million in retail sales
      between about April 2019 and January 2020, using related parties to create false sales. Luckin agreed
      to pay a $180 million penalty without admitting or denying the allegations.
    outcome: settled
    outcome_verified: true
    source_url: https://www.sec.gov/news/press-release/2020-319
    source_title: SEC press release 2020-319
  data_needed:
  - Company (revenue and profit figures by period; not FTM properties)
  - Company peers in the same industry
  checkable: lookups
  lookup_sources:
  - Company filings
  - Industry peer filings or databases
  levels:
    faint: Cash sales growing faster than the 0.257 (25.7%) average change seen in non-misstatement years
      in the study
    strong: Cash sales growth at or above the 0.466 (46.6%) average change seen in misstatement years
      in the study
    textbook: 'Meets the published definition as worded: rapid growth or unusual profitability compared
      with others in the same industry (no published cut-off)'
    threshold_source: https://www.thecaq.org/wp-content/uploads/2018/03/Dechow-et-al-2011-Contemporary_Accounting_Research.pdf
    threshold_note: Peer-reviewed benchmark for growth in cash sales (Dechow et al. 2011, US public companies
      with SEC enforcement-identified misstatements, 1982-2005). These are group averages, not a regulatory
      threshold. The figures come from a table, so the quote below reports the table values rather than
      a sentence; the article's copyright notice prevented getting the exact table text. The AUASB auditing
      standard gives no number. Beneish (1999) M-score sales growth index figures were not used because
      the full paper is paywalled and could not be opened.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - A genuinely better product or new market
  - Acquisitions
  - Early-stage companies grow fast from a small base
  version: 3
