  - name: Interface Inc.; Patrick C. Lynch; Gregory J. Bauer
    year: '2020'
    jurisdiction: United States (SEC)
    what_happened: 'The SEC found Interface made unsupported manual accounting adjustments in 2015 and
      2016, often when internal forecasts suggested it would miss analyst EPS estimates. Penalties: company
      $5 million, former CFO $70,000, former controller $45,000; neither admitted nor denied.'
    outcome: settled
    outcome_verified: true
    source_url: https://www.sec.gov/news/press-release/2020-226
    source_title: SEC press release 2020-226
  - name: Under Armour, Inc.
    year: '2021'
    jurisdiction: United States (SEC)
    what_happened: The SEC found Under Armour pulled forward $408 million in existing orders over six
      quarters to meet analysts' revenue estimates without disclosing this. It agreed to pay $9 million
      without admitting or denying the findings.
    outcome: settled
    outcome_verified: true
    source_url: https://www.sec.gov/news/press-release/2021-78
    source_title: SEC press release 2021-78
  data_needed:
  - Company (reported earnings per share; analyst consensus — outside FTM)
  - Document (earnings calls, guidance)
  checkable: lookups
  lookup_sources:
  - Analyst consensus data
  - Company filings and earnings call transcripts
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Target pressure exists at almost every listed company
  - Consistently meeting guidance can reflect conservative guidance
