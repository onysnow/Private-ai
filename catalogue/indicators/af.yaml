- id: AF-005
  name: Need for new financing or close to breaching loan or listing terms
  definition: The company needs new loans or share issues, or is close to breaking loan covenants or stock-exchange
    listing rules, giving a reason to make results look better.
  areas:
  - AF
  typology: 'Fraudulent financial reporting: incentive or pressure'
  status: verified
  sources:
  - title: Examples of Fraud Risk Factors (Appendix 2, ASA 240)
    publisher: AUASB
    url: https://standards.auasb.gov.au/node/2056
    locator: Appendix 2, Incentives/Pressures
