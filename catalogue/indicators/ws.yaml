key: WS
name: Workplace, industrial and transport safety
scope: Corporate and negligent manslaughter, workplace deaths, repeat safety violators, chemical explosions,
  building and fire-safety failures, and 'chameleon' trucking and bus carriers.
indicators:
- id: WS-001
  name: Employer meets OSHA severe-violator criteria (fatality or catastrophe)
  definition: An OSHA inspection tied to a worker death or to three or more people hospitalised finds
    at least one willful or repeated violation or a failure-to-abate notice.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: Severe Violator Enforcement Program (SVEP)
    publisher: OSHA
    year: '2022'
    url: https://www.osha.gov/enforcement/svep
    locator: 'SVEP criteria: Fatality/Catastrophe (instruction CPL 02-00-169, 15 Sept 2022)'
    quote: at least one willful or repeated violation or issues a failure-to-abate notice
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - An OSHA inspection after a fatal fall results in a willful citation for missing fall protection and
    the employer is placed in SVEP.
  cases: []
  data_needed:
  - Company
  - Event
  - CourtCase
  - Sanction
  - Document
  - Address
  checkable: lookups
  lookup_sources:
  - OSHA establishment search / inspection data (osha.gov)
  - OSHA SVEP log (public log temporarily removed per OSHA page)
  - State Plan OSHA inspection records
  levels:
    faint: Any willful, repeat or failure-to-abate citation at the employer
    strong: Such a citation in an inspection tied to a death or hospitalisation
    textbook: At least one willful/repeated violation or failure-to-abate notice in an inspection tied
      to a fatality or three or more hospitalisations (SVEP criterion)
    threshold_source: https://www.osha.gov/enforcement/svep
  threshold_verified: true
  cross_hints:
  - target_area: LE
    reason: A willful violation that caused a death can be prosecuted criminally under 29 U.S.C. 666(e).
    source_url: https://www.law.cornell.edu/uscode/text/29/666
  innocent_explanations:
  - Citations can be contested, reduced or vacated; check the final order
  - A willful classification may be downgraded in settlement
  - Large multi-site employers accumulate citations in proportion to size
  - A death can occur despite a generally good programme
  jurisdictions: US (federal OSHA; State Plans via referral)
  version: 1
- id: WS-002
  name: Multiple high-gravity willful, repeat or failure-to-abate violations without a death
  definition: An inspection finds two or more willful or repeated high-gravity serious violations or failure-to-abate
    notices even though no one died.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: Severe Violator Enforcement Program (SVEP)
    publisher: OSHA
    year: '2022'
    url: https://www.osha.gov/enforcement/svep
    locator: 'SVEP criteria: Non-Fatality/Catastrophe'
    quote: at least two willful or repeated violations or issues failure-to-abate notices
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A plant is cited twice as a repeat violator for unguarded machinery rated high gravity.
  cases: []
  data_needed:
  - Company
  - Sanction
  - Document
  - Event
  checkable: lookups
  lookup_sources:
  - OSHA inspection data
  - State Plan enforcement records
  levels:
    faint: One willful or repeat high-gravity citation
    strong: Two such citations in different inspections
    textbook: Two or more willful/repeated high-gravity serious violations or failure-to-abate notices
      in one inspection (SVEP non-fatality criterion; low and moderate gravity do not count)
    threshold_source: https://www.osha.gov/enforcement/svep
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Citations may be under contest and not final
  - Gravity ratings are inspector judgements and may change on settlement
  - Acquired sites may carry hazards from previous owners
  jurisdictions: US
  version: 1
- id: WS-003
  name: Egregious (per-instance) OSHA enforcement action
  definition: OSHA cites each instance of a violation separately, its most severe treatment, which automatically
    makes the case a severe-violator case.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: Severe Violator Enforcement Program (SVEP)
    publisher: OSHA
    year: '2022'
    url: https://www.osha.gov/enforcement/svep
    locator: 'SVEP criteria: Egregious'
    quote: All egregious (e.g., per-instance citations) enforcement actions shall be considered SVEP cases.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Separate willful citations for each worker exposed to the same hazard.
  cases: []
  data_needed:
  - Company
  - Sanction
  - Document
  checkable: lookups
  lookup_sources:
  - OSHA inspection data and news releases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Egregious citations may be reduced to single citations in settlement
  - Per-instance treatment reflects the number of exposed workers, which scales with workforce size
  jurisdictions: US
  version: 1
- id: WS-004
  name: Repeat citation for a substantially similar hazard
  definition: An employer is cited again for a hazard substantially similar to one in an earlier citation
    that has become final.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: 29 U.S.C. 666 - Civil and criminal penalties
    publisher: US Code via Legal Information Institute
    url: https://www.law.cornell.edu/uscode/text/29/666
    locator: Subsection (a), willful or repeated violations (statutory text; amounts since inflation-adjusted)
    quote: may be assessed a civil penalty of not more than $70,000 for each violation
    quote_verified: true
    checked: '2026-10-10'
  - title: OSHA and repeat violations
    publisher: National Safety Council
    url: https://www.nsc.org/safety-first/osha-and-repeat-violations
    locator: Article body
    quote: the original citation must be final; a citation under contest may not serve as the basis for
      a subsequent repeat citation.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A warehouse cited again for blocked exits two years after a final citation for the same issue.
  cases: []
  data_needed:
  - Company
  - Sanction
  - Document
  - Address
  checkable: lookups
  lookup_sources:
  - OSHA inspection data by establishment and parent company
  levels:
    faint: Same standard cited twice at the same employer
    strong: Repeat classification issued
    textbook: Repeat citation issued on a final earlier citation; OSHA's coverage window was expanded
      from three to five years (NSC); courts have held the lookback is not binding
    threshold_source: https://www.nsc.org/safety-first/osha-and-repeat-violations
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Different sites of a large company may be counted together
  - Hazard similarity is contested and sometimes overturned
  - Repeat findings may follow a change of ownership or contractor
  jurisdictions: US
  version: 1
- id: WS-005
  name: Hazards left unfixed after a citation or settlement (failure to abate)
  definition: The employer does not correct a cited hazard or keep a settlement promise, so the regulator
    issues failure-to-abate notices.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: US Department of Labor's OSHA issues record-breaking fines to BP
    publisher: US Department of Labor / OSHA
    year: '2009'
    url: https://www.dol.gov/newsroom/releases/osha/osha20091030
    locator: News release, 30 Oct 2009
    quote: 270 'notifications of failure to abate' with fines totaling $56.7 million
    quote_verified: true
    checked: '2026-10-10'
  - title: 29 U.S.C. 666 - Civil and criminal penalties
    publisher: US Code via Legal Information Institute
    url: https://www.law.cornell.edu/uscode/text/29/666
    locator: Subsection (d) failure to correct (as summarised on the LII page; statutory figure before
      inflation adjustment)
    quote: may be assessed a civil penalty of not more than $7,000 for each day during which such failure
      or violation continues.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - 'BP Texas City refinery: 270 failure-to-abate notifications four years after the 2005 explosion settlement.'
  cases:
  - name: 'BP Products North America, Texas City refinery: OSHA penalties'
    year: '2009'
    jurisdiction: US (Texas)
    what_happened: OSHA proposed $87,430,000 in penalties, including 270 failure-to-abate notifications
      ($56.7m) for not meeting the 2005 settlement and 439 new willful violations ($30.7m).
    outcome: fined_by_regulator
    outcome_verified: true
    source_url: https://www.dol.gov/newsroom/releases/osha/osha20091030
    source_title: OSHA news release 30 Oct 2009
  data_needed:
  - Company
  - Sanction
  - Document
  - Event
  - CourtCase
  checkable: records
  lookup_sources:
  - OSHA inspection data
  - Settlement agreements
  - OSHRC decisions
  levels:
    faint: Abatement certification late or missing
    strong: Failure-to-abate notice issued
    textbook: Failure-to-abate notice issued (also a SVEP trigger when tied to a fatality or catastrophe)
    threshold_source: https://www.osha.gov/enforcement/svep
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Abatement deadlines may be extended for engineering work
  - Contested citations do not start the correction clock until the final order
  - Paperwork lag rather than physical non-correction
  jurisdictions: US
  version: 1
- id: WS-006
  name: Willful safety violation that caused a worker's death
  definition: A death results from a safety rule the employer knowingly broke, the threshold for a federal
    criminal case under the OSH Act.
  areas:
  - WS
  typology: Negligent / corporate manslaughter
  status: verified
  sources:
  - title: 29 U.S.C. 666(e)
    publisher: US Code via Legal Information Institute
    url: https://www.law.cornell.edu/uscode/text/29/666
    locator: Subsection (e)
    quote: Any employer who willfully violates any standard, rule, or order promulgated pursuant to section
      655 of this title
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A company knowingly sends workers into an unprotected trench and one is killed.
  cases: []
  data_needed:
  - Company
  - Person
  - Event
  - CourtCase
  - Sanction
  - Employment
  checkable: records
  lookup_sources:
  - OSHA fatality inspection records
  - DOJ press releases
  - Court dockets (PACER)
  levels:
    faint: Fatality inspection with any willful citation
    strong: Willful citation directly tied to the cause of death
    textbook: Willful violation of a standard that caused an employee's death (29 U.S.C. 666(e)); first
      conviction up to $10,000 and six months
    threshold_source: https://www.law.cornell.edu/uscode/text/29/666
  threshold_verified: true
  cross_hints:
  - target_area: LE
    reason: Criminal prosecution route for workplace deaths.
    source_url: https://www.law.cornell.edu/uscode/text/29/666
  innocent_explanations:
  - Willful classification may be contested and dropped
  - Death may have had independent causes
  - Criminal referral is rare and requires proof of intent
  jurisdictions: US
  version: 1
- id: WS-007
  name: Mine shows a pattern of significant and substantial violations
  definition: A mine racks up many serious ('significant and substantial') citations and elevated enforcement
    orders, reaching MSHA's pattern-of-violations screen.
  areas:
  - WS
  typology: Repeat safety violator
  status: verified
  sources:
  - title: Pattern of Violations (POV)
    publisher: Mine Safety and Health Administration
    url: https://www.msha.gov/compliance-and-enforcement/pattern-violations-pov
    locator: Program description and screening criteria
    quote: recurring pattern of Significant and Substantial (S&S) violations
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A coal mine with more than 50 S&S citations in a year and an injury severity measure above the industry
    figure.
  cases:
  - name: Upper Big Branch mine (Performance Coal Co./Massey Energy)
    year: '2010'
    jurisdiction: US (West Virginia)
    what_happened: MSHA found that unlawful policies and practices of PCC/Massey were the root cause of
      the coal dust explosion that killed 29 miners, and issued 369 citations and orders, nine contributory
      violations designated flagrant.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.msha.gov/sites/default/files/Data_Reports/Fatals/Coal/Upper%20Big%20Branch/ExecutiveSummary.pdf
    source_title: MSHA Report of Investigation, Executive Summary
  data_needed:
  - Company
  - Organization
  - Address
  - Sanction
  - Event
  - Document
  checkable: lookups
  lookup_sources:
  - MSHA Mine Data Retrieval System
  - MSHA POV screening results
  levels:
    faint: S&S citations rising year on year
    strong: Meets some but not all POV screening criteria
    textbook: 'Set One: 50+ S&S citations/orders in 12 months, plus 8+ S&S per 100 inspection hours or
      25%+ high/reckless negligence, plus 0.5+ elevated orders per 100 inspection hours, plus injury severity
      above industry; or Set Two: 100+ S&S and 40+ elevated orders in 12 months'
    threshold_source: https://www.msha.gov/compliance-and-enforcement/pattern-violations-pov
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Large mines receive more inspection hours and so more citations
  - An approved Corrective Action Program can justify postponing a notice
  - Citations may be reduced on contest
  jurisdictions: US
  version: 1
- id: WS-008
  name: Slow correction of identified hazards
  definition: Hazards found in inspections stay open for days, weeks or longer, or interim fixes become
    permanent.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Hazard Prevention and Control, p. 12
    quote: Percentage of hazards abated on the same day, week, or month in which the hazard was identified.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Internal audit shows guardrail hazards open for months with only temporary tape.
  cases: []
  data_needed:
  - Document
  - Event
  - Company
  - Note
  checkable: records
  lookup_sources:
  - Internal inspection logs (via sources, litigation discovery or FOIA of regulator files)
  levels:
    faint: Hazards routinely open beyond the period they were found in
    strong: Interim controls in place long term
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Some fixes need capital work or parts with long lead times
  - Interim controls may be adequate while engineering work is planned
  jurisdictions: General (US guidance)
  version: 1
- id: WS-009
  name: Overdue corrective actions from inspections
  definition: A large share of action items raised by safety inspections are past their due date.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: 'Worked example: past-due action items, pp. 15-16 (wording as extracted)'
    quote: In this example, your leading indicator is the percentage of pastdue action items, and you
      set a goal of no more than 10%.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A corrective-action tracker with a third of items overdue.
  cases: []
  data_needed:
  - Document
  - Note
  - Company
  checkable: records
  lookup_sources:
  - Internal action trackers
  - Regulator inspection files
  levels:
    faint: Above 10% of inspection action items past due (OSHA worked-example goal)
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Backlogs after a large audit
  - Due dates set unrealistically short
  jurisdictions: General
  version: 1
- id: WS-010
  name: Required safety inspections or examinations missed or done poorly
  definition: Scheduled inspections or legally required examinations are not completed, skip areas, or
    do not lead to fixes.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Program Evaluation and Improvement, p. 13
    quote: Number of inspections completed to identify hazards or program weaknesses.
    quote_verified: true
    checked: '2026-10-10'
  - title: Upper Big Branch Report of Investigation, Executive Summary
    publisher: MSHA
    year: '2011'
    url: https://www.msha.gov/sites/default/files/Data_Reports/Fatals/Coal/Upper%20Big%20Branch/ExecutiveSummary.pdf
    locator: Executive Summary
    quote: PCC/Massey failed to perform required mine examinations adequately and remedy known hazards
      and violations of law
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Pre-shift examination records show areas never visited.
  cases:
  - name: Upper Big Branch mine
    year: '2010'
    jurisdiction: US (West Virginia)
    what_happened: MSHA found examiners failed to perform required examinations adequately and to remedy
      known hazards.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.msha.gov/sites/default/files/Data_Reports/Fatals/Coal/Upper%20Big%20Branch/ExecutiveSummary.pdf
    source_title: MSHA Report of Investigation, Executive Summary
  data_needed:
  - Document
  - Event
  - Company
  - Person
  checkable: records
  lookup_sources:
  - Examination books
  - Regulator citations for examination failures
  levels:
    faint: Some scheduled inspections missed
    strong: Citations for inadequate examinations
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Staff shortages or access problems
  - Records incomplete rather than inspections missed
  jurisdictions: General
  version: 1
- id: WS-011
  name: Slow start to incident investigations
  definition: Many hours or days pass after an incident before anyone begins investigating it.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Hazard Identification and Assessment, p. 12
    quote: Number of hours passed after an incident before an investigation is started.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Near-miss reports closed without any investigation recorded.
  cases: []
  data_needed:
  - Event
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Internal incident logs
  - Regulator files
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Minor incidents triaged for later review
  - Investigator availability after hours
  jurisdictions: General
  version: 1
- id: WS-012
  name: Management slow to acknowledge worker hazard reports
  definition: Workers' reports of hazards wait a long time before managers acknowledge or act on them.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Management Leadership, p. 11
    quote: Average time between worker report of a hazard or concern and management acknowledgement of
      the report.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Hazard reports sit unanswered for weeks.
  cases: []
  data_needed:
  - Document
  - Event
  - Employment
  - Note
  checkable: person
  lookup_sources:
  - Worker interviews
  - Internal reporting systems
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Reporting systems that do not record acknowledgements
  - Duplicate reports
  jurisdictions: General
  version: 1
- id: WS-013
  name: Workers intimidated from raising safety concerns; no complaints reach the regulator
  definition: Workers are told or shown that raising safety issues will cost them their jobs, and safety
    complaints to the regulator dry up.
  areas:
  - WS
  typology: Safety culture
  status: verified
  sources:
  - title: Upper Big Branch Report of Investigation, Executive Summary
    publisher: MSHA
    year: '2011'
    url: https://www.msha.gov/sites/default/files/Data_Reports/Fatals/Coal/Upper%20Big%20Branch/ExecutiveSummary.pdf
    locator: Executive Summary
    quote: Witness testimony revealed that miners were intimidated by UBB management and were told that
      raising safety concerns would jeopardize their jobs.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - No safety complaints from underground miners reached MSHA for about four years before the UBB explosion.
  cases: []
  data_needed:
  - Person
  - Employment
  - Document
  - Event
  - CourtCase
  checkable: person
  lookup_sources:
  - Worker interviews
  - Whistleblower retaliation complaints (OSHA/MSHA)
  - Regulator complaint counts
  levels:
    faint: Few or no complaints from a high-hazard workforce
    strong: Workers describe threats for raising concerns
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Low complaints can mean hazards are well managed
  - Workers may raise concerns internally through working channels
  jurisdictions: General
  version: 1
- id: WS-014
  name: Mandatory safety training not delivered on schedule
  definition: Workers or managers are not getting required safety training on time.
  areas:
  - WS
  typology: Weak safety management (leading indicators)
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Education and Training, pp. 12-13
    quote: Percentage of workers receiving mandatory training on schedule.
    quote_verified: true
