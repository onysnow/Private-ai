    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Training records show refresher courses lapsed for most staff.
  cases: []
  data_needed:
  - Document
  - Employment
  - Organization
  checkable: records
  lookup_sources:
  - Training records
  - Regulator citations for training
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - New starters not yet due
  - Records not digitised
  jurisdictions: General
  version: 1
- id: WS-015
  name: No oversight of contractors' safety; everyone assumes someone else is responsible
  definition: Contractors are not audited, contracts are loose, and each party assumes another is responsible
    for safety-critical matters.
  areas:
  - WS
  typology: Building and fire-safety failure
  status: verified
  sources:
  - title: Using Leading Indicators to Improve Safety and Health Outcomes (OSHA 3970)
    publisher: OSHA
    url: https://www.osha.gov/sites/default/files/OSHA_Leading_Indicators.pdf
    locator: Section 2.3, Communication and Coordination, pp. 13-14
    quote: Number of audits conducted to ensure contractors are following site safety and health policies
      to include in their own safety policies.
    quote_verified: true
    checked: '2026-10-10'
  - title: Grenfell Tower Inquiry Phase 2 Report, Volume 1
    publisher: Grenfell Tower Inquiry
    year: '2024'
    url: https://assets.publishing.service.gov.uk/media/66d817aa701781e1b341dbd3/CCS0923434692-004_GTI_Phase_2_Volume_1_BOOKMARKED.pdf
    locator: Para 2.74
    quote: Studio E, Rydon and Harley all took a casual approach to contractual relations.
    quote_verified: true
    checked: '2026-10-10'
  - title: Building a Safer Future (Hackitt Review final report)
    publisher: UK Government (MHCLG)
    year: '2018'
    url: https://assets.publishing.service.gov.uk/media/5afc50c840f0b622e4844ab4/Building_a_Safer_Future_-_web.pdf
    locator: Foreword, p. 5
    quote: Lack of clarity on roles and responsibilities – there is ambiguity over where responsibility
      lies
    quote_verified: true
