    quote_verified: true
    checked: '2026-10-10'
  examples:
  - GM failed to disclose the ignition-switch defect to NHTSA from spring 2012 through February 2014 (SDNY).
  cases:
  - name: General Motors ignition switch
    year: '2015'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: GM was charged with concealing material facts from a regulator and wire fraud over
