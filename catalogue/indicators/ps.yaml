key: PS
name: Unsafe products, food fraud and falsified medicines
scope: Hidden product defects and delayed recalls, vehicle and aviation defects, food adulteration and
  mislabelling, substandard and falsified medicines, and counterfeit alcohol and methanol poisoning.
indicators:
- id: PS-001
  name: Injury or incident reports held without telling the safety regulator
  definition: A company keeps receiving reports that its product hurt people (or nearly did) but does
    not report to the product safety regulator within the short legal window.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: '16 CFR Part 1115: Substantial Product Hazard Reports, §1115.14(e)'
    publisher: US Consumer Product Safety Commission (eCFR)
    year: current
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.14(e)
    quote: Immediately, that is, within 24 hours, after a subject firm has obtained information
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 1115, §1115.14(d)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.14(d)
    quote: This investigation and evaluation should not exceed 10 days
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 1115, §1115.12(f)(5)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f)(5)
    quote: Complaints from a consumer or consumer group.
    quote_verified: true
    checked: '2026-10-10'
  - title: Peloton Agrees to Pay $19 Million Civil Penalty for Failure to Immediately Report Tread+ Treadmill
      Entrapment Hazards
    publisher: US Consumer Product Safety Commission
    year: '2023'
    url: https://www.cpsc.gov/Newsroom/News-Releases/2023/Peloton-Agrees-to-Pay-19-Million-Civil-Penalty-for-Failure-to-Immediately-Report-Tread-Treadmill-Entrapment-Hazards-and-for-Distributing-Recalled-Treadmills
    quote: Despite possessing this information, Peloton did not immediately report to the Commission.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Peloton received Tread+ entrapment reports from December 2018 into 2019; by the time it reported there
    were more than 150 reports, including a child's death and 13 injuries (CPSC, 2023).
  cases:
  - name: Peloton Tread+ late reporting
    year: '2023'
    jurisdiction: United States
    what_happened: CPSC charged that Peloton knowingly failed to immediately report Tread+ entrapment
      hazards and distributed 38 recalled treadmills; Peloton agreed to a $19,065,000 civil penalty (provisionally
      accepted 4-0, subject to public comment).
    outcome: fined_by_regulator
    outcome_verified: true
    source_url: https://www.cpsc.gov/Newsroom/News-Releases/2023/Peloton-Agrees-to-Pay-19-Million-Civil-Penalty-for-Failure-to-Immediately-Report-Tread-Treadmill-Entrapment-Hazards-and-for-Distributing-Recalled-Treadmills
    source_title: Peloton Agrees to Pay $19 Million Civil Penalty
  data_needed:
  - Company
  - Document
  - Event
  - Note
  - CourtCase
  checkable: records
  lookup_sources:
  - SaferProducts.gov incident reports
  - CPSC recalls and civil penalty releases
  - Court dockets (product liability suits)
  levels:
    faint: Public complaints, lawsuits or news reports of injuries tied to a product with no recall or
      regulator notice on record.
    strong: Documents show the company received incident reports and the dates show a report to the regulator
      came weeks or months later.
    textbook: The firm held information reasonably supporting a substantial product hazard for more than
      24 hours (or investigated for more than 10 days without justification) before reporting under CPSA
      Section 15(b).
    threshold_source: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Early reports may describe misuse rather than a defect and need time to evaluate.
  - Firms may report in good faith once a pattern becomes clear; CPSC allows a longer investigation if
    the firm can show it is reasonable.
  - Duplicate or unverified complaints can inflate apparent counts.
  jurisdictions: United States (CPSC); comparable duties exist in the EU under general product safety
    rules
  version: 1
- id: PS-002
  name: Repeated death or serious-injury lawsuits over one product model
  definition: Several lawsuits over deaths or grievous injuries from the same product model end in settlements
    or plaintiff wins within a short period, which in the US triggers a duty to report to the regulator.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: 15 U.S. Code §2084 (CPSA Section 37)
    publisher: US Code via Cornell Legal Information Institute
    url: https://www.law.cornell.edu/uscode/text/15/2084
    locator: §2084(a)
    quote: the subject of at least 3 civil actions that have been filed in Federal or State court for
      death or grievous bodily injury
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 1115, §1115.12(f)(3)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f)(3)
    quote: Product liability suits and/or claims for personal injury or damage.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Three or more death/grievous injury suits on one model settled within the same 24-month window.
  cases: []
  data_needed:
  - Company
  - CourtCase
  - Event
  - Document
  checkable: records
  lookup_sources:
  - PACER and state court dockets
  - CourtListener
  - CPSC recall database
  levels:
    faint: Two or more injury suits naming the same product model in court dockets.
    strong: Several such suits settle confidentially within a short period with no recall or regulator
      report on record.
    textbook: At least 3 civil actions for death or grievous bodily injury over one model resolved by
      settlement or plaintiff judgment within a 24-month period (Section 37 reporting trigger).
    threshold_source: https://www.law.cornell.edu/uscode/text/15/2084
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - High-volume products attract more suits simply because more units are in use.
  - Settlements are often made to avoid litigation cost, not because a defect exists.
  - Suits may concern misuse or third-party modification.
  jurisdictions: United States
  version: 1
- id: PS-003
  name: Quiet safety-related design or production change
  definition: A maker changes a product's design or production for safety reasons, or cancels a planned
    safety change, without a recall or disclosure to the regulator.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: 16 CFR Part 1115, §1115.12(f)(2)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f)(2)
    quote: Information about safety-related production or design change(s).
    quote_verified: true
    checked: '2026-10-10'
  - title: Justice Department Announces Criminal Charge Against Toyota Motor Corporation and Deferred
      Prosecution Agreement
    publisher: US Department of Justice
    year: '2014'
    url: https://www.justice.gov/opa/pr/justice-department-announces-criminal-charge-against-toyota-motor-corporation-and-deferred
    quote: misled U.S. consumers by concealing and making deceptive statements about two safety issues
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Toyota cancelled planned pedal design changes and avoided documenting the cancellation to keep the
    sticky-pedal problem from NHTSA (DOJ, 2014).
  cases:
  - name: Toyota unintended acceleration disclosures
    year: '2014'
    jurisdiction: United States
    what_happened: Toyota admitted concealing and making deceptive statements about floor-mat entrapment
      and sticky pedals; charged with one count of wire fraud under a deferred prosecution agreement with
      a $1.2 billion financial penalty.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/justice-department-announces-criminal-charge-against-toyota-motor-corporation-and-deferred
    source_title: Justice Department Announces Criminal Charge Against Toyota Motor Corporation and Deferred
      Prosecution Agreement
  data_needed:
  - Company
  - Document
  - Event
  - Note
  checkable: records
  lookup_sources:
  - NHTSA manufacturer communications and recall files
  - Patent and parts catalogue changes
  - Court exhibits
  levels:
    faint: A running change in part numbers or specifications between production batches with no stated
      reason.
    strong: Internal or supplier documents link the change to field failures or injuries, and no recall
      followed.
    textbook: 'Meets the published definition as worded: a safety-related design or production change
      that was reportable information but not reported.'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Products are routinely improved for cost, durability or comfort, not safety.
  - Supplier changes or part obsolescence force design changes.
  - Firms may make precautionary improvements where no hazard exists.
  jurisdictions: United States; general concept applies elsewhere
  version: 1
- id: PS-004
  name: Recalled or acted on abroad, still sold at home
  definition: A product is recalled, withdrawn or found unsafe in one country while an identical or similar
    product stays on sale elsewhere without action.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: 49 CFR §579.11 Reporting of safety recalls and other safety campaigns in foreign countries
    publisher: US NHTSA (eCFR)
    url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-579/subpart-B/section-579.11
    locator: §579.11
    quote: Not later than 5 working days after a manufacturer determines to conduct a safety recall or
      other safety campaign
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 1115, §1115.12(f)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f) introductory text
    quote: about product use, experience, performance, design, or manufacture outside the United States
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A vehicle campaign run in one country for a part also fitted to US-market vehicles; an EU Safety Gate
    alert for a product still sold on another market.
  cases: []
  data_needed:
  - Company
  - Event
  - Document
  - Address
  checkable: lookups
  lookup_sources:
  - NHTSA recalls database
  - EU Safety Gate alerts
  - OECD GlobalRecalls portal
  - National recall sites
  levels:
    faint: A foreign recall notice names a product that looks like one sold in your market.
    strong: Part numbers or model codes match and no domestic recall or foreign-recall report is on file.
    textbook: A vehicle maker did not report a foreign recall of an identical or substantially similar
      vehicle/equipment to NHTSA within 5 working days of deciding to conduct it.
    threshold_source: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-579/subpart-B/section-579.11
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Products sold under the same name can differ by market (different parts, voltages, standards).
  - Hazards can depend on climate or local use conditions.
  - Different regulators reach different risk conclusions.
  jurisdictions: US (NHTSA, CPSC); EU (Safety Gate); international
  version: 1
- id: PS-005
  name: Recalled products still being sold or distributed
  definition: Products already under a recall or corrective action keep being sold, delivered or imported.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: 15 U.S. Code §2068(a)(2)(B)
    publisher: US Code via Cornell Legal Information Institute
    url: https://www.law.cornell.edu/uscode/text/15/2068
    locator: §2068(a)(2)(B)
    quote: subject to voluntary corrective action taken by the manufacturer
    quote_verified: true
    checked: '2026-10-10'
  - title: Peloton Agrees to Pay $19 Million Civil Penalty
    publisher: US Consumer Product Safety Commission
    year: '2023'
    url: https://www.cpsc.gov/Newsroom/News-Releases/2023/Peloton-Agrees-to-Pay-19-Million-Civil-Penalty-for-Failure-to-Immediately-Report-Tread-Treadmill-Entrapment-Hazards-and-for-Distributing-Recalled-Treadmills
    quote: Peloton knowingly distributed in commerce 38 Tread+ recalled treadmills.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Recalled treadmills delivered after the recall announcement (Peloton, 2023).
  cases:
  - name: Peloton Tread+ recalled units
    year: '2023'
    jurisdiction: United States
    what_happened: CPSC charged that 38 recalled Tread+ treadmills were distributed after the May 2021
      recall; part of the $19,065,000 penalty settlement.
    outcome: fined_by_regulator
    outcome_verified: true
    source_url: https://www.cpsc.gov/Newsroom/News-Releases/2023/Peloton-Agrees-to-Pay-19-Million-Civil-Penalty-for-Failure-to-Immediately-Report-Tread-Treadmill-Entrapment-Hazards-and-for-Distributing-Recalled-Treadmills
    source_title: Peloton Agrees to Pay $19 Million Civil Penalty
  data_needed:
  - Company
  - Event
  - Document
  - Payment
  checkable: lookups
  lookup_sources:
  - CPSC recalls
  - EU Safety Gate
  - Marketplace listings
  levels:
    faint: A recalled model appears in online listings or second-hand marketplaces.
    strong: The original maker or a major retailer is still selling or shipping recalled units.
    textbook: 'Meets the published definition as worded: selling, offering, distributing or importing
      a product subject to an announced corrective action or order (15 USC 2068(a)(2)).'
    threshold_source: https://www.cpsc.gov/Newsroom/News-Releases/2023/Peloton-Agrees-to-Pay-19-Million-Civil-Penalty-for-Failure-to-Immediately-Report-Tread-Treadmill-Entrapment-Hazards-and-for-Distributing-Recalled-Treadmills
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Listings may be for repaired or remedied units, or a different model with a similar name.
  - Private resale by consumers unaware of a recall.
  - Stock already in transit when the recall was announced.
  jurisdictions: United States; EU equivalents under product safety law
  version: 1
- id: PS-006
  name: Safety test data manipulated or withheld from customers or regulators
  definition: A manufacturer or supplier gives buyers or regulators false, altered or incomplete safety
    test results.
  areas:
  - PS
  typology: Hidden product defects; fraud on customers
  status: verified
  sources:
  - title: Takata Corporation Pleads Guilty and Sentenced to Pay $1 Billion in Criminal Penalties for
      Airbag Scheme
    publisher: US Department of Justice
    year: '2017'
    url: https://www.justice.gov/opa/pr/takata-corporation-pleads-guilty-sentenced-pay-1-billion-criminal-penalties-airbag-scheme
    quote: providing false and manipulated airbag inflator test data
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 1115, §1115.12(f)(1) and (4)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f)(4)
    quote: Information from an independent testing laboratory.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Takata provided false and manipulated inflator test data from 2000 to 2015 (DOJ, 2017).
  cases:
  - name: Takata airbag inflator test data
    year: '2017'
    jurisdiction: United States (E.D. Michigan)
    what_happened: Takata pleaded guilty to one count of wire fraud for a scheme of providing false and
      manipulated airbag inflator test data and was sentenced to a $1 billion criminal penalty.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/takata-corporation-pleads-guilty-sentenced-pay-1-billion-criminal-penalties-airbag-scheme
    source_title: Takata Corporation Pleads Guilty and Sentenced to Pay $1 Billion
  data_needed:
  - Company
  - Document
  - Contract
  - CourtCase
  - Person
  checkable: records
  lookup_sources:
  - Court records and plea agreements
  - NHTSA investigation files
  - Supplier contracts
  levels:
    faint: Test reports that are unusually uniform, missing raw data, or not independently verified.
    strong: Whistleblower or internal documents show test results were changed or failures left out of
      reports to customers.
    textbook: 'Meets the published definition as worded: false or manipulated safety test data provided
      to customers or regulators.'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Retests after a lab error are legitimate if documented.
  - Different test methods can give different but honest results.
  - Clerical errors in reports.
  jurisdictions: United States and global supply chains
  version: 1
- id: PS-007
  name: Returns, replacement requests or warranty claims cluster on one part
  definition: Business customers, dealers or consumers send back or claim on the same part or product
    far more than usual.
  areas:
  - PS
  typology: Hidden product defects and delayed recalls
  status: verified
  sources:
  - title: 16 CFR Part 1115, §1115.12(f)(7)
    publisher: US Consumer Product Safety Commission (eCFR)
    url: https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1115
    locator: §1115.12(f)(7)
    quote: Information received from other firms, including requests to return a product or for replacement
      or credit.
    quote_verified: true
    checked: '2026-10-10'
  - title: 49 CFR Part 579 (Early warning reporting)
    publisher: US NHTSA (eCFR)
    url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-579
    locator: §579.2
    quote: The purpose of this part is to enhance motor vehicle safety by specifying information and documents
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Warranty claims and field reports on a vehicle component reported quarterly to NHTSA under Early Warning
    Reporting.
  cases: []
  data_needed:
  - Company
  - Document
  - Event
  - Payment
  checkable: records
  lookup_sources:
  - NHTSA EWR public data
  - NHTSA manufacturer communications (technical service bulletins)
  levels:
    faint: Dealer forums or service bulletins mention repeated replacements of one part.
    strong: Warranty or return data show a sharp rise for one part, with injury or fire claims.
    textbook: 'Meets the published definition as worded: returns or replacement requests that are reportable
      information about a potential hazard.'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Non-safety quality faults (noise, cosmetic wear) drive many warranty claims.
  - Generous goodwill policies raise claim counts.
  - A bad batch from a supplier may be fixed without any safety risk.
  jurisdictions: United States (NHTSA EWR, CPSC)
  version: 1
- id: PS-008
  name: Cluster of similar public complaints about the same vehicle or product
  definition: Many owners independently report the same failure to a regulator's public complaint database.
  areas:
  - PS
  typology: Vehicle and product defects
  status: verified
  sources:
  - title: Recalls, investigations and complaints
    publisher: US NHTSA
    url: https://www.nhtsa.gov/recalls
    quote: If the agency receives similar reports from a number of people about the same product
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Owners of one model year report sudden loss of power or airbag non-deployment to NHTSA.
  cases: []
  data_needed:
  - Company
  - Vehicle
  - Event
  - Document
  checkable: lookups
  lookup_sources:
  - NHTSA complaints database and API
  - SaferProducts.gov
  levels:
    faint: A handful of similar complaints on one model in NHTSA or SaferProducts data.
    strong: Complaints grow over time, involve crashes, injuries or fires, and no investigation or recall
      exists.
    textbook: 'Meets the published definition as worded: similar reports from a number of people about
      the same product indicating a possible safety defect.'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Media coverage can prompt a burst of complaints.
  - Complaints are unverified and may describe driver error.
  - Popular models get more complaints simply from volume.
  jurisdictions: United States
  version: 1
- id: PS-009
