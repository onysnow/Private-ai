not_reached:
- The EU Safety Gate web report page (ec.europa.eu/safety-gate-alerts/screen/webReport) returned only
  a title; the 2024 statistics come from the Spanish Ministry of Consumer Affairs summary, not the Commission's
  own report.
- EU ACN monthly food fraud reports (food.ec.europa.eu/food-safety/acn/ffn-monthly_en) and the full 2023
  ACN annual report were not opened; only a Commission newsletter summary was read.
- 'Huisman and van Ruth (2022): the full list of about 50 SSAFE questions is not in the article; only
  indicator categories and examples were available.'
- The NIH/PMC article on the 2008 melamine incident was blocked by a browser check; WHO pages did not
  state why melamine was added or give prosecution outcomes in China, so no criminal outcome for that
  case is recorded.
- News24/Reuters article on Indonesian court papers was blocked by robots.txt; the Insurance Journal reprint
  was used. The August 2024 Indonesian civil ruling (tuoitre.vn) was not opened.
- The FDA BeSafeRx page failed to load; FDA's consumer update on buying medicines online was used instead.
- WHO 2014 Information Note on methanol poisoning outbreaks was not opened directly; it is cited via the
  UNDRR/ISC hazard profile.
- Primary court records for the Czech methanol verdicts, the Uzbek verdicts and the UK horsemeat conviction
  were not reached; trade press and public broadcaster reports describing the verdicts were used.
- No primary source reached for the second UK horsemeat defendants (Ulrik Nielsen, Alex Beech); not included.
- No published numeric thresholds found for food fraud or falsified-medicine warning signs beyond the
  FDA 0.10% DEG/EG limit and the methanol outbreak size range.
