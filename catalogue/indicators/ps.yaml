  - Company
  - Vehicle
  - Document
  - Event
  - CourtCase
  checkable: records
  lookup_sources:
  - NHTSA recall files (Part 573 reports and chronologies)
  - Court records
  levels:
    faint: The Part 573 chronology shows field reports years before the recall.
    strong: Internal documents show staff linked the failures to crashes or injuries well before the determination.
    textbook: The defect report was filed more than 5 working days after the maker determined the defect
      was safety-related.
    threshold_source: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-573/section-573.6
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Root-cause analysis of rare failures can genuinely take a long time.
  - Early reports may be ambiguous or attributed to other causes.
  - Supplier and maker may dispute the cause.
  jurisdictions: United States
