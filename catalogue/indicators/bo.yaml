  lookup_sources:
  - Company registries in each jurisdiction
  - OpenCorporates
  - Leak databases (e.g. ICIJ Offshore Leaks)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Splitting a structure across jurisdictions is the layering step of laundering; Lazarenko was
      convicted of money laundering.
    source_url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
  innocent_explanations:
  - Multinational groups operate in many countries for real business reasons.
