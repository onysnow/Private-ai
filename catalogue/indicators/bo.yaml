    quote_verified: true
    licence: Open Government Licence v3.0
    checked: '2026-10-09'
  examples:
  - Hilux Services LP and Polux Management LP shared the same two BVI corporate partners and an address
    with over 800 other SLPs (TI-UK p. 13).
  - All corporate partners of the 113 Laundromat SLPs with a known place of incorporation were in the
