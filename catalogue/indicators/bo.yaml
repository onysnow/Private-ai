key: BO
name: Hidden ownership and shell companies
scope: concealment of beneficial ownership, shell and front companies, nominees, formation agents, company
  factories, trusts. FATF/Egmont 2018 Annex E is the core list. The repo file docs/discovery/patterns.md
  already holds 22 indicators with sources; read it, keep what holds, add what is missing.
indicators:
- id: BO-001
  name: Circular ownership
  definition: A chain of ownership loops back so that a company ends up owning itself, letting a person
    with a tiny direct stake control it while staying under disclosure thresholds.
  areas:
  - BO
  typology: Ownership-chain manipulation
  status: verified
  sources:
  - title: 'More beneficial ownership loopholes to plug: circular ownership, fragmented control and companies
      as parties to the trust'
    publisher: Tax Justice Network (Andres Knobel)
    year: '2019'
    url: https://taxjustice.net/2019/09/06/more-beneficial-ownership-loopholes-to-plug-circular-ownership-control-with-little-ownership-and-companies-as-parties-to-the-trust/
    locator: Section 'Circular ownership'
    quote: However, she controls company A because there is no other owner. The rest is just a circular
      ownership structure (company C owns company B. Company B owns company A, and company A owns company
      C).
    quote_verified: true
    checked: '2026-10-08'
  - title: The Companies We Keep
    publisher: Global Witness
    year: '2018'
    url: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
    locator: Findings, point 4 'Circular control structures'
    quote: A circular control structure is a group of UK companies that file another UK company as their
      PSC, with the final company filing the first company in the group as its PSC.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Global Witness found 328 UK companies on the PSC register in circular control structures, although
    UK corporate law prohibits circular shareholding.
  cases: []
  data_needed:
  - Ownership (owner, asset, percentage, startDate, endDate)
  - Company (name, jurisdiction, registrationNumber)
  - Person
  checkable: records
  lookup_sources:
  - Company registry / beneficial ownership register (e.g. UK Companies House PSC data, Open Ownership
    BODS data)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Group cross-holdings or treasury shares in large corporate groups
  - Data entry errors in the register
  - Incomplete or out-of-date ownership records that make a chain look closed
  jurisdictions: Global; documented in UK PSC data
  version: 1
- id: BO-002
  name: Long or unnecessarily complex ownership chain
  definition: Several layers of companies, trusts or other vehicles sit between the real person and the
    asset or bank account, with no business reason for that complexity.
  areas:
  - BO
  typology: Layering of corporate vehicles
  status: verified
  sources:
  - title: 'Concealment of Beneficial Ownership, Annex E: Indicators of concealed beneficial ownership'
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 8, p. 184
    quote: Complex corporate structures that do not appear to legitimately require that level of complexity
      or which do not make commercial sense.
    quote_verified: true
    checked: '2026-10-08'
  - title: 'The Puppet Masters: How the Corrupt Use Legal Structures to Hide Stolen Assets and What to
      Do About It'
    publisher: World Bank / UNODC Stolen Asset Recovery Initiative (StAR)
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Box 3.13 'Developing a Nose for Inappropriate Complexity', p. 56
    quote: Whenever more than three layers of legal entities or arrangements separate the end-user natural
      persons (substantive beneficial owners) from the immediate ownership or control of a bank account,
      this test should trigger a particularly steep burden of proof on the part of the potential client
      to show the legitimacy and necessity of such a complex organization before the bank will consider
      beginning a relationship.
    quote_verified: true
    checked: '2026-10-08'
  - title: 'Exploring UK companies'' legal ownership chains to detect red flags and verify beneficial
      ownership information: Part 1'
    publisher: Tax Justice Network
    year: '2020'
    url: https://taxjustice.net/2020/07/06/exploring-uk-companies-legal-ownership-chains-to-detect-red-flags-and-verify-beneficial-ownership-information/
    locator: Summary paragraph
    quote: Only 5 per cent of UK terminal companies have more than 5 layers, and only 0.5 per cent have
      more than 10 layers.
    quote_verified: true
    checked: '2026-10-08'
  - title: Potential Money Laundering Risks Related to Shell Companies (FIN-2006-G014)
    publisher: FinCEN, US Treasury
    year: '2006'
    url: https://www.fincen.gov/sites/default/files/shared/AdvisoryOnShells_FINAL.pdf
    locator: p. 2
    quote: Layers of ownership can be devised which make it highly unlikely that relationships among various
      individuals and companies can be discerned, even if one or more of the owners is actually known
      or discovered.
    quote_verified: true
    licence: US government work
    checked: '2026-10-08'
  - title: Spotting red flags in beneficial ownership datasets
    publisher: Open Ownership
    year: '2024'
    url: https://www.openownership.org/en/blog/spotting-red-flags-in-beneficial-ownership-datasets/
    locator: List of questions
    quote: How many entities have complex ownership chains? (defined here as 5+ observable layers of ownership)
    quote_verified: true
    licence: CC BY 4.0
    checked: '2026-10-08'
  examples:
  - TJN found two UK companies with 23 layers of intermediary entities; in one, most layers reported their
    immediate corporate owner as beneficial owner.
  cases: []
  data_needed:
  - Ownership (owner, asset, percentage)
  - Company (jurisdiction)
  - LegalEntity
  - Person
  checkable: records
  lookup_sources:
  - Company registries in each jurisdiction of the chain
  - Commercial corporate databases (e.g. Orbis)
  - Open Ownership register
  levels:
    faint: More than 3 layers between the natural person and the account or asset (Puppet Masters 'three-layer
      test')
    strong: More than 5 layers (only about 5% of UK companies, per TJN 2020; Open Ownership's 'complex
      chain' definition)
    textbook: Meets the published definition as worded (complexity with no commercial sense, Annex E 8)
    threshold_source: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf ; https://taxjustice.net/2020/07/06/exploring-uk-companies-legal-ownership-chains-to-detect-red-flags-and-verify-beneficial-ownership-information/
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Listed multinationals and private-equity groups often have many layers for financing, tax and liability
    reasons
  - Joint ventures and acquisitions leave legacy holding companies
  - Regulatory ring-fencing (banks, insurers)
  jurisdictions: Global
  version: 1
- id: BO-003
  name: Entity or owner in a secrecy, low-tax or high-risk jurisdiction
  definition: A company, one of its owners, or a layer in its chain is formed in a jurisdiction known
    for secrecy, low tax, weak anti-money-laundering controls, or no central beneficial ownership register.
  areas:
  - BO
  typology: Offshore secrecy
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 4, pp. 182-183
    quote: are incorporated/formed in a jurisdiction that does not require companies to report beneficial
      owners to a central registry
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 4, p. 182
    quote: are incorporated/formed in a low-tax jurisdiction or international trade or finance centre
    quote_verified: true
    checked: '2026-10-08'
  - title: The Companies We Keep
    publisher: Global Witness
    year: '2018'
    url: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
    locator: Findings, point 2
    quote: In fact, nearly three-quarters (72%) of these foreign corporate PSCs are registered or have
      a correspondence address in a secrecy jurisdiction.
    quote_verified: true
    checked: '2026-10-08'
  - title: Using Beneficial Ownership Data for Systematic Risk Assessment in Public Procurement. The Example
      of 6 European Countries
    publisher: European Journal on Criminal Policy and Research (Tello Arista, Fazekas, Volkotrub)
    year: '2026'
    url: https://link.springer.com/article/10.1007/s10610-025-09654-9
    locator: Results (read through a summarising fetcher; verify wording)
    quote: foreign BOs are not associated with higher corruption risks in 4 out of 6 countries.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Global Witness limited 'secrecy jurisdiction' to those with a Financial Secrecy Index 2018 score over
    60.
  cases: []
  data_needed:
  - Company (jurisdiction, country)
  - Ownership
  - Person (nationality, country)
  - Address (country)
  checkable: lookups
  lookup_sources:
  - Tax Justice Network Financial Secrecy Index
  - FATF high-risk and monitored jurisdictions lists
  - EU list of non-cooperative tax jurisdictions
  - Company registry
  levels:
    faint: To be set by Ony
    strong: Global Witness used a Financial Secrecy Index secrecy score over 60 to define a secrecy jurisdiction
    textbook: Meets the published definition as worded
    threshold_source: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Common for legitimate cross-border investment funds, shipping, aircraft leasing and holding structures
  - Owner genuinely lives in that country
  - Peer-reviewed procurement study found foreign ownership alone was not linked to higher corruption
    risk in most countries tested; weight this flag down
  jurisdictions: Global
  version: 1
- id: BO-004
  name: 'Mass nominee: one person directs or owns very many companies'
  definition: The same director, shareholder or declared beneficial owner appears on a large number of
    unrelated companies, suggesting a professional nominee who lends a name rather than running anything.
  areas:
  - BO
  typology: Formal nominees
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 10, p. 184
    quote: formal nominees (formal nominees may be “mass” nominees who are nominated agents for a large
      number of shell companies)
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 4, p. 182
    quote: where the director, controlling shareholder(s) and/or beneficial owner(s) are listed against
      the accounts of other legal persons or arrangements, indicating the use of professional nominees
    quote_verified: true
    checked: '2026-10-08'
  - title: The Companies We Keep
    publisher: Global Witness
    year: '2018'
    url: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
    locator: Findings, point 3
    quote: Our analysis shows that over 9,000 companies are controlled by individuals who control more
      than 100 companies.
    quote_verified: true
    checked: '2026-10-08'
  - title: Using Beneficial Ownership Data for Systematic Risk Assessment in Public Procurement
    publisher: European Journal on Criminal Policy and Research (Tello Arista, Fazekas, Volkotrub)
    year: '2026'
    url: https://link.springer.com/article/10.1007/s10610-025-09654-9
    locator: Results, company frequency of BO (read through a summarising fetcher; verify wording)
    quote: This is exactly the relationship we find in all countries where such information is reliably
      available
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - 'FATF Case Study 81: a Vanuatu-based provider supplied nominee shareholders and directors for about
    2,000 New Zealand companies.'
  cases:
  - name: FATF Case Study 81 (New Zealand nominee directorship provider)
    year: '2018'
    jurisdiction: New Zealand / Vanuatu
    what_happened: A Vanuatu-based trust and company service provider registered about 2,000 New Zealand
      companies, acted as nominee shareholder and supplied nominee directors; authorities suspect at least
      73 of the companies facilitated crimes abroad. This is a suspicion stated in an official report,
      not a court finding.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.aml.gov.sa/en-us/GuidanceReports/Concealment%20of%20Beneficial%20Ownership.pdf
    source_title: Concealment of Beneficial Ownership (FATF/Egmont), Case Study 81, p. 38
  data_needed:
  - Directorship (director, organization, role, startDate)
  - Ownership (owner, asset)
  - Person (name, birthDate)
  - Company
  checkable: lookups
  lookup_sources:
  - Company registry officer and PSC data
  - OpenCorporates
  - Open Ownership register
  levels:
    faint: To be set by Ony
    strong: Person controls more than 100 companies (Global Witness red-flag cut-off)
    textbook: Meets the published definition as worded (mass nominee for many shell companies)
    threshold_source: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
  threshold_verified: true
  cross_hints:
  - target_area: PP
    reason: Owners who hold many companies were found to be linked to higher corruption risk in government
      contracting across several European countries.
    source_url: https://link.springer.com/article/10.1007/s10610-025-09654-9
  innocent_explanations:
  - Professional company secretaries and corporate service firms legitimately hold many appointments
  - Fund managers and special-purpose-vehicle administrators
  - Large group companies sharing directors
  - 'Name collisions: different people with the same name'
  jurisdictions: Global
  version: 1
- id: BO-005
  name: Informal nominee or 'straw man' (family member, associate or person of modest means)
  definition: A relative, friend, employee or person with no apparent wealth or role is recorded as owner
    or director while someone else really controls the company.
  areas:
  - BO
  typology: Informal nominees
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 10, p. 184
    quote: informal nominees, such as children, spouses, relatives or associates who do not appear to
      be involved in the running of the corporate enterprise.
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 7, p. 184
    quote: family members with no role or involvement in the running of the business are listed as beneficial
      owners of legal persons or arrangements
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 6, p. 183
    quote: demonstrate limited business acumen despite substantial interests in legal persons
    quote_verified: true
    checked: '2026-10-08'
  - title: The Puppet Masters
    publisher: World Bank / UNODC StAR
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Part 3, 'Front Men', p. 61
    quote: By contrast, a front man is specifically selected, is more likely to be connected to the principal
      by biographical data than by a contractual paper trail, and usually purports to be the beneficial
      owner of the corporate vehicle
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - OCCRP reported that the paper owner of two Azerbaijani Laundromat companies was a driver living on
    the outskirts of Baku.
  cases:
  - name: Azerbaijani Laundromat core companies (Hilux Services LP, Polux Management LP)
    year: '2017'
    jurisdiction: United Kingdom / Azerbaijan / Estonia
    what_happened: OCCRP reported that Maharram Ahmadov, on paper the owner of companies that sent millions
      around the world, is in reality a modest driver; he told reporters people at a Baku bank had made
      him a director.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.occrp.org/en/project/the-azerbaijani-laundromat/the-core-companies
    source_title: 'OCCRP, The Azerbaijani Laundromat: The Core Companies'
  - name: United States v. Richard Gaffey (Panama Papers investigation)
    year: '2020'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: A US accountant was sentenced to 39 months; DOJ said he falsely claimed a client's
      elderly mother was the sole beneficial owner of the client's offshore shell companies.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/us-accountant-panama-papers-investigation-sentenced-prison
    source_title: US DOJ press release, 24 Sept 2020 (quotes read through a summarising fetcher)
  data_needed:
  - Person (birthDate, nationality)
  - Family
  - Associate
  - Employment
  - Ownership
  - Directorship
  - Company
  checkable: person
  lookup_sources:
  - Company registry
  - Social media / professional networks
  - Property and wealth records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Family businesses where relatives genuinely co-own or inherit shares
  - Succession or estate planning
  - Spouses holding shares for legitimate tax or legal reasons
  - A person of modest means who genuinely founded a business
  jurisdictions: Global
  version: 1
- id: BO-006
  name: Nominee agreements or intermediary staff acting as nominees
  definition: Records show a written nominee arrangement, or employees of a law firm, accountant or company-service
    provider sit as directors or shareholders on behalf of an unnamed client.
  areas:
  - BO
  typology: Formal nominees
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 7, p. 184
    quote: employees of professional intermediary firms acting as nominee directors and shareholders
    quote_verified: true
    checked: '2026-10-08'
  - title: Potential Money Laundering Risks Related to Shell Companies (FIN-2006-G014)
    publisher: FinCEN, US Treasury
    year: '2006'
    url: https://www.fincen.gov/sites/default/files/shared/AdvisoryOnShells_FINAL.pdf
    locator: p. 3, nominee services list
    quote: 'Nominee Stockholders: A beneficial owner may use nominee stockholders to further ensure privacy
      and anonymity while maintaining control through an irrevocable proxy agreement.'
    quote_verified: true
    licence: US government work
    checked: '2026-10-08'
  examples:
  - Annex E 7 also lists 'agreements for nominee directors and shareholders' found in business records.
  cases: []
  data_needed:
  - Document (nominee agreement, proxy, declaration of trust)
  - Representation (agent, client)
  - Directorship
  - Employment
  - Company
  checkable: person
  lookup_sources:
  - Leaked or disclosed corporate-service-provider records
  - Company registry officer lists matched to service-provider staff
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Nominee arrangements are lawful in many jurisdictions, e.g. for publicly traded shares or to meet
    local-resident-director rules
  - Privacy for high-profile individuals at personal risk
  jurisdictions: Global
  version: 1
- id: BO-007
  name: Mass-registration address or 'company factory'
  definition: The company's registered address is shared with a very large number of other companies,
    usually a formation agent's or mailbox service's office.
  areas:
  - BO
  typology: Shell company indicators
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 11, p. 185
    quote: Address of mass registration (usually the address of a TCSP that manages a number of shell
      companies on behalf of its customers)
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 4, p. 182
    quote: are registered at an address that is also listed against numerous other companies or legal
      arrangements, indicating the use of a mailbox service
    quote_verified: true
    checked: '2026-10-08'
  - title: The Companies We Keep
    publisher: Global Witness
    year: '2018'
    url: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
    locator: Findings, point 1, and endnote 5
    quote: To explore the extent, we examined addresses where more than 100 companies were registered
      – often a sign that company service providers run a company.
    quote_verified: true
    checked: '2026-10-08'
  - title: Potential Money Laundering Risks Related to Shell Companies (FIN-2006-G014)
    publisher: FinCEN, US Treasury
    year: '2006'
    url: https://www.fincen.gov/sites/default/files/shared/AdvisoryOnShells_FINAL.pdf
    locator: p. 4
    quote: Transacting businesses share the same address, provide only a registered agent’s address, or
      raise other address-related inconsistencies.
    quote_verified: true
    licence: US government work
    checked: '2026-10-08'
  examples:
  - 'Global Witness: more than 208,000 UK companies registered at a ''company factory'', defined in its
    endnote 5 as an address with more than 1,000 companies registered there.'
  - 'FATF Case Study 81: one Auckland address was the registered office for most of about 2,000 companies.'
  cases:
  - name: Leeds business centre, no-PSC companies
    year: '2018'
    jurisdiction: United Kingdom
    what_happened: Global Witness reported a Leeds business centre where 95% of 1,157 registered companies
      said they had no PSC, and that 761 of them were directed by Marc Feldman, whom it describes as having
      two convictions for fraud and tax evasion.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
    source_title: Global Witness, The Companies We Keep
  data_needed:
  - Address (full, postalCode, country)
  - Company (addressEntity, address)
  - LegalEntity
  checkable: lookups
  lookup_sources:
  - Company registry bulk data (addresses)
  - OpenCorporates
  levels:
    faint: To be set by Ony
    strong: 'More than 100 companies at one address (Global Witness: often a sign a company service provider
      runs it)'
    textbook: More than 1,000 companies at one address (Global Witness 'company factory' definition)
    threshold_source: https://globalwitness.org/en/campaigns/corruption-and-money-laundering/the-companies-we-keep/
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Accountants', lawyers' and registered agents' offices legitimately host many registered offices
  - Virtual-office and co-working providers
  - Many small firms use their accountant's address for privacy
  jurisdictions: Global; quantified in UK
  version: 1
- id: BO-008
  name: Post-box only, unlocatable, or mismatched address
  definition: The company's only address is a post box, cannot be found on a map, or does not fit the
    kind of business it claims to be.
  areas:
  - BO
  typology: Shell company indicators
  status: verified
  sources:
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 12, p. 185
    quote: Only a post-box address (often used in the absence of professional TCSP services and in conjunction
      with informal nominees)
    quote_verified: true
    checked: '2026-10-08'
  - title: Concealment of Beneficial Ownership, Annex E
    publisher: FATF and Egmont Group
    year: '2018'
    url: https://egmontgroup.org/wp-content/uploads/2021/10/FATF-Egmont-Concealment-beneficial-ownership-annex-E.pdf
    locator: Annex E, indicator 4, p. 182
    quote: are registered at an address that cannot be located on internet mapping services (such as Google
      Maps)
