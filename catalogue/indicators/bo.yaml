- id: BO-052
  name: Structure spread across several countries, away from the owner's home country
  definition: The chain of companies, trusts and accounts is deliberately placed in several jurisdictions,
    so no single authority can compel all the evidence.
  areas:
  - BO
  typology: Layering of corporate vehicles across jurisdictions ('chaining')
  status: verified
  sources:
  - title: The Puppet Masters
    publisher: World Bank / UNODC StAR
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Part 3, section 3.2.5, p. 51
    quote: Investigations are particularly complicated when such layers are placed strategically in multiple
      jurisdictions, because no investigating authority will have the legal compulsory power to procure
      evidence from all parties involved.
    quote_verified: true
    checked: '2026-10-09'
  - title: The Puppet Masters
    publisher: World Bank / UNODC StAR
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Part 3, section 3.2.5, p. 52
    quote: A little more than one-third of the cases we reviewed involved officials using corporate vehicles
      established under the laws of their primary place of residence.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A company in Country B is owned by companies in Countries C and D, which are owned by a trust in Country
    E (StAR's own illustration, p. 51).
  - Lazarenko's associates formed vehicles and held proceeds in twelve jurisdictions (StAR p. 52).
  cases:
  - name: Pavel Lazarenko (former Prime Minister of Ukraine)
    year: '2009'
    jurisdiction: United States (also Switzerland, Ukraine)
    what_happened: StAR records that twelve jurisdictions were implicated, criminal charges were filed
