not_reached:
- 'fatf-gafi.org: all PDFs and the FATF glossary are behind a Cloudflare challenge. I used the same Annex
  E PDF from egmontgroup.org and the full 2018 report from a mirror on the Saudi FIU site (aml.gov.sa).
  Page numbers come from the report''s own page headers.'
- justice.gov blocks direct downloads. The Danske, Gaffey, Roger Ng and 2016 1MDB press releases were
  read only through a summarising fetcher. Their quotes should be checked word for word before the app
  shows them. The 2025 1MDB forfeiture complaint PDF did download and was read directly.
- 'Springer article by Tello Arista, Fazekas and Volkotrub (2026): read only through a summarising fetcher,
  and the last ~5,600 characters were not read. Check the quotes.'
- 'FinCEN FIN-2018-A003, the PEP facilitator advisory: the red-flag list is an image and did not extract,
  so it is not covered.'
- 'Manafort superseding information (D.D.C. 17-cr-201): the plea filing is a scanned image, and NPR is
  blocked by robots.txt. Left out as a case.'
- 'Open Contracting Partnership, Red Flags in Public Procurement (2024): not opened. The R032/R033 shared-owner
  bidder flags from patterns.md were not re-checked.'
- 'Fazekas & Tóth (2016), on company age: not opened.'
- 'Transparency International UK, Hiding in Plain Sight (2017): not opened.'
- 'FATF Guidance on Beneficial Ownership of Legal Persons (R.24, 2023) and Legal Arrangements (R.25, 2024):
  not reached.'
- 'FinCEN SAR Activity Review Issue 7 (2004), shell company red flags: not opened.'
- 'Wolfsberg Group and Egmont FIU typology updates after 2018: not reached.'
- 'FollowTheMoney explorer: property names are from memory and were not re-checked live, in particular
  CryptoWallet, RealEstate, Debt and the Ownership.ownershipType/sharesType fields.'
