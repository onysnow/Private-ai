- id: BO-061
  name: Fictitious loans enforced through the courts ('sham litigation')
  definition: Linked entities record a loan that was never paid out, stage a default, and get a court
    order making a guarantor pay, so the money leaves with a court order as its paperwork.
  areas:
  - BO
  typology: Sham debt and litigation laundering
  status: verified
  sources:
  - title: Offshore in the UK
    publisher: Transparency International UK
    year: '2017'
    url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    locator: Section 3, 'Separate Legal Personality', p. 8
    quote: This enables the laundering of significant amounts of money through incurring fake debts and
      participating in ‘sham litigation’.
    quote_verified: true
    checked: '2026-10-09'
  - title: Offshore in the UK
    publisher: Transparency International UK
    year: '2017'
    url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    locator: 'Case study: The ''Global Laundromat'', p. 7'
    quote: These core firms conducted sham business deals, including huge fictitious loans between the
      core entities, where no money actually changed hands.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A shell creditor sues a shell debtor for a 'defaulted' loan; a court orders the guarantor to pay hundreds
    of millions, which then move abroad (TI-UK p. 7).
