    quote: What this means is that although their name and country of incorporation may give them the
      veneer of a UK-regulated entity, their bank account and all of their financial transactions can
      be run through overseas bank accounts that have few, if any, money laundering checks on their account
      holders.
    quote_verified: true
    checked: '2026-10-09'
  - title: Offshore in the UK
    publisher: Transparency International UK
    year: '2017'
