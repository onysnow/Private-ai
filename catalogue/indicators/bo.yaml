    outcome_verified: true
    source_url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    source_title: Offshore in the UK (TI-UK 2017), p. 7, citing OCCRP
  - name: Caviar Diplomacy (Hilux Services LP, Polux Management LP)
    year: '2017'
    jurisdiction: Italy / Azerbaijan / United Kingdom
    what_happened: The European Stability Initiative alleged, citing Milan prosecutor documents, that
      two SLPs with BVI corporate partners were conduits for EUR 1.89 million in payments to Luca Volontè.
