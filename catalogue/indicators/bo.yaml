- id: BO-047
  name: 'Corporate director or corporate general partner: a company, not a person, sits in the management
    seat'
  definition: The director, or the managing (general) partner, of the entity is itself another company,
    so the register names no human being in charge.
  areas:
  - BO
  typology: Layering of corporate vehicles (legal fiction)
  status: verified
  sources:
  - title: 'The Puppet Masters: How the Corrupt Use Legal Structures to Hide Stolen Assets and What to
      Do About It'
    publisher: World Bank / UNODC Stolen Asset Recovery Initiative (StAR)
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Part 3, section 3.2.5, p. 51
    quote: This type of tiered approach appeared most commonly in our grand corruption database in situations
      in which legal entities were listed as (a) the legal shareholders or (b) the directors of companies
      or (c) both.
    quote_verified: true
    licence: (c) IBRD/World Bank 2011, all rights reserved; short quotation
    checked: '2026-10-09'
  - title: 'Offshore in the UK: Analysing the use of Scottish Limited Partnerships in corruption and money
      laundering'
    publisher: Transparency International UK (with Bellingcat)
    year: '2017'
    url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    locator: Section 3, 'No natural persons required', p. 9
    quote: Section 155 of the Companies Act 2006, commenced in October 2008, required that all UK private
      and limited companies must have at least one director that is a natural person.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Citibank appointed three Panamanian shelf companies as the board of directors of Trocca Ltd., the
    company holding Raul Salinas's assets (StAR box 3.3).
  - Two Belize companies, Advance Developments Limited and Corporate Solutions Limited, were appointed
    directors or partners of 351 UK companies and LLPs between 2004 and 2016 (TI-UK 2017, p. 14).
  cases:
  - name: Raul Salinas / Trocca Ltd. (Citibank private banking)
    year: '1998'
    jurisdiction: United States / Mexico
    what_happened: A U.S. GAO report and Senate PSI hearings described how Citibank set up Trocca Ltd.
      for Salinas and named three Panamanian shelf companies as its directors and a Cayman shelf company
      as a principal shareholder, so no document identified Salinas as beneficial owner.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    source_title: The Puppet Masters, box 3.3 (citing GAO/OSI-99-1, October 1998)
  data_needed:
  - Company (name, jurisdiction, registrationNumber, legalForm)
  - LegalEntity
  - Directorship (director, organization, role, startDate, endDate)
  - Ownership (owner, asset)
  - Address
  checkable: lookups
  lookup_sources:
  - Company registry (officer and partner lists)
  - OpenCorporates or similar aggregated registry data
  - Registry of the corporate director's own jurisdiction
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Group subsidiaries are often managed by the parent company or a group service company.
  - Investment funds commonly use a corporate general partner.
  - StAR notes that government-owned structures, family businesses and listed groups use companies as
    owners and controllers with no real secrecy risk (p. 54).
  - Corporate directors are lawful in many jurisdictions.
  jurisdictions: Global; UK requires at least one natural-person director for companies since October
    2008 (Companies Act 2006 s.155); StAR found 12 of 40 reviewed jurisdictions prohibit corporate directors
    outright.
  version: 1
