- id: BO-051
  name: Trust contains a 'flee clause' or protector resettlement clause
  definition: The trust deed requires or lets the trustee or protector move the trust and its assets to
    another jurisdiction when it is sued or investigated.
  areas:
  - BO
  typology: Misuse of trusts / asset protection against recovery
  status: verified
  sources:
  - title: The Puppet Masters
    publisher: World Bank / UNODC StAR
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Appendix C, trusts, pp. 169-170
    quote: 'To guard against such possibilities, many trusts were created with specific flee clauses:
      In the event of litigation against the trust or trustee (typically on behalf of a creditor), a trustee
      is required to transfer those assets to another jurisdiction.'
    quote_verified: true
    checked: '2026-10-09'
  - title: The Puppet Masters
    publisher: World Bank / UNODC StAR
    year: '2011'
    url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    locator: Appendix C, trusts, p. 170
    quote: In many cases, flee clauses have been replaced with Protector Resettlement Clauses, which give
      the protector power to move assets in a manner that can be implemented more easily and quickly,
      and may make it easier to defeat Mareva actions.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A trust moved from one island jurisdiction to another shortly after a creditor or prosecutor began
    action.
  - The deed lets the protector change governing law and trustee 'upon any threat to the trust fund'.
