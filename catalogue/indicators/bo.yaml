      conviction for money laundering and conspiracy was reviewed in US v. Lazarenko, 564 F.3d 1026 (9th
      Cir. 2009).
    outcome: convicted
    outcome_verified: true
    source_url: https://star.worldbank.org/sites/star/files/puppetmastersv1.pdf
    source_title: The Puppet Masters, section 3.2.5 and box 3.5
