    publisher: Transparency International UK (with Bellingcat)
    year: '2017'
    url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    locator: Key Findings, p. 1
    quote: 71 per cent of all SLPs registered in 2016 are controlled by companies based in secrecy jurisdictions,
      hiding who is really behind the partnership.
    quote_verified: true
    checked: '2026-10-09'
