  lookup_sources:
  - Companies House (LP registration forms LP5/LP6, SLP PSC filings since 2017)
  - Registry of the corporate partners' jurisdictions
  - Tax Justice Network Financial Secrecy Index
  levels:
    faint: A corporate partner from abroad sits alongside named individuals.
    strong: All partners are companies and none is in the country of registration.
    textbook: All partners are bodies corporate and the general partner is incorporated in a 'secrecy
      jurisdiction', which TI-UK defines as one scoring 60 or more on the Tax Justice Network Financial
      Secrecy Index (2015).
    threshold_source: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: SLPs with offshore corporate partners were used in the Global Laundromat and the Moldovan
      bank theft.
    source_url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
