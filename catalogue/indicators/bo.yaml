    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.transparency.org.uk/sites/default/files/2025-11/Offshore_In_The_UK_TIUK_June_2017.pdf
    source_title: Offshore in the UK (TI-UK 2017), p. 13
  data_needed:
  - Company (legalForm = limited partnership, jurisdiction, incorporationDate)
  - LegalEntity (corporate partners)
  - Directorship (role = general partner) or Ownership (role = limited partner)
  - Address
  - Person (PSC, where filed)
