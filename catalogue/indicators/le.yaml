- id: LE-044
  name: Labour relations consultant active in an organising campaign, but no LM-10 or LM-20 on file
  definition: An employer brings in an outside consultant or law firm to run or shape its response to
    a union drive, yet neither the employer (Form LM-10) nor the consultant (Form LM-20) has filed the
    disclosure the federal law requires.
  areas:
  - LE
  typology: Undisclosed persuader activity
  status: verified
  sources:
  - title: 'OLMS Newsletter 01-16: Persuader Rule'
    publisher: US Department of Labor, Office of Labor-Management Standards
    year: '2016'
    url: https://www.dol.gov/agencies/olms/about/newsletter/2016/1
    locator: Persuader rule summary
    quote: agrees to manage a campaign or program to avoid or counter a union organizing
    quote_verified: true
    checked: '2026-10-10'
  - title: 29 U.S.C. 433 (LMRDA section 203), Report of employers
    publisher: Legal Information Institute, Cornell Law School (text of US Code)
    url: https://www.law.cornell.edu/uscode/text/29/433
    locator: Section 203(a)(4) and 203(b)
    quote: any agreement or arrangement with a labor relations consultant or other independent contractor
      or organization
    quote_verified: true
    checked: '2026-10-10'
  - title: 29 CFR Part 406, Reporting by labor relations consultants and other persons
    publisher: US Government, Electronic Code of Federal Regulations
    url: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-II/subchapter-A/part-406
    locator: 406.2(a)
    quote: The report shall be filed within 30 days after entering into an agreement or arrangement of
      the type described in this section.
    quote_verified: true
    checked: '2026-10-10'
  - title: 29 CFR Part 405, Employer reports
    publisher: US Government, Electronic Code of Federal Regulations
    url: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-II/subchapter-A/part-405
    locator: '405.2'
    quote: within 90 days after the end of each of its fiscal years, a report signed by its president
      and treasurer
    quote_verified: true
    checked: '2026-10-10'
  - title: 'No Holds Barred: The Intensification of Employer Opposition to Organizing (EPI Briefing Paper
      235)'
    publisher: Economic Policy Institute (Kate Bronfenbrenner, Cornell University)
    year: '2009'
    url: https://files.epi.org/page/-/pdf/bp235.pdf
    locator: Table 3, p. 10
    quote: Hired management consultant 75%
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Workers report meetings run by outside 'labor relations' speakers, but the OLMS online disclosure
    search shows no LM-20 naming the employer.
  - An employer's LM-10 is absent for the fiscal year in which a union election took place and a law firm
    was publicly described as advising on the campaign.
  cases: []
  data_needed:
  - Company
  - Person
  - Organization
  - Contract
  - Payment
  - Document
  - Event
  checkable: lookups
  lookup_sources:
  - OLMS Online Public Disclosure Room (LM-10, LM-20, LM-21 filings)
  - NLRB case search (election petitions and dates)
  - Worker testimony or campaign materials naming the consultant
  levels:
    faint: A consultant is named in campaign materials or worker accounts; filing status not yet checked
    strong: Filings checked and no LM-20 found more than 30 days after the consultant was engaged, or
      no LM-10 more than 90 days after the employer's fiscal year end
    textbook: A persuader agreement exists (consultant undertook activities to persuade employees) and
      no LM-20 was filed within 30 days and/or no LM-10 within 90 days after fiscal year end
    threshold_source: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-II/subchapter-A/part-406
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Persuader reporting is a disclosure regime for paid third-party influence, comparable to lobbying
      registration gaps.
    source_url: https://www.law.cornell.edu/uscode/text/29/433
  innocent_explanations:
  - The consultant only gave advice to the employer, which is exempt from reporting under section 203(c).
