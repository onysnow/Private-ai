    strong: A director has been involved with two or more companies that went into liquidation, whether
      or not within the last seven years.
    textbook: A director has been involved with two or more companies in liquidation in the last seven
      years, with liquidators' initial statutory reports lodged for them. This is the threshold at which
      ASIC can disqualify a director.
    threshold_source: https://www.asic.gov.au/about-asic/news-centre/articles/asic-action-to-disqualify-company-directors/
    threshold_note: 'Counts prior liquidated companies per director. Australia only, under Corporations
      Act s206F. The same article adds: ''the law only requires people to be involved in two or more failed
      companies to be considered for director disqualification''. ASIC also says not every failure meets
      the threshold. The Senate Economics References Committee report on insolvency in the construction
      industry (ch. 7, para 7.4) says the same thing: two or more companies wound up within seven years.
      Its page blocked direct download, so the ASIC page is the one cited. Deregistration alone has no
      published number.'
