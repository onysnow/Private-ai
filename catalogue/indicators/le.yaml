    name.
  - The engagement began recently and the 30-day or 90-day filing window has not closed.
  - The scope of reportable 'indirect' persuasion changed with the 2016 rule; its later status was not
    verified here and must be checked before treating an omission as a breach.
  jurisdictions: United States (LMRDA, federal private sector)
  version: 1
