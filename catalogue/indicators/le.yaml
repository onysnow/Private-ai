  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Hourly pay below the applicable legal minimum for an employee doing the same work (the source
      cites the National Minimum Wage of $23.23/hr and casual minimum of $29.04/hr at the time of the
      survey).
    threshold_source: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  threshold_verified: true
  cross_hints: []
