key: LE
name: Labour exploitation and wage theft
scope: 'Labour exploitation short of forced labour (wage theft, underpayment). Red flags from ''Off the
  Books: Practical Guidance for Business'' (Migrant Justice Institute with Walk Free and the Australian
  Anti-Slavery Commissioner, August 2026). Misclassification: workers required to get an ABN to get or
  keep a job; contractors supervised like employees. Sham casual work: casual hours match permanent staff,
  no casual loading. Missing penalty rates, or flat rates that ignore loadings. Supplier refuses to provide
  payslips, timesheets or proof of payment. Wages partly paid in cash. Many workers'' payslips show identical
  hours. Delayed pay or unexplained deductions. Shifts cut after a worker raises concerns.'
indicators:
- id: LE-001
  name: Workers required to get an ABN or sign a contractor agreement to get or keep the job
  definition: The business makes workers register as self-employed contractors (in Australia, by getting
    an Australian Business Number) as a condition of being hired or kept on, so it can avoid employee
    pay and record-keeping duties.
  areas:
  - LE
  typology: Misclassification and sham contracting
  status: verified
  sources:
  - title: 'Off the Books: Practical Guidance for Business'
    publisher: Migrant Justice Institute, Walk Free and the Office of the Australian Anti-Slavery Commissioner
    year: '2026'
    url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
    locator: p.5, Red flags (Examining contractor / ABN risks)
    quote: Workers report they were required to get an ABN to obtain or keep the job.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Off the Books: Practical Guidance for Business'
    publisher: Migrant Justice Institute, Walk Free and the Office of the Australian Anti-Slavery Commissioner
    year: '2026'
    url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
    locator: p.4, section 1
    quote: Deliberately misrepresenting an employee as a contractor is known as sham contracting and is
      an offence that carries significant penalties.
    quote_verified: true
    checked: '2026-10-09'
  - title: Independent contractors
    publisher: Fair Work Ombudsman (Australia)
    url: https://www.fairwork.gov.au/find-help-for/independent-contractors
    locator: Sham contracting
    quote: If the business knew (or should have known) that the worker was an employee, there may be a
      sham contracting arrangement.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Fact Sheet 13: Employee or Independent Contractor Classification Under the FLSA'
    publisher: US Department of Labor, Wage and Hour Division
    url: https://www.dol.gov/agencies/whd/fact-sheets/13-flsa-employment-relationship
    locator: Titles and labels
    quote: a worker may be an employee under the FLSA regardless of the title or label they are given.
    quote_verified: true
    licence: US federal government work
    checked: '2026-10-09'
  examples:
  - Job advert or onboarding message says 'must have ABN'.
  - 'Worker quote in source: ''They tell you to get an ABN so they don''t have to pay night or weekend
    rates, but they still treat you like an employee.'' (OTB p.5)'
  cases:
  - name: Village Concrete Inc. (US Department of Labor v. Village Concrete)
    year: '2024'
    jurisdiction: US (E.D. Virginia)
    what_happened: WHD found the contractor treated 29 workers as contractors rather than employees, denied
      overtime, and falsified records; nearly $1.2 million in back wages, liquidated damages and civil
      money penalties under a consent judgment.
    outcome: settled
    outcome_verified: true
    source_url: https://www.dol.gov/newsroom/releases/whd/whd20240423
    source_title: US Department of Labor news release, 23 April 2024
  data_needed:
  - Employment (employer, employee, role, startDate, summary)
  - Contract (authority, contractor, title, signingDate)
  - Person
  - Company (registrationNumber, taxNumber)
  - Document (job adverts, onboarding forms)
  checkable: person
  lookup_sources:
  - Australian Business Register (ABN Lookup)
  - Company registry
  - Job advertising sites
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HT
    reason: The guidance says ABN misuse can compound other forced-labour indicators and signal heightened
      modern slavery risk.
    source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  - target_area: FR
    reason: Misclassifying employees as contractors shifts tax and superannuation obligations; the ATO
      handles superannuation, phoenix activity and the shadow economy (OTB p.11 referral table).
    source_url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  innocent_explanations:
  - The worker genuinely runs their own business and serves several clients.
  - The worker asked to be engaged as a contractor for their own tax or flexibility reasons.
  - Some industries (e.g. certain trades, freelance media) commonly and lawfully use contractors.
  jurisdictions: Australia (ABN, Fair Work Act 2009); US equivalent under FLSA
  version: 1
