- id: LE-005
  name: Contractor or 'ABN rate' pay below the minimum for equivalent employees
  definition: Workers engaged as contractors, or on so-called 'ABN rates' or 'cash job rates', are paid
    less per hour than the legal minimum for an employee doing the same work.
  areas:
  - LE
  typology: Underpayment
  status: verified
  sources:
  - title: 'Off the Books: Practical Guidance for Business'
    publisher: Migrant Justice Institute, Walk Free and the Office of the Australian Anti-Slavery Commissioner
    year: '2026'
    url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
    locator: p.4, section 1 (chart)
    quote: Businesses that engaged workers on an ABN paid far less than they would have been required
      to pay an employee under the Fair Work Act, and well beneath the casual minimum wage.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Off the Books: Practical Guidance for Business'
    publisher: Migrant Justice Institute, Walk Free and the Office of the Australian Anti-Slavery Commissioner
    year: '2026'
    url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
    locator: p.13, Case study, worker interviews
    quote: they are hired on “ABN rates” or “cash job” rates.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - 'Survey finding: 43% of ABN workers were paid below the National Minimum Wage ($23.23/hr) and 79%
    below the casual minimum wage ($29.04/hr) (OTB p.4).'
  cases: []
  data_needed:
