- id: LE-051
  name: Promises, raises, bonuses or solicited grievances during the campaign
  definition: During an organising drive the employer promises or hands out new benefits, unscheduled
    pay rises or favours, or invites complaints with an implied promise to fix them, to win votes against
    the union.
  areas:
  - LE
  typology: Coercion during organising
  status: verified
  sources:
  - title: Interfering with employee rights (Section 7 & 8(a)(1))
    publisher: National Labor Relations Board
    url: https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/interfering-with-employee-rights-section-7-8a1
    locator: Examples of employer conduct
    quote: Imply a promise of benefits by soliciting grievances from employees during a union organizing
      campaign.
    quote_verified: true
    checked: '2026-10-10'
  - title: Interfering with employee rights (Section 7 & 8(a)(1))
    publisher: National Labor Relations Board
    url: https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/interfering-with-employee-rights-section-7-8a1
    locator: Examples of employer conduct
    quote: Confer benefits on employees during a union organizing campaign to induce employees to vote
      against the union.
    quote_verified: true
    checked: '2026-10-10'
  - title: No Holds Barred (EPI Briefing Paper 235)
    publisher: Economic Policy Institute (Kate Bronfenbrenner)
    year: '2009'
    url: https://files.epi.org/page/-/pdf/bp235.pdf
    locator: Table 3, p. 11; p. 12
    quote: bribes and special favors (22%)
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A pay rise announced weeks after an election petition, outside the usual pay-review cycle.
  - '''Open-door'' listening sessions launched only after the union filed.'
  cases: []
  data_needed:
  - Company
  - Employment
  - Payment
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Pay history and announcement dates compared with NLRB petition date
  - Internal memos
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The rise or benefit was decided and scheduled before the campaign began.
  - Industry-wide wage pressure or a statutory minimum-wage increase.
  - Regular staff surveys that pre-date the campaign.
  jurisdictions: United States
  version: 1
- id: LE-052
  name: Scheduled raises or benefit changes withheld and blamed on the union
  definition: A pay rise or benefit change that would normally have happened is held back during the campaign,
    without a clear assurance it will come whatever the outcome.
  areas:
  - LE
  typology: Coercion during organising
  status: verified
  sources:
  - title: Interfering with employee rights (Section 7 & 8(a)(1))
    publisher: National Labor Relations Board
    url: https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/interfering-with-employee-rights-section-7-8a1
    locator: Examples of employer conduct
    quote: Withhold changes in wages or benefits during a union organizing campaign that would have been
      made had the union not been on the scene, unless you make clear to employees that the change will
      occur whether or not they select the union
    quote_verified: true
    checked: '2026-10-10'
  - title: No Holds Barred (EPI Briefing Paper 235)
    publisher: Economic Policy Institute (Kate Bronfenbrenner)
    year: '2009'
    url: https://files.epi.org/page/-/pdf/bp235.pdf
    locator: p. 15
    quote: alterations in benefits or working conditions have increased from 17% to 22%
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Annual raise given at other non-union sites but not at the site with a pending election.
  cases: []
  data_needed:
  - Company
  - Employment
  - Payment
  - Event
  checkable: records
  lookup_sources:
  - Pay records across sites
  - Company announcements
  - NLRB charges
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Company-wide pay freeze for financial reasons applied equally to all sites.
  - Employer gave a clear assurance that the change will happen regardless of the vote.
  jurisdictions: United States
  version: 1
- id: LE-053
  name: Mandatory anti-union 'captive audience' meetings
  definition: Workers are required, under threat of discipline, to attend meetings where management argues
    against the union.
  areas:
  - LE
  typology: Coercion during organising
  status: verified
  sources:
  - title: Board Rules Captive-Audience Meetings Unlawful (Amazon.com Services LLC)
    publisher: National Labor Relations Board
    year: '2024'
    url: https://www.nlrb.gov/news-outreach/news-story/board-rules-captive-audience-meetings-unlawful
    locator: News release, 13 November 2024
    quote: an employer violates the National Labor Relations Act by requiring employees under threat of
      discipline or discharge
    quote_verified: true
    checked: '2026-10-10'
  - title: No Holds Barred (EPI Briefing Paper 235)
    publisher: Economic Policy Institute (Kate Bronfenbrenner)
    year: '2009'
    url: https://files.epi.org/page/-/pdf/bp235.pdf
    locator: p. 12
    quote: Nearly 90% of employers use captive audience meetings, holding on average 10.4 meetings a year.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Rota shows compulsory 'information sessions' about the union with attendance taken.
  cases: []
  data_needed:
  - Company
  - Event
  - Employment
  - Document
  checkable: records
  lookup_sources:
  - Rotas and attendance sheets
  - Meeting invitations
  - NLRB decisions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Meetings where staff are told in advance attendance is voluntary, with no penalty and no attendance
    records, remained permitted under the 2024 decision.
  - Routine mandatory staff meetings on operations or safety.
  - The 2024 rule applies prospectively only, and a later Board may revisit it; current status was not
    verified here.
  jurisdictions: United States
  version: 1
- id: LE-054
  name: Union supporters fired, disciplined, demoted or laid off
  definition: Workers active in the organising effort lose their jobs, are disciplined, suspended, demoted
    or not recalled, in a pattern that tracks their union activity.
  areas:
  - LE
  typology: Retaliation
  status: verified
  sources:
  - title: Discriminating against employees because of their union activities (Section 8(a)(3))
    publisher: National Labor Relations Board
    url: https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/discriminating-against-employees-because-of-their-union
    locator: Examples
    quote: employers may not discharge, lay off, or discipline employees
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Unlawful: U.S. employers are charged with violating federal law in 41.5% of all union election
      campaigns'
    publisher: Economic Policy Institute
    year: '2019'
    url: https://www.epi.org/publication/unlawful-employer-opposition-to-union-election-campaigns/
    locator: Key findings
    quote: one out of five union election campaigns involves a charge that a worker was illegally fired
      for union activity.
    quote_verified: true
    checked: '2026-10-10'
  - title: No Holds Barred (EPI Briefing Paper 235)
    publisher: Economic Policy Institute (Kate Bronfenbrenner)
    year: '2009'
    url: https://files.epi.org/page/-/pdf/bp235.pdf
    locator: p. 2
    quote: employers threatened to close the plant in 57% of elections, discharged workers in 34%
    quote_verified: true
    checked: '2026-10-10'
  - title: Starbucks Corp. v. McKinney, 602 U.S. (2024)
    publisher: Supreme Court of the United States (via Legal Information Institute)
    year: '2024'
    url: https://www.law.cornell.edu/supremecourt/text/23-367
    locator: Opinion, facts
    quote: Starbucks ultimately fired multiple employees involved with the media event for violating company
      policy.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Organising committee members dismissed for minor policy breaches soon after going public.
  - Discipline records show a jump for named union supporters after the petition date.
  cases: []
  data_needed:
  - Person
  - Employment
  - Event
  - CourtCase
  - Document
  checkable: records
  lookup_sources:
  - NLRB case search (8(a)(3) charges, complaints, decisions)
  - Court records for 10(j) injunctions
  - Discipline and termination records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: LE
    reason: Retaliation for raising concerns about pay overlaps with retaliation for union activity.
    source_url: https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/interfering-with-employee-rights-section-7-8a1
  innocent_explanations:
  - Genuine misconduct or performance problems that would have led to the same action regardless of union
    activity.
  - Layoffs driven by documented business downturns applied to all staff.
  - Coincidental timing; NLRB charges are allegations until decided.
  jurisdictions: United States
  version: 1
