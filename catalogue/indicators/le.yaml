    quote_verified: true
    checked: '2026-10-09'
  - title: Casual employees
    publisher: Fair Work Ombudsman (Australia)
    url: https://www.fairwork.gov.au/starting-employment/types-of-employees/casual-employees
    locator: Casual loading
    quote: a higher pay rate for being a casual employee.
    quote_verified: true
    checked: '2026-10-09'
  examples:
