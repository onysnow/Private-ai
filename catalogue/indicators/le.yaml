- id: LE-006
  name: Casual employees working the same steady hours as permanent staff
  definition: Workers labelled 'casual' have regular hours matching permanent staff, which may show a
    sham casual arrangement used to avoid leave and other entitlements.
  areas:
  - LE
  typology: Sham casual employment
  status: verified
  sources:
  - title: 'Off the Books: Practical Guidance for Business'
    publisher: Migrant Justice Institute, Walk Free and the Office of the Australian Anti-Slavery Commissioner
    year: '2026'
    url: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
    locator: p.6, Red flags (Detecting harmful use of casual employment)
    quote: Casual employees’ work hours match those of permanent staff.
    quote_verified: true
    checked: '2026-10-09'
  - title: Casual employees
    publisher: Fair Work Ombudsman (Australia)
    url: https://www.fairwork.gov.au/starting-employment/types-of-employees/casual-employees
    locator: Sham casual arrangements
    quote: knowingly say something false to convince a current or former full-time or part-time employee
    quote_verified: true
    checked: '2026-10-09'
  - title: New rules for changing from casual to full-time or part-time employment
    publisher: Fair Work Ombudsman (Australia)
    year: '2024'
    url: https://www.fairwork.gov.au/about-us/workplace-laws/legislation-changes/closing-loopholes/casual-employment-changes/casual-conversion
    locator: Eligibility to give notice section
    quote: have been employed for at least 6 months (12 months if employed by a small business)
    quote_verified: true
    licence: Not stated
    checked: '2026-10-10'
  examples:
  - Rosters show a 'casual' worker on the same 38-hour weekly pattern for two years.
  cases: []
  data_needed:
  - Employment (role, startDate)
  - Document (rosters, time records)
  checkable: records
  lookup_sources: []
  levels:
    faint: A worker labelled casual has worked regular, steady hours like permanent staff, but for less
      than 6 months (less than 12 months at a small business).
    strong: A worker labelled casual has worked regular, steady hours matching permanent staff for at
      least 6 months (12 months if the employer is a small business) and is still treated as casual.
    textbook: A worker has been employed as a casual for at least 6 months (12 months at a small business)
      on hours matching permanent staff, has the right to give notice to change to permanent under the
      employee choice pathway, and is still kept on casual terms.
    threshold_source: https://www.fairwork.gov.au/about-us/workplace-laws/legislation-changes/closing-loopholes/casual-employment-changes/casual-conversion
    threshold_note: The 6- and 12-month figures are the Fair Work Act eligibility window for a casual
      to give notice to change to full-time or part-time (the employee choice pathway). This applies from
      26 February 2025 for casuals employed before 26 August 2024 by non-small businesses, and from 26
      August 2025 for small business employees. It is a legal window, not a test that proves a sham arrangement.
      The Fair Work casual employees page separately uses 'a regular and systematic basis over at least
      12 months', but for flexible-working and unpaid-parental-leave rights, not for conversion. Australia
      only.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - FWO notes a regular pattern of work alone does not mean there is a firm commitment to ongoing work;
    genuine casuals can work regular shifts.
  - Worker may prefer casual loading over leave.
  jurisdictions: Australia
  version: 2
- id: LE-007
  name: No casual loading paid or shown on pay slips
