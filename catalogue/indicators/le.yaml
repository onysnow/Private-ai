    textbook: Casual pay does not include the 25% casual loading (or the loading set by the applicable
      enterprise agreement).
    threshold_source: https://cdn.walkfree.org/content/uploads/2026/08/06115628/GD551-off-the-books-guidance_DIGITAL_spreads.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
