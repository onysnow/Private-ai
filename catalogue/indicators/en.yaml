  cases:
  - name: Holcim Romania registry theft
    year: '2010'
    jurisdiction: Romania / Liechtenstein
    what_happened: About 1.6 million credits (around EUR 23.5 million) were stolen from the Romanian registry;
      police in Romania and Liechtenstein traced and returned 600,000 of them. No prosecution outcome
      is reported.
    outcome: alleged_in_reporting
