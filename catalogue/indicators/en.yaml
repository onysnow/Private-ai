    year: 2013 (raid)
    jurisdiction: India
    what_happened: Delhi Police and the Wildlife Crime Control Bureau seized tiger remains and cash; a
      special court found Mr. X guilty of money laundering (4 years rigorous imprisonment), acquitted
      Mr. Y, and confiscated Rs 5 million and Rs 270,000; Mr. Z died during trial.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    source_title: 'FATF (2020) Money Laundering and the Illegal Wildlife Trade, Box 39 (source: India)'
