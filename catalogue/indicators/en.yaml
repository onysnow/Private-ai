    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
  innocent_explanations:
  - Clerical errors on genuine permits
  - Differences in permit formats between countries
  - Genuine captive-breeding operations
  jurisdictions: All 180+ CITES Parties
  version: 1
