not_reached:
- FATF website PDFs (fatf-gafi.org /content/dam/fatf-gafi/reports/...) blocked automated download (robots/bot
  check). The FATF 2020 IWT report was read from the OJK Indonesia mirror, the FATF 2021 environmental
  crime report from the Bank of Russia (cbr.ru) mirror, and the FATF/APG 2015 gold report from a Singapore
  government mirror; page numbers are the printed FATF page numbers.
- Full text of Welch et al. 2022 'Hot spots of unseen fishing vessels' (Science Advances) could not be
  fetched (science.org error, SEAFDEC mirror connection reset); the AIS gap duration threshold used in
  that paper was not verified, so no duration threshold is given for EN-065.
- TRAFFIC's own published indicator lists were not opened; the ROUTES Partnership factsheet does not name
  TRAFFIC as publisher.
