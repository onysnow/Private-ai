    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, B, pp.61-62
    quote: Transactions to licenced pet shop suppliers/breeders that originate from overseas, and/or incommensurate
      with stated business activities.
    quote_verified: true
