  definition: A company imports or sells HFCs without holding the quota or the F-gas Portal registration
    that EU law requires, often bringing them in through countries on the EU's external border.
  areas:
  - EN
  typology: Illegal trade in fluorinated gases (F-gases)
  status: verified
  sources:
  - title: Regulation (EU) 2024/573 on fluorinated greenhouse gases
    publisher: European Union (EUR-Lex)
    year: '2024'
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R0573
    locator: Recitals 28 and 35
    quote: the Commission should continue to allocate quota to individual producers and importers for
      the placing on the market of HFCs
    quote_verified: true
    checked: '2026-10-09'
  - title: Illegal smuggling of refrigerant gases into Europe continues as the climate crisis worsens
    publisher: Environmental Investigation Agency (EIA)
    url: https://eia-international.org/news/illegal-smuggling-of-refrigerant-gases-into-europe-continues-as-the-climate-crisis-worsens/
    locator: Article body
    quote: Trafficked from Bulgaria and other countries on the edge of the bloc
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - The importer is not listed as a registered F-gas Portal undertaking
  - Sales volumes are far above the company's allocated quota
  - Gas sourced from Turkiye or China arrives via Bulgaria or Romania for buyers in Greece, Germany, France,
    Italy, Portugal or Spain
  cases: []
  data_needed:
  - Company
  - Document (quota allocation, customs declarations, invoices)
  - Address
  - Payment
  checkable: lookups
  lookup_sources:
  - EU F-gas Portal and quota records
  - Customs data
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Gas is pre-charged in equipment covered by authorisations
  - Quota is transferred lawfully from another holder
  - The buyer is a distributor reselling gas already placed on the market by a quota holder
  jurisdictions: European Union
  version: 1
- id: EN-081
  name: Wildlife or wildlife parts openly advertised or auctioned on social media or online marketplaces
  definition: Protected live animals or parts such as ivory or rhino horn are posted for sale or auctioned
    on social media or marketplaces, often with the seller's personal phone number.
  areas:
