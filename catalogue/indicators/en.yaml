    locator: Section 'Drilling down from the tip of the iceberg' and 'How policy priorities and regulations
      (would) support enforcement efforts'
    quote: auctioning live wild animals and whole pieces of ivory or rhino horn openly to their followers
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A Facebook group post auctioning a live primate with a mobile number to call
  - Listings that keep appearing despite the platform's ban on live animal sales
  cases: []
  data_needed:
  - Person
  - UserAccount (social media profile)
  - Document (posts, screenshots)
  - Payment
  - Address
  checkable: lookups
  lookup_sources:
  - Social media and marketplace monitoring
  - CITES species lists
  - Phone number reverse lookup
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Lawful captive-bred or permitted species are sold online
  - Antiques that are lawful under exemptions
  - Scam ads with no real animal behind them
  jurisdictions: Global
  version: 1
