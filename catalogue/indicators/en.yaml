key: EN
name: Environmental crime
scope: wildlife trafficking (TRAFFIC, CITES, FATF 2020 illegal wildlife trade), illegal, unreported and
  unregulated fishing (Global Fishing Watch, FAO), illegal logging, illegal mining and gold, waste trafficking
  and pollution crime (FATF 2021 environmental crime report).
indicators:
- id: EN-001
  name: Trading or logistics company in a high-risk wildlife corridor dealing in typical cover goods
  definition: An import-export, freight, customs-clearing or logistics firm that ships goods often used
    to hide wildlife (logs, plastic waste, frozen food, fish maws, beans, stone blocks) along routes or
    ports known for wildlife seizures.
  areas:
  - EN
  - ML
  typology: Concealment of wildlife in legitimate cargo through import-export front companies
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, A. Client profiles, p.60 and footnote 82
    quote: raw or squared wooden logs, plastic waste or pellets, frozen food, fish maws, various kinds
      of beans, stone or quartz blocks.
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: para 37, p.18
    quote: Importantly, criminals incorporate shell and front companies in the both source or destination
      countries for the illicit wildlife
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A Kenyan 'tea trading' company set up to hide ivory inside tea sacks (FATF 2020 Box 6)
  - Front companies importing garlic and citric acid and exporting seafood/shells to hide ivory (Mikocheni
    syndicate, Tanzania)
  - A frozen fish company used to co-mingle pangolin-scale proceeds (PT. ABC, Indonesia)
  cases:
  - name: Tea trading front company used for ivory shipments (Mombasa to Thailand/Singapore)
    year: '2015'
    jurisdiction: Kenya / Thailand / Singapore
    what_happened: Seizures of 6.8 tonnes of ivory exported from Mombasa; an NGO financial investigation
      traced a syndicate that set up a tea trading front company, diverted trucks to fill tea sacks with
      ivory and changed destination and consignee en route.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    source_title: 'FATF (2020) Money Laundering and the Illegal Wildlife Trade, Box 6 (source: Liberty
      Shared)'
  data_needed:
  - Company (name, jurisdiction, incorporationDate, sector/classification)
  - Ownership
  - Directorship
  - Document (bills of lading, customs declarations, invoices)
  - Address (port, warehouse)
  - Payment (payer, beneficiary, amount, purpose)
  checkable: lookups
  lookup_sources:
  - Company registry
  - Customs and trade data (shipment manifests, bill-of-lading databases)
  - Seizure databases and court records
  - Port/container tracking
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: The same front-company and cover-load method moves value through the trade system, not just
      goods.
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
  innocent_explanations:
  - Most companies shipping these commodities on these routes are legitimate traders
  - Large ports handle huge legitimate volumes, so presence on a high-seizure route alone means little
  - Freight forwarders and clearing agents serve many unrelated clients
  jurisdictions: Global; FATF names ports with high seizure volumes incl. Lomé, Dar es Salaam, Manila,
    Mombasa, Sihanoukville, Apapa (Lagos), Matadi, Haiphong, Danang, Hangzhou (list not exhaustive)
  version: 1
- id: EN-002
  name: Re-used containers, consignees, transporters, clearing agents or exporters from earlier wildlife
    cases
  definition: A shipment or payment involves the same container, consignee, transporter, clearing agent
    or exporter that appeared in other cases believed to involve illegal wildlife trade.
  areas:
  - EN
  typology: Network re-use of logistics intermediaries
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, A. Client profiles, p.60
    quote: Use of common containers, consignees, transporter, clearing agents, or exporters as seen in
      other cases believed to involve IWT.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A consignee named in a past ivory seizure appears as buyer on a new timber shipment
  cases: []
  data_needed:
  - Company
  - Person
  - Document (bill of lading, container number, customs entry)
  - UnknownLink or Associate (links to prior case parties)
  - Address
  checkable: lookups
  lookup_sources:
  - Court records and seizure reports
  - Customs/bill-of-lading databases
  - Adverse media and NGO investigation reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Large clearing agents and transporters handle thousands of shipments and may have been unwittingly
    used once
  - Container numbers are reused by shipping lines for unrelated cargo
  jurisdictions: Global
  version: 1
- id: EN-003
  name: Officials with wildlife, forestry, customs or natural-resource duties holding unexplained cash
    or wealth
  definition: Government officials who protect or manage wildlife, forests, mines, borders, customs or
    seized-product stockpiles receive large cash deposits, wire transfers or show wealth their pay cannot
    explain.
  areas:
  - CO
  - EN
  typology: Corruption of officials enabling environmental crime
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, B. Transactions and client account activity, p.61
    quote: Large cash deposit by government officials working in wildlife protection agencies, border
      control or customs and revenue officials.
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, B, p.61
    quote: who have specific management or oversight authority of government stockpiles of seized ivory,
      rhino horn, timber, or other illegal wildlife products.
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering from Environmental Crime
    publisher: FATF
    year: '2021'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html
    locator: Annex A, Customers, p.54
    quote: Unexplained wealth, cash transfers involving senior officials, politically exposed persons
      (or family members of) with a position of responsibility related to the management or preservation
      of natural resources (e.g. forestry or mining officials).
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A CITES Management Authority employee makes repeated cash deposits far above salary
  - A police officer's brother-in-law's account receives proceeds from armadillo sales (Indonesia, FATF
    2020 Box 8)
  cases: []
  data_needed:
  - Person (position, employer)
  - Employment
  - Family
  - BankAccount
  - Payment
  - Asset/RealEstate/Vehicle
  checkable: lookups
  lookup_sources:
  - Asset declarations of public officials
  - Land and vehicle registries
  - PEP databases
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: FATF states environmental crime success is strongly linked to corruption, which provides falsified
      permits and safe passage.
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html
  innocent_explanations:
  - Inheritance, sale of family property or a spouse's business income
  - Legitimate side business declared to the employer
  - Cash-based economies where salaries and savings are commonly held in cash
  jurisdictions: Global
  version: 1
- id: EN-004
  name: Politically exposed person with environmental oversight tied to resource businesses or offshore
    trips
  definition: A PEP, wealthy businessperson or public official with oversight of the environment, game,
    forestry or land rights is involved in wildlife or resource transactions, or travels to offshore centres
    for undisclosed business.
  areas:
  - CO
  - EN
  typology: Elite capture of natural-resource rents
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, A. Client profiles, p.60
    quote: Activity involving PEPs and wealthy businessmen/women, particularly those with environmental,
      game, or forestry oversight or environmental or wildlife-related businesses
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering from Environmental Crime
    publisher: FATF
    year: '2021'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html
    locator: Annex A, Customers, p.55
    quote: PEP or public official with responsibilities for environment management/protection or land/tenure
      rights travelling to offshore jurisdictions for undisclosed business activities.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A forestry minister's relative holds shares in a logging concessionaire
  - A mining official makes repeated trips to an offshore financial centre
  cases: []
  data_needed:
  - Person (PEP status, position)
  - Family
  - Associate
  - Ownership
  - Directorship
  - Company
  - Event (travel)
  checkable: lookups
  lookup_sources:
  - PEP lists
  - Company registries and beneficial ownership registers
  - Asset declarations
  - Leaked offshore data (e.g. ICIJ Offshore Leaks)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Natural-resource officials and PEPs controlling licences are a known corruption channel.
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html
  - target_area: SF
    reason: Gertler case shows mining corruption can lead to sanctions designations.
    source_url: https://home.treasury.gov/news/press-releases/sm0417
  innocent_explanations:
  - PEPs may own legitimate businesses declared under conflict-of-interest rules
  - Officials travel abroad for conferences, training or family reasons
  jurisdictions: Global
  version: 1
- id: EN-005
  name: Legal wildlife business used as a front
  definition: A licensed zoo, breeder, exotic pet shop, safari company, wildlife-medicine maker, collector
    or reserve is involved in transactions, giving cover for illegal trade.
  areas:
  - EN
  typology: Laundering illegal specimens through legal wildlife trade
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, A. Client profiles, p.60
    quote: Involvement of legal wildlife-related entities such as private zoos, breeders, (exotic) pet
      stores, safari companies, pharmaceutical companies making medicines containing wildlife and wildlife
      collectors or reserves.
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Box 4, p.18
    quote: Legitimate pet stores and private “zoos”, “farms” or “parks” are often used to facilitate the
      illicit pet trade
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A private 'tiger zoo' selling cubs and parts using false receipts (FATF 2020 Box 4)
  - A fish farm used to hold smuggled glass eels before export (German and UK cases)
  cases: []
  data_needed:
  - Company (licence type)
  - License
  - Payment
  - Document (CITES permits, breeding records)
  - Person
  checkable: lookups
  lookup_sources:
