    publisher: US Treasury / FinCEN (Code of Federal Regulations, eCFR)
    year: '2026'
    url: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-C/section-1010.330
    locator: 31 CFR 1010.330(a)(1)(i); 15-day filing rule at 1010.330 (initial payment in excess of $10,000)
    quote: Any person ... who, in the course of a trade or business in which such person is engaged, receives
      currency in excess of $10,000 in 1 transaction (or 2 or more related transactions) shall, except
      as otherwise provided, make a report of information with respect to the receipt of currency.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-10'
