  - CITES Trade Database
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Most licensed zoos, breeders and pet shops trade legally; 97% of CITES-listed species can be traded
    commercially under permit (FATF 2020 Box 2)
  jurisdictions: Global; FATF notes Asia and the Americas for the pet trade
  version: 1
- id: EN-006
