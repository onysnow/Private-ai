    year: 2020 (reported)
    jurisdiction: South Africa
    what_happened: About 12 people allegedly poached and dehorned rhino, bribed a park official and laundered
      proceeds through cash purchases of property and luxury vehicles worth about USD 1 million. Charged
      with rhino offences, corruption, murder, money laundering and racketeering; case ongoing.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    source_title: 'FATF (2020) Money Laundering and the Illegal Wildlife Trade, Box 7 (source: South Africa)'
