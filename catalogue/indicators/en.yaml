    quote_verified: true
    checked: '2026-10-09'
  - title: Commission Delegated Regulation (EU) 2019/1122 supplementing Directive 2003/87/EC as regards
      the functioning of the Union Registry
    publisher: European Commission (Commission Delegated Regulation (EU) 2019/1122), retained-text copy
      on legislation.gov.uk (The National Archives)
    year: '2019'
    url: https://www.legislation.gov.uk/eur/2019/1122/data.htm
    locator: Article 35(3), Execution of transfers; see also Article 35(5)-(6) (abort at least two hours
      before execution)
    quote: The central administrator shall ensure that all transfers specified in Article 55 to accounts
      not indicated on the trusted account list and transfers from an Auction Collateral Delivery Account,
      proposed for execution before 12.00 CET of a working day, are executed at 12.00 CET of the following
      working day.
    quote_verified: true
    licence: Open Government Licence v3.0 (legislation.gov.uk); EU text © European Union, reuse permitted
    checked: '2026-10-10'
  examples:
