  version: 1
- id: EN-085
  name: Claim omits or hides information buyers need, or cherry-picks the good parts
  definition: A green claim leaves out important facts, such as significant negative impacts, so the product
    or business looks greener than it is.
  areas:
  - EN
  typology: Greenwashing - misleading environmental claims
  status: verified
  sources:
  - title: Green Claims Code
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: 'Principle 3: Claims must not omit or hide important information'
    quote: Claims made by businesses must not omit or hide information that consumers need to make informed
      choices.
    quote_verified: true
    checked: '2026-10-10'
  - title: Green Claims Code
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: Principle 3
    quote: Cherry-picking information like this is likely to make consumers think a product, service,
      process, brand or business as a whole is greener than it really is.
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 260
    publisher: US Federal Trade Commission (eCFR)
    year: '2012'
    url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-B/part-260
    locator: § 260.3 General principles
    quote: To prevent deceptive claims, qualifications and disclosures should be clear, prominent, and
      understandable.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - An airline promotes a small biofuel trial while not mentioning fleet-wide emissions growth
  - Key conditions of a claim are in small print far from the claim
  cases: []
  data_needed:
  - Company
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Company sustainability reports
  - Emissions disclosures (e.g. CDP, mandatory GHG reporting)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Space limits on labels; the full information is on a linked page
  - The omitted impact is minor in context
  - The company publishes full sustainability reporting elsewhere
  jurisdictions: UK, US
  version: 1
