- id: EN-083
  name: Vague, all-encompassing green claim ('eco', 'sustainable', 'environmentally friendly') with no
    specifics
  definition: A company describes a product, service or the whole business with a broad green word or
    phrase without saying what it means or proving it.
  areas:
  - EN
  typology: Greenwashing - misleading environmental claims
  status: verified
  sources:
  - title: 'Green Claims Code: environmental claims on goods and services'
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: 'Principle 2: Claims must be clear and unambiguous'
    quote: General or all-encompassing sustainability claims such as 'environmentally friendly', 'eco',
      or 'sustainable' don't provide any real indication of what is meant.
    quote_verified: true
    checked: '2026-10-10'
  - title: Directive (EU) 2024/825 (Empowering consumers for the green transition), Annex I point 4a
    publisher: European Parliament and Council (EUR-Lex)
    year: '2024'
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024L0825
    locator: Annex, amendment to Annex I of Directive 2005/29/EC, point 4a
    quote: Making a generic environmental claim for which the trader is not able to demonstrate recognised
      excellent environmental performance relevant to the claim.
    quote_verified: true
    checked: '2026-10-10'
  - title: Guides for the Use of Environmental Marketing Claims, 16 CFR Part 260
    publisher: US Federal Trade Commission (eCFR)
    year: '2012'
    url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-B/part-260
    locator: § 260.4 General environmental benefit claims
    quote: Unqualified general environmental benefit claims are difficult to interpret and likely convey
      a wide range of meanings.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Packaging says 'eco-friendly' with no explanation of which environmental benefit is meant
  - A brand advertises itself as 'sustainable' across all its lines
  cases: []
  data_needed:
  - Company
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Advertising and packaging archives
  - Company websites (archived versions)
  - EU Ecolabel and national ecolabel registers
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: a generic environmental claim not specified on
      the same medium and without demonstrated recognised excellent environmental performance (EU Annex
      I 4a)'
    threshold_source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024L0825
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: The EU rule is part of the Unfair Commercial Practices Directive blacklist, i.e. consumer-protection
      law.
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024L0825
  innocent_explanations:
  - The specifics are given elsewhere on the same label or page
  - The product holds a recognised official ecolabel (e.g. EU Ecolabel) that backs the general claim
  - Marketing copy predates the 2024 EU rules and has not yet been updated
  jurisdictions: UK, EU, US
  version: 1
- id: EN-084
  name: Green claim the company cannot back up with current, robust evidence
  definition: An environmental claim is made without credible, up-to-date evidence (often scientific)
    that shows it is true.
  areas:
  - EN
  typology: Greenwashing - misleading environmental claims
  status: verified
  sources:
  - title: Green Claims Code
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: 'Principle 6: Claims must be substantiated'
    quote: Businesses should therefore be able to back up their claims.
    quote_verified: true
    checked: '2026-10-10'
  - title: Green Claims Code
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: 'Principle 6: Claims must be substantiated'
    quote: They should hold robust, credible, relevant and up to date evidence that supports them.
    quote_verified: true
    checked: '2026-10-10'
  - title: 16 CFR Part 260
    publisher: US Federal Trade Commission (eCFR)
    year: '2012'
    url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-B/part-260
    locator: § 260.2 Interpretation and substantiation of environmental marketing claims
    quote: a reasonable basis often requires competent and reliable scientific evidence.
    quote_verified: true
    checked: '2026-10-10'
  - title: Green Claims Code
    publisher: UK Competition and Markets Authority
    year: '2021'
    url: https://www.gov.uk/government/publications/green-claims-code-making-environmental-claims/environmental-claims-on-goods-and-services
    locator: 'Principle 1: Claims must be truthful and accurate'
    quote: Businesses must live up to the environmental claims they make about products, services, brands
      and activities.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A company cannot produce the test or study behind a 'uses 30% less water' claim
  - Evidence relied on is years old and predates a change in the product
  cases: []
  data_needed:
  - Company
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Right-of-reply request to the company
  - Advertising regulator rulings (e.g. ASA)
  - Published life-cycle assessments
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: the trader cannot produce evidence supporting
      the claim'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Evidence exists but is commercially confidential and was not published
  - Evidence is held by a supplier or certifier rather than the brand
  - The claim is accurate but evidence is still being updated after a product change
