    source_url: https://www.interpol.int/content/download/5172/file/Guide%20to%20Carbon%20Trading%20Crime.pdf
    source_title: INTERPOL Guide to Carbon Trading Crime, Section 4.9, p. 22
  - name: German registry phishing attack
    year: '2010'
    jurisdiction: Germany and others
    what_happened: Phishing emails led to the theft of 250,000 credits worth EUR 3.2 million; registries
      in nine countries closed, and the German registry was shut for a week. No prosecution outcome is
      reported.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.interpol.int/content/download/5172/file/Guide%20to%20Carbon%20Trading%20Crime.pdf
    source_title: INTERPOL Guide to Carbon Trading Crime, Section 4.10, p. 24
  data_needed:
  - UserAccount
  - Email
  - Company
  - Person
  - Payment
  - Document (registry transfer logs)
  checkable: records
  lookup_sources:
  - Registry incident notices
  - Lists of stolen allowance serial numbers
  levels:
    faint: Allowances are moved out of an account to an account not on its trusted account list. The rules
      hold such a transfer until 12.00 CET of the following working day (or the second working day if
      it is proposed after 12.00 CET), so the holder has time to spot it.
    strong: The holder did not authorise the transfer, and it was not aborted at least two hours before
      execution, the latest point at which the holder or national administrator can stop a suspected fraudulent
      transfer.
    textbook: Allowances taken from a hijacked account pass the delay and are moved on or sold as soon
      as they arrive. This is the theft pattern the delay rule was written to stop. It meets the published
      definition as worded.
    threshold_source: https://www.legislation.gov.uk/eur/2019/1122/data.htm
    threshold_note: This number is an anti-theft delay window built into the EU Union Registry, not a
      red-flag trigger. It sets how long a transfer to an untrusted account must wait and how late it
      can be aborted ('at least two hours before its execution', Art. 35(5)-(6)). It is the only published
      time figure that applies directly to fast movement of stolen allowances. The copy read is the UK-retained
      version on legislation.gov.uk; check it against the current EUR-Lex consolidated text, which could
      not be loaded because of a bot block. The INTERPOL Guide gives no figure for how fast stolen credits
      were moved. Registry dates, not account logs, are needed to apply this.
  threshold_verified: true
  cross_hints:
  - target_area: CY
    reason: Account takeover through phishing and hacking is the core method.
    source_url: https://www.interpol.int/content/download/5172/file/Guide%20to%20Carbon%20Trading%20Crime.pdf
  innocent_explanations:
  - Legitimate quick transfers between a company's own accounts
  - Real registry notices asking users to update their details
  jurisdictions: European Union, Australia and others
  version: 2
