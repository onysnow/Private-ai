  lookup_sources:
  - Land registry
  - Vehicle registry
  - Court records
  levels:
    faint: Cash purchases of vehicles, jewellery, art or property at or below $10,000 each, especially
      several linked ones (related payments are added together toward the $10,000 figure).
    strong: A business receives more than $10,000 in cash for one purchase, or for two or more related
      purchases, from a person tied to wildlife or resource crime.
    textbook: 'Meets the published reporting threshold as worded: currency of more than $10,000 received
      in one transaction or two or more related transactions, which must be reported within 15 days.'
    threshold_source: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-C/section-1010.330
    threshold_note: US only (IRS/FinCEN Form 8300). The IRS Form 8300 Reference Guide (irs.gov, last updated
      27-Jul-2026) gives the same figure, 'The amount of cash received is more than $10,000'. It also
      says payments within a 12-month period count together, and its worked examples include cash purchases
      of cars and jewellery. The FATF wildlife report gives no number. The EU's cash-payment limit under
      the AML Regulation was not opened and is not used. The 'bought through others' names' part has no
      published number.
  threshold_verified: true
