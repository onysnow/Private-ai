- id: EN-008
  name: Suspicious CITES paperwork or false captive-bred / pre-Convention claims
  definition: Legal-looking wildlife shipments come with CITES certificates that are odd, incomplete or
    suspicious, or wild-caught animals are declared as captive-bred or as pre-dating the Convention.
  areas:
  - EN
  - FR
  typology: Laundering wildlife through fraudulent permits
  status: verified
  sources:
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Annex A, B, p.61
    quote: Shipments of legal wildlife (fauna and flora) with anomalous, incomplete, or otherwise suspicious
      CITES certificates.
    quote_verified: true
    checked: '2026-10-09'
  - title: Money Laundering and the Illegal Wildlife Trade
    publisher: FATF
    year: '2020'
    url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    locator: Box 2, p.11
    quote: wild-caught animals falsely declared as captive-bred, wildlife falsely declared as being pre-Convention
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - CITES permit numbers that do not exist in the issuing country's records
  - Large exports of 'captive-bred' animals of a species that rarely breeds in captivity
  cases:
  - name: Dutch exotic bird and monkey smuggling network
    year: '2017'
    jurisdiction: Netherlands
    what_happened: A network moved protected birds, monkeys and big cats through several countries using
      falsified health, trade and CITES documents and bribed customs officers. Suspect 1 was sentenced
      to 15 months for nature-protection crimes and forgery of CITES documents; suspect 2 to 8 months;
      over EUR 70,000 confiscated.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.fatf-gafi.org/en/publications/Environmentalcrime/Money-laundering-wildlife-trade.html
    source_title: 'FATF (2020) Money Laundering and the Illegal Wildlife Trade, Box 35 (source: Netherlands)'
  data_needed:
  - 'Document (CITES permit: number, issuer, species, quantity, source code)'
  - Company
  - Person
  - License
  checkable: lookups
  lookup_sources:
  - CITES Trade Database
  - National CITES Management Authority
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: In the Dutch case the network relied on bribery of customs officers to move animals on forged
