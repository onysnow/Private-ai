    checked: '2026-10-09'
  - title: FinCEN Advisory FIN-2017-A003
    publisher: FinCEN
    year: '2017'
    url: https://www.fincen.gov/resources/advisories/fincen-advisory-fin-2017-a003
    locator: Geographic Targeting Orders section
    quote: over 30 percent of the real estate transactions reported under the GTOs involved a beneficial
