key: ML
name: Money laundering
scope: money laundering in general, trade-based money laundering, real estate, cash-intensive businesses,
  professional money launderers, crypto-assets used for laundering. Also check whether the coded data
  behind Akartuna, Johnson & Thornton (2024, Journal of Experimental Criminology, doi 10.1007/s11292-024-09623-y,
  2,565 indicators from 105 typology reports) is downloadable, and report what you find.
indicators:
- id: ML-001
  name: Complex or illogical ownership structure
  definition: The company's ownership or the deal's structure is more layered than the business needs,
    for example chains of shell companies or companies in high-risk places, so it is hard to see who really
    owns or controls it.
  areas:
  - ML
  typology: Concealment of beneficial ownership
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: 'Structural risk indicators, p.3 (copy of the FATF PDF; FATF landing page: https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-based-money-laundering-indicators.html)'
    quote: The corporate structure of a trade entity appears unusually complex and illogical, such as
      the involvement of shell companies or companies registered in high-risk jurisdictions.
    quote_verified: true
    licence: © 2021 FATF–Egmont Group
    checked: '2026-10-09'
  - title: Guidance for a Risk-Based Approach for the Real Estate Sector
    publisher: FATF
    year: '2022'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/guidance/RBA-Real-Estate-Sector.pdf
    locator: Part Three, Risk categories, transaction risks (para 105)
    quote: Transactions which evidence complex ownership structures or where the beneficial owner is obfuscated.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'BSA/AML Examination Manual, Appendix F: Money Laundering and Terrorist Financing Red Flags'
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Trade Finance
    quote: Transaction structure appears unnecessarily complex and designed to obscure the true nature
      of the transaction.
    quote_verified: true
    licence: US government work
    checked: '2026-10-09'
  - title: 'Consultation Paper EBA/CP/2025/04: Proposed RTS in the context of the EBA''s response to the
      European Commission''s Call for advice on new AMLA mandates'
    publisher: European Banking Authority
    year: '2025'
    url: https://eba.europa.eu/sites/default/files/2025-03/9bc83e61-e9a1-4e91-93de-2af8325e0182/Consultation%20Paper%20on%20Response%20to%20Call%20for%20Advice%20new%20AMLA%20mandates.pdf
    locator: Page 41, draft RTS on CDD, Article 11(1)
    quote: obliged entities shall treat an ownership and control structure as complex where there are
      two or more layers between the customer and the beneficial owner and in addition, one of the following
      conditions is met
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A trading firm owned by a BVI company, owned in turn by a Seychelles company, with no named natural
    person
  - A bank's non-resident customers moving funds through shell companies that hid the true owners (Danske
    Bank Estonia)
  cases:
  - name: Danske Bank A/S
    year: '2022'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: Pleaded guilty to conspiracy to commit bank fraud; DOJ said Danske Bank Estonia's non-resident
      portfolio moved about $160 billion through US banks, with staff helping clients route money through
      shell companies that hid who owned the funds; agreed forfeiture of $2.059 billion.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/danske-bank-pleads-guilty-fraud-us-banks-multi-billion-dollar-scheme-access-us-financial
    source_title: Danske Bank Pleads Guilty to Fraud on U.S. Banks in Multi-Billion Dollar Scheme
  data_needed:
  - Company (name, jurisdiction, incorporationDate, registrationNumber)
  - Ownership (owner, asset, percentage, startDate)
  - Directorship (director, organization)
  - Person (name, nationality)
  - Address
  checkable: lookups
  lookup_sources:
  - company registries
  - beneficial ownership registers
  - offshore leaks databases
  - OpenCorporates
  levels:
    faint: Two or more layers of companies sit between the customer and the beneficial owner
    strong: 'Two or more layers, plus one of the aggravating conditions: a trust-like arrangement in a
      layer, entities in different jurisdictions, nominees, or a structure that obscures ownership with
      no clear economic reason'
    textbook: 'Meets the EBA draft definition of a complex structure as worded: two or more layers plus
      at least one listed condition'
    threshold_source: https://eba.europa.eu/sites/default/files/2025-03/9bc83e61-e9a1-4e91-93de-2af8325e0182/Consultation%20Paper%20on%20Response%20to%20Call%20for%20Advice%20new%20AMLA%20mandates.pdf
    threshold_note: EU only; this is a draft Regulatory Technical Standard under AMLR 2024/1624, Art.
      20(1)(b), not yet final law. AMLA's later consultation draft (9 Feb 2026, Art. 12(1), read via a
      mirror at dirittobancario.it) raises the bar to 'three or more layers between the customer and the
      beneficial owner' plus more than one condition, so the final figure may change. FATF/Egmont, FATF
      real-estate guidance and FFIEC (the cited sources) give no layer count. The World Bank's Puppet
      Masters report and the FATF/Egmont Concealment of Beneficial Ownership summary were also checked;
      neither gives a layer threshold.
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Layered shell structures were used to move funds allegedly misappropriated from a state fund
      (1MDB) into luxury property.
    source_url: https://www.justice.gov/archives/opa/pr/united-states-reaches-settlement-recover-more-700-million-assets-allegedly-traceable
  innocent_explanations:
  - Holding structures used for tax planning, financing or limiting liability
  - Joint ventures and inherited family structures
  - Investment funds that legitimately pool many owners
  jurisdictions: Global (FATF, FFIEC US)
  version: 2
- id: ML-002
  name: Entity registered in, or dealing with, a weak-AML jurisdiction
  definition: The company is registered or has offices where anti-money-laundering rules are weak, or
    does business with or ships through higher-risk places, without a clear business reason.
  areas:
  - ML
  typology: Geographic risk
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: A trade entity is registered or has offices in a jurisdiction with weak AML/CFT compliance.
    quote_verified: true
    checked: '2026-10-09'
  - title: BSA/AML Examination Manual, Appendix F
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Trade Finance
    quote: Customers conducting business in higher-risk jurisdictions.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - An importer whose only office is in a jurisdiction on the FATF list of jurisdictions under increased
    monitoring
  cases: []
  data_needed:
  - Company (jurisdiction, mainCountry)
  - Address (country)
  - Payment (payer, beneficiary, payerAccount, beneficiaryAccount)
  - BankAccount (bankName, country)
  checkable: lookups
  lookup_sources:
  - FATF high-risk and increased-monitoring lists
  - company registries
  - national risk assessments
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: FATF VA red flags list transactions and IP addresses linked to sanctioned jurisdictions alongside
      weak-regulation jurisdictions.
    source_url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
  innocent_explanations:
  - The firm is local to that country
  - Trade in goods only produced or sold there
  - Regional hub offices
  jurisdictions: Global
  version: 1
- id: ML-003
  name: Mass-registration or unsuitable business address
  definition: The company's address is one used by many companies (a formation agent or post box) or is
    a home or building that does not fit the stated business.
  areas:
  - ML
  typology: Shell company indicators
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3 and footnote 4
    quote: A trade entity is registered at an address that is likely to be a mass registration address
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: The business activity of a trade entity does not appear to be appropriate for the stated address
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Hundreds of companies registered at one trust and company service provider's office
  - A wholesale importer registered to a flat with no warehouse
  cases: []
  data_needed:
  - Company (address, registrationNumber)
  - Address (full, postalCode)
  - Ownership
  - Directorship
  checkable: lookups
  lookup_sources:
  - company registries (count companies per address)
  - OpenCorporates
  - street-view or property records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Small firms legitimately use registered-agent or accountant addresses
  - Start-ups run from home
  - Virtual offices for remote businesses
  jurisdictions: Global
  version: 1
- id: ML-004
  name: Thin, copied or impersonating online presence
  definition: The company has no website, or a website copied from others that shows no real knowledge
    of its trade, or a name that imitates a well-known company.
  areas:
  - ML
  typology: Shell company indicators
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: A trade entity lacks an online presence or the online presence suggests business activity inconsistent
      with the stated line of business
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: The name of a trade entity appears to be a copy of the name of a well-known corporation or
      is very similar to it
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A 'Siemens Trading Ltd' unrelated to Siemens
  - A website with boilerplate text lifted from another firm
  cases: []
  data_needed:
  - Company (name, website, previousName)
  - LegalEntity (website, email)
  - Document (archived web pages)
  checkable: lookups
  lookup_sources:
  - web archives (Wayback Machine)
  - WHOIS/domain records
  - trademark registries
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: Lookalike names and copied websites are also used in impersonation and invoice fraud; FATF
      notes the name may be used to appear part of the bigger corporation.
    source_url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
  innocent_explanations:
  - Small B2B traders often have no website
  - Common or descriptive names that happen to resemble big brands
  jurisdictions: Global
  version: 1
- id: ML-005
  name: Company shows no normal business activity
  definition: The company's accounts show none of the ordinary costs of running a business (wages, rent,
    taxes), it has very few staff for its trade volume, or it does not file routine returns.
  areas:
  - ML
  typology: Shell / front company
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: A trade entity displays a notable lack of typical business activities, e.g. it lacks regular
      payroll transactions in line with the number of stated employees, transactions relating to operating
      costs, tax remittances.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: An entity is not compliant with regular business obligations, such as filing VAT returns.
    quote_verified: true
    checked: '2026-10-09'
  - title: BSA/AML Examination Manual, Appendix F
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Shell Company Activity
    quote: Purpose of the shell company is unknown or unclear.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A firm turning over millions with one employee and no rent or tax payments
  cases: []
  data_needed:
  - Company (status, sector)
  - Payment (payer, beneficiary, purpose, amount, date)
  - Employment (employee, employer)
  - Document (annual accounts, tax filings)
  checkable: records
  lookup_sources:
  - company registry filings (accounts, employee counts)
  - VAT/tax registers where public
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: FATF lists failure to file VAT returns among TBML structural indicators, which also points
      to VAT fraud.
    source_url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
  innocent_explanations:
  - Costs paid by a parent or group company
  - Outsourced staff and services
  - Brokers and agents who never hold inventory
  - Late filing by a disorganised small firm
  jurisdictions: Global
  version: 1
- id: ML-006
  name: Nominee owners or managers
  definition: 'The people listed as owners or managers look like stand-ins for someone else: they lack
    business experience, do not know the transactions, or front many companies.'
  areas:
  - ML
  typology: Nominee arrangements
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: Owners or senior managers of a trade entity appear to be nominees acting to conceal the actual
      beneficial owners
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Companies Act 2014, Section 142: Limitation on number of directorships'
    publisher: Irish Statute Book (Office of the Attorney General, Ireland)
    year: '2014'
    url: https://www.irishstatutebook.ie/eli/2014/act/38/section/142/enacted/en/html
    locator: Section 142(1)(a)
    quote: A person shall not, at a particular time, be a director of more than— (a) 25 private companies
      limited by shares
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A 22-year-old student listed as director of 40 trading companies
  cases: []
  data_needed:
  - Person (birthDate, nationality)
  - Directorship (director, organization, startDate)
  - Ownership
  - Representation
  checkable: lookups
  lookup_sources:
  - company registries (count of directorships per person)
  - OpenCorporates officer search
  - interviews
  levels:
    faint: One person is a director of many companies, but no more than the published limit of 25 (no
      lower published figure)
    strong: One person is a director of close to 25 companies (no separate published figure for this level)
    textbook: One person is a director of more than 25 private companies limited by shares, above the
      Irish statutory limit
    threshold_source: https://www.irishstatutebook.ie/eli/2014/act/38/section/142/enacted/en/html
    threshold_note: 'Ireland only: a legal cap on directorships, not an AML red-flag figure. Public limited
      companies and some other company types are excluded from the count (s.142(3)), and an exemption
      certificate can raise the limit. Used for the ''fronts many companies'' part of the definition.
      The other parts (lack of experience, not knowing the transactions) are not countable. The cited
      FATF/Egmont source gives no number. UK Companies House has no statutory cap; UK limits were only
      proposed.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Professional directors and company secretaries who legitimately sit on many boards
  - Family members named as directors for succession or tax reasons
  jurisdictions: Global
  version: 2
- id: ML-007
  name: Adverse media or known criminal links
  definition: The company, its owners or managers, or the customer appear in negative news, investigations
    or convictions related to laundering, fraud, tax evasion or other crime.
  areas:
  - CY
  - ML
  typology: Customer risk
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: A trade entity, or its owners or senior managers, appear in negative news
    quote_verified: true
    checked: '2026-10-09'
  - title: Virtual Assets Red Flag Indicators of Money Laundering and Terrorist Financing
    publisher: FATF
    year: '2020'
    url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
    locator: Red flags about senders or recipients – Profile, p.13 (copy of FATF report hosted by Saudi
      GDFI)
    quote: A customer is known via publicly available information to law enforcement due to previous criminal
      association.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A director previously convicted of fraud in another country
  cases: []
  data_needed:
  - Person
  - Company
  - Document (press articles, court records)
  - Sanction
  checkable: lookups
  lookup_sources:
  - news archives
  - court records
  - sanctions and PEP lists (e.g. OpenSanctions)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Name matches with a different person
  - Old or unproven allegations
  - Acquittals or dropped cases
  jurisdictions: Global
  version: 1
- id: ML-008
  name: Dormancy then sudden burst of activity
  definition: A new or long-dormant company or account suddenly handles large, high-value business, then
    goes quiet again after a short time.
  areas:
  - CY
  - ML
  typology: Transaction pattern
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Trade activity risk indicators, p.4
    quote: A newly formed or recently re-activated trade entity engages in high-volume and high-value
      trade activity
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Account and transaction activity risk indicators, p.6
    quote: Transaction activity associated with a trade entity increases in volume quickly and significantly,
      and then goes dormant after a short period of time.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Structural risk indicators, p.3
    quote: A trade entity has unexplained periods of dormancy.
    quote_verified: true
    checked: '2026-10-09'
  - title: Inoperative Accounts/Unclaimed Deposits in Banks - Revised Instructions (RBI/2023-24/105, DOR.SOG
      (LEG).REC/64/09.08.024/2023-24)
    publisher: Reserve Bank of India
    year: '2024'
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12589&Mode=0
    locator: Annex, Part I, para 1(a)(iv) (definition); para 4.1 (monitoring after reactivation)
    quote: A savings/ current account shall be treated as inoperative, if there are no 'customer induced
      transactions' in the account for a period of over two years. [...] The transactions in inoperative
      accounts, which have been reactivated, shall be monitored regularly, for at least six months, at
      higher levels (i.e. by controlling authorities of the concerned branch) without the knowledge and
      notice of the customers and the dealing staff.
    quote_verified: true
    licence: Not stated
    checked: '2026-10-10'
  examples:
  - A company incorporated last month that imports $20m of electronics, then stops trading
  cases: []
  data_needed:
  - Company (incorporationDate, status, dissolutionDate)
  - Payment (date, amount)
  - BankAccount (opening date)
  checkable: records
  lookup_sources:
  - company registry (incorporation and filing history)
  levels:
    faint: An account or company comes back to life after a long quiet spell and starts handling large
      amounts, but the quiet spell was shorter than two years.
    strong: An account with no customer-made transactions for over two years is reactivated and handles
      large, high-value business soon after.
    textbook: An account with no customer-made transactions for over two years (inoperative under the
      published definition) is reactivated, then shows large activity within the six months after reactivation,
      when the regulator requires closer monitoring.
    threshold_source: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12589&Mode=0
    threshold_note: The number comes from the Reserve Bank of India's rules on inoperative accounts. They
      define dormancy as over two years with no customer-made transactions and require at least six months
      of closer monitoring after reactivation to reduce fraud risk. This is an Indian banking rule about
      accounts, not a global standard for trade companies. The cited FATF-Egmont TBML indicators (cbr.ru
      copy) have no number; The full text was checked. Singapore STRO bank indicators ('Large cash withdrawals
      from a previously dormant/inactive account') also give no period. The AUSTRAC 2024 money-mule guide
      has no dormancy figure.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Seasonal businesses
  - Project companies set up for one contract
  - Start-ups winning a big first order
  jurisdictions: Global
  version: 2
- id: ML-009
  name: Trade inconsistent with stated line of business
  definition: A company buys or sells goods that have nothing to do with its declared business, or deals
    through many unrelated middlemen in other trades.
  areas:
  - ML
  typology: Trade-based money laundering
  status: verified
  sources:
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Trade activity risk indicators, p.4
    quote: Trade activity is inconsistent with the stated line of business of the entities involved, e.g.,
      a car dealer is exporting clothing or a precious metals dealer is importing seafood.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Trade-Based Money Laundering: Risk Indicators'
    publisher: FATF and Egmont Group
    year: '2021'
    url: https://www.cbr.ru/Content/Document/File/119937/TBLMRI.PDF
    locator: Trade activity risk indicators, p.4
    quote: A trade entity engages in complex trade deals involving numerous third-party intermediaries
      in incongruent lines of business.
    quote_verified: true
    checked: '2026-10-09'
  - title: BSA/AML Examination Manual, Appendix F
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Activity Inconsistent with the Customer's Business
    quote: Goods or services purchased by the business do not match the customer’s stated line of business.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A produce company paying a leather goods business and a textile maker in China (FinCEN funnel-account
    example)
  - Money exchange houses wiring funds to buy used cars for West Africa (Lebanese Canadian Bank case)
  cases:
  - name: Lebanese Canadian Bank SAL
    year: '2013'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: US prosecutors alleged at least $329 million was wired into the US, mainly via two
      Lebanese exchange houses, to buy used cars shipped to West Africa, with sale proceeds and narcotics
      proceeds moved to Lebanon through Hizballah-linked channels; LCB agreed to forfeit $102 million
      to settle civil forfeiture and money laundering claims. The release does not state an admission
      of liability.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/usao-sdny/pr/manhattan-us-attorney-announces-102-million-settlement-civil-forfeiture-and-money
    source_title: Manhattan U.S. Attorney Announces $102 Million Settlement Of Civil Forfeiture And Money
