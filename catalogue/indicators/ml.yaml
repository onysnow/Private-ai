    locator: Part Three, client risk (para 104)
    quote: The use of foreign companies for purchase of real estate.
    quote_verified: true
    checked: '2026-10-09'
  - title: Guidance for a Risk-Based Approach for the Real Estate Sector
    publisher: FATF
    year: '2022'
