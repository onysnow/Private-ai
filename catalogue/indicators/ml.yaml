- id: ML-082
  name: Sequentially numbered money orders or traveller's cheques, or bulk third-party items from exchange
    houses
  definition: Money orders, traveller's cheques or cashier's cheques with consecutive serial numbers or
    odd stamps are deposited, often by mail, or foreign exchange houses deposit many third-party instruments,
    which suggests cash was split into instruments to avoid reports.
  areas:
  - ML
  typology: Structuring through monetary instruments
  status: verified
  sources:
  - title: 'BSA/AML Examination Manual, Appendix F: Money Laundering and Terrorist Financing Red Flags'
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Other Unusual or Suspicious Customer Activity
    quote: Monetary instruments deposited by mail are numbered sequentially or have unusual symbols or
      stamps on them.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'BSA/AML Examination Manual, Appendix F: Money Laundering and Terrorist Financing Red Flags'
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Cross-Border Financial Institution Transactions
    quote: Casas de cambio deposit numerous third-party items, including sequentially numbered monetary
      instruments
    quote_verified: true
    checked: '2026-10-09'
  - title: 31 CFR 1010.415 Purchases of bank checks and drafts, cashier's checks, money orders and traveler's
      checks
    publisher: US Treasury, FinCEN (Code of Federal Regulations, 31 CFR 1010.415)
    year: '2025'
    url: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-D/section-1010.415
    locator: 31 CFR 1010.415(a)
    quote: No financial institution may issue or sell a bank check or draft, cashier's check, money order
      or traveler's check for $3,000 or more in currency unless it maintains records of the following
      information, which must be obtained for each issuance or sale of one or more of these instruments
      to any individual purchaser which involves currency in amounts of $3,000-$10,000 inclusive
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-10'
  examples:
  - Twenty money orders of $900 each, numbered consecutively and bought at the same store, are mailed
    in for deposit.
  cases: []
  data_needed:
  - Document (instrument images with serial numbers)
  - Payment (amount, date, issuer)
  - Company (casa de cambio or money services business)
  - BankAccount
  checkable: records
  lookup_sources:
  - Bank deposit records (in court files)
  - Money services business registers (e.g. FinCEN MSB registration search)
  levels:
    faint: Sequentially numbered money orders, traveller's cheques or cashier's cheques each bought for
      less than $3,000 in cash, the level at which the seller must keep purchaser records.
    strong: Sequential instruments bought with cash in the $3,000 to $10,000 recordkeeping band, or many
      smaller instruments that together exceed $10,000.
    textbook: 'Meets the published definition as worded: sequential or oddly stamped instruments, or bulk
      third-party items from exchange houses, used to split cash around the $3,000 and $10,000 lines.'
