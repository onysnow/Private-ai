- id: ML-060
  name: Business receives sales or export money but never buys stock
  definition: A business regularly receives payments for exports or online sales, or from countries it
    has no link to, but shows no purchases of inventory to match.
  areas:
  - ML
  typology: Mirror transactions / TBML
  status: verified
  sources:
  - title: FinCEN Advisory FIN-2025-A003
    publisher: FinCEN
    year: '2025'
    url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
    locator: Red Flags Potentially Indicative of CMLN-Affiliated TBML Schemes, p.10
    quote: A small U.S.-based business in the electronics or real estate industry receives wires from
      Mexico, China, Hong Kong, and the United Arab Emirates and has no known nexus to these countries.
    quote_verified: true
    checked: '2026-10-08'
  - title: BSA/AML Examination Manual, Appendix F
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Other Unusual or Suspicious Customer Activity
    quote: Customer receives large and frequent deposits from online payments systems yet has no apparent
      online or auction business.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A freight company receiving 'export' wires to Mexico and the UAE with no supplier payments
  cases: []
  data_needed:
  - Company (sector, address)
  - Payment (payer, beneficiary, purpose)
  - BankAccount
  checkable: records
  lookup_sources:
  - company registry
  - customs/export data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: FinCEN ties these TBML red flags to networks laundering cartel proceeds.
    source_url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
  innocent_explanations:
  - Drop-shipping and agency models where suppliers are paid by others
  - Purchases from a different account
  jurisdictions: US; FinCEN red flags name Chinese-owned businesses, but ownership nationality alone is
    not an indicator
  version: 1
- id: ML-061
  name: Paying unrelated people's credit cards or buying luxury goods with third-party money
  definition: A business or person uses transfers from unknown people to pay off credit cards, or pays
    many unrelated individuals' cards, linked to bulk buying of electronics or luxury goods.
  areas:
  - ML
  typology: Mirror transactions / professional laundering
  status: verified
  sources:
  - title: FinCEN Advisory FIN-2025-A003
    publisher: FinCEN
    year: '2025'
    url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
    locator: Red Flags Potentially Indicative of CMLN-Affiliated TBML Schemes, p.10
    quote: A business that sells electronics or other luxury goods makes payments for multiple credit
      cards associated with various individuals, who are seemingly unrelated to the business.
    quote_verified: true
    checked: '2026-10-08'
  - title: FinCEN Advisory FIN-2025-A003
    publisher: FinCEN
    year: '2025'
    url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
    locator: Red Flags Potentially Indicative of CMLN-Affiliated TBML Schemes, p.10
    quote: A business that sells electronics or other luxury goods has income that is not commensurate
      with the size and scale of the business.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - An electronics shop paying off 30 strangers' credit cards
  cases: []
  data_needed:
  - Payment (payer, beneficiary)
  - Company
  - Person
  - BankAccount
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: FinCEN links these patterns to mirror-transfer laundering of cartel proceeds.
    source_url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
  innocent_explanations:
  - Corporate card programmes for staff
  - Family members paying each other's cards
  jurisdictions: US
  version: 1
- id: ML-062
  name: Chains of company formation agents or professional enablers
  definition: Companies are set up through chains of formation agents in several countries, or professionals
    take a tick-box approach, forge signatures or falsely notarise documents.
  areas:
  - ML
  typology: Professional money laundering – gatekeepers
  status: verified
  sources:
  - title: Professional Money Laundering
    publisher: FATF
    year: '2018'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Professional-Money-Laundering.pdf
    locator: 'Legal and professional services: TCSP behaviours'
    quote: utilising chains of formation agents in multiple jurisdictions;
    quote_verified: true
    checked: '2026-10-08'
  - title: Professional Money Laundering
    publisher: FATF
    year: '2018'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Professional-Money-Laundering.pdf
    locator: 'Legal and professional services: TCSP behaviours'
    quote: forging signatures and fraudulently notarising documents.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A UK company formed by an agent in Latvia acting for an agent in Belize
  cases: []
  data_needed:
  - Company
  - Representation (agent, client)
  - Directorship
  - Document
  checkable: lookups
  lookup_sources:
  - company registries (filing agent fields)
  - OpenCorporates
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - International groups using local agents in each country
  jurisdictions: Global
  version: 1
- id: ML-063
  name: Money transfer agents letting customers split remittances
  definition: Agents of a money transfer business let customers break up remittances among several people,
    or share a common customer base with other reported agents.
  areas:
  - ML
  typology: Structuring via MVTS
  status: verified
  sources:
  - title: Professional Money Laundering
    publisher: FATF
    year: '2018'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Professional-Money-Laundering.pdf
    locator: 'MVTS case (Source: Italy)'
    quote: the MVTS agents allowed their customers to structure transactions by splitting up remittances
      with several accomplices; and
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Ten senders sending $900 each to the same recipient on the same day
  cases: []
  data_needed:
  - Payment (payer, beneficiary, amount, date)
  - Person
  - Company (MVTS agent)
  checkable: records
  lookup_sources:
  - MSB/MVTS registers
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Family members each sending support to the same relative
  - Diaspora community collections
  jurisdictions: Global
  version: 1
not_reached:
- 'FATF PDFs on fatf-gafi.org return HTTP 403 to direct download; the TBML indicators were read from an
  identical copy hosted by the Bank of Russia (cbr.ru) and the VA red flags from a copy hosted by Saudi
  Arabia''s GDFI (aml.gov.sa). FATF landing page for TBML indicators: https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-based-money-laundering-indicators.html'
- 'FATF Professional Money Laundering (2018): read through a page-fetch tool only. No formal indicator
  list was found in the parts read; the report says one aim was to develop PML risk indicators. Only the
  TCSP, complicit-employee and MVTS case lists were used.'
- 'FATF RBA Guidance for the Real Estate Sector (2022): text read only up to about para 107. The mortgage-lender
  section and later parts were not read. Several long indicators were shown cut off and are quoted only
  as exact fragments.'
- 'FFIEC Appendix F: some longer red flags were shown cut off by the fetch tool. Only complete sentences
  or exact fragments are quoted.'
- 'Cullen Commission (BC) Final Report 2022: only the table of contents was read. Chapters 4, 15 and 19
  on real estate and scale were not reached, so none of its findings are used.'
- 'FATF–Egmont Concealment of Beneficial Ownership (2018) indicators: not reached'
- 'FATF–Egmont Trade-Based Money Laundering: Trends and Developments (2020): not read'
- 'FATF 2007 Money Laundering through the Real Estate Sector typology: not read'
- 'FinCEN real estate GTO order text and the 2024 Residential Real Estate rule (and its current legal
  status): not checked'
- 'AUSTRAC, UK (NCA/HM Treasury), EU and Egmont indicator lists: not reached'
- 'CBA case: the final Federal Court penalty order was not checked; the case is recorded from the AUSTRAC
  release on the agreed penalty'
- 'Hajiyeva v NCA [2020] EWCA Civ 108: read but not used as a case, because the court upheld an investigative
  order and made no finding of laundering. It is only cited as a cross-hint and in the glossary.'
- Springer article page for Akartuna et al. returned a JavaScript client challenge. The full text was
  read through the Springer PDF link with a page-fetch tool, and the supplements were downloaded from
  static-content.springer.com.
- City University of Hong Kong repository PDF of Akartuna et al. returned 403
