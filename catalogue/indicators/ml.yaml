- id: ML-083
  name: Unregistered informal value transfer (hawala) run through bank accounts
  definition: A business or person takes cash and cheques from many local customers, often in structured
    deposits, gathers them in one central account, and wires them to many countries for those customers,
    without a licence or registration as a money transmitter.
  areas:
  - ML
  typology: Informal value transfer systems (IVTS), hawala, unlicensed money transmission
  status: verified
  sources:
  - title: 'FinCEN Advisory: Informal Value Transfer Systems (Issue 33)'
    publisher: FinCEN (US Treasury)
    year: '2003'
    url: https://www.fincen.gov/sites/default/files/shared/advis33.pdf
    locator: IVTS-Related Transactions and Other Activity Conducted Within Financial Institutions
    quote: Structured cash deposits are made and subsequently followed by international wire transfers.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'FinCEN Advisory: Informal Value Transfer Systems (Issue 33)'
    publisher: FinCEN (US Treasury)
    year: '2003'
    url: https://www.fincen.gov/sites/default/files/shared/advis33.pdf
    locator: IVTS-Related Transactions and Other Activity Conducted Within Financial Institutions
    quote: Account activity involves only cash or monetary instrument deposits followed by one-way wire
      transfers
    quote_verified: true
    checked: '2026-10-09'
  - title: Informal Value Transfer Systems (FIN-2010-A011, updated 2022)
    publisher: FinCEN (US Treasury)
    year: 2010 (updated 2022)
    url: https://www.fincen.gov/sites/default/files/advisory/2022-07-05/FIN-2010-A11-updated_508.pdf
    locator: 'Case example: Abad''s Carnival French Ice Cream'
    quote: The deposits typically were structured to avoid reporting requirements.
    quote_verified: true
    checked: '2026-10-09'
  - title: 31 CFR 1010.311 Filing obligations for reports of transactions in currency
    publisher: US Treasury, FinCEN (Code of Federal Regulations, 31 CFR 1010.311)
    year: '2025'
    url: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-C/section-1010.311
    locator: 31 CFR 1010.311, opening sentence
    quote: Each financial institution other than a casino shall file a report of each deposit, withdrawal,
      exchange of currency or other payment or transfer, by, through, or to such financial institution
      which involves a transaction in currency of more than $10,000, except as otherwise provided in this
      section.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-10'
  examples:
  - A Brooklyn ice-cream shop's accounts took $22.2 million in cash, cheques and wires, consolidated it,
    and wired $21.9 million to 25 countries (FinCEN's Carnival example).
  cases:
  - name: United States v. Elfgeeh (Abad's Carnival French Ice Cream)
    year: '2008'
    jurisdiction: United States (2nd Cir.)
    what_happened: The Brooklyn business was convicted of operating as a money transmitter without a state
      licence after $22.2 million was deposited, largely structured, and $21.9 million wired to 25 countries
      (1996-2003).
    outcome: convicted
    outcome_verified: true
    source_url: https://www.fincen.gov/sites/default/files/advisory/2022-07-05/FIN-2010-A11-updated_508.pdf
    source_title: FinCEN Advisory FIN-2010-A011 (updated 2022)
  - name: United States v. Mazza-Alaluf
    year: '2009'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: Mauricio Alfanso Mazza-Alaluf was convicted of providing IVTS services without a licence,
      using his US bank accounts for thousands of transactions totalling hundreds of millions of dollars.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.fincen.gov/sites/default/files/advisory/2022-07-05/FIN-2010-A11-updated_508.pdf
    source_title: FinCEN Advisory FIN-2010-A011 (updated 2022)
  data_needed:
  - Company (the business running the transfers)
  - BankAccount (collection and central accounts)
  - Payment (payer, beneficiary, amount, date, country)
  - Person (customers and overseas payout agents)
  checkable: lookups
  lookup_sources:
  - Money services business registers (FinCEN MSB registrant search; state money transmitter licence lists)
  - Court records
  levels:
    faint: An unregistered business takes cash from many customers and wires it abroad, with deposits
      below the bank currency report line of more than $10,000.
    strong: Repeated cash deposits each kept under the more-than-$10,000 line, gathered in one account
      and followed by one-way international wires.
    textbook: 'Meets the published definition as worded: unlicensed money transmission through bank accounts
      using deposits structured to avoid the more-than-$10,000 currency transaction report.'
    threshold_source: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1010/subpart-C/section-1010.311
    threshold_note: Both FinCEN advisories cited (Advisory 33, March 2003; FIN-2010-A011, updated 5 July
      2022) say deposits were structured to avoid reporting requirements but state no dollar figure (Advisory
      33 only gives 'within 24 hours' for IVTS settlement speed). The number used is the bank currency
      transaction report threshold that structuring avoids. US money transmitters must register regardless
      of amount, so there is no amount trigger for the licensing part.
  threshold_verified: true
  cross_hints:
  - target_area: EN
    reason: EN already lists informal value transfer as a channel for wildlife-trafficking networks.
    source_url: https://www.fincen.gov/sites/default/files/shared/advis33.pdf
  innocent_explanations:
  - Many diaspora communities rely on legitimate, registered remittance providers.
  - A business may make regular international payments to suppliers.
  - Advisory 33 itself says each indicator alone does not mean IVTS activity.
  jurisdictions: US; hawala networks worldwide
  version: 2
