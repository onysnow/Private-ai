not_reached:
- 'FATF PDFs on fatf-gafi.org return HTTP 403 to direct download; the TBML indicators were read from an
  identical copy hosted by the Bank of Russia (cbr.ru) and the VA red flags from a copy hosted by Saudi
  Arabia''s GDFI (aml.gov.sa). FATF landing page for TBML indicators: https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-based-money-laundering-indicators.html'
- 'FATF Professional Money Laundering (2018): read through a page-fetch tool only. No formal indicator
  list was found in the parts read; the report says one aim was to develop PML risk indicators. Only the
  TCSP, complicit-employee and MVTS case lists were used.'
- 'FATF RBA Guidance for the Real Estate Sector (2022): text read only up to about para 107. The mortgage-lender
  section and later parts were not read. Several long indicators were shown cut off and are quoted only
  as exact fragments.'
- 'FFIEC Appendix F: some longer red flags were shown cut off by the fetch tool. Only complete sentences
  or exact fragments are quoted.'
- 'Cullen Commission (BC) Final Report 2022: only the table of contents was read. Chapters 4, 15 and 19
  on real estate and scale were not reached, so none of its findings are used.'
- 'FATF–Egmont Concealment of Beneficial Ownership (2018) indicators: not reached'
- 'FATF–Egmont Trade-Based Money Laundering: Trends and Developments (2020): not read'
- 'FATF 2007 Money Laundering through the Real Estate Sector typology: not read'
- 'FinCEN real estate GTO order text and the 2024 Residential Real Estate rule (and its current legal
  status): not checked'
- 'AUSTRAC, UK (NCA/HM Treasury), EU and Egmont indicator lists: not reached'
- 'CBA case: the final Federal Court penalty order was not checked; the case is recorded from the AUSTRAC
  release on the agreed penalty'
- 'Hajiyeva v NCA [2020] EWCA Civ 108: read but not used as a case, because the court upheld an investigative
  order and made no finding of laundering. It is only cited as a cross-hint and in the glossary.'
- Springer article page for Akartuna et al. returned a JavaScript client challenge. The full text was
  read through the Springer PDF link with a page-fetch tool, and the supplements were downloaded from
  static-content.springer.com.
- City University of Hong Kong repository PDF of Akartuna et al. returned 403
- 'FATF, Money Laundering and Terrorist Financing Vulnerabilities of Legal Professionals (2013), Chapter
  5 ''Red flag indicators'' (p. 77 onward): the FATF PDF is behind a bot check for direct download, and
  the fetch tool''s text stopped at p. 50. The 42 red flags were taken from CILEx Regulation''s reproduction
  (cilexregulation.org.uk/wp-content/uploads/2018/12/AML-Red-Flag-Indicators.pdf), which says it collects
  the FATF June 2013 red flags. Before publishing, check the wording against the FATF original.'
- 'FATF, Vulnerabilities of Casinos and Gaming Sector (2009) on fatf-gafi.org: blocked by robots/bot check.
  I used the copy filed as Exhibit RC0310 at the Victorian Royal Commission into the Casino Operator and
  Licence (rccol.archive.royalcommission.vic.gov.au). The PDF text extraction drops some punctuation,
  so quotes were picked from cleanly extracted lines.'
- 'FATF/OECD, Misuse of CBI and RBI Programmes (2023): the fetch tool reached text up to para. 147. I
  found no annex of red flags in the readable text and could not confirm whether one exists after that
  point. Page numbers varied between fetches, so paragraph numbers are given instead.'
- 'AUSTRAC media release ''Federal Court makes ruling in Crown matter'': robots disallowed. The enforcement-actions
  list confirms the A$450m penalty (11 July 2023), but I could not confirm which casino conduct it covered,
  so Crown is not used as a case.'
- 'FATF, Risks of gaming and gambling (September 2026) with new risk indicators: I read only the news
  release, not the report PDF. Worth a follow-up for online gambling and casino indicators.'
- FinCEN Advisory 33 (2003) was read; FinCEN's later IVTS/hawala SAR typologies were not checked.
- 'Cullen Commission (British Columbia, 2022) final report on casino laundering: not opened, so not used
  as a case.'
- AUSTRAC casino page has no 'last updated' date on the fetched content; I assumed 2024 from the gap note
  (Sept 2024 sector release) and did not verify it.
