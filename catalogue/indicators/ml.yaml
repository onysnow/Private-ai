- id: ML-039
  name: Rush, pressure, or price far from market value
  definition: The buyer or seller pushes to close unusually fast, or asks to buy or sell well over or
    under value.
  areas:
  - ML
  typology: Real estate laundering
  status: verified
  sources:
  - title: Guidance for a Risk-Based Approach for the Real Estate Sector
    publisher: FATF
    year: '2022'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/guidance/RBA-Real-Estate-Sector.pdf
    locator: Part Three, client risk (para 104)
    quote: Undue pressure or abnormal haste from the customer for the transaction to be concluded expeditiously.
    quote_verified: true
    checked: '2026-10-09'
  - title: Guidance for a Risk-Based Approach for the Real Estate Sector
    publisher: FATF
    year: '2022'
    url: https://www.fatf-gafi.org/content/dam/fatf-gafi/guidance/RBA-Real-Estate-Sector.pdf
    locator: Part Three, transaction risks (para 105)
    quote: Requests to expedite transactions, possibly over or under value.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Defining a Housing Market Integrity Index (MII): A Methodology and Application to Quebec''s
      Housing Market (Working Document)'
    publisher: Canada Mortgage and Housing Corporation (exhibit 719, Commission of Inquiry into Money
      Laundering in British Columbia)
    year: '2021'
    url: https://ag-pssg-sharedservices-ex.objectstore.gov.bc.ca/ag-pssg-cc-exh-prod-bkt-ex/719%20-%20Defining%20a%20Housing%20Market%20Integrity%20Index%20A%20Methodology%20and%20Application%20to%20Quebecs%20Housing%20Market%20-%20Draft%20-%2019%20Feb%202021.pdf
    locator: Executive summary, transaction-characteristics indicators 1 and 2 (about PDF page 7)
    quote: The cut off for the lowest decile in the price distribution is a price 54% below the neighbourhood
      average, whereas a property with a 43% higher price is the cut off for the top decile. ... relative
      to the assessed value, a property traded at 38% below the assessed value fall into the lowest decile
      percentile, whereas a property with a price 19% above is in the top decile, and both trigger a red
      flag for significant difference from assessed value.
    quote_verified: true
    licence: Copyright CMHC; report says it 'shall not be disclosed, distributed or reproduced without
      the consent of CMHC'; made public as an inquiry exhibit
    checked: '2026-10-10'
  examples:
  - A buyer offering 20% above asking price for a closing within a week
  cases: []
  data_needed:
  - RealEstate
  - Contract (sale price, date)
  - Payment
  - Document (valuations)
  checkable: lookups
  lookup_sources:
  - property price data (comparable sales)
  - property registries
  levels:
    faint: Price is at least 19% above, or at least 38% below, the assessed value (CMHC red-flag cut-off
      against assessed value)
    strong: Price is at least 43% above, or at least 54% below, the neighbourhood average (CMHC red-flag
      cut-off against the neighbourhood), and it also crosses the assessed-value cut-off
    textbook: 'Meets the FATF definition as worded: abnormal haste or pressure to close, at a price beyond
      the CMHC cut-offs above. No time figure for haste has been published.'
    threshold_source: https://ag-pssg-sharedservices-ex.objectstore.gov.bc.ca/ag-pssg-cc-exh-prod-bkt-ex/719%20-%20Defining%20a%20Housing%20Market%20Integrity%20Index%20A%20Methodology%20and%20Application%20to%20Quebecs%20Housing%20Market%20-%20Draft%20-%2019%20Feb%202021.pdf
    threshold_note: 'The number covers the price part only: how far the price sits from the neighbourhood
      average or the assessed value. It comes from a Canada Mortgage and Housing Corporation (CMHC) working
      paper on Quebec home sales from 2000 to 2018, filed as Exhibit 719 at British Columbia''s Cullen
      Commission inquiry into money laundering. The cut-offs are the top and bottom tenths of Quebec sale
      prices, not a legal threshold. The paper is marked ''Working Document / DO NOT CITE'', but the inquiry
      made it public. For ''rush'' or ''haste'', no published time figure was found: FATF RBA Real Estate
      (2022) gives wording only. Related: CMHC Exhibit 715 (Pereboom, 2019) says ''considerably higher
      / lower'' with no figure. The ELRA/Colegio de Registradores slides give no price figure.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Relocation deadlines
  - Competitive markets
  - Family sales below value
  jurisdictions: Global
  version: 2
