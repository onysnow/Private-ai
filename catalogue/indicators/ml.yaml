    threshold_note: The number is the US recordkeeping rule for cash purchases of money orders, traveller's
      cheques and cashier's cheques ($3,000 to $10,000 inclusive); the more-than-$10,000 bank currency
      transaction report (31 CFR 1010.311) is the upper line. The FFIEC appendix cited gives no number.
      These are reporting/recordkeeping lines, not red-flag counts of sequential items; no published count
      of sequential instruments was found.
