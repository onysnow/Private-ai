  definition: The customer uses fake or altered ID, ID that cannot be checked, or documents that contradict
    each other.
  areas:
  - CY
  - ML
  typology: Identity fraud in onboarding
  status: verified
  sources:
  - title: Virtual Assets Red Flag Indicators of Money Laundering and Terrorist Financing
    publisher: FATF
    year: '2020'
    url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
    locator: Irregularities observed during CDD process, p.12
    quote: Customer has provided forged documents or has edited photographs and/or identification documents
      as part of the on-boarding process.
    quote_verified: true
    checked: '2026-10-09'
  - title: FinCEN Advisory FIN-2025-A003
    publisher: FinCEN
    year: '2025'
    url: https://www.fincen.gov/system/files/2025-08/FinCEN-Advisory-CMLN-508.pdf
    locator: Money mule red flags, p.9
    quote: During the onboarding process, a customer presents a Chinese passport and a visa that contain
      the same photograph despite being allegedly issued years apart.
    quote_verified: true
    checked: '2026-10-09'
  - title: BSA/AML Examination Manual, Appendix F
    publisher: FFIEC
    url: https://bsaaml.ffiec.gov/manual/Appendices/07
    locator: Customers Who Provide Insufficient or Suspicious Information
    quote: A customer uses unusual or suspicious identification documents that cannot be readily verified.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Doctored photos used to pass exchange KYC in a hack-laundering case (FATF case study 12)
  cases:
  - name: Enhua Fang, Jianfei Lu and Shu Jun Zhen
    year: '2025'
    jurisdiction: United States (W.D.N.C.)
    what_happened: DOJ said Lu procured fake driver's licences for couriers depositing drug cash; all
      three pleaded guilty to money laundering charges.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/final-three-members-charged-prolific-chinese-money-laundering-scheme-plead-guilty-laundering
    source_title: Final Three Members Charged in Prolific Chinese Money Laundering Scheme Plead Guilty
  data_needed:
  - Passport (number, issueDate, country)
  - Identification
  - Person
  - Document
  checkable: person
  lookup_sources:
  - document verification services
  - interviews
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: Forged ID is itself an offence and a fraud indicator.
    source_url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
  innocent_explanations:
  - Reissued documents reusing an old photo
  - Poor-quality scans
  jurisdictions: Global
  version: 1
- id: ML-032
  name: Money mule profile
  definition: 'The person moving the money seems to be a stand-in: they know little about the business,
    source of cash or the technology, or fit profiles often recruited (students, unemployed, much older
    users, financially vulnerable people).'
  areas:
