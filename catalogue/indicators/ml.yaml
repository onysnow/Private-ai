    publisher: FinCEN (US Treasury)
    year: '2025'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN-Notice-CVCKIOSK.pdf
    locator: p. 9, red flags for CVC kiosk operators, and footnote 46
    quote: A report of each deposit, withdrawal, exchange of currency, or other payment or transfer, by,
      through, or to a financial institution that involves a transaction in currency of more than $10,000.
      Multiple transactions may be aggregated when determining whether the reporting threshold has been
      met.
    quote_verified: true
    licence: US federal government work (public domain)
    checked: '2026-10-10'
  examples:
