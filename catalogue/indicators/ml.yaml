    quote_verified: true
    checked: '2026-10-09'
  - title: Virtual Assets Red Flag Indicators of Money Laundering and Terrorist Financing
    publisher: FATF
    year: '2020'
    url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
    locator: Profile of potential money mule or scam victims, p.14
    quote: A customer being a financially vulnerable person, who is often used by drug dealers to assist
      them in their trafficking business.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A young person's new account receiving commercial deposits from companies and sending them to crypto
    exchanges within two days (FATF Czech case study)
