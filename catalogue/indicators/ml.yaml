  - blockchain analytics
  levels:
    faint: Repeated cash deposits at crypto kiosks that build toward the $10,000 Currency Transaction
      Report threshold. No lower published figure for 'small' amounts was found.
    strong: Cash deposits each kept just under $10,000, or adding up to more than $10,000, spread across
      several kiosks or accounts.
    textbook: Cash deposits structured just beneath the $10,000 Currency Transaction Report threshold
      (or a kiosk's daily limit) by using multiple machines or multiple accounts, as FinCEN's red flag
      words it.
    threshold_source: https://www.fincen.gov/sites/default/files/shared/FinCEN-Notice-CVCKIOSK.pdf
    threshold_note: 'The number comes from FinCEN''s red flag for kiosks (p. 9): ''A customer structures
      cash deposits just beneath the Currency Transaction Report (CTR) threshold,46 or CVC kiosk daily
      limit, either by using multiple machines or multiple accounts (i.e., smurfing).'' Footnote 46 sets
      the CTR threshold at more than $10,000, which is the quote used below. Other published figures:
      (1) The same notice says kiosk fees range ''from 7–20 percent'', which bears on ''despite high fees''.
      (2) It notes that California''s law bars operators from accepting or dispensing more than $1,000
      a day per customer (footnote 18). (3) AUSTRAC (Australia) requires ''limits of $5,000 on cash deposits
      and withdrawals at crypto ATMs'' (page ''Crypto ATM providers to meet minimum standards'', austrac.gov.au,
      undated, c. mid-2025). The California and AUSTRAC figures are caps on operators, not red-flag triggers.
      The cited FATF source gives no number. Applies to the US (CTR); the kiosk-limit part depends on
      the jurisdiction.'
  threshold_verified: true
  cross_hints:
