  - interviews
  - social media recruitment ads
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: FATF says mules may be scam victims turned mules, and much older users may be victims of elder
      financial exploitation.
    source_url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
  - target_area: OC
    reason: FATF notes financially vulnerable people are often used by drug dealers.
    source_url: https://www.aml.gov.sa/en-us/GuidanceReports/Virtual%20Assets%20Red%20Flag%20Indicators.pdf
