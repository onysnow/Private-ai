key: AG
name: Aggression, coups, insurrection and unlawful militias
scope: The crime of aggression, including deniable proxy and mercenary forces; signs of an invasion build-up;
  coups and self-coups by incumbents; seditious conspiracy; private armed militias.
indicators:
- id: AG-001
  name: Invasion, occupation or annexation of another state's territory by armed forces
  definition: A state's armed forces cross into, occupy or annex all or part of another state's territory.
  areas:
  - AG
  typology: Crime of aggression
  status: verified
  sources:
  - title: Definition of Aggression, UNGA Resolution 3314 (XXIX), Art 3(a)
    publisher: UN General Assembly (via University of Minnesota Human Rights Library)
    year: '1974'
    url: https://hrlibrary.umn.edu/instree/GAres3314.html
    locator: Article 3(a)
    quote: The invasion or attack by the armed forces of a State of the territory of another State, or
      any military occupation, however temporary, resulting from such invasion or attack, or any annexation
      by the use of force of the territory of another State or part thereof
    quote_verified: true
    checked: '2026-10-10'
  - title: General Assembly resolution ES-11/1 (press summary GA/12407)
    publisher: UN General Assembly
    year: '2022'
    url: https://press.un.org/en/2022/ga12407.doc.htm
    locator: Resolution summary
    quote: Deploring in the strongest terms its aggression against Ukraine in violation of the Charter
      of the United Nations
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Russian full-scale invasion of Ukraine, February 2022 (UNGA ES-11/1)
  cases: []
  data_needed:
  - PublicBody
  - Event
  - Document
  - Address
  checkable: lookups
  lookup_sources:
  - UN General Assembly and Security Council records
  - Satellite imagery providers
  - Official government statements
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Forces present with the host state's valid consent
  - Lawful collective or individual self-defence or UN Security Council authorisation
  - Disputed or undemarcated borders where both sides claim the area
  - Border incidents too minor to reach the gravity threshold (UNGA 3314 Art 2)
  jurisdictions: International (UN Charter; Rome Statute Art 8 bis)
  version: 1
