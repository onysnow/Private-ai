- id: SF-042
  name: Diplomats or designated persons holding accounts in family members' or front companies' names,
    in several countries
  definition: Officials or designated persons get around asset freezes and account limits by using accounts
    in relatives' or front companies' names, or in countries where they are not posted.
  areas:
  - SF
  typology: Nominee accounts
  status: verified
  sources:
  - title: UN Panel of Experts report S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: Diplomats and representatives of designated entities of the Democratic People’s Republic of
      Korea also circumvent the assets freeze and the limit on the number of diplomatic bank accounts
      by holding accounts in the name of family members and front companies and by establishing accounts
      in multiple jurisdictions.
    quote_verified: true
    checked: '2026-10-09'
  - title: Resolution 2321 (2016), S/RES/2321 (2016)
    publisher: United Nations Security Council
    year: '2016'
    url: https://documents.un.org/doc/undoc/gen/n16/407/50/pdf/n1640750.pdf
    locator: Operative paragraph 16, page 4
    quote: 16. Decides that all States shall take steps to limit the number of bank accounts to one per
      DPRK diplomatic mission and consular post, and one per accredited DPRK diplomat and consular officer,
      at banks in their territory;
    quote_verified: true
    licence: UN official document; licence not stated
    checked: '2026-10-10'
  examples:
  - An embassy staffer's spouse holds an account receiving regular wires from a trading company.
  cases:
  - name: UN Panel of Experts on DPRK, 2019 final report
    year: '2019'
    jurisdiction: United Nations
    what_happened: The Panel found DPRK diplomats controlled accounts in multiple countries, including
      ones where they were not accredited, and used family-member and front-company accounts.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    source_title: S/2019/171
  data_needed:
  - Person
  - Family
  - BankAccount
  - Company
  - Ownership
  - Sanction
  checkable: lookups
  lookup_sources:
  - Diplomatic lists
  - Sanctions lists
  - Company registries
  levels:
    faint: A DPRK diplomat, consular officer, mission or consular post holds more than one account at
      banks in one country (above the limit of one per mission or post and one per diplomat or consular
      officer)
    strong: More than one account per diplomat or mission, held in family members' or front companies'
      names, or opened in countries where the person is not posted
    textbook: 'Meets the published definition as worded: accounts in family members'' or front companies''
      names, or in multiple jurisdictions, used to get around the assets freeze and the limit of one account
      per mission or post and one per accredited diplomat or consular officer'
    threshold_source: https://documents.un.org/doc/undoc/gen/n16/407/50/pdf/n1640750.pdf
    threshold_note: The number is the account limit that the circumvention defeats. It applies to DPRK
      missions and diplomats under the UNSC 1718 sanctions regime and binds all UN member states for banks
      in their territory. Wider search was limited (Firecrawl out of credits, WebSearch limit used up).
      The UN Panel of Experts report S/2019/171 (the cited source) mentions 'the limit on the number of
      diplomatic bank accounts' but does not state the number.
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Use of family and front-company accounts by officials is the same pattern seen in PEP corruption
      cases.
    source_url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
  innocent_explanations:
  - Family members have their own legitimate income and accounts.
  - Diplomats legitimately hold accounts for personal needs.
  jurisdictions: UN DPRK sanctions (UNSC 1718 regime)
  version: 2
