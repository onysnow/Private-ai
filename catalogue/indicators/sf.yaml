key: SF
name: Terrorist financing, proliferation financing and sanctions evasion
scope: 'terrorist financing, proliferation financing, sanctions evasion on land and at sea (deceptive
  shipping practices: AIS manipulation, ship-to-ship transfers, flag hopping, document falsification,
  the 2020 US maritime advisory and its 2024 or later updates), export control evasion.'
indicators:
- id: SF-001
  name: Vessel AIS switched off or gaps in transmission (going dark)
  definition: A ship stops broadcasting its Automatic Identification System signal for a period, especially
    near high-risk areas, so its movements cannot be followed.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: 'Sanctions Advisory for the Maritime Industry, Energy and Metals Sectors, and Related Communities:
      Guidance to Address Illicit Shipping and Sanctions Evasion Practices'
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.2, Deceptive Shipping Practices item 1
    quote: vessels engaged in illicit activities may also intentionally disable their AIS transponders
      or manipulate the data transmitted in order to mask their movement.
    quote_verified: true
    checked: '2026-10-08'
  - title: Sanctions Advisory for the Maritime Industry (Annex A, Guidance for Maritime Insurance Companies)
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: Annex A, p.9
    quote: any significant time period with non-transmission that is not consistent with the International
      Convention for the Safety of Life at Sea (SOLAS)
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory for the Maritime Oil Industry and Related Sectors
    publisher: Price Cap Coalition (G7, EU, Australia, New Zealand), published by OFAC
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: 'Increased Risks: Reputational, Logistical, and Financial'
    quote: Shadow fleet tankers have been observed disabling or manipulating Automatic Identification
      Systems (AIS) to conceal illicit activity or other information about their voyages.
    quote_verified: true
    checked: '2026-10-08'
  - title: Report of the Panel of Experts established pursuant to resolution 1874 (2009), S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: The manipulation of vessel AIS transmis sions remains an overarching feature of illegal transfers
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - The DPRK-flagged bulk carrier Wise Honest had not broadcast AIS since 4 August 2017 despite a March
    2018 coal voyage (DOJ, 2019).
  - AIS goes silent for several days while a tanker is in an area used for ship-to-ship transfers, then
    reappears with a full cargo.
  cases:
  - name: United States v. M/V Wise Honest (civil forfeiture)
    year: '2019'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: The US seized a North Korean bulk carrier used to export coal; DOJ stated it had not
      broadcast AIS since August 2017, used false paperwork on nationality and coal origin, and paid over
      $750,000 through US banks. The 2019 release reports a forfeiture complaint, not a judgment.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/north-korean-cargo-vessel-connected-sanctions-violations-seized-us-government
    source_title: North Korean Cargo Vessel Connected to Sanctions Violations Seized by U.S. Government
  data_needed:
  - Vessel (imoNumber, mmsi, flag, name)
  - Vessel position history from ship tracking (outside FtM)
  - Address (ports, areas)
  - Ownership (owner, asset Vessel)
  - Sanction
  checkable: lookups
  lookup_sources:
  - AIS ship tracking services (commercial or open)
  - LRIT data where accessible to flag registries
  - Satellite imagery
  - IMO GISIS ship database
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: non-transmission inconsistent with SOLAS, or
      a pattern of turning AIS off inconsistent with SOLAS (2020 advisory Annex A). No hour threshold
      is published.'
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: EN
    reason: The same AIS gaps are used to hide illegal fishing or unsafe oil transfers; the 2024 advisory
      ties shadow-fleet practices to oil spill and safety risk.
    source_url: https://ofac.treasury.gov/media/933506/download
  innocent_explanations:
  - Legitimate safety disablement, for example piracy risk (the 2020 advisory and 2024 advisory both acknowledge
    this).
  - Poor satellite or terrestrial reception coverage in remote waters.
  - Equipment failure or maintenance.
  - Data gaps in the tracking provider rather than on the ship.
  jurisdictions: Global; SOLAS requires AIS on certain classes of ships on international voyages
  version: 1
- id: SF-002
  name: 'AIS spoofing: ship broadcasts a false identity or position'
  definition: The ship's AIS transmits a different name, IMO number, MMSI or location than its real one,
    so it looks like another ship or seems to be somewhere else.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.2, item 1
    quote: The practice of manipulating AIS data, referred to as “spoofing,” allows ships to broadcast
      a different name, International Maritime Organization (IMO) number (a unique, seven-digit vessel
      identification code), Maritime Mobile Service Identity (MMSI), or other identifying information.
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory
    publisher: Price Cap Coalition
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: Recommendation 3
    quote: Industry stakeholders should also vigilantly monitor irregular AIS patterns or data that are
      inconsistent with actual ship locations.
    quote_verified: true
    checked: '2026-10-08'
  - title: UN Panel of Experts report S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: The disguising of vessels through ship identity theft and false Automatic Identification System
      (AIS) transmissions is not being taken into account by most global and regional commodity trading
      companies, banks and insurers
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Two ships broadcast the same IMO number at once in different oceans.
  - A tanker's AIS shows it anchored offshore while satellite imagery shows it at a sanctioned port.
  cases:
  - name: Suez Rajan Limited (Iranian oil)
    year: '2023'
    jurisdiction: United States (D.D.C.)
    what_happened: Suez Rajan Limited pleaded guilty to conspiring to violate IEEPA over Iranian oil;
      DOJ stated participants tried to disguise the oil's origin using ship-to-ship transfers, false automatic
      identification system reporting and falsified documents. Fine of nearly $2.5 million and three years'
      corporate probation.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/justice-department-announces-first-criminal-resolution-involving-illicit-sale-and-transport
    source_title: Justice Department Announces First Criminal Resolution Involving Illicit Sale and Transport
      of Iranian Oil in Violation of U.S. Sanctions
  data_needed:
  - Vessel (imoNumber, mmsi, callSign, name, flag)
  - Position history (ship tracking)
  - Document (bills of lading, port records)
  checkable: lookups
  lookup_sources:
  - AIS tracking history
  - Satellite imagery (optical or radar)
  - IMO GISIS
  - LRIT via flag registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Data entry errors in AIS settings by crew.
  - GPS jamming or interference in conflict areas that shifts reported positions.
  - Duplicate MMSI numbers assigned in error.
  - Tracking-provider merging errors.
  jurisdictions: Global
  version: 1
- id: SF-003
  name: 'Ship identity altered: painted-over name or IMO number, identity theft or identity laundering'
  definition: A ship's painted name or IMO number is hidden or changed, it uses another ship's identity,
    or its owners obtain a new identity number to escape detection.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.2, item 2
    quote: Vessels involved in illicit activities have often painted over vessel names and IMO numbers
      to obscure their identities and pass themselves off as different vessels.
    quote_verified: true
    checked: '2026-10-08'
  - title: UN Panel of Experts report S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: The Panel inspected seized vessels engaged in prohibited coal trades, documenting ship identity
      laundering, whereby the owners had deceived IMO into providing new vessel identity numbers to avoid
      repeat detection.
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory
    publisher: Price Cap Coalition
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: Recommendation 10
    quote: owners and operators of sanctioned vessels may attempt to engage in deceptive practices to
      obfuscate their status, such as renaming, reflagging, obscuring their IMO number, or falsifying
      documents
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Photographs show a hull name freshly painted over and a different name welded on.
  - A ship with a newly issued IMO number has the same build year, tonnage and shape as a sanctioned ship
    that disappeared.
  cases: []
  data_needed:
  - Vessel (imoNumber, name, buildDate, tonnage, pastFlags)
  - Document (photos, port state control records)
  - Sanction
  checkable: lookups
  lookup_sources:
  - IMO GISIS ship database
  - Port state control inspection databases
  - Ship photo archives and satellite imagery
  - Sanctions lists (vessel entries)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded. Note: passenger ships of 100 GT and above and
      cargo ships of 300 GT and above must display name and IMO number (2020 advisory p.2).'
    threshold_source: https://ofac.treasury.gov/media/37751/download
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: The Panel found owners deceived the IMO to obtain new identity numbers, which is identity
      fraud against a registry.
    source_url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
  innocent_explanations:
  - Legitimate renaming after a sale (the IMO number should stay the same).
  - Repainting during dry-dock maintenance.
  - Rust or damage obscuring markings.
  jurisdictions: Global (IMO ship identification number scheme)
  version: 1
- id: SF-004
  name: Falsified cargo or vessel documents to disguise origin
  definition: Bills of lading, certificates of origin, invoices or other shipping papers give a false
    origin, cargo, ship or destination.
  areas:
  - SF
  typology: Deceptive shipping practice / document fraud
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.2, item 3
    quote: Authorities have found that sanctions evaders have falsified shipping documentation pertaining
      to petrochemicals, petroleum, petroleum products, or metals (steel, iron) or sand in order to disguise
      their origin.
    quote_verified: true
    checked: '2026-10-08'
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices, Annex A
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: Annex A, commodity trading guidance, p.15
    quote: Any indication of manipulated shipping documentation is a red flag for potential illicit activity
      and should be investigated fully prior to continuing with the transaction.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A certificate of origin says Malaysia but the cargo's chemical profile and the ship's track point
    to Iran.
  - Wise Honest paperwork listed false countries for vessel nationality and coal origin (DOJ 2019, alleged).
  cases:
  - name: Suez Rajan Limited
    year: '2023'
    jurisdiction: United States (D.D.C.)
    what_happened: Guilty plea to IEEPA conspiracy; DOJ said falsified documents were among the methods
      used to disguise the Iranian oil's origin.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/justice-department-announces-first-criminal-resolution-involving-illicit-sale-and-transport
    source_title: DOJ press release, 8 Sept 2023
  data_needed:
  - Document (bill of lading, certificate of origin, invoice, packing list)
  - Vessel
  - Company (shipper, consignee)
  - Address (load port, discharge port)
  - Payment
  checkable: person
  lookup_sources:
  - Ship tracking to compare claimed load port
  - Customs and trade data
  - Port call records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: False origin and value on trade documents is a core trade-based laundering method too.
    source_url: https://isomer-user-content.by.gov.sg/473/b7c26389-d5c0-454a-ba8b-b581c642097d/Guidance-Proliferation-Financing-Risk-Assessment-Mitigation.pdf
  innocent_explanations:
  - Clerical errors or amended bills of lading after a legitimate cargo resale.
  - Blending of cargoes from several origins.
  - Switch bills of lading used legitimately in commodity trading to protect supplier identity.
  jurisdictions: Global
  version: 1
- id: SF-005
  name: Ship-to-ship transfers at night or in high-risk areas
  definition: Cargo is moved from one ship to another at sea, particularly at night, outside sheltered
    waters or in areas known for sanctions evasion, hiding where it came from or where it goes.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.3, item 4
    quote: STS transfers—especially at night or in areas determined to be high-risk for sanctions evasion
      or other illicit activity—are frequently used to evade sanctions by concealing the origin or destination
      of surreptitiously transferred petroleum, coal, and other material.
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory
    publisher: Price Cap Coalition
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: Recommendation 4
    quote: While STS transfers (the transfer of cargo between ships at sea) are often conducted for legitimate
      purposes, such transfers can also be used to conceal the origin or destination of cargo in circumvention
      of sanctions or other regulations.
    quote_verified: true
    checked: '2026-10-08'
  - title: UN Panel of Experts report S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: Other methods of evasion include physical disguise of tankers of the Democratic People’s Republic
      of Korea, the use of small, unregistered vessels, illegal name-changing and other forms of identity
      fraud, night transfers and the use of additional vessels for transshipment.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Two tankers sit side by side for 20 hours in open water, one with AIS off.
  - Oil record book does not match the volumes the ship's draught shows were transferred.
  cases:
  - name: Suez Rajan Limited
    year: '2023'
    jurisdiction: United States (D.D.C.)
    what_happened: DOJ stated ship-to-ship transfers were used to disguise the origin of Iranian oil;
      company pleaded guilty.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/justice-department-announces-first-criminal-resolution-involving-illicit-sale-and-transport
    source_title: DOJ press release, 8 Sept 2023
  - name: UN Panel of Experts on DPRK, 2019 final report
    year: '2019'
    jurisdiction: United Nations
    what_happened: The Panel reported that illegal ship-to-ship transfers of petroleum products to the
      DPRK continued, using AIS manipulation, identity fraud and night transfers.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    source_title: S/2019/171
  data_needed:
  - Vessel (both ships)
  - Position history
  - Document (oil record book, MARPOL Annex I STS notification, bills of lading)
  - Ownership
  - Sanction
  checkable: lookups
  lookup_sources:
  - AIS tracking (encounter detection)
  - Satellite imagery
  - Coastal state STS notifications
  - Sanctions lists
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: EN
    reason: STS transfers outside safe waters carry heightened spill and safety risk.
    source_url: https://ofac.treasury.gov/media/933506/download
  innocent_explanations:
  - Legitimate lightering where ports are too shallow for large ships.
  - Bunkering (fuel supply) at sea.
  - Commercial STS hubs operating with proper notifications and AIS on.
  jurisdictions: Global; UNSCR 2375 (2017) prohibits STS transfers to or from DPRK-flagged vessels (cited
    in 2020 advisory Annex A)
  version: 1
- id: SF-006
  name: 'Voyage irregularities: indirect routing, unscheduled detours, transit through third countries'
  definition: A ship takes routes or stops that do not make commercial sense, often through third countries,
    to hide the cargo's real origin or destination.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.3, item 5
    quote: Malign actors may attempt to disguise the ultimate destination or origin of cargo or recipients
      by using indirect routing, unscheduled detours, or transit or transshipment of cargo through third
      countries.
    quote_verified: true
    checked: '2026-10-08'
  - title: Guidance on Proliferation Financing Risk Assessment and Mitigation
    publisher: FATF
    year: '2021'
    url: https://isomer-user-content.by.gov.sg/473/b7c26389-d5c0-454a-ba8b-b581c642097d/Guidance-Proliferation-Financing-Risk-Assessment-Mitigation.pdf
    locator: para 31, maritime sector risk indicators, pp.20-21
    quote: Shipment of goods is made in a circuitous fashion (if information is available), including
      multiple destinations
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A tanker declares Singapore, detours into the Gulf with AIS off, and returns low in the water.
  cases: []
  data_needed:
  - Vessel
  - Port calls (Address)
  - Document (voyage charter, bills of lading)
  checkable: lookups
  lookup_sources:
  - Ship tracking
  - Port call databases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Weather, piracy avoidance or emergencies (the 2020 advisory names unsafe ports, extreme weather, emergencies).
  - Change of buyer mid-voyage.
  - Canal closures or congestion forcing reroutes.
  jurisdictions: Global
  version: 1
- id: SF-007
  name: False flag, flag hopping or fraudulent ship registration
  definition: A ship flies a flag it has no right to, keeps using a flag after being deregistered, or
    changes flag state repeatedly in a short time to avoid detection.
  areas:
  - SF
  typology: Deceptive shipping practice
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.3, item 6
    quote: Bad actors may falsify the flag of their vessels to mask illicit trade. They may also repeatedly
      register with new flag states (“flag hopping”) to avoid detection.
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory
    publisher: Price Cap Coalition
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: 'Increased Risks: Maritime Safety and Marine Environment'
    quote: These vessels are often registered with flag states that fail to meet their international obligations.
      There is also an increased risk of falsified/fraudulent registration.
    quote_verified: true
    checked: '2026-10-08'
  - title: UN Panel of Experts report S/2019/171
    publisher: United Nations Security Council
    year: '2019'
    url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    locator: Summary, p.4
    quote: routinely engaging in double-flagging and providing safe harbour for hijacked ships
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A tanker changes flag three times in a year, the last to a registry that does not list it.
  - A ship claims a flag after that registry announced its deregistration.
  cases:
  - name: UN Panel of Experts on DPRK, 2019 final report
    year: '2019'
    jurisdiction: United Nations
    what_happened: The Panel found the DPRK fleet routinely engaged in double-flagging.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://documents.un.org/doc/undoc/gen/n19/028/82/pdf/n1902882.pdf
    source_title: S/2019/171
  data_needed:
  - Vessel (flag, pastFlags, registrationNumber, registrationDate)
  - Sanction
  - Document (registry certificates)
  checkable: lookups
  lookup_sources:
  - Flag registry records
  - IMO GISIS
  - Equasis
  - Sanctions lists
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: use of a flag after deregistration, claiming
      a flag without authorisation, or frequent flag changes in a short period (2020 advisory p.3). No
      number of changes is published.'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Change of flag after a legitimate sale.
  - Moving to a cheaper or better-run open registry.
  - Flag state left a registry scheme or closed it.
  jurisdictions: Global (UNCLOS; flag state duties)
  version: 1
- id: SF-008
  name: Complex or frequently changing ship ownership and management; single-vessel companies
  definition: The ship's real owner is hidden behind shell companies, layered ownership, single-ship companies,
    or repeated changes of owner or ISM manager, including transfers between companies with the same beneficial
    owner.
  areas:
  - BO
  - SF
  typology: Deceptive shipping practice / corporate concealment
  status: verified
  sources:
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.3, item 7
    quote: Bad actors also may engage in a pattern of changes in the ownership or management of companies
      or in the International Safety Management Code (ISM) management companies used.
    quote_verified: true
    checked: '2026-10-08'
  - title: Guidance to Address Illicit Shipping and Sanctions Evasion Practices
    publisher: US Department of State, Treasury OFAC and US Coast Guard
    year: '2020'
    url: https://ofac.treasury.gov/media/37751/download
    locator: p.5, General Practices item 3
    quote: industry actors may also consider looking for situations where ownership of a vessel is transferred
      between companies controlled by the same beneficial owner and where there is no discernable legitimate
      purpose for the transfer.
    quote_verified: true
    checked: '2026-10-08'
  - title: Updated Price Cap Coalition Advisory
    publisher: Price Cap Coalition
    year: '2024'
    url: https://ofac.treasury.gov/media/933506/download
    locator: Increased Risks; Recommendation 6
    quote: The ownership of shadow fleet tankers may be concealed through complex corporate arrangements,
      with a recent increase of single vessel fleets.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A tanker is owned by a Marshall Islands company with one ship, managed by a newly formed company in
    a different country, which changed twice in a year.
  cases: []
  data_needed:
  - Vessel
  - Company (incorporationDate, jurisdiction)
  - Ownership (owner, asset, startDate, endDate)
  - Directorship
  - Representation (ISM manager, commercial manager)
  - Address
  checkable: lookups
  lookup_sources:
  - IMO GISIS (registered owner, ISM manager, IMO company number)
  - Equasis
  - Company registries
  - Sanctions lists
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: BO
