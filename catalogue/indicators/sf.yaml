    Priority Items, or sudden spike in such imports
  definition: A company set up after Russia's full-scale invasion, based outside the Global Export Control
    Coalition, trades in the battlefield-relevant HS codes, or an existing importer starts receiving or
    sharply increases them.
  areas:
  - SF
  typology: Russia diversion network
  status: verified
  sources:
  - title: FinCEN-BIS Supplemental Alert FIN-2023-Alert004
    publisher: FinCEN and BIS
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN%20and%20BIS%20Joint%20Alert%20_FINAL_508C.pdf
    locator: New Transactional and Behavioral Red Flags, p.9
    quote: A new customer whose line of business is in trade of products associated with the nine HS codes,
      is based in a non-GECC country, and was incorporated after February 24, 2022.
    quote_verified: true
    checked: '2026-10-08'
  - title: FinCEN-BIS Supplemental Alert FIN-2023-Alert004
    publisher: FinCEN and BIS
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN%20and%20BIS%20Joint%20Alert%20_FINAL_508C.pdf
    locator: p.9
    quote: An existing customer, based outside the United States, received exports associated with one
      or more of the nine HS codes prior to February 24, 2022, and requested or received a significant
      increase in exports with those same codes thereafter.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A Central Asian electronics importer founded in mid-2022 suddenly imports large volumes of HS 8542.31
    microcontrollers.
  cases: []
  data_needed:
  - Company (incorporationDate, jurisdiction)
  - Document (invoices with HS codes)
  - Payment
  - Address
  checkable: lookups
  lookup_sources:
  - Company registries
  - Customs and trade data (HS-code level)
  - BIS High Priority Items List
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Incorporated after 24 February 2022, based in a non-GECC country and trading in one of the
      nine High Priority HS codes (FinCEN-BIS May 2023). The size of a 'significant increase' is not published.
    threshold_source: https://www.fincen.gov/sites/default/files/shared/FinCEN%20and%20BIS%20Joint%20Alert%20_FINAL_508C.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Legitimate new firms entering electronics distribution.
  - Regional demand growth.
  - Supply-chain relocation away from Russia.
  jurisdictions: US; GECC partners
  version: 1
- id: SF-033
  name: Purported civilian end user at a military address, or military-linked indicators
  definition: The stated end user claims to be civilian, but its address is a military facility or next
    to one, or it advertises 'special purpose projects' or a security-service certificate to work on state
    secrets.
  areas:
  - SF
  typology: Military end use
  status: verified
  sources:
  - title: FinCEN-BIS Joint Notice FIN-2023-NTC2
    publisher: FinCEN and BIS
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN_Joint_Notice_US_Export_Controls_FINAL508.pdf
    locator: p.4
    quote: Transactions involve a purported civil end-user, but basic research indicates the address is
      a military facility or co-located with military facilities in a country of concern.
    quote_verified: true
    checked: '2026-10-08'
  - title: FinCEN-BIS Joint Alert FIN-2022-Alert003
    publisher: FinCEN and BIS
    year: '2022'
    url: https://www.fincen.gov/sites/default/files/2022-06/FinCEN%20and%20Bis%20Joint%20Alert%20FINAL.pdf
    locator: p.6 and fn 23
    quote: Transactions involving entities whose website or business registration states the entities
      work on “special purpose projects.”
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Cadence documents described Central South CAD Center as an alias for China's National University of
    Defense Technology (DOJ 2025).
  cases:
  - name: Cadence Design Systems Inc.
    year: '2025'
    jurisdiction: United States (N.D. Cal.)
    what_happened: Cadence agreed to plead guilty to conspiracy to commit export control violations for
      exporting EDA tools to NUDT, an Entity-Listed Chinese military university, through the alias Central
      South CAD Center, 2015 to 2021; combined penalties over $140 million. Plea subject to court approval
      at time of release.
    outcome: fined_by_regulator
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/cadence-design-systems-agrees-plead-guilty-and-pay-over-140-million-unlawfully-exporting
    source_title: Cadence Design Systems Agrees to Plead Guilty and Pay Over $140 Million for Unlawfully
      Exporting Semiconductor Design Tools to a Restricted PRC Military University
  data_needed:
  - Company
  - Address
  - Document (website captures, registrations)
  checkable: lookups
  lookup_sources:
  - Mapping and satellite imagery
  - Company registries
  - BIS Entity List
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Civilian businesses located in former military buildings or dual-use industrial parks.
  - Defence suppliers selling legitimately with licences.
  jurisdictions: US
  version: 1
