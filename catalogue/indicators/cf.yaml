not_reached:
- Web search budget for the run ran out partway through, so later sources were fetched only from URLs
  already known
- NY Attorney General press release on the Steven Croman tenant-harassment settlement (ag.ny.gov blocked
  fetching by robots.txt); only news coverage seen, so the case is not included
- No insurer bad-faith case (e.g., California DOI v. PacifiCare) could be sourced before the search budget
  ran out
- NYC Admin Code 27-2004(a)(48) full statutory definition of harassment not reached (the HPD examples
  page was used instead)
- 24 CFR 100.75 on eCFR failed to load; Cornell LII copy used
- CFPB UDAAP supervisory guidance page failed to load; statute 12 USC 5531 used instead
- Regulation F sections 1006.6 (inconvenient times and places) and 1006.34 (validation notices) not read
  in full
- 'Not sourced: algorithmic or AI tenant-screening harm beyond ad delivery; HUD paired-testing studies
  (e.g., Housing Discrimination Studies); EEOC AI hiring guidance; state payday-loan regulator data thresholds'
