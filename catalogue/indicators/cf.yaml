key: CF
name: Consumer, housing and lending exploitation
scope: Predatory lending, abusive debt collection, for-profit college fraud, insurers' bad-faith claim
  denials, landlord harassment and slum conditions, gambling operators exploiting harmed gamblers, and
  discrimination in lending, housing and hiring (redlining and reverse redlining).
indicators:
- id: CF-001
  name: 'Equity stripping: loan sized to home equity, not ability to repay'
  definition: A lender makes a home-secured loan based on how much equity the borrower has rather than
    whether the borrower can afford the payments.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Equity Stripping
    quote: The lender makes a loan based upon the equity in your home, whether or not you can make the
      payments.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Older homeowner with low fixed income and large equity given a refinance whose payments exceed income,
    followed by default and foreclosure
  cases: []
  data_needed:
  - Person
  - Company
  - Contract
  - Payment
  - Address
  - Document
  - CourtCase
  checkable: records
  lookup_sources:
  - County recorder mortgage and deed records
  - Foreclosure court dockets
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Borrower had income or assets not visible in public records
  - Legitimate reverse mortgage or equity-release product designed for borrowers without income
  - Borrower circumstances changed after origination (job loss, illness)
  jurisdictions: US (Washington State DFI guidance; general)
  version: 1
- id: CF-002
  name: Bait-and-switch loan terms
  definition: The borrower is promised one loan type or rate and, without good reason, given a different
    and worse one at closing.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Bait-and-switch schemes
    quote: The lender may promise one type of loan or interest rate but without good reason, give you
      a different one.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Good-faith estimate quotes a fixed rate; closing documents carry an adjustable rate with higher fees
  cases: []
  data_needed:
  - Person
  - Company
  - Contract
  - Document
  checkable: records
  lookup_sources:
  - Borrower loan estimates and closing disclosures
  - CFPB complaint database
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Rate lock expired or market rates moved
  - Appraisal or credit information changed underwriting
  - Borrower requested a different product
  jurisdictions: US
  version: 1
- id: CF-003
  name: 'Loan flipping: repeated refinancing into new high-cost loans'
  definition: A lender repeatedly refinances a borrower's loan into new long-term high-cost loans, generating
    fresh fees each time.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Loan Flipping
    quote: A lender refinances your loan with a new long-term, high cost loan.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Several refinances of the same property by the same lender within a few years, each recorded as a
    new mortgage
  cases: []
  data_needed:
  - Person
  - Company
  - Contract
  - Address
  - Document
  checkable: records
  lookup_sources:
  - County recorder mortgage records (count refinances per parcel per lender)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Borrower refinanced to capture falling interest rates
  - Cash-out refinance for genuine home repairs or debt consolidation that lowered total cost
  jurisdictions: US
  version: 1
- id: CF-004
  name: 'Packing: unrequested add-on charges or insurance'
  definition: The loan includes charges for services, such as credit insurance, that the borrower did
    not ask for or need.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Packing
    quote: You receive a loan that contains charges for services you did not request or need.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Single-premium credit life insurance financed into the loan balance
  cases: []
  data_needed:
  - Person
  - Company
  - Contract
  - Payment
  - Document
  checkable: records
  lookup_sources:
  - Closing disclosures and settlement statements
  - CFPB complaint database
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Borrower knowingly chose optional insurance or services
  - Charge is required by the investor or by law (e.g., flood insurance in a flood zone)
  jurisdictions: US
  version: 1
- id: CF-005
  name: Hidden balloon payment
  definition: A loan presented as affordable turns out at closing to be short-term with a large final
    payment that forces refinancing; for high-cost mortgages a payment more than twice the regular payment
    is prohibited.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Hidden Balloon Payments
    quote: only to learn at closing that it is a short-term loan that you will have to refinance within
      a few years.
    quote_verified: true
    checked: '2026-10-10'
  - title: 12 CFR 1026.32 Requirements for high-cost mortgages
    publisher: CFPB (eCFR)
    url: https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-E/section-1026.32
    locator: § 1026.32(d)(1)(i)
    quote: a payment schedule with a payment that is more than two times a regular periodic payment
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Mortgage with low monthly payments for five years then a lump-sum payoff of most of the principal
  cases: []
  data_needed:
  - Person
  - Company
  - Contract
  - Document
  checkable: records
  lookup_sources:
  - Promissory note and closing disclosure
  - County recorder mortgage records
  levels:
    faint: A balloon feature appears in a consumer loan
    strong: To be set by Ony
    textbook: On a high-cost mortgage, any payment more than two times a regular periodic payment (subject
      to the rule's exceptions)
    threshold_source: https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-E/section-1026.32
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Bridge loans and some commercial or construction loans are legitimately balloon-structured
  - Balloon terms clearly disclosed and chosen by an informed borrower expecting a sale
  jurisdictions: US
  version: 1
- id: CF-006
  name: Loan meets high-cost mortgage (HOEPA) price triggers
  definition: A home loan's interest rate, points and fees, or prepayment penalties exceed the federal
    thresholds that classify it as a high-cost mortgage.
  areas:
  - CF
  typology: Predatory lending
  status: verified
  sources:
  - title: 12 CFR 1026.32 Requirements for high-cost mortgages
    publisher: CFPB (eCFR)
    url: https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-E/section-1026.32
    locator: § 1026.32(a)(1)(i)(A)
    quote: 6.5 percentage points for a first-lien transaction, other than as described in paragraph (a)(1)(i)(B)
      of this section;
    quote_verified: true
    checked: '2026-10-10'
  - title: 12 CFR 1026.32 Requirements for high-cost mortgages
    publisher: CFPB (eCFR)
    url: https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-E/section-1026.32
    locator: § 1026.32(a)(1)(ii)(A)
    quote: 5 percent of the total loan amount for a transaction with a loan amount of $20,000 or more;
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - HMDA records showing a lender's first-lien loans with rate spreads above 6.5 points concentrated in
    particular tracts
  cases: []
  data_needed:
  - Company
  - Contract
  - Address
  - Document
  checkable: lookups
  lookup_sources:
  - HMDA public loan-level data (rate spread, HOEPA status fields)
  - Loan documents
  levels:
    faint: A lender's loans cluster just below the triggers
    strong: To be set by Ony
    textbook: First-lien APR more than 6.5 points above APOR, or points and fees above 5% of a loan of
      $20,000 or more, or prepayment penalties beyond 36 months or above 2% of the amount prepaid
    threshold_source: https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-E/section-1026.32
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - High-cost loans are legal if HOEPA protections and counselling are provided
  - Small loan amounts or manufactured-housing loans have naturally higher rate spreads
  - Borrower credit risk justifies pricing
  jurisdictions: US federal (Regulation Z / HOEPA)
  version: 1
- id: CF-007
  name: 'Reverse redlining: targeting minority or older borrowers with worse products'
  definition: A lender targets particular communities, such as minority neighbourhoods or older homeowners,
    with less advantageous loans, for example by advertising in a specific language.
  areas:
  - CF
  typology: Predatory lending; lending discrimination
  status: verified
  sources:
  - title: Identifying and Mitigating Potential Redlining Risks
    publisher: FDIC
    url: https://www.fdic.gov/resources/bankers/fair-lending/documents/fdic-redlining-fair-lending-resources-page.pdf
    locator: Reverse redlining definition
    quote: the practice of targeting certain borrowers or areas with less advantageous products or services
    quote_verified: true
    checked: '2026-10-10'
  - title: Predatory Lending
    publisher: Washington State Department of Financial Institutions
    url: https://dfi.wa.gov/financial-education/information/predatory-lending
    locator: Targeting
    quote: They may target minority communities by advertising in a specific language
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Subprime or high-cost loan share far higher in majority-minority tracts than in comparable white tracts
  cases: []
  data_needed:
  - Company
  - Contract
  - Address
  - Document
  - Event
  checkable: lookups
  lookup_sources:
  - HMDA data with census tract demographics
  - Lender advertising archives
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Language-specific marketing that offers the same products and prices to all
  - Differences explained by credit profiles or loan size
  - Lender specialises legitimately in a niche product
  jurisdictions: US
  version: 1
- id: CF-008
  name: 'Payday debt trap: loans repeatedly rolled over or renewed'
  definition: Short-term loans are routinely rolled over or re-borrowed so that borrowers stay in long
    sequences of loans and pay fees exceeding what they borrowed.
  areas:
  - CF
  typology: Predatory lending (small-dollar)
  status: verified
  sources:
  - title: CFPB Finds Four Out Of Five Payday Loans Are Rolled Over Or Renewed
    publisher: CFPB
    url: https://www.consumerfinance.gov/about-us/newsroom/cfpb-finds-four-out-of-five-payday-loans-are-rolled-over-or-renewed
    locator: Key findings
    quote: More than 80 percent of payday loans are rolled over or renewed within two weeks.
    quote_verified: true
    checked: '2026-10-10'
  - title: CFPB Finds Four Out Of Five Payday Loans Are Rolled Over Or Renewed
    publisher: CFPB
    url: https://www.consumerfinance.gov/about-us/newsroom/cfpb-finds-four-out-of-five-payday-loans-are-rolled-over-or-renewed
    locator: Key findings
    quote: Over 60 percent of loans are made to borrowers in the course of loan sequences lasting seven
      or more loans in a row.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Lender revenue data showing most fee income comes from repeat borrowers
  cases: []
  data_needed:
  - Company
  - Person
  - Contract
  - Payment
  checkable: lookups
  lookup_sources:
  - State payday lending regulator annual reports
  - Lender filings
  - CFPB complaint database
  levels:
    faint: Borrowers commonly take a new loan within two weeks of repaying
    strong: Borrowers in sequences of seven or more loans in a row (the CFPB's study measure)
    textbook: Meets the published definition as worded
    threshold_source: https://www.consumerfinance.gov/about-us/newsroom/cfpb-finds-four-out-of-five-payday-loans-are-rolled-over-or-renewed
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Borrower uses small loans occasionally for unrelated emergencies
  - State law caps rollovers and the lender complies
  jurisdictions: US
  version: 1
- id: CF-009
  name: 'Abusive design: product terms that obscure costs or exploit reliance'
  definition: A financial product or practice materially interferes with understanding its terms, or takes
    unreasonable advantage of a consumer's lack of understanding, inability to protect themselves, or
    reliance on the provider.
  areas:
  - CF
  typology: Unfair, deceptive or abusive acts or practices (UDAAP)
  status: verified
  sources:
  - title: 12 U.S.C. 5531
    publisher: US Code (Cornell LII)
    url: https://www.law.cornell.edu/uscode/text/12/5531
    locator: § 5531(d)(1)
    quote: materially interferes with the ability of a consumer to understand a term or condition
    quote_verified: true
    checked: '2026-10-10'
  - title: 12 U.S.C. 5531
    publisher: US Code (Cornell LII)
    url: https://www.law.cornell.edu/uscode/text/12/5531
    locator: § 5531(c)(1)(A)
    quote: causes or is likely to cause substantial injury to consumers which is not reasonably avoidable
      by consumers.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Fees disclosed only in fine print after sign-up
  - Product sold as being in the customer's interest by an adviser paid to sell it
  cases: []
  data_needed:
  - Company
  - Contract
  - Document
  - Note
  checkable: records
  lookup_sources:
  - CFPB enforcement actions and complaint database
  - Product terms and marketing
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Complex products can be genuinely complex and fully disclosed
  - Customer confusion may come from one poorly trained employee rather than design
  jurisdictions: US federal
  version: 1
- id: CF-010
  name: Lending market area excludes minority neighbourhoods
  definition: A lender's defined market or CRA assessment area carves out areas with relatively high minority
    populations.
  areas:
  - CF
  typology: Redlining
  status: verified
  sources:
  - title: Fair Lending Exam Procedures Risk Factors (FFIEC Interagency procedures, Dallas Fed summary)
    publisher: Federal Reserve Bank of Dallas
    url: https://www.newyorkfed.org/medialibrary/media/outreach-and-education/cra/resources/DallasFed-Fair-Lending-Exam-Procedures-Risk-Factors.pdf
    locator: Redlining risk factors (3rd item)
    quote: Having credit product markets that exclude geographic areas that have relatively high concentrations
      of minority residents
    quote_verified: true
    checked: '2026-10-10'
  - title: Identifying and Mitigating Potential Redlining Risks
    publisher: FDIC
    url: https://www.fdic.gov/resources/bankers/fair-lending/documents/fdic-redlining-fair-lending-resources-page.pdf
    locator: Assessment area
    quote: Pay close attention if the bank's assessment area includes only partial political subdivisions
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Assessment-area map that follows a city's majority-Black neighbourhoods around their edges
  cases: []
  data_needed:
  - Company
  - Address
  - Document
  checkable: lookups
  lookup_sources:
  - CRA public evaluations and assessment-area maps
  - Census tract demographics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Assessment area drawn around branch locations that predate the analysis
  - Small bank cannot reasonably serve a whole county
  - Excluded tracts are non-residential
  jurisdictions: US (FFIEC, FDIC)
  version: 1
- id: CF-011
  name: Branches and loan offices placed to avoid minority areas
  definition: Most of a lender's branches or loan officers are in predominantly white areas, while minority
    areas get no branches or only subprime affiliates.
  areas:
  - CF
  typology: Redlining; steering
  status: verified
  sources:
  - title: Fair Lending Exam Procedures Risk Factors
    publisher: Federal Reserve Bank of Dallas
    url: https://www.newyorkfed.org/medialibrary/media/outreach-and-education/cra/resources/DallasFed-Fair-Lending-Exam-Procedures-Risk-Factors.pdf
    locator: Redlining risk factors (6th item); Steering (7th item)
    quote: Most of the lender's branches are in predominantly white neighborhoods, while branches of its
      subprime subsidiary…
    quote_verified: true
    checked: '2026-10-10'
  - title: Identifying and Mitigating Potential Redlining Risks
    publisher: FDIC
    url: https://www.fdic.gov/resources/bankers/fair-lending/documents/fdic-redlining-fair-lending-resources-page.pdf
    locator: Branch locations
    quote: Review marketing, including branching strategies (if used to reach applicants)
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - 'Trident Mortgage: DOJ alleged offices concentrated in majority-white areas of the Philadelphia region'
  cases:
  - name: United States et al. v. Trident Mortgage Company
    year: '2022'
    jurisdiction: US (E.D. Pa.)
    what_happened: DOJ, CFPB and three state AGs alleged Trident failed to provide mortgage lending services
      to neighbourhoods of color in the Philadelphia area; Trident agreed to invest over $20 million in
      those neighbourhoods and pay a $4 million civil money penalty.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/usao-edpa/pr/justice-department-consumer-financial-protection-bureau-and-three-state-attorneys
    source_title: Justice Department, CFPB and Three State Attorneys General ... Trident
  data_needed:
  - Company
  - Address
  - Employment
  - Document
  checkable: lookups
  lookup_sources:
  - FDIC Summary of Deposits branch locations
  - NMLS loan officer and branch registry
  - Census tract demographics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Branch network inherited through acquisitions
  - Lender operates mainly online or through brokers
  - Branch decisions driven by deposit markets, not lending
  jurisdictions: US
  version: 1
- id: CF-012
  name: Low loan applications or originations in minority areas compared with peers
  definition: A lender receives or makes far fewer loans in minority areas than other lenders in the same
    market, or the share of minority applicants is much lower than their share of the population.
  areas:
  - CF
  typology: Redlining
  status: verified
  sources:
  - title: Fair Lending Exam Procedures Risk Factors
    publisher: Federal Reserve Bank of Dallas
    url: https://www.newyorkfed.org/medialibrary/media/outreach-and-education/cra/resources/DallasFed-Fair-Lending-Exam-Procedures-Risk-Factors.pdf
    locator: Redlining risk factors (1st item); Marketing (6th item)
    quote: Significant differences—in number of loans, approval/denial rates for all applicants and denial
      rates based on…
    quote_verified: true
    checked: '2026-10-10'
  - title: Identifying and Mitigating Potential Redlining Risks
    publisher: FDIC
    url: https://www.fdic.gov/resources/bankers/fair-lending/documents/fdic-redlining-fair-lending-resources-page.pdf
    locator: Peer comparison
    quote: compares to data reported by other HMDA reporters operating in the same market
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Lender's share of applications from majority-minority tracts is a fraction of its peers' share in
    the same metro area
  cases:
  - name: United States et al. v. Trident Mortgage Company
    year: '2022'
    jurisdiction: US (E.D. Pa.)
    what_happened: Redlining complaint alleging Trident failed to serve neighbourhoods of color in the
      Philadelphia metro; settled with over $20 million in investment and a $4 million penalty.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/usao-edpa/pr/justice-department-consumer-financial-protection-bureau-and-three-state-attorneys
  data_needed:
  - Company
  - Contract
  - Address
  checkable: lookups
  lookup_sources:
  - HMDA public data (FFIEC)
  - Census tract demographics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: PM
    reason: Disparity analysis overlaps the existing PM-011 disparities indicator
    source_url: https://www.fdic.gov/resources/bankers/fair-lending/documents/fdic-redlining-fair-lending-resources-page.pdf
  innocent_explanations:
  - Lender specialises in products (jumbo, rural) less demanded in those areas
  - Small numbers make peer comparisons unstable
  - Lender entered the market recently
  jurisdictions: US
  version: 1
- id: CF-013
  name: Marketing that excludes minority media or geographies
  definition: A lender or housing provider advertises only in media or places that reach non-minority
    areas, or uses prescreened lists or brokers that leave out protected groups.
  areas:
  - CF
  typology: Redlining; discriminatory advertising
  status: verified
  sources:
  - title: Fair Lending Exam Procedures Risk Factors
    publisher: Federal Reserve Bank of Dallas
    url: https://www.newyorkfed.org/medialibrary/media/outreach-and-education/cra/resources/DallasFed-Fair-Lending-Exam-Procedures-Risk-Factors.pdf
    locator: Marketing risk factors (2nd item; see also items 1, 3-5)
    quote: Advertising only in media serving nonminority areas
    quote_verified: true
    checked: '2026-10-10'
  - title: 24 CFR 100.75 Discriminatory advertisements, statements and notices
    publisher: HUD (Cornell LII)
    url: https://www.law.cornell.edu/cfr/text/24/100.75
    locator: § 100.75(c)(3)
    quote: Selecting media or locations for advertising the sale or rental of dwellings which deny particular
      segments
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Mortgage mailers sent only to ZIP codes that are majority white
  cases: []
  data_needed:
  - Company
  - Document
  - Address
  - Event
  checkable: records
  lookup_sources:
  - Ad libraries (e.g., platform ad archives)
  - Direct-mail samples
  - HMDA applicant data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Budget limits restrict ads to a few outlets
  - Media chosen by cost per reach without regard to demographics
  jurisdictions: US
  version: 1
