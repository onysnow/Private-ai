    quote_verified: true
    checked: '2026-10-10'
  - title: Istanbul Protocol (Rev. 2)
    publisher: OHCHR
    year: '2022'
    url: https://www.veritaszim.net/sites/veritas_d/files/Istanbul-Protocol_Rev2_EN.pdf
    locator: para. 659(k)
    quote: Prohibiting the use in any proceedings of evidence obtained as a result of torture or ill‑treatment;
