key: DT
name: Torture, arbitrary detention and enforced disappearance
scope: Torture and ill-treatment of living detainees (prisons, police cells, immigration detention, psychiatric
  units); missing custody safeguards; solitary confinement; secret or arbitrary detention; enforced disappearance;
  immigration detention conditions.
indicators:
- id: DT-001
  name: No prompt access to a lawyer, especially during questioning
  definition: A person in police or other custody is questioned or held through the first hours without
    a lawyer, or lawyer access is delayed until after interrogation.
  areas:
  - DT
  typology: Missing custody safeguards
  status: verified
  sources:
  - title: 'Symposium on procedural safeguards in the first hours of police custody: outcome report'
    publisher: Association for the Prevention of Torture
    url: https://www.apt.ch/sites/default/files/publications/symposium-on-safeguards_outcome-report.pdf
    locator: p. 9
    quote: moments of highest risk, including during questioning.
    quote_verified: true
    checked: '2026-10-10'
  - title: Police custody (extract from 2nd General Report, CPT/Inf(92)3-part1)
    publisher: Council of Europe, European Committee for the Prevention of Torture (CPT)
    year: '1992'
    url: https://rm.coe.int/16806cea2f
    locator: para. 36
    quote: as from the very outset of deprivation of liberty
    quote_verified: true
    checked: '2026-10-10'
  - title: Istanbul Protocol (Professional Training Series No. 8, Rev. 2)
    publisher: OHCHR
    year: '2022'
    url: https://www.veritaszim.net/sites/veritas_d/files/Istanbul-Protocol_Rev2_EN.pdf
    locator: para. 659(c)
    quote: Guaranteeing prompt access to a lawyer of one's choice during all interrogations and judicial
      proceedings;
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Custody logs show an interview held before the lawyer was called.
  - Lawyer access rules allow long 'delay' periods in practice applied to most suspects.
  cases: []
  data_needed:
  - Person
  - PublicBody
  - Event
  - Document
  - CourtCase
  checkable: records
  lookup_sources:
  - Custody records
  - Court files (suppression motions)
  - NPM and CPT visit reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Detainee knowingly waived the right to a lawyer.
  - No duty lawyer was available at night and questioning was postponed.
  - Lawful, time-limited delay authorised under national law.
  jurisdictions: International standard; applies to all police custody
  version: 1
- id: DT-002
  name: No independent medical examination on arrival, at request or before transfer
  definition: Detainees are not examined by a doctor at admission, on request or before transfer, or cannot
    see an independent clinician of their choice.
  areas:
  - DT
  typology: Missing custody safeguards
  status: verified
  sources:
  - title: 'Symposium on procedural safeguards in the first hours of police custody: outcome report'
    publisher: Association for the Prevention of Torture
    url: https://www.apt.ch/sites/default/files/publications/symposium-on-safeguards_outcome-report.pdf
    locator: p. 13
    quote: When realised, this safeguard provides a way to report, record, and end abuse.
    quote_verified: true
    checked: '2026-10-10'
  - title: Istanbul Protocol (Rev. 2)
    publisher: OHCHR
    year: '2022'
    url: https://www.veritaszim.net/sites/veritas_d/files/Istanbul-Protocol_Rev2_EN.pdf
    locator: para. 660
    quote: including an initial health examination at the time of detention and every 24 hours thereafter;
      at the request of the detainee; and before transfers to other places of detention
    quote_verified: true
    checked: '2026-10-10'
  - title: United Nations Standard Minimum Rules for the Treatment of Prisoners (the Nelson Mandela Rules)
    publisher: UNODC / UN General Assembly
    year: '2015'
    url: https://www.unodc.org/documents/justice-and-prison-reform/Nelson_Mandela_Rules-E-ebook.pdf
    locator: Rule 30
    quote: shall see, talk with and examine every prisoner as soon as possible following his or her admission
      and thereafter as necessary.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Admission medical screening absent from file.
  - Detainee asked for a doctor and the request is unanswered in the log.
  cases: []
  data_needed:
  - Person
  - PublicBody
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Custody and medical records
  - NPM / inspectorate reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: No initial health examination at detention, or none in each 24 hours of police custody,
      or clinician access to an alleged victim not given within 24 hours
    threshold_source: https://www.veritaszim.net/sites/veritas_d/files/Istanbul-Protocol_Rev2_EN.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Short custody released before an exam was due.
  - Detainee refused examination.
  - Staffing shortage rather than intent.
  jurisdictions: International standard
  version: 1
- id: DT-003
  name: Family or chosen third party not told of the detention
  definition: Relatives or a person chosen by the detainee are not informed promptly that the person is
    held, or where.
  areas:
  - DT
  typology: Missing custody safeguards
  status: verified
  sources:
  - title: 'Symposium on procedural safeguards in the first hours of police custody: outcome report'
    publisher: Association for the Prevention of Torture
    url: https://www.apt.ch/sites/default/files/publications/symposium-on-safeguards_outcome-report.pdf
    locator: p. 16
    quote: significantly reduces the isolation of the person in custody.
    quote_verified: true
    checked: '2026-10-10'
  - title: International Convention for the Protection of All Persons from Enforced Disappearance
    publisher: OHCHR
    year: '2006'
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/international-convention-protection-all-persons-enforced
    locator: Article 17(2)(d)
    quote: his or her family, counsel
    quote_verified: true
    checked: '2026-10-10'
  - title: Istanbul Protocol (Rev. 2)
    publisher: OHCHR
    year: '2022'
    url: https://www.veritaszim.net/sites/veritas_d/files/Istanbul-Protocol_Rev2_EN.pdf
    locator: para. 659(d)
    quote: Allowing prompt contact and visits by relatives and/or friends;
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Family learns of the arrest days later from another source.
  cases: []
  data_needed:
  - Person
  - Family
  - Event
  - PublicBody
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HR
    reason: Non-notification is an element of the enforced disappearance pattern covered by HR-031.
    source_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/international-convention-protection-all-persons-enforced
  innocent_explanations:
  - Detainee asked that family not be told.
  - No contact details for a relative.
  - Lawful short delay to protect an investigation.
  jurisdictions: International standard
  version: 1
- id: DT-004
  name: Detainee not brought promptly before a judge, or habeas corpus blocked
  definition: A detainee stays in the detaining authority's hands without prompt judicial review, or courts
    cannot or do not hear a challenge to the detention.
  areas:
  - DT
  typology: Missing custody safeguards / arbitrary detention
  status: verified
  sources:
  - title: 'Symposium on procedural safeguards in the first hours of police custody: outcome report'
    publisher: Association for the Prevention of Torture
    url: https://www.apt.ch/sites/default/files/publications/symposium-on-safeguards_outcome-report.pdf
    locator: p. 18
    quote: removing a detainee from the control of the detaining authority at an early opportunity
    quote_verified: true
    checked: '2026-10-10'
  - title: Enforced or Involuntary Disappearances, Fact Sheet No. 6 (Rev. 2)
    publisher: OHCHR / Working Group on Enforced or Involuntary Disappearances
    url: https://digitallibrary.un.org/record/243400/files/FactSheet6rev-2en.pdf
    locator: Section III
    quote: the right to habeas corpus
    quote_verified: true
    checked: '2026-10-10'
  - title: International Convention for the Protection of All Persons from Enforced Disappearance
    publisher: OHCHR
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/international-convention-protection-all-persons-enforced
    locator: Article 20(2)
    quote: may not be suspended or restricted in any circumstances
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Habeas petitions answered with claims the person is not held.
  cases: []
  data_needed:
  - Person
  - CourtCase
  - PublicBody
  - Event
  checkable: lookups
  lookup_sources:
  - Court dockets (PACER, state court records)
  - Habeas petitions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Court backlogs or holidays.
  - Detainee released before a hearing was needed.
  - Statutory time limit not yet passed.
  jurisdictions: International standard
  version: 1
- id: DT-005
  name: Interviews and custody areas not recorded or supervised
  definition: Police interviews are not electronically recorded and custody areas lack audio or video
    supervision, leaving no independent record of treatment.
