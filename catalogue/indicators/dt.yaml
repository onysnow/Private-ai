  - DT
  typology: Missing custody safeguards
  status: verified
  sources:
  - title: Police custody (CPT/Inf(92)3-part1)
    publisher: CPT, Council of Europe
    url: https://rm.coe.int/16806cea2f
    locator: para. 39
    quote: the electronic recording of police interviews is another useful safeguard against the ill-treatment
      of detainees
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Symposium on procedural safeguards in the first hours of police custody: outcome report'
    publisher: Association for the Prevention of Torture
    url: https://www.apt.ch/sites/default/files/publications/symposium-on-safeguards_outcome-report.pdf
    locator: p. 22
    quote: Custody may be supervised directly using audio or video equipment such as CCTV
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Recording 'malfunctioned' during the interview at issue.
  - Interview length and times not logged.
  cases: []
  data_needed:
  - Event
  - Document
  - PublicBody
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Genuine equipment failure.
  - Jurisdiction has no recording requirement.
  - Retention period expired.
  jurisdictions: International standard
  version: 1
- id: DT-006
  name: Missing, incomplete or inaccurate custody register
  definition: The official record of who is held, when, where, by whose order and when released or transferred
    is missing fields, absent or wrong.
  areas:
  - DT
  typology: Records and registers
  status: verified
  sources:
  - title: International Convention for the Protection of All Persons from Enforced Disappearance, Article
      17
    publisher: United Nations treaty text (via LexMea)
    url: https://lexmea.de/en/gesetz/cped/article-17
    locator: Article 17(3)
    quote: up-to-date official registers and/or records
    quote_verified: true
    checked: '2026-10-10'
  - title: International Convention for the Protection of All Persons from Enforced Disappearance
    publisher: OHCHR
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/international-convention-protection-all-persons-enforced
    locator: Article 22(b) (summary from fetch; full text not quoted)
    quote: Failure to record the deprivation of liberty of any person, or the recording of any information
      which the official responsible for the official register knew or should have known to be inaccurate
    quote_verified: true
    checked: '2026-10-10'
  - title: Police custody (CPT/Inf(92)3-part1)
    publisher: CPT, Council of Europe
    url: https://rm.coe.int/16806cea2f
    locator: para. 40
    quote: a single and comprehensive custody record
    quote_verified: true
    checked: '2026-10-10'
  - title: Nelson Mandela Rules
    publisher: UNODC / UN General Assembly
    url: https://www.unodc.org/documents/justice-and-prison-reform/Nelson_Mandela_Rules-E-ebook.pdf
    locator: Rule 7
    quote: No person shall be received in a prison without a valid commitment order.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Register lacks the ordering authority or grounds.
  - Release time recorded but no destination.
