- id: DT-013
  name: Torture or ill-treatment allegations not promptly and independently investigated
  definition: Complaints or reasonable grounds of ill-treatment get no prompt, impartial investigation
    by a body independent of the detaining authority, or implicated staff take part.
  areas:
  - DT
  typology: Investigation failures
  status: verified
  sources:
