not_reached:
- WebSearch budget for this turn was used up after one query, so the research used only direct fetches
  of known URLs. Wider sources could not be searched.
- 'U.S. v. Burge (Chicago police torture, perjury conviction): the DOJ press release returned no content,
  and the CourtListener API throttled the request. The case was not included.'
- 'Taguba report (Abu Ghraib): irp.fas.org and fas.org returned empty files.'
- 'Baha Mousa Public Inquiry report (UK, 2011): the gov.uk page links PDF volumes that were not fetched.
  Only the publication date was confirmed.'
- 'Senate Select Committee on Intelligence CIA detention study (2014): only the release date of 9 December
  2014 was confirmed. The findings PDF download was corrupt.'
- 'Brook House Inquiry report (UK immigration detention): a CAPTCHA blocked access.'
- 'DHS OIG-18-86 (Adelanto management alert): oig.dhs.gov and the oversight.gov mirror both returned Access
  Denied. Adelanto findings were taken from OIG-19-47 instead.'
- 'UN Special Rapporteur on Torture report A/66/268 on solitary confinement: not fetched.'
- 'CPT standards on complaints mechanisms and access to a lawyer: not fetched.'
- 'APT Detention Focus Database topic pages (solitary, restraint, body searches): only the index was fetched.'
- 'SPT ''Visits and public reports'' and ''Non-compliance'' pages: not fetched.'
- 'Istanbul Protocol Chapter V on physical evidence: deliberately not turned into method-level indicators.
  Only the documentation and safeguard levels are used.'
- 'Full text of CAT Articles 12, 13 and 15, ICPED Articles 21 and 22, and ICPED Article 17(3)(h): the
  fetch tool returned paraphrases only. Those sources are marked ''(as summarised)'' and need checking
  against the treaty text before publishing.'
