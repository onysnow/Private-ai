  - DT
  typology: Coerced statements
  status: verified
  sources:
  - title: Convention against Torture
    publisher: OHCHR
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-against-torture-and-other-cruel-inhuman-or-degrading
    locator: Article 15 (summary from fetch)
    quote: Each State Party shall ensure that any statement which is established to have been made as
