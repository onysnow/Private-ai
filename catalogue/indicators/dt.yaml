    url: https://phrtoolkits.org/toolkits/istanbul-protocol-model-medical-curriculum/module-2-istanbul-protocol-standards-for-medical-documentation-of-torture-and-medical-ethics/an-overview-of-the-istanbul-protocol/
    locator: Module 2
    quote: outside the presence of security agents and other government officials
    quote_verified: true
