key: HC
name: Health care harm and patient safety
scope: Medical negligence, dangerous practitioners, unsafe hospital and maternity units, never events,
  medical device harm, physician sexual misconduct, and cover-ups of public health risks.
indicators:
- id: HC-001
  name: High mortality ratio explained away instead of investigated
  definition: A hospital's standardised death rate stays well above average for years and the hospital
    treats the figures as a coding or data problem rather than a sign of unsafe care.
  areas:
  - HC
  typology: Unsafe hospital or unit
  status: verified
  sources:
  - title: 'Report of the Mid Staffordshire NHS Foundation Trust Public Inquiry: Executive summary (HC
      947)'
    publisher: Mid Staffordshire NHS Foundation Trust Public Inquiry (Robert Francis QC)
    year: '2013'
    url: https://assets.publishing.service.gov.uk/media/5a7ba0faed915d13110607c8/0947.pdf
    locator: Summary of findings, para 1.7
    quote: This can be seen from the way the Trust approached its FT application, its approach to high
      Hospital Standardised Mortality Ratios (HSMRs) and its inaccurate self declaration of its own performance.
      It took false assurance from good news, and yet tolerated or sought to explain away bad news.
    quote_verified: true
    licence: Open Government Licence v3.0
    checked: '2026-10-10'
  - title: 'Report of the Mid Staffordshire NHS Foundation Trust Public Inquiry: Executive summary (HC
      947)'
    publisher: Mid Staffordshire NHS Foundation Trust Public Inquiry
    year: '2013'
    url: https://assets.publishing.service.gov.uk/media/5a7ba0faed915d13110607c8/0947.pdf
    locator: Introduction
    quote: Why did the regulatory bodies not act sooner to investigate a trust whose mortality rates had
      been significantly higher than the average since 2003 and whose record in dealing with serious complaints
      was so poor?
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - 'Mid Staffordshire NHS Foundation Trust: mortality significantly above average from 2003; the inquiry
    found the trust sought to explain away bad news.'
  cases:
  - name: Mid Staffordshire NHS Foundation Trust
    year: '2013'
    jurisdiction: England
    what_happened: A public inquiry found the trust tolerated poor standards, prioritised finances and
      foundation trust status, and explained away high mortality ratios while oversight bodies failed
      to act.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/media/5a7ba0faed915d13110607c8/0947.pdf
    source_title: 'Report of the Mid Staffordshire NHS Foundation Trust Public Inquiry: Executive summary'
  data_needed:
  - PublicBody
  - Organization
  - Document
  - Event
  - Note
  checkable: lookups
  lookup_sources:
  - Published risk-adjusted mortality indicators (e.g. NHS SHMI, HSMR from commercial providers)
  - Board papers and minutes
  - Regulator inspection reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Genuine coding or data-quality errors can inflate a ratio
  - Hospitals serving sicker or more deprived populations, or with hospice or specialist services, can
    show higher crude and adjusted rates
  - Small numbers produce random swings
  jurisdictions: UK (NHS); applies wherever risk-adjusted mortality is published
  version: 1
- id: HC-002
  name: Unit is a statistical outlier for serious harm
  definition: A unit has a rate of serious-harm incidents or avoidable deaths clearly higher than comparable
    units, which should prompt outside scrutiny.
  areas:
  - HC
  typology: Unsafe hospital or unit
  status: verified
  sources:
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation (Dr Bill Kirkup) for UK DHSC, HC 681
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Chapter 1, para 1.114
    quote: In 2018, it became evident that East Kent maternity services were an outlier because of the
      rate of occurrence of safety incidents resulting in serious harm.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Foreword / Key Action Area 1
    quote: They can be used, not to generate meaningless league tables, but to identify results that are
      genuine outliers.
    quote_verified: true
    checked: '2026-10-10'
  - title: The Report of the Morecambe Bay Investigation
    publisher: Morecambe Bay Investigation (Dr Bill Kirkup) for UK DHSC
    year: '2015'
    url: https://assets.publishing.service.gov.uk/media/5a7f3d7240f0b62305b85efb/47487_MBI_Accessible_v0.1.pdf
    locator: Summary, para 5
    quote: Different clinical care in these cases would have been expected to prevent the outcome in one
      maternal death and the deaths of 11 babies. This was almost four times the frequency of such failures
      of care at the Royal Lancaster Infirmary.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - East Kent maternity flagged as outlier by HSIB in 2018
  - 'Furness General Hospital maternity: serious failures of care almost four times the rate of a sister
    hospital'
  cases:
  - name: East Kent Hospitals University NHS Foundation Trust maternity services
    year: '2022'
    jurisdiction: England
    what_happened: Independent investigation found a clear pattern of suboptimal care causing significant
      harm from 2009 to 2020, with eight missed opportunities to act.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    source_title: Reading the signals
  - name: University Hospitals of Morecambe Bay NHS Foundation Trust (Furness General Hospital maternity)
    year: '2015'
    jurisdiction: England
    what_happened: Investigation found 20 instances of significant or major failures of care associated
      with three maternal deaths and the deaths of 16 babies.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/media/5a7f3d7240f0b62305b85efb/47487_MBI_Accessible_v0.1.pdf
    source_title: The Report of the Morecambe Bay Investigation
  data_needed:
  - PublicBody
  - Organization
  - Event
  - Document
  checkable: lookups
  lookup_sources:
  - National perinatal mortality surveillance (MBRRACE-UK)
  - Patient safety investigation body reports (HSIB/HSSIB)
  - Regulator ratings and inspection reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Units taking higher-risk referrals or tertiary cases see more poor outcomes
  - A unit with a strong reporting culture records more incidents
  - Random variation in small units
  jurisdictions: UK; general
  version: 1
- id: HC-003
  name: Never Event occurred
  definition: A wholly preventable serious incident on a recognised list (such as wrong-site surgery,
    a retained foreign object, or wrong-route medication) happened at the provider.
  areas:
  - HC
  typology: Never events and serious reportable events
  status: verified
  sources:
  - title: Revised Never Events policy and framework
    publisher: NHS Improvement / NHS England
    url: https://www.england.nhs.uk/wp-content/uploads/2020/11/Revised-Never-Events-policy-and-framework-FINAL.pdf
    locator: Section 3.1
    quote: Never Events are defined as Serious Incidents that are wholly preventable because guidance
      or safety recommendations that provide strong systemic protective barriers are available at a national
      level and should have been implemented by all healthcare providers.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Factsheet: Never Events (2025)'
    publisher: The Leapfrog Group
    year: '2025'
    url: https://ratings.leapfroggroup.org/sites/default/files/2025-03/2025%20Never%20Events%20Fact%20Sheet.pdf
    locator: Measure Background
    quote: Often referred to as “never events,” these include errors such as surgery performed on the
      wrong body part or on the wrong patient, leaving a foreign object inside a patient after surgery,
      or death resulting from devices or contaminated drugs.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Wrong-site surgery
  - Retained foreign object after surgery
  - Death from contaminated drugs or devices
  cases: []
  data_needed:
  - PublicBody
  - Organization
  - Event
  - Document
  checkable: lookups
  lookup_sources:
  - NHS England published Never Events data by trust
  - US state adverse-event reporting programmes (e.g. Minnesota)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Human error can occur despite good systems; a single event does not prove a failing organisation
  - Providers with honest reporting may appear to have more events than those that under-report
  jurisdictions: England (NHS Never Events list); US (NQF Serious Reportable Events)
  version: 1
- id: HC-004
  name: Expected response to a never event missing
  definition: After a never event the provider did not apologise, report it to an outside body in time,
    carry out a root-cause analysis, or waive the related charges.
  areas:
  - HC
  typology: Never events and serious reportable events
  status: verified
  sources:
  - title: 'Factsheet: Never Events (2025)'
    publisher: The Leapfrog Group
    year: '2025'
    url: https://ratings.leapfroggroup.org/sites/default/files/2025-03/2025%20Never%20Events%20Fact%20Sheet.pdf
    locator: Leapfrog's Policy on Never Events
    quote: 'Beginning in 2007, Leapfrog has asked hospitals to commit to five actions if a never event
      occurs within their facility: 1) apologize to the patient; 2) report the event; 3) perform a root
      cause analysis; 4) waive costs directly related to the event; 5) provide a copy of the hospital’s
      policy on never events to patients and payors upon request.'
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Factsheet: Never Events (2025)'
    publisher: The Leapfrog Group
    year: '2025'
    url: https://ratings.leapfroggroup.org/sites/default/files/2025-03/2025%20Never%20Events%20Fact%20Sheet.pdf
    locator: Action 2
    quote: Leapfrog asks that the hospital report to its chosen entity within 15 business days of determining
      a never event occurred.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Patient billed for corrective surgery after a retained object
  - No root-cause analysis on file after wrong-site surgery
  cases: []
  data_needed:
  - Organization
  - Event
  - Document
  - Payment
  - Person
  checkable: records
  lookup_sources:
  - Billing records and explanation-of-benefits documents
  - State adverse-event reports
  - Leapfrog Hospital Survey results
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Report not made within 15 business days of determining a never event occurred, or any of
      the listed actions missing
    threshold_source: https://ratings.leapfroggroup.org/sites/default/files/2025-03/2025%20Never%20Events%20Fact%20Sheet.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Leapfrog's policy is voluntary; not every hospital has adopted it
  - Billing may be automated and corrected later
  - Reports may go to a patient safety organisation that does not publish them
  jurisdictions: US (Leapfrog policy); comparable duties elsewhere
  version: 1
- id: HC-005
  name: Serious incidents downgraded or not declared
  definition: Incidents that meet the serious-incident threshold are recorded as lower-level local reviews
    or not recorded at all, keeping them away from outside scrutiny.
  areas:
  - HC
  typology: Concealment and failure to investigate
  status: verified
  sources:
  - title: Final report of the Ockenden review
    publisher: Independent Review of Maternity Services at The Shrewsbury and Telford Hospital NHS Trust,
      for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/624332fe8fa8f527744f0615/Final-Ockenden-Report-web-accessible.pdf
    locator: Summary of findings (governance)
    quote: In fact, the maternity governance team inappropriately downgraded serious incidents to a local
      investigation methodology in order to avoid external scrutiny, so that the true scale of serious
      incidents at the Trust went unknown until this review was undertaken.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Illustrative Case B
    quote: Also striking are the lack of frankness about what had happened and the failure to report and
      investigate a serious incident.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Kate Stanton-Davies' death investigated as a High Risk Case Review rather than a Serious Incident
    (Ockenden)
  cases:
  - name: Shrewsbury and Telford Hospital NHS Trust maternity services
    year: '2022'
    jurisdiction: England
    what_happened: Review of 1,592 clinical incidents found the service failed to investigate, learn and
      improve, and downgraded serious incidents to avoid external scrutiny.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/media/624332fe8fa8f527744f0615/Final-Ockenden-Report-web-accessible.pdf
    source_title: Final report of the Ockenden review
  data_needed:
  - PublicBody
  - Event
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Serious incident logs (e.g. StEIS) obtained by FOI
  - Board quality committee papers
  - Coroner prevention-of-future-deaths reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Incident classification frameworks change over time and thresholds are sometimes genuinely unclear
  - Some cases are properly managed locally when harm was not avoidable
  jurisdictions: UK; general
  version: 1
- id: HC-006
  name: Deaths treated as expected and kept from the coroner
  definition: A provider classes catastrophic outcomes as expected or unavoidable and resists referral
    to the coroner or an inquest.
  areas:
  - HC
  typology: Concealment and failure to investigate
  status: verified
  sources:
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Missed Opportunity 7, para 1.112
    quote: It included denying that anything had gone amiss, minimising adverse features, finding reasons
      to treat deaths and other catastrophic outcomes as expected, and omitting key details in accounts
      given to families as well as to official bodies. Although we did not find evidence that there was
      a conscious conspiracy, the effect of these behaviours was to cover up the truth.
    quote_verified: true
    checked: '2026-10-10'
  - title: Final report of the Ockenden review
    publisher: Independent Review of Maternity Services at The Shrewsbury and Telford Hospital NHS Trust
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/624332fe8fa8f527744f0615/Final-Ockenden-Report-web-accessible.pdf
    locator: Chapter 1a, para 1a.2
    quote: Within nine months, between May 2008 and March 2009, there were three neonatal deaths of babies
      that should have led to a systematic review of governance processes, strong actions and learning
      as well as a coronial inquiry into safety at the Trust.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - East Kent initially refused to refer baby Harry Richford's death to the coroner; a coroner's inquest
    more than two years later exposed the failings
  cases:
  - name: 'East Kent maternity: death of baby Harry Richford'
    year: '2022'
    jurisdiction: England
    what_happened: The investigation found the trust initially refused to refer the death to the coroner
      and sent incorrect data to the national perinatal audit; the family's persistence led to an inquest.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    source_title: Reading the signals
  data_needed:
  - PublicBody
  - Event
  - CourtCase
  - Document
  checkable: records
  lookup_sources:
  - Coroner inquest records and prevention-of-future-deaths reports
  - Trust incident records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Many deaths are genuinely expected and do not need referral
  - Referral rules and coroner practice vary by area
  jurisdictions: England and Wales (coroner system); general
  version: 1
- id: HC-007
  name: Inaccurate data sent to national audits or regulators
  definition: A provider sends wrong or misleading information about incidents or its own performance
    to a national audit, regulator or commissioner.
  areas:
  - HC
  typology: Concealment and failure to investigate
  status: verified
  sources:
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Chapter 5 (baby Harry)
    quote: The MBRRACE-UK form for Harry dated February 2019 confirmed (among other inaccuracies) that
      the placenta had been sent for histology, that the case had been discussed with a coroner (although
      this was only done following pressure from the family) and that there was a final, agreed cause
      of death following the results of the inquest and all investigations
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Report of the Mid Staffordshire NHS Foundation Trust Public Inquiry: Executive summary'
    publisher: Mid Staffordshire NHS Foundation Trust Public Inquiry
    year: '2013'
    url: https://assets.publishing.service.gov.uk/media/5a7ba0faed915d13110607c8/0947.pdf
    locator: Recommendation 181
    quote: On directors of healthcare organisations to be truthful in any information given to a regulator
      or commissioner.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Inaccurate MBRRACE-UK return for a neonatal death (East Kent)
  - Inaccurate self-declaration of compliance with standards (Mid Staffordshire)
  cases: []
  data_needed:
  - PublicBody
  - Document
  - Event
  checkable: records
  lookup_sources:
  - National audit returns obtained by FOI or via families
  - Regulator self-assessment declarations
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Clerical error or forms completed before investigations finished
  - Different definitions between audits
  jurisdictions: UK; general
  version: 1
- id: HC-008
  name: Families not told the truth about harm
  definition: Patients or families are not told openly what went wrong, are given partial accounts, or
    learn key facts only through their own effort.
  areas:
  - HC
  typology: Concealment and failure to investigate
  status: verified
  sources:
  - title: 'Regulation 20: Duty of candour'
    publisher: Care Quality Commission
    url: https://www.cqc.org.uk/guidance-regulation/providers/regulations-service-providers-and-managers/health-social-care-act/regulation-20
    locator: Background to the duty of candour
    quote: The duty of candour is a general duty to be open and transparent with people receiving care
      from you. It applies to every health and social care provider that CQC regulates.
    quote_verified: true
    checked: '2026-10-10'
  - title: Final report of the Ockenden review
    publisher: Independent Review of Maternity Services at The Shrewsbury and Telford Hospital NHS Trust
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/624332fe8fa8f527744f0615/Final-Ockenden-Report-web-accessible.pdf
    locator: Para 4.63
    quote: In 2018 an investigation was started without the woman being told an investigation was ongoing
      or being asked to contribute. This is despite Duty of Candour78 being well embedded nationally and
      being a legal requirement.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Infected Blood Inquiry: The Report, Volume 1'
    publisher: Infected Blood Inquiry (UK)
    year: '2024'
    url: https://www.infectedbloodinquiry.org.uk/sites/default/files/Volume_1.pdf
    locator: Overview, chapter 7.9 commentary
    quote: 'Hiding the truth includes not only deliberate concealment but also a lack of candour: the
      retelling of half-truths such as the “no conclusive proof” line; and failing to tell people about
      the risks inherent in treatment or the alternatives to that treatment, that they had been tested
      for infection, or been used in research, or were suffering from a potentially serious and fatal
      disease.'
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Investigation run without telling the mother (Shrewsbury and Telford)
  cases: []
  data_needed:
  - Person
  - Organization
  - Event
  - Document
  checkable: person
  lookup_sources:
  - Family accounts and correspondence
  - Complaint files
  - Ombudsman decisions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Facts may be unknown while investigations are ongoing
  - Staff may delay disclosure on legal advice without intent to conceal
  jurisdictions: England (statutory duty of candour); general
  version: 1
- id: HC-009
  name: Patients' and families' concerns dismissed
  definition: Patients' reports of symptoms or problems are repeatedly dismissed or not taken seriously,
    including labelling women's symptoms as normal.
  areas:
  - HC
  typology: Failure to listen
  status: verified
  sources:
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
    url: https://assets.publishing.service.gov.uk/media/634fb083e90e0731a5423408/reading-the-signals-maternity-and-neonatal-services-in-east-kent_the-report-of-the-independent-investigation_print-ready.pdf
    locator: Chapter 3, themes from family listening sessions
    quote: Not listening to women’s concerns or not taking them seriously, resulting in a failure to recognise
      warning signs or a deteriorating situation
    quote_verified: true
    checked: '2026-10-10'
  - title: 'First Do No Harm: The report of the Independent Medicines and Medical Devices Safety Review'
    publisher: Independent Medicines and Medical Devices Safety Review (Baroness Cumberlege)
    year: '2020'
    url: https://www.immdsreview.org.uk/downloads/IMMDSReview_Web.pdf
    locator: Chapter 1, para 1.18
    quote: For women there is an added dimension – the widespread and wholly unacceptable labelling of
      so many symptoms as ‘normal’ and attributable to ‘women’s problems’.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - East Kent families told their concerns were unfounded
  - Pelvic mesh patients told symptoms were normal (IMMDS review)
  cases:
  - name: Pelvic mesh, sodium valproate and Primodos (IMMDS review)
    year: '2020'
    jurisdiction: England
    what_happened: The review found patients affected by these interventions had been dismissed, overlooked
      and ignored, and that the healthcare system was disjointed, siloed, unresponsive and defensive.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://www.immdsreview.org.uk/downloads/IMMDSReview_Web.pdf
    source_title: First Do No Harm
  data_needed:
  - Person
  - Organization
  - Event
  - Document
  checkable: person
  lookup_sources:
  - Complaints data
  - Patient surveys
  - Family and patient-group testimony
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Clinicians often correctly reassure patients whose symptoms are benign
  - Single complaints may reflect communication problems rather than unsafe care
  jurisdictions: UK; general
  version: 1
- id: HC-010
  name: Complaints and scrutiny handled as reputation management
  definition: A provider puts more effort into managing complaints, litigation and press than into learning,
    and fights regulators' findings line by line.
  areas:
  - HC
  typology: Concealment and failure to investigate
  status: verified
  sources:
  - title: 'Reading the signals: Maternity and neonatal services in East Kent'
    publisher: Independent Investigation for UK DHSC
    year: '2022'
