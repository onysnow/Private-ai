key: KX
name: Kidnapping, extortion and protection rackets
scope: Kidnap for ransom, express and virtual kidnapping, illegal detention by criminals, hijacking, and
  extortion of businesses and diaspora communities by gangs and cartels.
indicators:
- id: KX-001
  name: Ransom call from an unfamiliar number, often several calls
  definition: Someone gets one or more calls from an unfamiliar or out-of-area number claiming a relative
    has been kidnapped and demanding money.
  areas:
  - KX
  typology: Virtual kidnapping
  status: verified
  sources:
  - title: FBI Warns Public of 'Virtual Kidnapping' Extortion Calls
    publisher: FBI Phoenix
    year: '2020'
    url: https://www.fbi.gov/contact-us/field-offices/phoenix/news/press-releases/fbi-warns-public-of-virtual-kidnapping-extortion-calls
    locator: List of indicators
    quote: Calls are usually made from an outside area code
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - The FBI says calls in Operation Hotel Tango came from Mexican prisons and reached more than 80 victims
    in four US states.
  cases:
  - name: Operation Hotel Tango (FBI Los Angeles)
    year: '2017'
    jurisdiction: United States (California, Minnesota, Idaho, Texas)
    what_happened: The FBI says virtual kidnapping calls placed from Mexican prisons reached more than
      80 victims, with combined losses above $87,000. The source reports no court outcome.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.fbi.gov/news/stories/virtual-kidnapping
    source_title: Virtual Kidnapping (FBI news story)
  data_needed:
  - Person
  - Event
  - Note
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: The FBI calls virtual kidnapping 'always an extortion scheme', a deception-based fraud.
    source_url: https://www.fbi.gov/news/stories/virtual-kidnapping
  innocent_explanations:
  - Relatives travelling abroad or using borrowed or foreign phones
  - Real emergencies reported by hospitals, police or consulates
  - Ordinary calls from unfamiliar area codes
  jurisdictions: United States, Mexico
  version: 1
