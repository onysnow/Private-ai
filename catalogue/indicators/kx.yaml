- id: KX-004
  name: Ransom demanded only by wire transfer, often abroad, with the amount dropping fast
  definition: The caller will accept payment only by wire transfer (the FBI cites transfers to Mexico),
    and the ransom demand drops quickly when the target hesitates.
  areas:
  - KX
  typology: Virtual kidnapping
  status: verified
  sources:
  - title: FBI Warns Public of 'Virtual Kidnapping' Extortion Calls
    publisher: FBI Phoenix
    year: '2020'
