key: TR
name: Transnational repression
scope: 'States harassing, surveilling, coercing home, spying on or attacking diaspora critics abroad:
  covert police stations, threats to relatives, Interpol abuse, and assassination plots.'
indicators:
- id: TR-001
  name: Undeclared foreign police 'station' or outpost operating in a diaspora community
  definition: An office in the host country that quietly works for a foreign police or security ministry,
    without being declared to the host government, to watch and pressure people from that country.
  areas:
  - TR
  typology: Covert state presence / co-opting diaspora institutions
  status: verified
  sources:
  - title: New York Resident Pleads Guilty to Operating Secret Police Station of the Chinese Government
      in Lower Manhattan
    publisher: US Department of Justice, Office of Public Affairs
    year: '2024'
    url: https://www.justice.gov/opa/pr/new-york-resident-pleads-guilty-operating-secret-police-station-chinese-government-lower
    locator: Press release, 18 Dec 2024, opening paragraphs
    quote: opening and operating an undeclared overseas police station, located in lower Manhattan
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational repression (Joint Committee on Human Rights report HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 9
    quote: used to monitor and pressure members of the Chinese diaspora
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - MPS-linked station occupying a floor of a Chinatown office building in Manhattan, closed in fall 2022
    after the FBI investigation became known (DOJ).
  cases:
  - name: United States v. Chen Jinping (Manhattan overseas police station)
    year: '2024'
    jurisdiction: US (E.D.N.Y.)
    what_happened: Chen Jinping pleaded guilty to conspiring to act as an illegal agent of the PRC government
      in connection with an undeclared MPS police station in lower Manhattan.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/new-york-resident-pleads-guilty-operating-secret-police-station-chinese-government-lower
    source_title: New York Resident Pleads Guilty to Operating Secret Police Station of the Chinese Government
      in Lower Manhattan
  - name: United States v. Lu Jianwang
    year: '2023'
    jurisdiction: US (E.D.N.Y.)
    what_happened: Charged with conspiring to act as an agent of the PRC and obstruction; per the complaint
      an MPS official sought his help locating a pro-democracy activist in California. He pleaded not
      guilty; the charges are allegations.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/two-arrested-operating-illegal-overseas-police-station-chinese-government
    source_title: Two Arrested for Operating Illegal Overseas Police Station of the Chinese Government
  data_needed:
  - Organization
  - Address
  - Person
  - Directorship
  - Employment
  - PublicBody
  - UnknownLink
  - Document
  - CourtCase
  checkable: records
  lookup_sources:
  - Company/charity registries for the hosting association
  - Foreign-agent registers (FARA in US; FIRS in UK)
  - Court dockets (PACER)
  - Property/lease records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SA
    reason: Journalists covering such stations may become targets of the same monitoring.
    source_url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
  - target_area: CO
    reason: The charge was acting as an illegal agent of a foreign government without notice to the Attorney
      General.
    source_url: https://www.justice.gov/opa/pr/new-york-resident-pleads-guilty-operating-secret-police-station-chinese-government-lower
  innocent_explanations:
  - Hometown or clan associations legitimately offer help with paperwork such as driving-licence renewals
    for people from the same region.
  - Consulates lawfully provide consular services; a declared consular office is not an undeclared station.
  - Community centres often host visiting officials for cultural events.
  jurisdictions: US (EDNY case); UK (JCHR evidence); pattern reported in many host countries
  version: 1
- id: TR-002
  name: Locating or surveilling a specific critic's home or routine for foreign officials
  definition: Someone in the host country finds a named dissident or journalist, watches their home or
    movements, and passes addresses, photos or routines back to foreign officials or their go-betweens.
  areas:
  - TR
  typology: Direct attack precursor / stalking
  status: verified
  sources:
  - title: Transnational Repression
    publisher: FBI Counterintelligence Division
    url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
    locator: List of tactics
    quote: stalking
    quote_verified: true
    checked: '2026-10-10'
  - title: Two Eastern European Organized Crime Leaders Convicted of Murder-for-Hire Targeting U.S.-Based
      Journalist on Behalf of Iranian Government
    publisher: US Department of Justice
    year: '2025'
    url: https://www.justice.gov/opa/pr/two-eastern-european-organized-crime-leaders-convicted-murder-hire-targeting-us-based
    locator: Press release, 21 Mar 2025
    quote: repeatedly traveled to Alinejad's neighborhood to surveil her
    quote_verified: true
    checked: '2026-10-10'
  - title: Two Arrested for Operating Illegal Overseas Police Station of the Chinese Government
    publisher: US Department of Justice
    year: '2023'
    url: https://www.justice.gov/archives/opa/pr/two-arrested-operating-illegal-overseas-police-station-chinese-government
    locator: Press release, 17 Apr 2023
    quote: the MPS Official sought Lu's assistance in locating an individual living in California
    quote_verified: true
    checked: '2026-10-10'
  - title: Political Operative Sentenced to 48 Months in Federal Prison for Acting as Covert Agent of
      People's Republic of China
    publisher: US Department of Justice
    year: '2026'
    url: https://www.justice.gov/opa/pr/political-operative-sentenced-48-months-federal-prison-acting-covert-agent-peoples-republic
    locator: Press release, 10 Feb 2026
    quote: surveilled groups in the United States that China viewed as threatening its interests
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Photos and videos of a journalist's home sent up a chain to IRGC officials (Amirov/Omarov).
  - Repeated stalking of a Brooklyn house and following the target to a university event (Loadholt).
  cases:
  - name: United States v. Rafat Amirov and Polad Omarov
    year: '2025'
    jurisdiction: US (S.D.N.Y.)
    what_happened: A jury convicted both of a murder-for-hire plot, directed by IRGC members, targeting
      journalist Masih Alinejad; a hired man surveilled her home and bought an AK-47-style rifle.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/two-eastern-european-organized-crime-leaders-convicted-murder-hire-targeting-us-based
    source_title: Two Eastern European Organized Crime Leaders Convicted of Murder-for-Hire Targeting
      U.S.-Based Journalist on Behalf of Iranian Government
  - name: United States v. Yaoning 'Mike' Sun
    year: '2026'
    jurisdiction: US (C.D. Cal.)
    what_happened: Sentenced to 48 months for acting as an illegal agent of the PRC, including surveilling
      groups China saw as threats and reporting on the movements of Taiwan's then-President during a 2023
      visit.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/political-operative-sentenced-48-months-federal-prison-acting-covert-agent-peoples-republic
    source_title: Political Operative Sentenced to 48 Months in Federal Prison for Acting as Covert Agent
      of People's Republic of China
  data_needed:
  - Person
  - Address
  - Event
  - Note
  - Associate
  - UnknownLink
  - Payment
  - CourtCase
  checkable: person
  lookup_sources:
  - Court filings and complaints
  - Police reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SA
    reason: Surveillance of journalists' homes is the step before the attack in the Alinejad plots.
    source_url: https://www.justice.gov/opa/pr/staten-island-man-sentenced-murder-hire-plot-and-stalking-journalist-and-prominent-critic
  innocent_explanations:
  - Press photographers, process servers, private investigators on lawful civil matters, and fans or neighbours
    may be seen near a public figure's home.
  - Community organisers legitimately track public events held by activist groups.
  jurisdictions: US (SDNY, EDNY, CDCA cases)
  version: 1
- id: TR-003
  name: Threats to, police visits to, or detention of relatives in the home country
  definition: Family members or friends still in the home country are threatened, visited by police or
    detained to put pressure on the critic living abroad.
  areas:
  - TR
  typology: Coercion-by-proxy (long-distance threat)
  status: verified
  sources:
  - title: Transnational Repression
    publisher: FBI Counterintelligence Division
    url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
    locator: List of tactics
    quote: threatening or detaining family members or friends in the country of origin
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 58 (witness evidence)
    quote: my family back in China received a police visit
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational Repression
    publisher: Freedom House
    url: https://freedomhouse.org/report/transnational-repression
    locator: 'Tactic categories: Long Distance Threats'
    quote: Origin country tactics that do not require physically reaching the individual targeted.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Police visit to an activist's family in China after the activist spoke out in the UK (JCHR evidence).
  cases: []
  data_needed:
  - Person
  - Family
  - Event
  - Note
  - PublicBody
  checkable: person
  lookup_sources:
  - Interviews with the target
  - Human-rights NGO case files
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SA
    reason: Sources and fixers with family in the origin country are exposed to the same pressure.
    source_url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
  innocent_explanations:
  - Relatives may be contacted by police for unrelated ordinary matters (registration, local disputes,
    criminal investigations unrelated to the critic).
  - Family members may voice worry or ask the person to stop speaking out on their own initiative.
  jurisdictions: Global
  version: 1
- id: TR-004
  name: Campaign to coerce a person to return ('repatriation' pressure)
  definition: A sustained effort, often by agents or relatives acting for the origin state, to make someone
    abroad go back home, using threats, harassment or pressure on family.
  areas:
  - TR
  typology: Coerced return (e.g., Operation Fox Hunt / Sky Net)
  status: verified
  sources:
  - title: Transnational Repression
    publisher: FBI Counterintelligence Division
    url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
    locator: List of tactics
    quote: forcing or coercing the victim to return to their country of origin
    quote_verified: true
    checked: '2026-10-10'
  - title: Leader of Multi-Year 'Operation Fox Hunt' Repatriation Campaign Directed by the People's Republic
      of China Sentenced
    publisher: US Department of Justice
    year: '2025'
    url: https://www.justice.gov/opa/pr/leader-multi-year-operation-fox-hunt-repatriation-campaign-directed-peoples-republic-china
    locator: Press release, Mar 2025
    quote: a leading member of an international campaign to threaten, harass, and intimidate the U.S.
      Resident and his family members
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 66
    quote: applying coercive pressure, through threats to family members, to compel their return.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Unannounced visits to the target's adult son's home and messages that officials would 'keep pestering'
    the son (Quanzhong An case).
  cases:
  - name: United States v. Quanzhong An (Operation Fox Hunt)
    year: '2025'
    jurisdiction: US (E.D.N.Y.)
    what_happened: Sentenced to 20 months and about $5 million in financial penalties for leading a PRC-directed
      campaign from 2017 to 2022 to coerce a U.S. resident to return to China.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/leader-multi-year-operation-fox-hunt-repatriation-campaign-directed-peoples-republic-china
    source_title: Leader of Multi-Year 'Operation Fox Hunt' Repatriation Campaign ... Sentenced
  data_needed:
  - Person
  - Family
  - Event
  - Note
  - PublicBody
  - CourtCase
  - Payment
  checkable: person
  lookup_sources:
  - Court records
  - Extradition / anti-corruption fugitive lists published by origin state
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Fox Hunt targets were described by the origin state as fugitives; distinguishing lawful recovery
      from coercion requires checking legal channels.
    source_url: https://www.justice.gov/archives/opa/pr/two-arrested-and-13-charged-three-separate-cases-alleged-participation-malign-schemes-united
  innocent_explanations:
  - Legitimate cross-border law-enforcement cooperation through extradition or mutual legal assistance
    channels.
  - Relatives genuinely wanting a family member to come home.
  jurisdictions: US (EDNY); UK (JCHR)
  version: 1
- id: TR-005
  name: Murder-for-hire or assassination plot using criminal proxies
  definition: Foreign state officials, directly or through middlemen, hire criminals in the host country
    to kill or kidnap a critic, usually paying in cash and supplying targeting details.
  areas:
  - TR
  typology: Direct attack
  status: verified
  sources:
  - title: Transnational Repression
    publisher: FBI Counterintelligence Division
    url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
    locator: List of tactics
    quote: attempted murder
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational Repression
    publisher: Freedom House
    url: https://freedomhouse.org/report/transnational-repression
    locator: 'Tactic categories: Direct Attacks'
    quote: Origin country tactics that physically reach the individual targeted.
    quote_verified: true
    checked: '2026-10-10'
  - title: Indian National Pleads Guilty to Plotting to Assassinate U.S. Citizen in New York City
    publisher: US Attorney's Office, S.D.N.Y.
    year: '2026'
    url: https://www.justice.gov/usao-sdny/pr/indian-national-pleads-guilty-plotting-assassinate-us-citizen-new-york-city
    locator: Press release, Feb 2026
    quote: GUPTA directed the UC to carry out the murder as soon as possible, but GUPTA also specifically
      instructed
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 10
    quote: Russia has engaged in the most serious forms of transnational repression
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - $30,000 cash paid to a hired man who bought an AK-47-style rifle (Alinejad plot).
  - Address, phone numbers and daily routine supplied by a government employee to a would-be hitman (Gupta).
  cases:
  - name: United States v. Nikhil Gupta
    year: '2026'
    jurisdiction: US (S.D.N.Y.)
    what_happened: Pleaded guilty to all three counts in a plot, allegedly directed by Indian Cabinet
      Secretariat employee Vikash Yadav (charged, not arrested), to assassinate a U.S. citizen who advocates
      for Khalistan.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-sdny/pr/indian-national-pleads-guilty-plotting-assassinate-us-citizen-new-york-city
    source_title: Indian National Pleads Guilty to Plotting to Assassinate U.S. Citizen in New York City
  - name: United States v. Jonathan Loadholt
    year: '2026'
    jurisdiction: US (S.D.N.Y.)
    what_happened: Sentenced to 10 years after pleading guilty to stalking and money-laundering conspiracy
      in an Iranian government-directed plot against Masih Alinejad; co-defendant Carlisle Rivera sentenced
      to 15 years; Farhad Shakeri at large.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/staten-island-man-sentenced-murder-hire-plot-and-stalking-journalist-and-prominent-critic
    source_title: Staten Island Man Sentenced for Murder-for-Hire Plot and Stalking a Journalist
  - name: United States v. Amirov and Omarov
    year: '2025'
    jurisdiction: US (S.D.N.Y.)
    what_happened: Jury convicted both of an IRGC-directed murder-for-hire plot against Masih Alinejad.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/two-eastern-european-organized-crime-leaders-convicted-murder-hire-targeting-us-based
    source_title: Two Eastern European Organized Crime Leaders Convicted...
