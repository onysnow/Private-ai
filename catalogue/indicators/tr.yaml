  - Person
  - Payment
  - Associate
  - Event
  - Address
  - Employment
  - PublicBody
  - CourtCase
  - Vehicle
  checkable: records
  lookup_sources:
  - Federal court dockets
  - Sanctions lists (IRGC designations)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: State plots used organised-crime figures and cash payments; Loadholt pleaded to money-laundering
      conspiracy.
    source_url: https://www.justice.gov/opa/pr/staten-island-man-sentenced-murder-hire-plot-and-stalking-journalist-and-prominent-critic
  - target_area: SF
    reason: IRGC direction of plots links to sanctioned entities.
    source_url: https://www.justice.gov/opa/pr/two-eastern-european-organized-crime-leaders-convicted-murder-hire-targeting-us-based
  innocent_explanations:
  - Ordinary criminal violence against a public figure with no state link.
  - Threats from private individuals who share a government's views but act alone.
  jurisdictions: US (SDNY); UK (Skripal per JCHR)
  version: 1
- id: TR-006
  name: Bounties on exiles and threatening letters to their neighbours
  definition: The origin state publicly offers money for information leading to an exile's capture and
    people near the exile receive letters urging them to inform.
  areas:
  - TR
  typology: Long-distance threat / extraterritorial arrest warrants
  status: verified
  sources:
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 9
    quote: offering $HK1 million for information leading to their capture abroad.
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 9
    quote: threatening letters were reportedly sent to the neighbours of individuals who had bounties
      placed on them
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Hong Kong bounties on UK-based activists including Chloe Cheung, who gave evidence to the committee
    (JCHR paras 4, 9).
  cases:
  - name: Hong Kong bounties on UK-based activists (JCHR inquiry)
    year: '2025'
    jurisdiction: UK
    what_happened: The Joint Committee on Human Rights reported HK$1 million bounties on Hong Kongers
      abroad and letters to their neighbours, and that only one recipient in the third round was contacted
      by MI5.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    source_title: Transnational repression (HC 681)
  data_needed:
  - Person
  - PublicBody
  - Document
  - Address
  - Event
  - Sanction
  checkable: lookups
  lookup_sources:
  - Origin-state police/government wanted announcements
  - Official gazettes
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Ordinary wanted-person appeals for people accused of common crimes in rule-of-law states.
  jurisdictions: UK (Hong Kong cases per JCHR)
  version: 1
- id: TR-007
  name: Politically motivated INTERPOL Red Notice or other international alert
  definition: The origin state uses INTERPOL's wanted-person alerts against opponents, journalists or
    rights defenders, which can lead to detention at borders or refusal of asylum or citizenship.
  areas:
  - TR
  typology: Co-opting other countries / Interpol abuse
  status: verified
  sources:
  - title: Transnational repression (HC 681)
    publisher: UK Parliament Joint Committee on Human Rights
    year: '2025'
    url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
    locator: Para 64
    quote: routinely used to pursue political opponents, human rights defenders, and journalists beyond
      national borders
    quote_verified: true
    checked: '2026-10-10'
  - title: Red Notices
    publisher: INTERPOL
    url: https://www.interpol.int/en/How-we-work/Notices/Red-Notices
    locator: Red Notices page
    quote: A Red Notice is an international alert for a wanted person, but it is not an arrest warrant.
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational Repression
    publisher: Freedom House
    url: https://freedomhouse.org/report/transnational-repression
    locator: Definition
    quote: including through assassinations, unlawful deportations, abductions, digital threats, Interpol
      abuse,
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Red Notice leading to refusal of asylum or citizenship applications (JCHR para 76).
  cases: []
  data_needed:
  - Person
  - PublicBody
  - Document
  - Event
  - CourtCase
  checkable: lookups
  lookup_sources:
  - INTERPOL public Red Notice list
  - Extradition court rulings
  - CCF (Commission for the Control of INTERPOL's Files) decisions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: SA
    reason: JCHR notes Red Notices are used against journalists, which affects reporters travelling.
    source_url: https://publications.parliament.uk/pa/jt5901/jtselect/jtrights/681/report.html
  innocent_explanations:
  - Most Red Notices concern ordinary criminal suspects and are reviewed by INTERPOL for compliance with
    its rules.
  - A person may face genuine criminal charges in addition to being a critic.
  jurisdictions: Global
  version: 1
- id: TR-008
  name: 'Mobility controls: passport revocation, denial of consular services, false lost/stolen passport
    reports'
  definition: The origin state stops a person travelling or living normally abroad by cancelling or withholding
    passports, refusing consular help, or reporting travel documents lost or stolen so the person is held
    in transit.
  areas:
  - TR
  typology: Mobility controls
  status: verified
  sources:
  - title: Transnational Repression
    publisher: Freedom House
    url: https://freedomhouse.org/report/transnational-repression
    locator: 'Tactic categories: Mobility Controls'
    quote: When origin countries restrict individuals' ability to travel.
    quote_verified: true
    checked: '2026-10-10'
  - title: Transnational Repression
    publisher: FBI Counterintelligence Division
    url: https://www.fbi.gov/investigate/counterintelligence/transnational-repression
    locator: List of tactics
    quote: abusive legal practices (e.g., lawsuits, asset freezes, or withholding legal documents such
      as passports)
    quote_verified: true
    checked: '2026-10-10'
  examples: []
  cases: []
  data_needed:
  - Person
  - Document
  - PublicBody
  - Event
  checkable: person
  lookup_sources:
  - Consular correspondence held by the target
  - Border/transit detention records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Passports expire or are cancelled after genuine loss reports, unpaid fees or ordinary administrative
    errors.
  - Consular backlogs and staffing shortages delay services for everyone.
  jurisdictions: Global
  version: 1
- id: TR-009
  name: Abusive legal action against critics abroad (SLAPPs, asset freezes)
  definition: Lawsuits, asset freezes or other legal processes are used mainly to exhaust, frighten or
