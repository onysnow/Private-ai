key: VA
name: Abuse and neglect of older and disabled adults in care
scope: Physical, sexual, psychological and organisational abuse and neglect in nursing homes, learning-disability
  units, supported living and group homes, including unreported incidents and failing facilities.
indicators:
- id: VA-001
  name: Injuries with no explanation, or an explanation that does not fit
  definition: A resident has bruises, fractures, burns, cuts or other injuries that nobody can account
    for, or the account given does not match the injury.
  areas:
  - VA
  typology: Physical abuse / injury of unknown source
  status: verified
  sources:
  - title: Types and indicators of abuse
    publisher: Social Care Institute for Excellence (SCIE)
    url: https://www.scie.org.uk/safeguarding/adults/introduction/types-and-indicators-of-abuse/
    locator: Physical abuse - signs and indicators
    quote: No explanation for injuries or inconsistency with the account of what happened
    quote_verified: true
    checked: '2026-10-10'
  - title: Signs of Elder Abuse
    publisher: National Center on Elder Abuse (ACL)
    url: https://pfs2.acl.gov/strapib/assets/NCEA_Signs_EA_e7f59fa5f6.pdf
    locator: Physical
    quote: Broken bones, bruises, and welts
    quote_verified: true
    checked: '2026-10-10'
  - title: Incidents of Potential Abuse and Neglect at Skilled Nursing Facilities Were Not Always Reported
      (A-01-16-00509)
    publisher: HHS Office of Inspector General
    year: '2019'
    url: https://oig.hhs.gov/oas/reports/region1/11600509.pdf
    locator: p. 13
    quote: interpreted the term 'suspicious' in different ways when determining whether an incident should
      have been reported
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Hospital records show a femur fracture for a bed-bound resident with no incident report
  - Staff give differing accounts of how a resident got facial bruising
  cases: []
  data_needed:
  - Person
  - Event
  - Document
  - PublicBody
  - Organization
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Older people bruise and fracture easily (thin skin, osteoporosis, anticoagulant drugs)
  - Genuine accidents and falls, including unwitnessed ones
  - Injuries caused during legitimate moving and handling
  - Residents with dementia may not be able to explain an accident
  version: 1
