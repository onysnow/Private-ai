    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Work excessively long hours over long periods
    quote_verified: true
    checked: '2026-10-09'
  - title: Q&As on business and working time
    publisher: International Labour Organization (Helpdesk for Business)
    year: '2012'
    url: https://www.ilo.org/resource/qas-business-and-working-time-0
    locator: Answer to 'Are 24 hour shifts consistent with international labour standards?'
    quote: The relevant international labour standards set a limit on normal (pre-overtime) hours of 8
      per day and 48 hours per week.
    quote_verified: true
    licence: Not stated
