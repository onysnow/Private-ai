key: HT
name: Human trafficking and forced labour
scope: human trafficking, forced labour (the ILO 11 indicators), forced labour in supply chains, migrant
  smuggling, labour exploitation, child labour, and child exploitation only at the level official bodies
  (UNODC, ILO, FATF, national FIUs) publish. Include the financial indicators FIUs publish for trafficking,
  since those link to financial cases.
indicators:
- id: HT-001
  name: Abuse of vulnerability
  definition: The employer or recruiter takes advantage of a worker's weak position (for example irregular
    migration status, poverty, not speaking the language, or dependence on the employer) to impose conditions
    the worker would not otherwise accept.
  areas:
  - HT
  typology: ILO forced labour indicator 1 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization (Special Action Programme to Combat Forced Labour)
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 1, Abuse of vulnerability
    quote: Anyone can be a victim of forced labour.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Be in a situation of dependence
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Workers whose visa is tied to one employer told they will be deported if they complain
  - Workers recruited from an area of economic hardship who cannot speak the local language and rely on
    the employer for housing and transport
  cases:
  - name: Operation Fort (R v Ignacy Brzezinski and others)
    year: '2019'
    jurisdiction: England and Wales (Birmingham Crown Court)
    what_happened: An organised crime group lured largely vulnerable Polish nationals to the UK with offers
      of work, accommodation, food and travel, then exploited them; defendants were sentenced for human
      trafficking, forced labour and money laundering.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.gov.uk/government/news/solicitor-general-welcomes-modern-slavery-conviction
    source_title: Solicitor General welcomes modern slavery conviction (GOV.UK press release)
  data_needed:
  - Person (nationality, birthDate)
  - Employment (employer, employee, startDate, role)
  - Passport / Identification (holder, country, type)
  - Address (shared housing provided by employer)
  - Document (visa or work permit, contract)
  checkable: person
  lookup_sources:
  - Immigration or visa sponsorship records where public
  - Labour inspectorate findings
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Many migrant workers depend on an employer for a visa or housing under lawful, fair schemes
  - Vulnerability alone shows risk, not exploitation; the ILO says some indicators need others alongside
    them
  jurisdictions: International (ILO standard); used by national labour inspectorates and customs authorities
  version: 1
- id: HT-002
  name: Deception about the job
  definition: The worker was promised one job, wage, or set of conditions (verbally or in writing) and
    got something worse on arrival, including contract switching.
  areas:
  - HT
  typology: ILO forced labour indicator 2 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 2, Deception
    quote: Deception relates to the failure to deliver what has been promised to the worker, either verbally
      or in writing.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Have acted on the basis of false promises
    quote_verified: true
    checked: '2026-10-09'
  - title: Supplemental Advisory on Identifying and Reporting Human Trafficking and Related Activity (FIN-2020-A008)
    publisher: FinCEN, US Treasury
    year: '2020'
    url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
    locator: Section I.2, Exploitative Employment Practices
    quote: Some labor recruiters also mislead workers about the conditions and nature of a job, engage
      in contract switching, and confiscate or destroy workers' identity documents.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Job advert abroad promises factory work at a set wage; worker is placed in a different job at lower
    pay
  - Contract signed in home country differs from the one presented on arrival
  cases:
  - name: Operation Fort (R v Ignacy Brzezinski and others)
    year: '2019'
    jurisdiction: England and Wales
    what_happened: Victims were lured with offers of work and free or subsidised accommodation, food and
      travel, then housed in very poor accommodation and paid as little as £10 a week.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.gov.uk/government/news/solicitor-general-welcomes-modern-slavery-conviction
    source_title: Solicitor General welcomes modern slavery conviction
  data_needed:
  - Document (job advertisement, recruitment contract, employment contract)
  - Employment (employer, employee, salary, role)
  - Company (recruitment agency)
  - Representation (agency acting for employer)
  checkable: person
  lookup_sources:
  - Online job advertisements and archives
  - Company registry for the recruitment agency
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: Deceptive recruitment and visa fraud are named by FinCEN as exploitative employment schemes
      used to profit from trafficking.
    source_url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
  innocent_explanations:
  - Lawful contract changes agreed by both sides
  - Misunderstanding caused by translation
  - An employer that failed financially and could not deliver what it promised
  jurisdictions: International
  version: 1
- id: HT-003
  name: Restriction of movement
  definition: Workers are locked in, guarded, or otherwise kept from leaving the workplace or living quarters,
    or can only go out escorted.
  areas:
  - HT
  typology: ILO forced labour indicator 3 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 3, Restriction of movement
    quote: Forced labourers may be locked up and guarded to prevent them from escaping, at work or while
      being transported.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Be unable to leave their work environment
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Guarded worker camps
  - Workers escorted to and from work and never seen alone
  cases: []
  data_needed:
  - Address (workplace and housing, same or linked)
  - Employment
  - Person (worker, supervisor)
  - Document (witness statements, photos)
  checkable: person
  lookup_sources:
  - Satellite or street imagery of sites
  - Planning or property records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Site security rules on dangerous or remote sites (mines, ships, oil rigs)
  - Employer-provided transport offered for convenience
  - Pandemic or public-health movement limits
  jurisdictions: International
  version: 1
- id: HT-004
  name: Isolation
  definition: Workers are kept in remote places or cut off from family, friends, phones, or anyone who
    could help.
  areas:
  - HT
  typology: ILO forced labour indicator 4 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 4, Isolation
    quote: Victims of forced labour are often isolated in remote locations, denied contact with the outside
      world.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Have limited contact with their families or with people outside of their immediate environment
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Fishing crews kept at sea for long periods
  - Workers' phones taken away
  cases: []
  data_needed:
  - Address (remote worksite)
  - Vessel (for at-sea labour)
  - Person
  - Employment
  checkable: person
  lookup_sources:
  - Ship tracking (AIS) for time at sea
  - Satellite imagery
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Remote work by nature (fishing, mining, farming) with lawful rotation and communication
  - Poor connectivity rather than deliberate restriction
  jurisdictions: International
  version: 1
- id: HT-005
  name: Physical and sexual violence
  definition: Workers, or their families, are beaten, assaulted, sexually abused, or given injuries consistent
    with control measures.
  areas:
  - HT
  typology: ILO forced labour indicator 5 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 5, Physical and sexual violence
    quote: Forced labourers, their family members and close associates may be subjected to actual physical
      or sexual violence.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Suffer injuries that appear to be the result of an assault
    quote_verified: true
    checked: '2026-10-09'
  - title: FIN-2020-A008
    publisher: FinCEN
    year: '2020'
    url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
    locator: Section II, Behavioral indicators
    quote: A third party commits acts of physical aggression or intimidation toward the customer.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Bank staff see a companion strike or threaten a customer
  - Medical records of repeated unexplained injuries
  cases: []
  data_needed:
  - Person
  - Document (medical records, police reports, statements)
  - Associate (victim and controller)
  checkable: person
  lookup_sources:
  - Court and police records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Workplace accidents
  - Injuries from unrelated domestic or personal causes
  jurisdictions: International
  version: 1
- id: HT-006
  name: Intimidation and threats
  definition: Workers are threatened (with violence, denunciation to immigration, harm to family, or loss
    of pay) when they complain or try to leave.
  areas:
  - HT
  typology: ILO forced labour indicator 6 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 6, Intimidation and threats
    quote: Victims of forced labour may suffer intimidation and threats when they complain about their
      conditions
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Be threatened with being handed over to the authorities
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Messages threatening to report a worker to immigration
  - Threats against family in home country
  cases:
  - name: Operation Fort (R v Ignacy Brzezinski and others)
    year: '2019'
    jurisdiction: England and Wales
    what_happened: The group threatened or assaulted victims who suggested leaving.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.gov.uk/government/news/solicitor-general-welcomes-modern-slavery-conviction
    source_title: Solicitor General welcomes modern slavery conviction
  data_needed:
  - Person
  - Document (messages, recordings, statements)
  - Email
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Ordinary, lawful disciplinary warnings
  - Workplace disputes without coercion
  jurisdictions: International
  version: 1
- id: HT-007
  name: Retention of identity documents
  definition: The employer, recruiter or a companion holds the worker's passport, ID card or other valuables,
    so the worker cannot leave or prove who they are.
  areas:
  - HT
  - ML
  typology: ILO forced labour indicator 7 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 7, Retention of identity documents
    quote: The retention by the employer of identity documents or other valuable personal possessions
      is an element of forced labour
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Not be in possession of their passports or other travel or identity documents, as those documents
      are being held by someone else
    quote_verified: true
    checked: '2026-10-09'
  - title: Guidance on Recognizing Activity that May be Associated with Human Smuggling and Human Trafficking
      (FIN-2014-A008)
    publisher: FinCEN
    year: '2014'
    url: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A008.pdf
    locator: Appendix B, Customer Interaction Red Flags
    quote: Correspondingly, the third party escorting the customer may always have possession of the customer's
      ID.
    quote_verified: true
    checked: '2026-10-09'
  - title: FIN-2020-A008
    publisher: FinCEN
    year: '2020'
    url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
    locator: Section II, Behavioral indicators
    quote: A third party maintains possession and/or control of all documents or money.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Companion hands the customer's passport to the bank teller
  - Employer keeps workers' passports 'for safekeeping'
  cases:
  - name: Operation Fort (R v Ignacy Brzezinski and others)
    year: '2019'
    jurisdiction: England and Wales
    what_happened: The group kept victims' bank cards and Polish identity cards, or copies of them, to
      prevent them from leaving.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.gov.uk/government/news/solicitor-general-welcomes-modern-slavery-conviction
    source_title: Solicitor General welcomes modern slavery conviction
  - name: CBP forced labor finding on Top Glove Corporation Bhd.
    year: '2021'
    jurisdiction: United States (import enforcement; Malaysia production)
    what_happened: CBP issued a forced labor finding on 29 March (2021) citing indicators including retention
      of identity documents in Top Glove's production; a shipment of 3.97 million gloves was later seized
      in Cleveland.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://cbp.gov/newsroom/local-media-release/cbp-cleveland-seizes-top-glove-products-under-forced-labor-finding
    source_title: CBP Cleveland seizes Top Glove products under forced labor finding
  data_needed:
  - Passport / Identification (holder)
  - Person (holder and person in possession)
  - Associate or UnknownLink (companion to customer)
  - Employment
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Control of a victim's ID lets traffickers open and run accounts in the victim's name; FinCEN
      lists third-party control of documents as a bank-branch red flag.
    source_url: https://www.fincen.gov/sites/default/files/advisory/2020-10-15/Advisory%20Human%20Trafficking%20508%20FINAL_0.pdf
  innocent_explanations:
  - Short, consented retention for a visa or permit application
  - A parent or guardian holding a child's documents
  - Safe-deposit arrangement the worker can end at any time
  jurisdictions: International
  version: 1
- id: HT-008
  name: Withholding of wages
  definition: Wages are systematically held back, delayed or not paid, so the worker stays to try to get
    what they are owed.
  areas:
  - HT
  typology: ILO forced labour indicator 8 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 8, Withholding of wages
    quote: The fact of irregular or delayed payment of wages does not automatically imply a forced labour
      situation.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Have no access to their earnings
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Wages paid months late or held until the end of a contract
  - Workers receive tiny cash sums while records show larger pay
  cases:
  - name: Operation Fort (R v Ignacy Brzezinski and others)
    year: '2019'
    jurisdiction: England and Wales
    what_happened: Victims were forced to work for as little as £10 a week and their benefits were siphoned
      by the group.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.gov.uk/government/news/solicitor-general-welcomes-modern-slavery-conviction
    source_title: Solicitor General welcomes modern slavery conviction
  data_needed:
  - Employment (salary)
  - Payment (payer = employer, beneficiary = worker, amount, date)
  - BankAccount (worker account)
  - Document (payslips, contracts)
  checkable: records
  lookup_sources:
  - Labour inspectorate or wage-claim records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: FR
    reason: FinCEN notes a business that shows no normal payroll costs (wages, payroll taxes) for its
      size as a trafficking red flag, which also signals payroll tax evasion.
    source_url: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A008.pdf
  innocent_explanations:
  - Employer cash-flow trouble or insolvency (the ILO itself says late pay alone is not forced labour)
  - Agreed end-of-season lump-sum payments
  - Payroll errors
  jurisdictions: International
  version: 1
- id: HT-009
  name: Debt bondage
  definition: The worker owes a debt (often recruitment fees, travel or advances) that is used to keep
    them working, where the work does not fairly pay the debt down or has no clear limit.
  areas:
  - HT
  typology: ILO forced labour indicator 9 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 9, Debt bondage
    quote: Debt bondage – or bonded labour – reflects an imbalance in power between the worker-debtor
      and the employer-creditor.
    quote_verified: true
    checked: '2026-10-09'
  - title: Supplementary Convention on the Abolition of Slavery, the Slave Trade, and Institutions and
      Practices Similar to Slavery
    publisher: United Nations (OHCHR)
    year: '1956'
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/supplementary-convention-abolition-slavery-slave-trade-and
    locator: Article 1, item (a) debt bondage
    quote: if the value of those services as reasonably assessed is not applied towards the liquidation
      of the debt
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 1, General indicators
    quote: Be under the perception that they are bonded by debt
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Workers paid large recruitment fees and must repay them from wages for years
  - Debt grows through charges for housing and food
  cases:
  - name: CBP forced labor finding on Top Glove Corporation Bhd.
    year: '2021'
    jurisdiction: United States (import enforcement; Malaysia production)
    what_happened: CBP cited debt bondage, excessive overtime, abusive working and living conditions and
      retention of identity documents as forced labor indicators in Top Glove's production.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://cbp.gov/newsroom/local-media-release/cbp-cleveland-seizes-top-glove-products-under-forced-labor-finding
    source_title: CBP Cleveland seizes Top Glove products under forced labor finding
  data_needed:
  - Debt (debtor, creditor, amount, date)
  - Payment (recruitment fee payments)
  - Employment
  - Company (recruitment agency)
  checkable: person
  lookup_sources:
  - Recruitment agency licensing registers
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HT
    reason: Debt bondage in a factory can lead to import bans on its goods, as in the CBP Top Glove finding.
    source_url: https://cbp.gov/newsroom/local-media-release/cbp-cleveland-seizes-top-glove-products-under-forced-labor-finding
  innocent_explanations:
  - Ordinary salary advances or loans repaid on clear, fair terms
  - Lawful employer-funded training repayment agreements
  jurisdictions: International (1956 UN Supplementary Convention; ILO)
  version: 1
- id: HT-010
  name: Abusive working and living conditions
  definition: Workers endure degrading, dangerous, overcrowded or unsanitary work or housing that no one
    would freely accept, often in serious breach of labour law.
  areas:
  - HT
  typology: ILO forced labour indicator 10 of 11
  status: verified
  sources:
  - title: ILO Indicators of Forced Labour
    publisher: International Labour Organization
    year: not printed in the text read
    url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@ed_norm/@declaration/documents/publication/wcms_203832.pdf
    locator: Indicator 10, Abusive working and living conditions
    quote: Forced labour victims are likely to endure living and working conditions that workers would
      never freely accept.
    quote_verified: true
    checked: '2026-10-09'
  - title: Human Trafficking Indicators
    publisher: UNODC
    year: '2008'
    url: https://www.unodc.org/pdf/HT_indicators_E_LOWRES.pdf
    locator: Page 2, Labour exploitation
    quote: Live in degraded, unsuitable places, such as in agricultural or industrial buildings
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Dozens of workers sleeping in a container or a farm building
  - No protective equipment for dangerous work
  cases:
  - name: EEOC v. Signal International, LLC
    year: '2015'
    jurisdiction: United States
    what_happened: EEOC alleged that as many as 24 men were forced to live in containers the size of a
      double-wide trailer; the case settled for an estimated $5 million.
    outcome: settled
    outcome_verified: true
