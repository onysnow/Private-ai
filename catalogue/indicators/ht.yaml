- id: HT-055
  name: Recipient arranges a transplant abroad through a broker who hides who the donor is
  definition: A patient needing an organ goes abroad through a person or company that organises transplants
    but says nothing about the donors, often without telling their own doctors and without knowing in
    advance where the operation will be or who the donor is.
  areas:
  - HT
  typology: Trafficking for organ removal - recruitment (recipient side)
  status: verified
  sources:
  - title: 'Indicators to Identify Trafficking in Human Beings for the Purpose of Organ Removal (Transplantation
      Direct 2(2): e56)'
    publisher: de Jong & Ambagtsheer, Wolters Kluwer / HOTT Project (EU-funded)
    year: '2016'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4946497
    locator: Indicators - Recruitment (recipients)
    quote: be in (online) contact with a person and/or company that advertises/organizes transplants (abroad)
      and that does not provide information about the organ donors
    quote_verified: true
    licence: CC BY-NC-ND 4.0
    checked: '2026-10-09'
  examples:
  - A dialysis patient stops attending the local transplant waiting-list clinic, then pays a website-based
    'transplant tour' company that will not name the hospital or donor.
  - A patient receives a personal invitation from a surgeon abroad and is asked to send test results to
    an uncertified 'reviewer'.
  cases:
  - name: United States v. Levy Izhak Rosenbaum
    year: '2011'
    jurisdiction: United States (D. New Jersey)
    what_happened: Rosenbaum admitted brokering three kidney transplants for which he was paid about $120,000,
      $150,000 and $140,000, locating paid donors in Israel and arranging their travel and accommodation.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archive/usao/nj/Press/files/Rosenbaum,%20Levy%20Izhak%20Plea%20News%20Release.html
    source_title: U.S. Attorney's Office, District of New Jersey - Rosenbaum plea news release
  data_needed:
  - Person (recipient)
  - Company or Organization (transplant broker / facilitator)
  - Payment (recipient to broker)
  - Email or Message (contact with broker)
  - Document (medical records sent abroad, invitation letters)
  - Address (clinic abroad)
  checkable: person
  lookup_sources:
  - Company registry (broker company)
  - Health regulator / hospital licensing register in destination country
  - Web archive of broker adverts
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Recipients pay brokers large sums (here $120,000-$150,000 per transplant) that must be moved
      and hidden; the brokered fees were forfeited as criminal proceeds.
    source_url: https://www.justice.gov/archive/usao/nj/Press/files/Rosenbaum,%20Levy%20Izhak%20Plea%20News%20Release.html
  innocent_explanations:
  - Legal medical travel to a country with shorter waiting lists and a lawful living-donor programme.
  - A genuine relative or friend abroad has agreed to donate.
  - Patients often research treatment options online without any wrongdoing.
  jurisdictions: International; indicators drawn from HOTT Project research across EU states
  version: 1
