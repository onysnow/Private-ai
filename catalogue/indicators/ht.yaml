- 'FATF/APG ''Financial Flows from Human Trafficking'' (July 2018) Annex B indicator list: fatf-gafi.org
  blocks direct download (robots and bot page) and the WebFetch text stopped before Annex B. Only paragraphs
  64-65 were quoted, via the fetch tool''s summary.'
- 'FATF ''ML/TF Risks Arising from Migrant Smuggling'' (2022): fatf-gafi.org not fetchable; used a copy
  hosted by the Bank of Russia (cbr.ru). Check against the FATF original.'
- 'ILO Indicators of Forced Labour: the year is not printed in the text read (ILO catalogues it as 2012).
  Quotes came through the fetch tool, not a local text dump.'
- 'US DOL news release on Packers Sanitation Services (whd20230217-1): curl was blocked, so the quote
  came through the fetch tool.'
- 'CBP national press release on the Top Glove finding: fetch failed. Used the CBP Cleveland local release,
  which gives 29 March but no year. 2021 comes from search-result URLs, not the CBP page.'
- CBP Withhold Release Orders and Findings page has no definitions. WRO and Finding definitions are taken
  from 19 CFR 12.42 via Cornell LII.
- 'ILO 2019 definition of recruitment fees and related costs: not opened.'
- 'ILO normlex pages for C29 and C182: blocked. C182 text came from the University of Minnesota Human
  Rights Library mirror.'
- 'FinCEN FIN-2014-A005 (funnel accounts advisory): not opened; funnel account described from FIN-2014-A008
  and FIN-2020-A008.'
- 'Europol ''Trafficking in Human Beings Financial Business Model'', OSCE ''Following the Money'', AHTI
  red flags, Polaris typology: not opened.'
- 'FINTRAC 2025 online child sexual exploitation indicators and the May 2026 major-events trafficking
  indicators (seen in search results): not opened.'
- 'EU Forced Labour Regulation (2024/3015), UK Modern Slavery Act statutory guidance and GLAA indicators,
  Australian Modern Slavery Act: not opened.'
- 'AP ''Seafood from Slaves'' (Benjina) reporting: not opened, so not used as a case.'
- 'FinCEN FIN-2020-A008 case studies (Thai sex trafficking funnel accounts): names were not extracted,
  so not used as a case.'
- 'UNODC Assessment Toolkit: Trafficking in Persons for the Purpose of Organ Removal (2015). I guessed
  the PDF URL and the fetch failed; the search did not find a working link. I used the HOTT/de Jong &
  Ambagtsheer (2016) indicator list, which the UNODC-linked research site names as the indicator source.'
- UNODC Toolkit on the Investigation and Prosecution of Trafficking in Persons for Organ Removal (2022).
