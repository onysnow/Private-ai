  was reached by direct fetch of known URLs only; no wider search was possible.
- SafeLives Dash page lists no questions; questions taken from the quick-start guidance PDF instead.
- SASH questions and SHARP's 14 factors are not public on the pages opened (SASH needs a request; SHARP
  lists harms, not factors).
