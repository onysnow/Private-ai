  - Company annual reports
  - Trade association statistics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Mature markets with long-term contracts naturally show stable shares.
  - Capacity limits keep each firm at a similar level.
  jurisdictions: US (FTC guidance); general
  version: 1
- id: CT-012
  name: Common pricing formula or fixed price differentials
  definition: Competitors all calculate prices the same way or keep the same gaps between product sizes,
