    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/market-division-or-customer-allocation
    locator: Main text
    quote: Illegal market sharing may involve allocating a specific percentage of available business to
      each producer,
    quote_verified: true
    checked: '2026-10-10'
  - title: Price fixing (Guide to Antitrust Laws)
    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/price-fixing
    locator: Topics list
    quote: Production quotas
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Industry sales data show three producers holding near-identical shares year after year despite demand
