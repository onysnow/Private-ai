key: CT
name: Price-fixing and market-sharing cartels
scope: Price fixing, market and customer allocation, and algorithmic rent-setting outside public tenders.
indicators:
- id: CT-001
  name: Competitors' prices identical for long periods
  definition: Rival sellers charge the same price and keep it that way for a long time, especially where
    their prices used to differ.
  areas:
  - CT
  typology: price fixing
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For
      (An Antitrust Primer)'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.4, 'Bid or Price Patterns', Prices
    quote: 'Identical prices may indicate a price-fixing conspiracy, especially when: Prices stay identical
      for long periods of time. Prices previously were different.'
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Several suppliers of the same product quote the same unit price month after month, after a period
    when their prices differed.
  cases: []
  data_needed:
  - Company
  - Document
  - Event
  - Note
  checkable: lookups
  lookup_sources:
  - Published price lists and archived web pages
  - Consumer or trade price surveys
  - Government price statistics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - In a market for a standard product, competition itself can push prices to the same level.
  - Firms may lawfully follow a rival's public price without any agreement.
  - Prices may be regulated, capped or set by a common published index.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-002
  name: Price increases not explained by costs
  definition: Rival sellers raise prices, often at the same time, without any rise in their costs that
    would explain it.
  areas:
  - CT
  typology: price fixing
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.4, 'Bid or Price Patterns', Prices
    quote: Price increases do not appear to be supported by increased costs.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Several producers announce similar increases in the same week while input costs are flat.
  cases: []
  data_needed:
  - Company
  - Document
  - Event
  checkable: lookups
  lookup_sources:
  - Company price announcements and press releases
  - Input cost indices (commodity, energy, wages)
  - Company annual reports showing margins
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Costs that outsiders cannot see may have risen (contracts, insurance, financing).
  - A rise in demand can raise prices without any cost change.
  - Firms may independently follow a price leader.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-003
  name: Discounts disappear across a market
  definition: Discounts that buyers used to get are withdrawn, especially across several sellers in a
    market where discounting was normal.
  areas:
  - CT
  typology: price fixing
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.4, 'Bid or Price Patterns', Prices
    quote: Discounts are eliminated, especially in a market where discounts historically were given.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.2, 'Price Fixing' (examples of agreements)
    quote: Eliminate or reduce discounts.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Customers report that every supplier in a region stopped offering volume discounts in the same period.
  cases: []
  data_needed:
  - Company
  - Document
  - Event
  - Note
  checkable: person
  lookup_sources:
  - Buyers and procurement staff
  - Historical quotes and invoices
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Tight supply or high demand reduces the need to discount.
  - A firm may cut discounts after independently reviewing its margins.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-004
  name: Local customers pay more than distant customers
  definition: Sellers charge higher prices to nearby customers than to customers further away, which the
    DOJ says may mean local prices are fixed.
  areas:
  - CT
  typology: price fixing / market allocation
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.4, 'Bid or Price Patterns', Prices
    quote: Vendors are charging higher prices to local customers than to distant customers. This may indicate
      local prices are fixed.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A regional supplier sells more cheaply to a buyer in another state than to buyers in its own city,
    despite higher delivery costs.
  cases: []
  data_needed:
  - Company
  - Address
  - Document
  - Payment
  checkable: records
  lookup_sources:
  - Invoices or quotes from customers in different locations
  - Public procurement price records from different areas
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Distant markets may be more competitive, forcing lower prices there.
  - Volume or contract-length differences between customers.
  - Introductory pricing to win new territory.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-005
  name: Talk that a customer or contract 'belongs' to a vendor
  definition: A salesperson or bidder says a particular customer, contract or territory is someone else's,
    suggesting competitors have shared out the business.
  areas:
  - CT
  - PP
  typology: market and customer allocation
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.5, 'Suspicious Statements or Behavior'
    quote: Statements to the effect that a particular customer or contract “belongs” to a certain vendor.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A supplier declines to quote and tells the buyer it 'isn't our account'.
  cases: []
  data_needed:
  - Person
  - Company
  - Document
  - Note
  checkable: person
  lookup_sources:
  - Buyers, procurement officers, former employees
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: PP
    reason: The DOJ primer lists this statement among bid-rigging warning signs as well, so it applies
      to public tenders too.
    source_url: https://www.justice.gov/atr/public/guidelines/211578.pdf
  innocent_explanations:
  - Loose talk about a long-standing incumbent relationship.
  - The vendor may lack capacity or interest and phrase its refusal casually.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-006
  name: Reference to industry-wide or association price schedules
  definition: A seller points to an industry or trade association price list, or to 'industry pricing',
    as the basis for its price.
  areas:
  - CT
  typology: price fixing
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.5, 'Suspicious Statements or Behavior'
    quote: Any reference to industry-wide or association price schedules.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.2, 'Price Fixing' (examples of agreements)
    quote: Adhere to a minimum fee or price schedule.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A trade association circulates a 'recommended' fee schedule and members quote from it.
  cases: []
  data_needed:
  - Organization
  - Company
  - Document
  - Person
  checkable: records
  lookup_sources:
  - Trade association websites, newsletters and member materials
  - Quotes and sales documents
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Some sectors use lawful published benchmarks or regulated tariffs.
  - Salespeople may say 'industry rate' loosely to mean the going market price.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-007
  name: Advance knowledge of competitors' pricing
  definition: A seller knows what its rivals will charge before that information is public.
  areas:
  - CT
  typology: price fixing / information exchange
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.5, 'Suspicious Statements or Behavior'
    quote: Any statement indicating advance (non-public) knowledge of competitors’ pricing.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A sales rep tells a customer the exact increase a rival will announce next month.
  cases: []
  data_needed:
  - Person
  - Company
  - Document
  - Event
  checkable: person
  lookup_sources:
  - Customers, former employees, internal emails obtained lawfully
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Information may have come from customers comparing quotes.
  - Rivals may have already pre-announced prices publicly.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-008
  name: Statements that competitors discussed or agreed prices
  definition: Anyone indicates that competing sellers have talked about prices or reached an understanding
    on them.
  areas:
  - CT
  typology: price fixing
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.5, 'Suspicious Statements or Behavior'
    quote: Any statement indicating that vendors have discussed prices among themselves or have reached
      an understanding about prices.
    quote_verified: true
    checked: '2026-10-10'
  - title: Price fixing (Guide to Antitrust Laws)
    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/price-fixing
    locator: Definition
    quote: Price fixing is an agreement (written, verbal, or inferred from conduct) among competitors
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A former employee describes regular calls between sales heads of rival firms before price changes.
  cases: []
  data_needed:
  - Person
  - Company
  - Event
  - Document
  - Associate
  checkable: person
  lookup_sources:
  - Whistleblowers, former employees
  - Court filings and regulator decisions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Lawful joint ventures or supply agreements between competitors can involve pricing talks about that
    specific deal.
  - Hearsay or misunderstanding of a lawful conversation.
  jurisdictions: US (DOJ guidance); general
  version: 1
- id: CT-009
  name: Competitors stay out of each other's territories
  definition: Rival firms sell only in their own areas and refuse to sell, or quote deliberately high
    prices, to customers in areas served by the others.
  areas:
  - CT
  typology: market allocation (territorial)
  status: verified
  sources:
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.3, 'Market Division'
    quote: In other schemes, competitors agree to sell only to customers in certain geographic areas and
      refuse to sell to, or quote intentionally high prices to, customers in geographic areas allocated
      to conspirator companies.
    quote_verified: true
    checked: '2026-10-10'
  - title: Market division or customer allocation (Guide to Antitrust Laws)
    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/market-division-or-customer-allocation
    locator: Main text
    quote: Plain agreements among competitors to divide sales territories or assign customers are almost
      always illegal.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - 'FTC example: two chemical companies where ''one would not sell in North America if the other would
    not sell in Japan.'''
  cases: []
  data_needed:
  - Company
  - Address
  - Contract
  - Document
  checkable: records
  lookup_sources:
  - Company sales footprints, depot and branch locations
  - Procurement award data by region
  - Customer quotes
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Transport costs, licensing or logistics make distant sales uneconomic.
  - A firm may independently choose to focus on its home market.
  - Regulatory or franchise boundaries may restrict where firms operate.
  jurisdictions: US (DOJ, FTC guidance); general
  version: 1
- id: CT-010
  name: Competitors do not solicit each other's customers
  definition: Rival firms leave each other's customers (or employees) alone, or each is assigned particular
    customers or customer types.
  areas:
  - CT
  typology: customer allocation
  status: verified
  sources:
  - title: Market division or customer allocation (Guide to Antitrust Laws)
    publisher: US Federal Trade Commission
    url: https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/dealings-competitors/market-division-or-customer-allocation
    locator: Main text
    quote: or agreeing not to solicit one another's customers or employees.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.3, 'Market Division'
    quote: In such schemes, competing firms allocate specific customers or types of customers, products,
      or territories among themselves.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Sandoz admitted to conspiring to allocate customers for generic drugs (DOJ, 2020).
  cases: []
  data_needed:
  - Company
  - Contract
  - ContractAward
  - Employment
  - Document
  checkable: records
  lookup_sources:
  - Customer supplier histories
  - Procurement and contract award records
  - Job-move data (for no-poach patterns)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - 'Specialisation: firms may serve different customer types because of their products.'
  - Customer loyalty and switching costs keep customers with incumbents.
  - Lawful non-solicit clauses in genuine joint ventures or sale-of-business deals.
  jurisdictions: US (DOJ, FTC guidance); general
  version: 1
- id: CT-011
  name: Each firm's share of the business is fixed or very stable
  definition: Competitors appear to divide the available business by set percentages, so market shares
    barely move over time.
