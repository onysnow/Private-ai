    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.2, 'Price Fixing' (examples of agreements)
    quote: Adopt a standard formula for computing prices.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: US Department of Justice, Antitrust Division
    year: 2005, revised 2021
    url: https://www.justice.gov/atr/public/guidelines/211578.pdf
    locator: p.2, 'Price Fixing' (examples of agreements)
    quote: Maintain certain price differentials between different types, sizes, or quantities of products.
    quote_verified: true
    checked: '2026-10-10'
  examples:
