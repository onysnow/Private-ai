- id: CP-014
  name: Wider family's concerns dismissed or treated as malicious
  definition: Grandparents, relatives or other referrers repeatedly raise concerns, and agencies dismiss
    them or label them malicious without a full assessment.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'Child Protection in England: National review (May 2022)'
