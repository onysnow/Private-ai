key: CP
name: Child protection failures and illicit adoption
scope: Physical abuse and neglect of children outside institutions; deaths known to child-protection services;
  foster care; troubled-teen residential programmes; parental and family abduction; illicit intercountry
  adoption.
indicators:
- id: CP-001
  name: Earlier reports to child protection before a child's death or serious injury
  definition: A child who died or was seriously hurt had already been reported to child protection services,
    whatever happened to those reports.
  areas:
  - CP
  typology: Child deaths known to services
  status: pending
  sources:
  - title: 'Within Our Reach: A National Strategy to Eliminate Child Abuse and Neglect Fatalities'
    publisher: Commission to Eliminate Child Abuse and Neglect Fatalities (US)
    year: '2016'
    url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
    locator: Section 'Past CPS Reports Are Associated With Increased Risk of Fatality'
    quote: A prior report to CPS, regardless of its disposition, was the single strongest predictor of
      a child’s potential risk for injury death (intentional or unintentional) before age 5.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Within Our Reach: A National Strategy to Eliminate Child Abuse and Neglect Fatalities'
    publisher: Commission to Eliminate Child Abuse and Neglect Fatalities (US)
    year: '2016'
    url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
    locator: Chairman's letter
    quote: A call to a child protection hotline, regardless of the disposition, is the best predictor
      of a later child abuse or neglect fatality.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A hotline call about a toddler was screened out; months later the child died of injuries.
  - Several reports about one household were closed as unsubstantiated before a child's death.
  cases:
  - name: Los Angeles County DCFS social workers prosecution (Palmdale child death, 2013)
    year: '2020'
    jurisdiction: California, US
    what_happened: Four county social workers were charged with felony child abuse and falsifying public
      records over a 2013 child death; the charges were dismissed in July 2020 after an appellate ruling.
      The child's mother was sentenced to life without parole and her boyfriend to death in 2018.
    outcome: convicted
    outcome_verified: false
    source_url: https://www.cbsnews.com/losangeles/news/judge-dismisses-charges-against-la-county-social-workers-in-death-of-gabriel-fernandez/
    source_title: Judge dismisses charges against LA County social workers (CBS Los Angeles)
  data_needed:
  - Person
  - Event
  - Document
  - CourtCase
  - PublicBody
  checkable: records
  lookup_sources:
  - Child fatality review reports
  - State CPS fatality disclosures (CAPTA public disclosure)
  - Court records in criminal cases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: HO
    reason: Child homicides often follow earlier reports to services; homicide indicators cover the death
      scene.
    source_url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
  innocent_explanations:
  - Many families are reported and never harm a child; a prior report alone does not show an agency failed.
  - Reports can be malicious or mistaken.
  - The commission notes that half or more of fatalities involve children not known to the local agency,
    so the absence of a report is not reassurance either.
  jurisdictions: US; principle used in UK reviews too
  version: 1
- id: CP-002
  name: Deaths and serious harm concentrated among infants and very young children
  definition: The child who died or was seriously hurt was a baby or toddler, the age group that makes
    up most maltreatment deaths and serious-incident notifications.
  areas:
  - CP
  typology: Child deaths known to services
  status: verified
  sources:
  - title: 'Within Our Reach: A National Strategy to Eliminate Child Abuse and Neglect Fatalities'
    publisher: Commission to Eliminate Child Abuse and Neglect Fatalities (US)
    year: '2016'
    url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
    locator: Characteristics of Child Maltreatment Deaths
    quote: approximately half are infants younger than 1 year old, and approximately three-quarters are
      under 3 years of age.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.12, para 12 'Harm to babies under 12 months old'
    quote: Babies under 12 months old continue to be the most prevalent group notified, and there were
      a high proportion of cases involving non-accidental injury and sudden unexpected infant death.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A local authority's serious incident notifications are mostly babies, with face-to-face visits replaced
    by phone contact.
  cases: []
  data_needed:
  - Person
  - Event
  - Document
  - PublicBody
  checkable: records
  lookup_sources:
  - Child death review data
  - Serious incident notifications (England)
  - NCANDS child fatality data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Child aged under 1 (or under 3) who died or was seriously harmed while known to services;
      ages from the CECANF report
    threshold_source: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
  threshold_verified: true
  cross_hints:
  - target_area: HO
    reason: HO-033 covers infant death scenes; the Panel links sudden unexpected infant death to its notifications.
    source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
  innocent_explanations:
  - Infants die of natural causes, accidents and sudden unexplained infant death without any maltreatment.
  - Age alone is a risk statistic, not evidence about any one family.
  jurisdictions: US, England
  version: 1
- id: CP-003
  name: Official child-fatality counts lower than other sources
  definition: The official count of child maltreatment deaths is lower than counts from other records,
    such as death certificates, police files or fatality reviews.
  areas:
  - CP
  typology: Child deaths known to services
  status: verified
  sources:
  - title: 'Within Our Reach: A National Strategy to Eliminate Child Abuse and Neglect Fatalities'
    publisher: Commission to Eliminate Child Abuse and Neglect Fatalities (US)
    year: '2016'
    url: https://www.azcourts.gov/Portals/0/46/Reading%20List/CECANF%20Final%20Report.pdf
    locator: Chapter on data and the undercount
    quote: Yet a peer-reviewed study of fatal child maltreatment in three states that reviewed multiple
      sources of data on child deaths found that state child welfare records undercount child fatalities
      from maltreatment by 55-76 percent.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A state reports far fewer maltreatment deaths to the federal system than its own child death review
    team counts.
  cases: []
  data_needed:
  - Event
  - Document
  - PublicBody
  checkable: records
  lookup_sources:
  - NCANDS / Child Maltreatment annual report
  - State child death review team reports
  - Vital statistics
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Agencies define maltreatment deaths differently and some deaths are classified only after court cases
    end.
  - Nearly half of states report only children already known to CPS, so the gap may come from the reporting
    rule rather than concealment.
  jurisdictions: US
  version: 1
- id: CP-004
  name: Statutory child-protection process not started at key moments
  definition: Agencies dealt with signs of serious harm through single-agency or informal work instead
    of starting formal multi-agency child-protection enquiries.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'Child Protection in England: National review (May 2022)'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2022'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1078488/ALH_SH_National_Review_26-5-22.pdf
    locator: Key findings
    quote: A lack of robust critical thinking and challenge within and between agencies, compounded by
      a failure to trigger statutory multi-agency child protection processes at a number of key moments.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Bruising reported by relatives is followed by a single social worker home visit, with no strategy
    discussion or section 47 enquiry.
  cases:
  - name: National review of two child murders in Solihull and Bradford
    year: '2022'
    jurisdiction: England
    what_happened: The national Panel found failures to trigger statutory multi-agency child-protection
      processes, weak information sharing, and wider family members who were not listened to.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1078488/ALH_SH_National_Review_26-5-22.pdf
    source_title: 'Child Protection in England: National review (May 2022)'
  data_needed:
  - Event
  - Document
  - PublicBody
  - Person
  checkable: records
  lookup_sources:
  - Local child safeguarding practice reviews
  - Serious case reviews
  - Inspection reports (Ofsted)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Professionals may judge, on the information they had, that the threshold for formal enquiries was
    not met.
  - Hindsight makes earlier moments look clearer than they were.
  jurisdictions: England (principle general)
  version: 1
- id: CP-005
  name: Risk assessments not updated as circumstances change
  definition: An early risk assessment stayed in use after the family's situation changed, for example
    when a new adult arrived or parental problems got worse.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.30, Theme 4 'Responding to changing risk and need'
    quote: In many cases, initial assessments of risk have not been reviewed and updated in response to
      changing circumstances or taken sufficient account of the potential risk to children arising from
      known information about factors such as parental mental health concerns, adverse childhood experiences
      or criminality.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A case plan written before a parent's relapse is still the operative assessment months later.
  cases: []
  data_needed:
  - Document
  - Event
  - Person
  checkable: records
  lookup_sources:
  - Case reviews
  - Court bundles in care proceedings
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Some changes are not known to the agency.
  - Assessments may have been reviewed informally without a written update.
  jurisdictions: England (principle general)
  version: 1
- id: CP-006
  name: Information not shared between agencies
  definition: Agencies each held part of the picture (siblings, domestic abuse, substance misuse, mental
    health) but did not share it, so no one saw the full risk.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.31, Theme 5 'Sharing information in a timely and appropriate way'
    quote: Lack of appropriate and timely sharing of information (particularly about siblings, domestic
      violence, substance misuse and mental health concerns) means that the nature of risk to the child
      is not recognised or acted upon.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'Child Protection in England: National review (May 2022)'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2022'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1078488/ALH_SH_National_Review_26-5-22.pdf
    locator: Key findings
    quote: 'These are: • Weaknesses in information sharing and seeking within and between agencies.'
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Health records showing a parent's earlier mental health crisis were not accessed at booking, so alerts
    to the GP never triggered.
  cases: []
  data_needed:
  - PublicBody
  - Document
  - Event
  - Person
  checkable: records
  lookup_sources:
  - Case reviews
  - Inquest records
  - Inspection reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Data-protection rules and incompatible IT systems limit sharing even when staff act in good faith.
  - Information may have been shared verbally without a record.
  jurisdictions: England (principle general)
  version: 1
- id: CP-007
  name: 'Avoidant family engagement: missed appointments and cancelled visits'
  definition: A family repeatedly misses appointments, cancels home visits or blocks contact, and agencies
    do not follow up firmly.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.28, Theme 2
    quote: Missed appointments, blocking of communications and cancelled visits are all indications of
      avoidant behaviour and require proactive follow-up.
    quote_verified: true
    checked: '2026-10-10'
  - title: Child abuse and neglect (NICE guideline NG76)
    publisher: National Institute for Health and Care Excellence (UK)
    year: '2017'
    url: https://www.nice.org.uk/guidance/ng76/chapter/Recommendations
    locator: Recommendation 1.2.4
    quote: 'Recognise the following as vulnerability factors for recurring or persistent child abuse and
      neglect: The parent or carer does not engage with services.'
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Case notes show five 'no access' visits in two months with no escalation.
