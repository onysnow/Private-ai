- id: CP-008
  name: '''Disguised compliance'' and parental self-report accepted without checking'
  definition: Professionals accept a parent's account of change or cooperation without checking it against
    other agencies' information.
  areas:
  - CP
  typology: Agency failure
  status: verified
  sources:
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.29, Theme 3
    quote: Positive self-reports of change need to be considered alongside reports and information from
      other practitioners.
    quote_verified: true
    checked: '2026-10-10'
  - title: 'The Child Safeguarding Practice Review Panel: Annual Report 2020'
    publisher: Child Safeguarding Practice Review Panel (England)
    year: '2021'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/984767/The_Child_Safeguarding_Annual_Report_2020.pdf
    locator: p.28, Theme 2
    quote: This is sometimes characterised as ‘disguised compliance’ or ‘resistance’.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A parent's statement that drug use had stopped was recorded as fact despite concerns from the children's
    centre.
  cases: []
  data_needed:
  - Document
