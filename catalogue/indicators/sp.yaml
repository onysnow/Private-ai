- id: SP-029
  name: Failure to report or slow reporting to authorities
  definition: Adults or institutions told of suspected abuse do not report it to the proper authorities
    promptly or do not document it.
  areas:
  - SP
  typology: Reporting failure
  status: verified
  sources:
  - title: 2026 SafeSport Code
    publisher: U.S. Center for SafeSport
    year: '2026'
    url: https://uscenterforsafesport.org/2026-safesport-code/
    locator: IX.G.1.a
    quote: Failure to comply with any provision of Section X.A-E. by an Adult Participant is a violation
      of the Code.
    quote_verified: true
    checked: '2026-10-10'
  - title: Investigation and Review of the FBI's Handling of Allegations of Sexual Abuse by Former USA
      Gymnastics Physician Lawrence Gerard Nassar
    publisher: US Department of Justice Office of the Inspector General
    year: '2021'
    url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
    locator: Executive Summary
    quote: the Indianapolis office did not notify state or local authorities of the sexual assault allegations
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Governing body conducts an internal investigation before going to police
  - Agency receives report but takes no investigative action for months
  cases:
  - name: FBI handling of allegations against Lawrence Gerard Nassar
    year: '2021'
    jurisdiction: United States
    what_happened: The DOJ Inspector General found that FBI officials failed to respond to the Nassar
      allegations with the utmost seriousness and urgency, did not properly document the July 2015 meeting
      with USA Gymnastics, and did not notify state or local authorities.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
    source_title: DOJ OIG Report 21-093
  data_needed:
  - Organization
  - PublicBody
  - Person
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Official inquiry reports
  - Inspector general reports
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CA
    reason: Many of those harmed in the Nassar case were young athletes; child sexual abuse indicators
      in CA apply.
    source_url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
  innocent_explanations:
  - Report made through a different, valid channel
  - Initial information too vague to report
  - Reporting rules differ by jurisdiction
  jurisdictions: US (SafeSport mandatory reporting); general
  version: 1
- id: SP-030
  name: Accused person stays in post with access to athletes after a report
  definition: After allegations reach an organisation or authority, the accused keeps working with athletes
    in the same or other institutions.
  areas:
  - SP
  typology: Institutional failure
  status: verified
  sources:
  - title: DOJ OIG Report 21-093 (Nassar)
    publisher: US Department of Justice Office of the Inspector General
    year: '2021'
    url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
    locator: Executive Summary, p. i
    quote: Nassar continued to maintain his positions at MSU, Twistars USA Gymnastics Club, and Holt High
      School.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Practitioner continues treating patients at other institutions while one body investigates
  cases:
  - name: Lawrence Gerard Nassar
    year: '2018'
    jurisdiction: United States (federal and Michigan state courts)
    what_happened: Per the OIG report, Nassar continued to treat patients until August 2016 after USA
      Gymnastics reported to the FBI in July 2015; he pleaded guilty to federal child pornography offences
      (sentenced to 60 years, December 2017) and to criminal sexual conduct in Michigan state court (sentenced
      January and February 2018).
    outcome: convicted
    outcome_verified: true
    source_url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
    source_title: DOJ OIG Report 21-093
  data_needed:
  - Person
  - Employment
  - Organization
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Employment and licensing records
  - Inquiry reports
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CA
    reason: Case involves child sexual abuse; use CA indicators for the child-protection side.
    source_url: https://oig.justice.gov/sites/default/files/reports/21-093.pdf
  innocent_explanations:
  - Presumption of innocence and due-process limits on suspension
  - Allegations later unfounded
  - Other employers not legally permitted to be told
  jurisdictions: US finding; general
  version: 1
- id: SP-031
  name: Others enabling misconduct (aiding and abetting)
  definition: Adults knowingly help, encourage or cover for someone else's prohibited conduct toward athletes.
  areas:
  - SP
  typology: Complicity in abuse
  status: verified
  sources:
  - title: SafeSport Code Glossary
    publisher: U.S. Center for SafeSport
    url: https://uscenterforsafesport.org/code-glossary/
    locator: Glossary, Aiding and Abetting
    quote: Aiding and Abetting occurs when an Adult Participant knowingly helps (or encourages) a Participant
      engage in Prohibited
    quote_verified: true
    checked: '2026-10-10'
  - title: 'IOC consensus statement: harassment and abuse in sport'
    publisher: IOC / BJSM
    year: '2016'
    url: https://bjsm.bmj.com/content/bjsports/early/2016/04/26/bjsports-2016-096121.full.pdf
    locator: Risk factors (bystanders)
    quote: passive attitudes/non-intervention, denial or silence by people in positions of power in sport
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Staff who arrange access to athletes for a suspended coach
  cases: []
  data_needed:
  - Person
  - Associate
  - Employment
  - Organization
  checkable: person
  lookup_sources:
  - SafeSport disciplinary database
  - Inquiry reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Colleagues unaware of the misconduct or of a sanction
  jurisdictions: US (SafeSport); international (IOC)
  version: 1
- id: SP-032
  name: Athletes in higher-risk groups without added protection
  definition: Elite, disabled and LGBT athletes face higher published risks of abuse, so a lack of specific
    protections for them is a warning sign.
  areas:
  - SP
  typology: Risk context
  status: verified
  sources:
  - title: 'IOC consensus statement: harassment and abuse in sport'
    publisher: IOC / BJSM
    year: '2016'
    url: https://bjsm.bmj.com/content/bjsports/early/2016/04/26/bjsports-2016-096121.full.pdf
    locator: Athletes at higher risk
    quote: science has confirmed that the risks are highest among elite, disabled, child and LGBT athletes
    quote_verified: true
    checked: '2026-10-10'
  - title: 'IOC consensus statement: harassment and abuse in sport'
    publisher: IOC / BJSM
    year: '2016'
    url: https://bjsm.bmj.com/content/bjsports/early/2016/04/26/bjsports-2016-096121.full.pdf
    locator: Risk factors
    quote: the risk of experiencing psychological, physical and sexual violence rises as the athlete progresses
      up the talent ladder
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Para-sport programme with no accessible reporting route
  cases: []
  data_needed:
  - Organization
  - Document
  checkable: lookups
  lookup_sources:
  - Governing-body safeguarding documents
  - Funding-body audits
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - This is a risk context, not evidence of abuse; most programmes for these groups are safe
  jurisdictions: International (IOC)
  version: 1
