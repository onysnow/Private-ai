- id: SP-012
  name: Medical exemptions or medicines used to enhance performance
  definition: Therapeutic Use Exemptions or permitted medicines are used to boost performance rather than
    to treat a genuine medical need.
  areas:
  - SP
  typology: Ethics and abuse of the TUE system
  status: verified
  sources:
  - title: Combatting doping in sport
    publisher: House of Commons DCMS Committee
    year: '2018'
    url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36606.htm
    locator: Para 105
    quote: the Therapeutic Use Exemption (TUE) system is open to abuse
    quote_verified: true
    checked: '2026-10-10'
  - title: Therapeutic Use Exemptions
    publisher: USADA
    url: https://www.usada.org/athletes/tue/
    locator: Step four, assessment
    quote: no potential for enhanced performance beyond returing the athlete to a normal state of health
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - TUE applications clustered just before major races
  - Team-wide use of a permitted medicine without diagnosis
  cases:
  - name: Team Sky and British Cycling medicines use
    year: '2018'
    jurisdiction: United Kingdom
    what_happened: The DCMS Committee said it believed medicines were used within the team to enhance
      the performance of riders and not just to treat medical need, and that this crossed the ethical
      line David Brailsford had drawn. This is a committee conclusion, not an anti-doping rule violation
      finding.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36606.htm
    source_title: Combatting doping in sport, para 110
  data_needed:
  - Person
  - Organization
  - Document
  - Event
  checkable: records
  lookup_sources:
  - Leaked or disclosed TUE records
  - Parliamentary and official inquiry reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Genuine chronic conditions (e.g. asthma, allergies) that need treatment
  - TUEs are lawful and approved by independent committees
  jurisdictions: WADA Code signatories; UK finding
  version: 1
