key: SP
name: 'Sport integrity: doping and abuse of athletes'
scope: Anti-doping rule violations and state doping; psychological and physical abuse, hazing and neglect
  of adult and elite athletes.
indicators:
- id: SP-001
  name: Prohibited substance found in an athlete's sample
  definition: A laboratory finds a banned substance, or a by-product or marker of one, in an athlete's
    urine or blood sample.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.1)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.1
    quote: Presence of a Prohibited Substance or its Metabolites or Markers in an Athlete's Sample
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A national anti-doping agency announces a provisional suspension after a positive test
  - A results-management decision published by an international federation
  cases: []
  data_needed:
  - Person
  - Organization
  - Sanction
  - Document
  - Event
  - CourtCase
  checkable: lookups
  lookup_sources:
  - National anti-doping agency sanction lists (e.g. USADA, UKAD)
  - International federation and Athletics Integrity Unit decision lists
  - Court of Arbitration for Sport (CAS) awards
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Valid Therapeutic Use Exemption for the substance
  - Contaminated supplement or food (the Code has a separate contaminated-product route)
  - Laboratory or chain-of-custody error later overturned on appeal
  - Atypical finding that is not confirmed as a violation
  jurisdictions: All WADA Code signatories (international and national sport bodies worldwide)
  version: 1
- id: SP-002
  name: Use of a banned substance or method, including an abnormal biological passport
  definition: Evidence other than a single positive test, such as an athlete's biological passport, records
    or testimony, shows the athlete used or tried to use a banned substance or method.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.2)
  status: pending
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.2
    quote: Use or Attempted Use by an Athlete of a Prohibited Substance or a Prohibited Method
    quote_verified: true
    checked: '2026-10-10'
  - title: Athlete Biological Passport
    publisher: USADA
    url: https://www.usada.org/spirit-of-sport/education/athlete-biological-passport/
    locator: ABP page, opening section
    quote: The principle behind the Athlete Biological Passport (ABP) is the monitoring of selected biological
      parameters over time
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Sanction based on longitudinal blood values (haemoglobin, reticulocytes, OFF-score) rather than a
    positive test
  - USADA's 2012 case against the US Postal Service team relied on sworn testimony, emails and payments
  cases:
  - name: US Postal Service Pro Cycling Team doping conspiracy (Lance Armstrong)
    year: '2012'
    jurisdiction: United States (USADA)
    what_happened: USADA said evidence including sworn testimony from 26 people, financial payments, emails,
      scientific data and laboratory results showed the team ran a doping programme; Armstrong accepted
      a lifetime ban rather than contest the evidence. The sanction was imposed by an anti-doping agency,
      not a court.
    outcome: fined_by_regulator
    outcome_verified: false
    source_url: https://www.usada.org/news/statement-from-usada-ceo-travis-t-tygart-regarding-the-u-s-postal-service-pro-cycling-team-doping-conspiracy/
    source_title: Statement from USADA CEO Travis T. Tygart regarding the U.S. Postal Service Pro Cycling
      Team doping conspiracy
  data_needed:
  - Person
  - Sanction
  - Document
  - Event
  - Payment
  checkable: lookups
  lookup_sources:
  - Anti-doping agency sanction announcements
  - CAS awards
  - Athletics Integrity Unit decisions
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Altitude training, illness, dehydration or genetic factors can shift blood values
  - Valid Therapeutic Use Exemption
  - Testimony that is uncorroborated or disputed
  jurisdictions: All WADA Code signatories
  version: 1
- id: SP-003
  name: Evading or refusing sample collection
  definition: An athlete avoids, refuses or fails to give a sample after being properly notified, without
    a compelling reason.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.3)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.3, p. 22
    quote: Evading Sample collection; or refusing or failing to submit to Sample collection without compelling
      justification
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Athlete leaves venue before doping control after notification
  - Athlete refuses to provide a sample to a doping control officer
  cases: []
  data_needed:
  - Person
  - Event
  - Sanction
  - Document
  checkable: lookups
  lookup_sources:
  - Anti-doping agency sanction lists
  - CAS awards
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Medical emergency or genuine compelling justification
  - Defective notification by the collecting authority
  - Misunderstanding, language barrier or minor procedural confusion
  jurisdictions: All WADA Code signatories
  version: 1
- id: SP-004
  name: Repeated whereabouts failures
  definition: An athlete in a testing pool repeatedly misses tests or fails to file where they will be,
    making out-of-competition testing harder.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.4)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.4, p. 22
    quote: Any combination of three missed tests and/or filing failures, as defined in the International
      Standard
    quote_verified: true
    checked: '2026-10-10'
  - title: Whereabouts
    publisher: USADA
    url: https://www.usada.org/athletes/whereabouts/
    locator: Whereabouts page, consequences section
    quote: Any combination of three Whereabouts Failures (Filing Failures and/or Missed Tests)
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Athlete unavailable during their declared 60-minute slot on separate occasions
  - Late or missing quarterly whereabouts filing
  cases: []
  data_needed:
  - Person
  - Event
  - Sanction
  - Address
  checkable: lookups
  lookup_sources:
  - Anti-doping agency sanction lists
  - CAS awards
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Three whereabouts failures (missed tests and/or filing failures) within any 12-month period
      by an athlete in a Registered Testing Pool
    threshold_source: https://www.usada.org/athletes/whereabouts/
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Travel disruption, family emergencies or administrative mistakes
  - Errors by the testing authority
  - A single failure is common and is not itself a violation
  jurisdictions: All WADA Code signatories; applies to athletes in a Registered Testing Pool
  version: 1
- id: SP-005
  name: Tampering with doping control
  definition: Someone interferes with any part of the testing process, such as samples, paperwork or the
    people running it.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.5)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.5
    quote: Tampering or Attempted Tampering with any Part of Doping Control by an Athlete or Other Person
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Sample swapping found by the McLaren investigation at the Sochi laboratory
  cases:
  - name: Sochi 2014 sample swapping (McLaren investigation)
    year: '2016'
    jurisdiction: Russia / international (WADA)
    what_happened: A UK parliamentary committee report records that McLaren's WADA-commissioned investigation
      established sample swapping at the Sochi laboratory during the Games, with state oversight and control
      of the Moscow laboratory and FSB involvement.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36605.htm
    source_title: House of Commons DCMS Committee, Combatting doping in sport (2018), paras 25-26
  data_needed:
  - Person
  - Organization
  - PublicBody
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Anti-doping agency decisions
  - Official inquiry reports
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Genuine procedural errors in collection or transport
  - Damaged sample from shipping problems
  jurisdictions: All WADA Code signatories
  version: 1
