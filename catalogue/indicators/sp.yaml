    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Administrative delays in results management that are not intended to hide anything
  - Confidentiality rules that require results to stay unpublished until a decision
  jurisdictions: All WADA Code signatories
  version: 1
- id: SP-010
  name: Working with a banned or disqualified coach, doctor or adviser
  definition: An athlete or other person works in a sport capacity with a support person who is banned,
    has been found guilty of doping conduct, or acts as a front for such a person.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.10, Prohibited Association)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.10.1.3, pp. 24-25
    quote: Is serving as a front or intermediary for an individual described in Article 2.10.1.1 or 2.10.1.2.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Athlete continues training under a coach serving a period of ineligibility
  - Banned adviser works through an intermediary
  cases: []
  data_needed:
  - Person
  - Employment
  - Associate
  - Sanction
  - Organization
  checkable: lookups
  lookup_sources:
  - Anti-doping sanction lists (to check coach and doctor status)
  - Team staff lists and accreditation records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Association in a professional or sport-related capacity with a person serving ineligibility,
