- id: SP-009
  name: Complicity and cover-up of doping
  definition: Someone helps, encourages, conspires in or covers up another person's anti-doping rule violation.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.9)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.9, p. 23
    quote: Assisting, encouraging, aiding, abetting, conspiring, covering up or any other type of intentional
      complicity
    quote_verified: true
    checked: '2026-10-10'
  - title: Combatting doping in sport
    publisher: House of Commons DCMS Committee
    year: '2018'
    url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36605.htm
    locator: Para 26 (quoting McLaren)
    quote: An institutionalised conspiracy existed across summer and winter sports athletes
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Officials delaying naming athletes to avoid bad publicity (DCMS para 30)
  cases:
  - name: Russian state-sponsored doping (McLaren and Independent Commission findings)
    year: '2016'
    jurisdiction: Russia / international
    what_happened: The DCMS Committee report records McLaren's finding of an institutionalised conspiracy
      and an evolving cover-up, and the Independent Commission's finding of systematic, state-sponsored
      doping encouraged by Russian federations and anti-doping bodies.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36605.htm
    source_title: Combatting doping in sport, paras 26 and 28
