  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Poor administration, lost laptops or IT failures
  - Records held by a different body
  jurisdictions: UK finding; general
  version: 1
- id: SP-014
  name: Abnormal blood values not followed up
  definition: A sport body holds test data showing highly abnormal athlete blood values but does not investigate
    or sanction.
  areas:
  - SP
  typology: Governance failure in results management
  status: verified
  sources:
  - title: Combatting doping in sport
    publisher: House of Commons DCMS Committee
    year: '2018'
    url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36605.htm
    locator: Para 14
    quote: the athletics authorities have allowed athletes with highly abnormal blood scores to continue
      to compete
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Only a third of 105 likely cheats identified under the ABP received bans between 2009 and 2012 (DCMS
    para 14)
  cases:
  - name: Leaked IAAF blood test data
    year: '2018'
    jurisdiction: International (IAAF)
    what_happened: The Committee recorded expert evidence that 21 athletes had values so extreme they
      risked heart attacks or strokes, and that only one of 26 under-19 and under-23 athletes with extreme
      scores was disciplined.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://publications.parliament.uk/pa/cm201719/cmselect/cmcumeds/366/36605.htm
    source_title: Combatting doping in sport, paras 12-14
