  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Medication held under a valid TUE or other acceptable justification
  - Prescribed for a family member
  - Medical staff legitimately holding medicines for treatment
  jurisdictions: All WADA Code signatories
  version: 1
- id: SP-007
  name: Trafficking of banned substances or methods
  definition: Someone sells, gives, transports or distributes banned substances or methods, or tries to.
  areas:
  - SP
  typology: Anti-doping rule violation (WADA Code Art. 2.7)
  status: verified
  sources:
  - title: World Anti-Doping Code 2021
    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.7
    quote: Trafficking or Attempted Trafficking in any Prohibited Substance or Prohibited Method by an
      Athlete or Other Person
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Coach or supplier distributing testosterone to athletes
  cases: []
  data_needed:
  - Person
  - Company
  - Payment
  - Address
  - Event
  - CourtCase
  - Sanction
  checkable: records
  lookup_sources:
  - Anti-doping sanctions
  - Federal and national court records
  - Prosecutor press releases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: Trafficking of performance-enhancing drugs overlaps with organised supply of controlled medicines;
      the area brief notes OC covers related sport crime (match-fixing).
    source_url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
  innocent_explanations:
  - Legitimate medical supply chains (pharmacies, clinics) handling the same substances
  - Prescription medicines supplied for genuine treatment
  jurisdictions: All WADA Code signatories; may also be a criminal offence nationally
