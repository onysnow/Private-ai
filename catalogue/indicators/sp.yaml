    publisher: WADA (hosted by USADA)
    year: '2021'
    url: https://www.usada.org/wp-content/uploads/2021_wada_code.pdf
    locator: Article 2.6
    quote: Possession of a Prohibited Substance or a Prohibited Method by an Athlete or Athlete Support
      Person
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Substances found during customs or police searches linked to an athlete's entourage
  cases: []
