key: PL
name: Pollution and environmental health
scope: Illegal discharges, falsified monitoring, chronic non-compliance, drinking-water violations, PFAS,
  coal ash, vehicle defeat devices, ships dumping oil at sea, and community air quality.
indicators:
- id: PL-001
  name: Facility flagged in significant non-compliance (SNC) or as a High Priority Violator (HPV)
  definition: A regulator has classed a facility's violations as serious (SNC under the Clean Water Act
    or RCRA, HPV under the Clean Air Act) in its public compliance data.
  areas:
  - PL
  typology: Chronic non-compliance
  status: verified
  sources:
  - title: ECHO Watch List Reports
    publisher: US EPA
    url: https://echo.epa.gov/node/126
    locator: Watch List page, definitions
    quote: serious violations will be noted as "Significant Noncompliance" or SNC
    quote_verified: true
    checked: '2026-10-10'
  - title: 'National Compliance Initiative: Reducing Significant Non-Compliance with NPDES Permits'
    publisher: US EPA
    url: https://www.epa.gov/enforcement/national-compliance-initiative-reducing-significant-non-compliance-national-pollutant
    locator: Background
    quote: In fiscal year (FY) 2018, 20.3% of these facilities were in significant noncompliance (SNC)
      with their permits.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A wastewater plant shown in EPA ECHO with SNC flags in several recent quarters
  - A refinery listed as an HPV under the Clean Air Act
  cases: []
  data_needed:
  - Organization
  - Company
  - PublicBody
  - Address
  - Event
  - Document
  - Note
  checkable: lookups
  lookup_sources:
  - EPA ECHO facility search and Detailed Facility Report
  - State environmental agency compliance databases
  levels:
    faint: SNC/HPV flag in one quarter
    strong: SNC/HPV flag in several consecutive quarters
    textbook: Flagged SNC or HPV in the regulator's own data
    threshold_source: https://echo.epa.gov/node/126
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Data-entry or reporting errors in ECHO that the state later corrects
  - A one-off upset or equipment failure already being fixed
  - Permit limits tightened faster than a plant could be upgraded, with a compliance schedule in place
  - Small public systems with too little money or staff rather than wilful violation
  version: 1
- id: PL-002
  name: Serious violations left without formal enforcement past the expected timeline (EPA Watch List)
  definition: A facility has stayed in serious non-compliance longer than the 180 to 360 days in which
    regulators are expected to take formal action, and no formal action has been taken.
  areas:
  - PL
  typology: Regulatory inaction
  status: verified
  sources:
  - title: ECHO Watch List Reports
    publisher: US EPA
    url: https://echo.epa.gov/node/126
    locator: Watch List page, enforcement timelines
    quote: typically it is between 180 and 360 days.
    quote_verified: true
    checked: '2026-10-10'
  - title: ECHO Watch List Reports
    publisher: US EPA
    url: https://echo.epa.gov/node/126
    locator: Watch List page, purpose
    quote: EPA maintains a "Watch List" to facilitate dialogue between EPA, state and local environmental
      agencies
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A facility that appears on successive quarterly Watch List reports with no penalty order or consent
    decree recorded
  cases: []
  data_needed:
  - Organization
  - PublicBody
  - Event
  - CourtCase
  - Document
  - Note
  checkable: lookups
  lookup_sources:
  - EPA ECHO Watch List quarterly reports
  - ECHO enforcement and case history
  - State agency enforcement dockets
  levels:
    faint: In SNC/HPV with only informal actions (warning letters)
    strong: Past 180 days in SNC/HPV with no formal action
    textbook: Listed on EPA's Watch List (past the 180-360 day timeline without formal action)
    threshold_source: https://echo.epa.gov/node/126
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Formal action is under negotiation but not yet recorded
  - A state action exists but has not been entered into federal data
  - The facility is being closed or rebuilt under an agreed plan
  version: 1
- id: PL-003
  name: Repeated or large exceedances of permitted discharge limits
  definition: A permit holder's own monitoring reports show pollutant levels over its permit limit repeatedly
    or by a large margin over a six-month period.
  areas:
  - PL
  typology: Illegal discharge
  status: verified
  sources:
  - title: Effluent Exceedance Violations (ECHO training, April 2024)
    publisher: US EPA ECHO
    url: https://echo.epa.gov/system/files/Effluent%20Exceedance%20Violations_April%202024-508.pdf
    locator: Chronic violation criterion
    quote: equal or exceed the limit by 20 or 40 percent in any two or more months in a 6-month period
    quote_verified: true
    checked: '2026-10-10'
  - title: Effluent Exceedance Violations (ECHO training, April 2024)
    publisher: US EPA ECHO
    url: https://echo.epa.gov/system/files/Effluent%20Exceedance%20Violations_April%202024-508.pdf
    locator: Technical Review Criteria (TRC)
    quote: equal or exceed the limit by 20 or 40 percent in any two or more months in a 6-month period
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - E. coli or ammonia exceedances at a municipal sewage plant month after month
  - Metals exceeding limits by more than 20% at an industrial discharger
  cases: []
  data_needed:
  - Organization
  - Address
  - Document
  - Event
  - Note
  checkable: records
  lookup_sources:
  - EPA ECHO effluent charts (DMR data)
  - State NPDES permit files
  levels:
    faint: A single month over the limit
    strong: Exceedances in two or three months of a six-month period
    textbook: Chronic (any exceedance in 4+ of 6 months) or TRC (Group I by 40% or Group II by 20% in
      2+ of 6 months)
    threshold_source: https://echo.epa.gov/system/files/Effluent%20Exceedance%20Violations_April%202024-508.pdf
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Heavy rainfall or snowmelt overwhelming a plant
  - Laboratory or unit-conversion error in the report
  - New, stricter permit limit taking effect
  - Plant upgrade under construction with an agreed schedule
  version: 1
- id: PL-004
  name: Missing, late or incomplete compliance monitoring reports
  definition: A permit holder fails to file the discharge monitoring reports or other self-reports it
    is required to submit, so regulators cannot see whether it is complying.
  areas:
  - PL
  typology: Falsified or absent monitoring
  status: verified
  sources:
  - title: 'National Compliance Initiative: Reducing Significant Non-Compliance with NPDES Permits'
    publisher: US EPA
    url: https://www.epa.gov/enforcement/national-compliance-initiative-reducing-significant-non-compliance-national-pollutant
    locator: Types of SNC violations
    quote: failure to submit reports that can mask serious deficiencies
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A facility page in ECHO showing DMR 'non-receipt' for several quarters
  cases: []
  data_needed:
  - Organization
  - Document
  - Event
  - Note
  checkable: lookups
  lookup_sources:
  - EPA ECHO DMR non-receipt flags
  - State permit compliance files
  levels:
    faint: One report missing or late
    strong: Several consecutive reports missing
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Electronic reporting (NetDMR) transfer failures
  - Change of operator or consultant during the period
  - Facility idle or not discharging, with the 'no discharge' code not entered
  version: 1
- id: PL-005
  name: Monitoring results fabricated, or testing reported that was never done
  definition: Discharge or water-quality reports show results from sampling or laboratory tests that did
    not happen, or values changed to show compliance.
  areas:
  - PL
  typology: Falsified monitoring
  status: verified
  sources:
  - title: Laboratory operator sentenced to 40 months for fabricating industrial wastewater results
    publisher: US Department of Justice
    url: https://www.justice.gov/opa/pr/laboratory-operator-sentenced-40-months-fabricating-industrial-wastewater-results
    locator: Press release, August 27, 2013
    quote: such testing had not been done
    quote_verified: true
    checked: '2026-10-10'
  - title: Chief executive officer sentenced to 36 months in prison for submitting hundreds of false monitoring
      reports
    publisher: US Department of Justice
    url: https://www.justice.gov/opa/pr/chief-executive-officer-sentenced-36-months-prison-submitting-hundreds-false-monitoring
    locator: Press release, September 12, 2022
    quote: Gordon fabricated the test results and related reports
    quote_verified: true
    checked: '2026-10-10'
  - title: Former Indiana water treatment plant superintendent sentenced to prison for falsifying reports
    publisher: US Department of Justice
    url: https://www.justice.gov/archives/opa/pr/former-indiana-water-treatment-plant-superintendent-sentenced-prison-falsifying-reports
    locator: Press release, September 15, 2009
    quote: falsifying discharge monitoring reports that concealed violations of the Clean Water Act
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Results that never vary, or that sit just under the limit every month
  - Lab reports on letterhead of a lab that has no record of the samples
  - One consultant filing reports for many clients with no lab invoices
  cases: []
  data_needed:
  - Person
  - Company
  - Organization
  - Document
  - Employment
  - Contract
  - Payment
  - CourtCase
  checkable: records
  lookup_sources:
  - State DMR files
  - Laboratory accreditation registers
  - Court records (PACER)
  levels:
    faint: Results unusually flat or always just below the limit
    strong: Lab paperwork or chain-of-custody forms that cannot be matched to the named laboratory
    textbook: A court or regulator finds the results fabricated
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Well-run plants do produce stable results
  - Rounding or reporting conventions make values look uniform
  - Clerical errors in copying lab results
  version: 1
- id: PL-006
  name: Company gives the regulator a misleading picture of its compliance
  definition: An operator reports or presents its performance in a way that hides discharges or breaches
    from the regulator.
  areas:
  - PL
  typology: Concealment
  status: verified
  sources:
  - title: Record £90m fine for Southern Water following Environment Agency prosecution
    publisher: UK Environment Agency / GOV.UK
    url: https://www.gov.uk/government/news/record-90m-fine-for-southern-water-following-ea-prosecution
    locator: Press release, 9 July 2021
    quote: deliberately presented a misleading picture of compliance to the Environment Agency
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Self-reported spill data that does not match independent flow monitors or river testing
  cases: []
  data_needed:
  - Company
  - PublicBody
  - Document
  - Event
  - CourtCase
  checkable: records
  lookup_sources:
  - Environment Agency public registers
  - Company annual performance reports
  - Court sentencing remarks
  levels:
    faint: Self-reported data differs from independent data
    strong: Regulator opens an investigation into reporting accuracy
    textbook: A court or regulator finds the company misled the regulator
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Faulty or uncalibrated monitors
  - Different methods for counting events
  - Honest misunderstanding of a permit condition
  version: 1
- id: PL-007
  name: Sewage treatment works spilling before treating the flow its permit requires (flow-to-full-treatment
    breaches)
  definition: A sewage works discharges untreated or partly treated sewage while it is treating less than
    the flow its permit requires it to treat first.
  areas:
  - PL
  typology: Illegal discharge
  status: verified
  sources:
  - title: Environment Agency investigation into sewage treatment works
    publisher: UK Environment Agency
    url: https://environmentagency.blog.gov.uk/2022/02/16/environment-agency-investigation-into-sewage-treatment-works
    locator: Blog post, 16 February 2022
    quote: The investigations were launched after companies revealed to us that they may be in breach
      of their permit conditions.
    quote_verified: true
    checked: '2026-10-10'
  - title: Directive (EU) 2024/1203 on the protection of the environment through criminal law
    publisher: European Union (EUR-Lex)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401203
    locator: Article 3(2)(a)
    quote: the discharge, emission or introduction of a quantity of materials or substances, energy or
      ionising radiation, into air, soil or water which causes or is likely to cause the death of, or
      serious injury to, any person or substantial damage to the quality of air, soil or water
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Storm overflow at a works spilling in dry weather or while inflow is below the permitted flow-to-full-treatment
    level
  cases: []
  data_needed:
  - Company
  - Address
  - Event
  - Document
  - Note
  checkable: records
  lookup_sources:
  - Event duration monitoring (EDM) data published by English water companies and the Environment Agency
  - Flow data obtained by environmental information requests
  levels:
    faint: Frequent spills at one works
    strong: Spills recorded while inflow is below the permitted treatment level
    textbook: Regulator finds a permit breach
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Heavy rainfall legitimately exceeding capacity
  - Flow monitor error
  - Permit conditions unclear about measurement points
  version: 1
- id: PL-008
  name: Very high number and duration of illegal sewage or effluent discharges
  definition: A utility or plant has many discharges, lasting a long total time, that are not allowed
    by its permits.
  areas:
  - PL
  typology: Illegal discharge
  status: verified
  sources:
  - title: Record £90m fine for Southern Water following Environment Agency prosecution
    publisher: UK Environment Agency / GOV.UK
    url: https://www.gov.uk/government/news/record-90m-fine-for-southern-water-following-ea-prosecution
    locator: Press release, 9 July 2021
    quote: causing 6,971 illegal discharges over the offending period
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Thousands of discharges totalling tens of thousands of hours from treatment works into protected or
    shellfish waters
  cases: []
  data_needed:
  - Company
  - Address
  - Event
  - Document
  checkable: records
  lookup_sources:
  - Environment Agency storm overflow spill data
  - EPA ECHO sanitary sewer overflow data
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Lawful storm overflow use in exceptional rainfall
  - Combined sewer systems designed to overflow in storms
  - Monitors recording false spills
  version: 1
- id: PL-009
  name: Failure to build, maintain and operate wastewater infrastructure while paying dividends
  definition: A water company falls short on maintaining sewage infrastructure while paying shareholders
    in ways a regulator later finds broke the rules.
  areas:
  - PL
  typology: Under-investment
  status: verified
  sources:
  - title: Ofwat fines Thames Water nearly £123m following two investigations
    publisher: Water Magazine (reporting Ofwat decision of 28 May 2025)
    url: https://www.watermagazine.co.uk/2025/05/28/ofwat-fines-thames-water-nearly-123m-following-two-investigations/
    locator: Article, 28 May 2025
    quote: uncovered failings that have amounted to a significant breach of the company's legal obligations
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Dividends paid in the same years as rising spills and enforcement orders
  cases: []
  data_needed:
  - Company
  - Ownership
  - Payment
  - Document
  - Event
  - PublicBody
  checkable: records
  lookup_sources:
  - Companies House filings
  - Ofwat enforcement cases
  - Annual reports
  levels:
    faint: Dividends paid while spill numbers rise
    strong: Regulator opens an enforcement case
    textbook: Regulator finds a breach of obligations
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Dividends paid within agreed regulatory rules
  - Investment programmes that take years to show results
  - Spill increases caused by more monitors being installed
  version: 1
- id: PL-010
  name: Community drinking water system with health-based violations
  definition: A public water system has broken a health-based drinking water standard, such as a maximum
    contaminant level or a treatment requirement.
  areas:
  - PL
  typology: Drinking water
  status: verified
  sources:
  - title: 'National Enforcement and Compliance Initiative: Increasing Compliance with Drinking Water
      Standards'
    publisher: US EPA
    url: https://epa.gov/enforcement/national-enforcement-and-compliance-initiative-increasing-compliance-drinking-water-0
    locator: Background, FY 2022
    quote: almost 3,000 CWSs had a health-based violation
    quote_verified: true
    checked: '2026-10-10'
  - title: National Enforcement and Compliance Initiatives
    publisher: US EPA
    url: https://www.epa.gov/enforcement/national-enforcement-and-compliance-initiatives
    locator: FY2024-2027 NECI list
    quote: Seeks to improve community water systems’ compliance with the Safe Drinking Water Act
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A system listed by EPA among drinking water 'top violators'
  cases: []
  data_needed:
  - PublicBody
  - Organization
  - Address
  - Event
  - Document
  checkable: lookups
  lookup_sources:
  - EPA SDWIS / ECHO drinking water search
  - Consumer Confidence Reports
  - State drinking water program
  levels:
    faint: Monitoring or reporting violation only
    strong: One health-based violation
    textbook: Repeated health-based violations or listed as a top violator
    threshold_source: https://epa.gov/enforcement/national-enforcement-and-compliance-initiative-increasing-compliance-drinking-water-0
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Small systems lacking money and trained operators
  - Naturally occurring contaminants (arsenic, radium) in source water
  - New standards taking effect
  version: 1
- id: PL-011
  name: Lead in tap water over the action level
  definition: The 90th-percentile lead result from a water system's household tap samples is higher than
    15 parts per billion, which triggers required follow-up.
  areas:
  - PL
  typology: Drinking water
  status: verified
  sources:
  - title: Lead & Copper Rule
    publisher: Kansas Department of Health and Environment
    url: https://www.kdhe.ks.gov/547/Lead-Copper-Rule
    locator: Lead & Copper Rule page
    quote: An AL is not a violation, but may trigger
    quote_verified: true
    checked: '2026-10-10'
  - title: Lead & Copper Rule
    publisher: Kansas Department of Health and Environment
    url: https://www.kdhe.ks.gov/547/Lead-Copper-Rule
    locator: Lead & Copper Rule page
    quote: action level (AL) of 0.015 mg/L for Lead
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A city's 90th-percentile lead result rising above 15 ppb after a change of water source
  cases: []
  data_needed:
  - PublicBody
  - Address
  - Document
  - Event
  checkable: lookups
  lookup_sources:
  - State drinking water lead sampling results
  - Consumer Confidence Reports
  - SDWIS
  levels:
    faint: 90th percentile rising toward 15 ppb
    strong: Individual homes far above 15 ppb
    textbook: 90th-percentile result above 0.015 mg/L (15 ppb)
    threshold_source: https://www.kdhe.ks.gov/547/Lead-Copper-Rule
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Lead from a single home's plumbing rather than the system
  - Sampling errors or stagnant water in unoccupied homes
  - Short-lived disturbance from construction or line replacement
  version: 1
- id: PL-012
  name: Water source or treatment changed without required corrosion control
  definition: A water system changes its source or treatment without the corrosion control needed to stop
    lead leaching from pipes.
  areas:
  - PL
  typology: Drinking water
  status: verified
  sources:
  - title: Flint Water Advisory Task Force Final Report
    publisher: State of Michigan (Flint Water Advisory Task Force)
    url: https://www.michigan.gov/documents/snyder/FWATF_FINAL_REPORT_21March2016_517805_7.pdf
    locator: p. 9, Finding F-33
    quote: There was and remains no justification for MDEQ not requiring corrosion control treatment
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A switch to river water to save money without adding orthophosphate
  cases: []
  data_needed:
  - PublicBody
  - Person
  - Document
  - Event
  - Contract
  checkable: records
  lookup_sources:
  - State drinking water permits and correspondence
  - City council minutes
  - Public records requests
  levels:
    faint: Source switch announced as a cost saving
    strong: No corrosion control study before the switch
    textbook: Official finding that corrosion control was required but not done
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Source water chemistry that does not need extra treatment
  - Corrosion control already in place under another name
  - Optimisation study under way with interim measures
  version: 1
- id: PL-013
  name: Water sampling that avoids the highest-risk homes or is falsified
  definition: A water system's compliance samples are taken in a way that misses homes with lead service
    lines, or sample results are falsified.
  areas:
  - PL
  typology: Falsified monitoring
  status: verified
  sources:
  - title: Flint Water Advisory Task Force Final Report
    publisher: State of Michigan (Flint Water Advisory Task Force)
    url: https://www.michigan.gov/documents/snyder/FWATF_FINAL_REPORT_21March2016_517805_7.pdf
    locator: p. 8, Finding F-25
    quote: Flint personnel did not identify residences with LSLs, secure an adequate number of tap water
      samples
    quote_verified: true
    checked: '2026-10-10'
  - title: ENRD Environmental Crimes Section bulletin
    publisher: US Department of Justice, ENRD
    url: https://www.justice.gov/enrd/page/file/851586/dl
    locator: Philip Kraus case summary (falsifying drinking water samples)
    quote: all six false statement counts
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Sampling pool with few or no lead-service-line homes
  - Samples taken after flushing taps
  cases: []
  data_needed:
  - PublicBody
  - Person
  - Address
  - Document
  checkable: records
  lookup_sources:
  - Lead and Copper Rule sampling site lists
  - Service line inventories
  - Public records requests
  levels:
    faint: Sample sites not matched to service line inventory
    strong: Too few samples or sites without lead lines
    textbook: Official finding or conviction for falsified or inadequate sampling
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Incomplete service line records
  - Residents declining to take part
  - Homes replaced or vacant since site lists were made
  version: 1
- id: PL-014
  name: Regulator dismisses residents' complaints in an overburdened community
  definition: Officials brush off residents' and outside experts' warnings about pollution, often in poorer
    or minority communities.
  areas:
  - PL
  typology: Environmental injustice / regulatory failure
  status: verified
  sources:
  - title: Flint Water Advisory Task Force Final Report
    publisher: State of Michigan (Flint Water Advisory Task Force)
    url: https://www.michigan.gov/documents/snyder/FWATF_FINAL_REPORT_21March2016_517805_7.pdf
    locator: p. 9, Finding F-36
    quote: The Flint water crisis is a clear case of environmental injustice.
    quote_verified: true
    checked: '2026-10-10'
  - title: Flint Water Advisory Task Force Final Report
    publisher: State of Michigan (Flint Water Advisory Task Force)
    url: https://www.michigan.gov/documents/snyder/FWATF_FINAL_REPORT_21March2016_517805_7.pdf
    locator: p. 6, Finding F-4
    quote: '...at times, MDEQ staff were dismissive and unresponsive.'
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Complaints about water colour, smell or rashes logged without investigation
  cases: []
  data_needed:
  - PublicBody
  - Person
  - Document
  - Event
  - Note
  checkable: person
  lookup_sources:
  - Complaint logs via public records requests
  - Agency emails
  - Community meeting records
  levels:
    faint: Repeated complaints without visible follow-up
    strong: Officials publicly deny a problem while data show it
    textbook: Official inquiry finds complaints were dismissed
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Complaints investigated and found unrelated to the source
  - Limited agency staff
  - Complaints about taste or odour that are not health risks
  version: 1
- id: PL-015
  name: PFAS in drinking water above federal limits
  definition: A water system's PFOA or PFOS level is above 4.0 nanograms per litre, or a PFAS mixture
    exceeds the hazard index of 1.
  areas:
  - PL
  typology: PFAS
  status: verified
  sources:
  - title: PFAS National Primary Drinking Water Regulation (Federal Register, 26 April 2024)
    publisher: US EPA / Federal Register
    url: https://www.govinfo.gov/content/pkg/FR-2024-04-26/html/2024-07773.htm
    locator: Summary
    quote: the EPA is promulgating individual Maximum Contaminant Levels (MCLs) for PFOA and PFOS at 4.0
      nanograms per liter
    quote_verified: true
    checked: '2026-10-10'
  - title: PFAS National Primary Drinking Water Regulation (Federal Register, 26 April 2024)
    publisher: US EPA / Federal Register
    url: https://www.govinfo.gov/content/pkg/FR-2024-04-26/html/2024-07773.htm
    locator: Compliance dates
    quote: All systems must comply with the MCLs by April 26, 2029.
    quote_verified: true
    checked: '2026-10-10'
  - title: National Enforcement and Compliance Initiatives
