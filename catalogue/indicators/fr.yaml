    publisher: FinCEN, OFAC and FBI
    year: '2024'
    url: https://www.fincen.gov/system/files/shared/FinCEN-Joint-Notice-Timeshare-Mexico-508C-FINAL.pdf
    locator: Typologies, p. 5 (impersonating U.S. law firms; impersonating government authorities)
    quote: Scammers generally first reestablish contact with victims by impersonating U.S.-based law firms
      who have knowledge about the initial fraud and then offer to assist the victims in recovering their
      funds.
