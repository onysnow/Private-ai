  cases:
  - name: SEC v. Luckin Coffee Inc.
    year: '2020'
    jurisdiction: US (SEC)
    what_happened: The SEC charged that from about April 2019 to January 2020 Luckin fabricated over $300
      million of retail sales using related parties, inflated expenses by over $190 million and altered
      records. Luckin agreed to pay a $180 million penalty without admitting or denying the allegations.
