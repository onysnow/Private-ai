  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Substantial personal expenditures exceeding reported resources.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-08'
  examples:
  - Property, vehicles or luxury goods bought by someone whose returns show modest income
  cases: []
  data_needed:
  - Person
  - Ownership
  - RealEstate
  - Vehicle
  - Payment
  - Document
  checkable: lookups
