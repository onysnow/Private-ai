      companies, the lesser of $120,000 or one percent of average total assets), which must be disclosed
      under SEC Item 404
    threshold_source: https://www.law.cornell.edu/cfr/text/17/229.404
    threshold_note: PCAOB AS 2401 gives no number. SEC Regulation S-K Item 404(a) sets the disclosure
      threshold for related-person transactions at more than $120,000. Item 404(d)(1) sets it for smaller
      reporting companies at the lesser of $120,000 or 1% of average total assets over the last two completed
      fiscal years. This is a disclosure trigger, not proof of wrongdoing. US public companies only.
