      the calendar year reported.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-08'
  examples:
  - Customer failed to disclose dual citizenship or tax residence (FIAU Annex I s.1)
  - UBS staff opening accounts in the names of nominees or sham entities for US clients (DOJ 2009)
  cases:
  - name: UBS AG deferred prosecution agreement
    year: '2009'
    jurisdiction: United States (S.D. Florida)
    what_happened: UBS admitted helping US taxpayers hide accounts from the IRS, including opening accounts
      in the names of nominees and/or sham entities, and agreed to pay $780 million in fines, penalties,
      interest and restitution under a deferred prosecution agreement.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/2009/February/09-tax-136.html
    source_title: DOJ press release 09-tax-136, 18 Feb 2009
  - name: United States v. Paul Manafort (EDVA)
    year: '2018'
    jurisdiction: United States (E.D. Virginia)
    what_happened: Convicted on false tax return counts and one count of not filing a required IRS form;
      prosecutors alleged $65 million hidden in overseas bank accounts.
    outcome: convicted
