  - title: 'FIAU Intelligence Factsheet: Tax-Related ML'
    publisher: Financial Intelligence Analysis Unit, Malta
    url: https://fiaumalta.org/wp-content/uploads/2021/12/FIAU-Intelligence-Factsheet-Tax-Related-ML-final.pdf
    locator: Annex I, Section 3, pp. 20-21
    quote: The customer opens an account and funds are transferred to/from non-cooperative jurisdictions…
    quote_verified: true
    licence: Not stated
    checked: '2026-10-08'
  - title: Report of Foreign Bank and Financial Accounts (FBAR)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar
