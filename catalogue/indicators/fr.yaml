  cases: []
  data_needed:
  - Person
  - Company
  - Document
  checkable: lookups
  lookup_sources:
  - Tax lien records
  - Company registry filing history
  - Court judgments
  levels:
    faint: Missing returns for a recent tax year while income was received. The source gives no lower
      figure.
    strong: Missing returns over several years, approaching the six-year IRS enforcement period.
    textbook: Missing returns across the full six-year enforcement period the IRS normally pursues.
    threshold_source: https://www.irs.gov/irm/part4/irm_04-012-001
    threshold_note: The six years is the IRS's normal enforcement period for delinquent returns (Policy
      Statement 5-133, IRM 1.2.1.6.18, applied in IRM 4.12.1.3). It is an enforcement window, not a red-flag
      count; IRM 4.12.1.3.1 allows longer or shorter periods with management approval. The IRM 1.2.1 page
      with the policy statement's own wording could not be opened. IRM 25.1.2 ('several years') and FIAU
      Malta ('a number of years') give no figure.
  threshold_verified: true
