      for their part in a mobile-phone VAT carousel using missing traders such as Eurocoin (UK) Ltd; the
      Court of Appeal judgment of 18 November 2008 dealt with confiscation.
    outcome: convicted
    outcome_verified: true
    source_url: https://caselaw.nationalarchives.gov.uk/ewca/crim/2008/2562
    source_title: Sangha & Ors, R. v [2008] EWCA Crim 2562
