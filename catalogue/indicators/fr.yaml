- id: FR-084
  name: 'Missing trader: VAT-registered firm buys goods VAT-free across a border, sells with VAT and disappears'
  definition: A company registers for VAT, imports goods or services from another EU country without VAT,
    charges VAT when it resells them domestically, then vanishes or defaults without paying that VAT to
    the tax authority.
  areas:
  - FR
  typology: Missing trader intra-community (MTIC) VAT fraud
  status: verified
  sources:
  - title: 'VAT Fraud manual VATF23510: What is MTIC fraud'
    publisher: HMRC
    url: https://www.gov.uk/hmrc-internal-manuals/vat-fraud/vatf23510
    locator: VATF23510
    quote: 'MTIC fraud contains two elements: a missing trader and an intra-community supply.'
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Europol Review 2015: Fraud'
    publisher: Europol
    year: '2015'
    url: https://www.europol.europa.eu/annual_review/2015/fraud.html
    locator: Fraud section
    quote: It is estimated that VAT revenue losses incurred by MTIC fraud alone are between EUR 45 billion
      and EUR 53 billion each year
    quote_verified: true
    checked: '2026-10-09'
  - title: VAT Fraud manual VATF23520
    publisher: HMRC
    url: https://www.gov.uk/hmrc-internal-manuals/vat-fraud/vatf23520
    locator: VATF23520 (defaulter)
    quote: The important thing to remember is that this is the entity that defaults on its VAT liability.
    quote_verified: true
    checked: '2026-10-09'
  examples:
