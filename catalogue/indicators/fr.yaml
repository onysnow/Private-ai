  sources:
  - title: 7 U.S.C. § 6c(a)(5) Disruptive practices
    publisher: US Code (via Cornell LII)
    url: https://www.law.cornell.edu/uscode/text/7/6c
    locator: § 6c(a)(5)(C)
    quote: (bidding or offering with the intent to cancel the bid or offer before execution).
    quote_verified: true
    checked: '2026-10-09'
  - title: United States v. Michael Coscia, No. 16-3017
    publisher: US Court of Appeals for the Seventh Circuit (via CourtListener)
    year: '2017'
    url: https://www.courtlistener.com/opinion/4416689/united-states-v-michael-coscia/
    locator: Opinion, star page *796
    quote: Coscia's order-to-trade ratio was 1,592%, whereas the order-to-trade ratio for other market
      participants ranged from 91% to 264%.
    quote_verified: true
    licence: US court opinion, public domain
    checked: '2026-10-10'
  examples:
  - On the day of the 2010 Flash Crash a trader entered at least 85 spoof sell orders in E-mini S&P futures.
  cases:
  - name: United States v. Navinder Singh Sarao
    year: '2016'
    jurisdiction: US (N.D. Illinois)
    what_happened: Sarao pleaded guilty to wire fraud and spoofing; he placed thousands of E-mini S&P
      500 futures orders he never intended to fill and admitted at least $12.8 million in illicit gains.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/futures-trader-pleads-guilty-illegally-manipulating-futures-market-connection-2010-flash
    source_title: Futures Trader Pleads Guilty to Illegally Manipulating the Futures Market in Connection
      With 2010 'Flash Crash'
