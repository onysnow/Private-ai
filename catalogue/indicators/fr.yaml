  - Exchange order-book data (rarely public; usually from court records)
  - CFTC and DOJ enforcement releases
  levels:
    faint: A trader's order-to-trade ratio is above 264%, the top of the range the court recorded for
      other market participants.
    strong: Large orders are almost never filled (0.08% of large orders filled against 35.61% of small
      orders), or few large orders rest more than one second (0.57%).
    textbook: An order-to-trade ratio on the scale of 1,592%, the figure proved in the first US criminal
      spoofing conviction, together with evidence of intent to cancel before execution.
    threshold_source: https://www.courtlistener.com/opinion/4416689/united-states-v-michael-coscia/
    threshold_note: 'These are evidence figures a federal appeals court accepted as proof of spoofing
      under 7 U.S.C. § 6c(a)(5)(C). They are not a rule-based trigger. The same page says: ''on the Chicago
      Mercantile Exchange, 35.61% of his small orders were filled, whereas only 0.08% of his large orders
      were filled'' and ''only 0.57% of Coscia''s large orders were on the market for more than one second''.
      The statute itself gives no number. A law-firm memo (Willkie Farr) repeats these figures but was
      not used as the source.'
  threshold_verified: true
