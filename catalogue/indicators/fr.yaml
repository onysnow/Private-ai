  definition: An older customer wires or sends money interstate or abroad to people they do not know well,
    or says an online friend or romantic partner asked them to receive and forward money.
  areas:
  - FR
  typology: Elder financial exploitation (romance and imposter scams)
  status: verified
  sources:
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: FinCEN
    year: '2022'
    url: https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: Behavioral red flags, p. 9
    quote: An older customer mentions how an online friend or romantic partner is asking them to receive
      and forward money
    quote_verified: true
    checked: '2026-10-09'
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: FinCEN
    year: '2022'
    url: https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: Financial red flags, p. 10
    quote: Uncharacteristic attempts to wire large sums of money.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A widower wires savings overseas to a partner he met online and has never seen in person.
  cases: []
  data_needed:
  - Payment (beneficiary, country)
  - Person (sender, recipient)
  - BankAccount
  - Associate / UnknownLink
  checkable: records
  lookup_sources:
  - Sanctions lists
  - Scam and fraud-report databases (e.g. FTC Consumer Sentinel, where available)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: An older person asked to receive and forward money may be used as a money mule.
    source_url: https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
  innocent_explanations:
  - Supporting real relatives abroad
  - Paying for overseas property or travel
  jurisdictions: US (FinCEN)
  version: 1
- id: FR-075
  name: Bounced payments or unpaid bills that are new for an older person
  definition: An older customer suddenly has insufficient-funds activity or stops paying for services,
    which can mean money has been taken or access lost.
  areas:
  - FR
  typology: Elder financial exploitation
  status: verified
  sources:
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: FinCEN
    year: '2022'
    url: https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: Financial red flags, p. 10
    quote: Uncharacteristic nonpayment for services, which may indicate a loss of funds or of access to
      funds.
    quote_verified: true
    checked: '2026-10-09'
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: FinCEN
    year: '2022'
    url: https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: Financial red flags, p. 10
    quote: Sudden or frequent non-sufficient fund activity.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A nursing home bill goes unpaid while the resident's agent spends her money (Smith case).
  cases:
  - name: United States v. Shanan Smith
    year: '2022'
    jurisdiction: US (N.D. Iowa)
    what_happened: The victim's unpaid nursing-home bill followed the agent's theft; the agent then sold
      the victim's house. Smith pleaded guilty to wire fraud.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-ndia/pr/waterloo-woman-who-abused-power-attorney-steal-victim-suffering-dementia-sentenced
    source_title: Waterloo Woman Who Abused Power of Attorney to Steal from Victim Suffering from Dementia
      Sentenced
  data_needed:
  - BankAccount
  - Payment
  - Person
  - Document (care-home invoices, collection notices)
  checkable: records
  lookup_sources:
  - Court records for debt collection or eviction cases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Memory decline causing missed payments
  - Real financial hardship
  - Bank or billing errors
  jurisdictions: US (FinCEN)
  version: 1
- id: FR-076
  name: Washed or altered checks
  definition: A check shows signs that the original writing was chemically removed or overwritten, or
    is on check stock that differs from the bank's and the customer's usual checks.
  areas:
  - FR
  typology: Check fraud (mail-theft related)
  status: verified
  sources:
  - title: FinCEN Alert on Nationwide Surge in Mail Theft-Related Check Fraud (FIN-2023-Alert003)
    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN%20Alert%20Mail%20Theft-Related%20Check%20Fraud%20FINAL%20508.pdf
    locator: Red flags, p. 5
    quote: Examination of suspect checks reveals faded handwriting underneath darker handwriting,
    quote_verified: true
    checked: '2026-10-09'
  - title: FinCEN Alert on Mail Theft-Related Check Fraud
    publisher: FinCEN
    year: '2023'
    url: https://www.fincen.gov/sites/default/files/shared/FinCEN%20Alert%20Mail%20Theft-Related%20Check%20Fraud%20FINAL%20508.pdf
    locator: Red flags, p. 4
    quote: Checks used to withdraw funds from a customer's account appear to be of a noticeably different
      check stock
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Checks stolen from USPS collection boxes had their payees changed and amounts raised from small sums
    to thousands of dollars.
  cases:
  - name: United States v. Naod Tsegay, Fode Bangoura, Zyier Williams and Najae Thomas
    year: '2024'
    jurisdiction: US (E.D. Pennsylvania)
    what_happened: The men stole checks from blue USPS collection boxes, some using stolen postal Arrow
      Keys, changed payees and raised amounts, and deposited them into accounts supplied by recruited
      account holders. All pleaded guilty to bank fraud and related counts; sentences ranged from six
      to 61 months.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-edpa/pr/four-philadelphia-area-men-sentenced-prison-schemes-wash-and-alter-checks-stolen-usps
    source_title: Four Philadelphia-Area Men Sentenced to Prison for Schemes to Wash and Alter Checks
      Stolen from USPS
  data_needed:
  - Document (check images, front and back)
  - Payment (original vs altered payee and amount)
  - BankAccount (drawer and depositing account)
  - Person / Company (payee, depositor)
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Writer corrected their own mistake
  - Faded ink or poor-quality scans
  - A customer legitimately switched check printers
  jurisdictions: US (FinCEN)
  version: 1
