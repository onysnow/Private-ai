    publisher: US Internal Revenue Service
    year: '2026'
    url: https://www.irs.gov/irm/part4/irm_04-012-001
    locator: IRM 4.12.1.3, Enforcement Period (citing IRM 1.2.1.6.18, Policy Statement 5-133)
    quote: The enforcement period is not to be more than six years.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-10'
  examples:
