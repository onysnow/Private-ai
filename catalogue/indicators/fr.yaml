key: FR
name: Tax evasion and fraud
scope: tax evasion and aggressive avoidance used to hide wrongdoing, investment and securities fraud,
  Ponzi and pyramid schemes, insurance fraud, healthcare fraud, bankruptcy fraud.
indicators:
- id: FR-001
  name: Omitted income or whole income sources
  definition: Income that was clearly received is left off the tax return, either item by item or a whole
    source at once.
  areas:
  - FR
  typology: Tax evasion - unreported income
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Omitting entire sources of income.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-08'
  examples:
  - Omitting specific items where similar items are included (IRM 25.1.2.3(2))
  - Failing to report or explain substantial amounts of income identified as received (IRM 25.1.2.3(2))
  cases:
  - name: United States v. Paul Manafort (EDVA)
    year: '2018'
    jurisdiction: United States (E.D. Virginia)
    what_happened: A jury found Manafort guilty of five counts of filing false tax returns, one count
      of not filing a required IRS form and two counts of bank fraud; prosecutors alleged he hid $65 million
      from the IRS in overseas accounts. The jury could not agree on the other 10 counts.
    outcome: convicted
    outcome_verified: true
    source_url: https://abajournal.com/news/article/jury_finds_paul_manafort_guilty_on_eight_counts_judge_declares_mistrial_on
    source_title: Jury finds Paul Manafort guilty on eight counts; judge declares mistrial on 10 other
      counts (ABA Journal)
  data_needed:
  - Person
  - Company
  - Payment
  - BankAccount
  - Document
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Honest bookkeeping error or a missing third-party form
  - Misunderstanding of what counts as taxable income
  - Income reported on a related entity's return rather than the individual's
  jurisdictions: US (IRS); concept general
  version: 1
- id: FR-002
  name: Wealth or spending that reported income cannot explain
