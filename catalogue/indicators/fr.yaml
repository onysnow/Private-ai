    publisher: PCAOB
    url: https://pcaobus.org/oversight/standards/auditing-standards/details/AS2401
    locator: Para. .85, A.2 Opportunities, item 1
    quote: a significant related party transaction outside the normal course of business
    quote_verified: true
    checked: '2026-10-09'
  - title: 17 CFR 229.404 (Item 404) Transactions with related persons, promoters and certain control
      persons
    publisher: US Securities and Exchange Commission (Regulation S-K), via Cornell LII
    year: '2026'
    url: https://www.law.cornell.edu/cfr/text/17/229.404
    locator: Item 404(a); smaller reporting companies at Item 404(d)(1)
    quote: the amount involved exceeds $120,000
    quote_verified: true
    licence: US federal regulation, public domain
    checked: '2026-10-10'
  examples:
