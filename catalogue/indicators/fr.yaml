- id: FR-080
  name: Unsolicited offer to sell or rent out a timeshare, with upfront fees or taxes
  definition: A caller or email claims to have a buyer, renter or investor for a person's timeshare, then
    demands fees, taxes or closing costs in advance, and keeps asking for more.
  areas:
  - FR
  typology: Timeshare exit, re-rent and investment scams (advance-fee fraud)
  status: verified
  sources:
  - title: Joint Notice on Timeshare Fraud Associated with Mexico-Based Transnational Criminal Organizations
      (FIN-2024-NTC2)
    publisher: FinCEN, OFAC and FBI
    year: '2024'
    url: https://www.fincen.gov/system/files/shared/FinCEN-Joint-Notice-Timeshare-Mexico-508C-FINAL.pdf
    locator: Typologies, pp. 4–5
    quote: Mexico-based TCOs are targeting U.S. owners of timeshares in Mexico through complex, often
      yearslong telemarketing scams.
    quote_verified: true
    checked: '2026-10-09'
  - title: Treasury press release on CJNG timeshare fraud
    publisher: US Treasury
    year: '2024'
    url: https://home.treasury.gov/news/press-releases/jy2465
    quote: Unsolicited calls and emails may seem legitimate, but they're actually made by cartel-supported
      criminals.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Owners are told a buyer is waiting and must pay 'closing costs' and 'taxes'; fake bank dashboards
    show balances to encourage more payments.
  cases:
  - name: OFAC designations of CJNG-linked accountants and companies
    year: '2024'
    jurisdiction: US (Treasury, OFAC)
    what_happened: OFAC sanctioned three Mexican accountants (Griselda Margarita Arredondo Pinzon, Xeyda
      Del Refugio Foubert Cadena, Emiliano Sanchez Martinez) and four Mexican companies linked to CJNG
      timeshare fraud. This is an administrative sanctions designation, not a court ruling.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://home.treasury.gov/news/press-releases/jy2465
    source_title: Treasury, FinCEN, FBI press release (jy2465)
  data_needed:
  - Person (victim, callers)
  - Company (purported broker or law firm)
  - Payment (fees, beneficiary bank and country)
  - Email / Phone / Document (offers, fake contracts)
  - BankAccount (beneficiary)
  checkable: lookups
  lookup_sources:
  - OFAC SDN sanctions list
  - Company registry (Mexico, US state registries)
  - State bar directories to check named lawyers
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: FinCEN, OFAC and FBI link these schemes to the CJNG cartel, which uses proceeds to fund drug
      operations.
    source_url: https://www.fincen.gov/system/files/shared/FinCEN-Joint-Notice-Timeshare-Mexico-508C-FINAL.pdf
  - target_area: SF
    reason: Designated persons and companies appear on the OFAC SDN list.
    source_url: https://home.treasury.gov/news/press-releases/jy2465
  innocent_explanations:
  - Legitimate resale brokers who charge only on completion
  - Resort-run exit programmes with published fees
  jurisdictions: US and Mexico (FinCEN, OFAC, FBI)
  version: 1
- id: FR-081
  name: Fake lawyers or officials offering to recover losses or unblock funds
  definition: After a first scam, the victim is contacted by people posing as a law firm or a government
    body (such as OFAC, Mexico's financial intelligence unit or INTERPOL) who demand more fees to recover
    or release money.
