key: FR
name: Tax evasion and fraud
scope: tax evasion and aggressive avoidance used to hide wrongdoing, investment and securities fraud,
  Ponzi and pyramid schemes, insurance fraud, healthcare fraud, bankruptcy fraud.
indicators:
- id: FR-001
  name: Omitted income or whole income sources
  definition: Income that was clearly received is left off the tax return, either item by item or a whole
    source at once.
  areas:
  - FR
  typology: Tax evasion - unreported income
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Omitting entire sources of income.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  examples:
  - Omitting specific items where similar items are included (IRM 25.1.2.3(2))
  - Failing to report or explain substantial amounts of income identified as received (IRM 25.1.2.3(2))
  cases:
  - name: United States v. Paul Manafort (EDVA)
    year: '2018'
    jurisdiction: United States (E.D. Virginia)
    what_happened: A jury found Manafort guilty of five counts of filing false tax returns, one count
      of not filing a required IRS form and two counts of bank fraud; prosecutors alleged he hid $65 million
      from the IRS in overseas accounts. The jury could not agree on the other 10 counts.
    outcome: convicted
    outcome_verified: true
    source_url: https://abajournal.com/news/article/jury_finds_paul_manafort_guilty_on_eight_counts_judge_declares_mistrial_on
    source_title: Jury finds Paul Manafort guilty on eight counts; judge declares mistrial on 10 other
      counts (ABA Journal)
  data_needed:
  - Person
  - Company
  - Payment
  - BankAccount
  - Document
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Honest bookkeeping error or a missing third-party form
  - Misunderstanding of what counts as taxable income
  - Income reported on a related entity's return rather than the individual's
  jurisdictions: US (IRS); concept general
  version: 1
- id: FR-002
  name: Wealth or spending that reported income cannot explain
  definition: A person's net worth grows, or their personal spending runs, well beyond what their declared
    income could pay for.
  areas:
  - FR
  - ML
  typology: Net worth / expenditure method
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Inability to explain substantial increases in net worth, especially over a period of years.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Substantial personal expenditures exceeding reported resources.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  examples:
  - Property, vehicles or luxury goods bought by someone whose returns show modest income
  cases: []
  data_needed:
  - Person
  - Ownership
  - RealEstate
  - Vehicle
  - Payment
  - Document
  checkable: lookups
  lookup_sources:
  - Property and land registries
  - Vehicle/vessel/aircraft registries
  - Court filings showing declared income
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Unexplained wealth in public officials is a classic sign of bribe receipt as well as tax evasion.
    source_url: https://www.irs.gov/irm/part25/irm_25-001-002
  innocent_explanations:
  - Inheritance, gifts or loans
  - Sale of an asset bought long ago
  - Spouse's or family income
  - Non-taxable receipts such as insurance payouts
  version: 1
- id: FR-003
  name: Bank deposits larger than reported income
  definition: Money paid into a person's or business's accounts is much more than the income shown on
    the tax return, and the source cannot be explained.
  areas:
  - FR
  typology: Bank deposits method
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Inability to explain sources of bank deposits substantially exceeding reported income.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: 'FIAU Intelligence Factsheet: Tax-Related ML'
    publisher: Financial Intelligence Analysis Unit, Malta
    url: https://fiaumalta.org/wp-content/uploads/2021/12/FIAU-Intelligence-Factsheet-Tax-Related-ML-final.pdf
    locator: Annex I, Section 5, p. 22
    quote: Frequent amounts of deposits from unexplained sources.
    quote_verified: true
    licence: Not stated
    checked: '2026-10-09'
  - title: 26 U.S. Code § 6501 - Limitations on assessment and collection
    publisher: Cornell Legal Information Institute (text of US Code, Office of the Law Revision Counsel)
    year: '2026'
    url: https://www.law.cornell.edu/uscode/text/26/6501
    locator: § 6501(e)(1)(A)(i); assessment 'at any time within 6 years after the return was filed'
    quote: such amount is in excess of 25 percent of the amount of gross income stated in the return,
      or
    quote_verified: true
    licence: US Code is public domain; LII presentation
    checked: '2026-10-10'
  examples:
  - An entity that does not report any revenue but has executed transactions which have been reported
    by third parties (FIAU Annex I s.2)
  cases: []
  data_needed:
  - BankAccount
  - Payment
  - Person
  - Company
  - Document
  checkable: records
  lookup_sources: []
  levels:
    faint: Deposits exceed reported gross income and the difference is unexplained, but the omitted amount
      is below 25 percent of gross income stated on the return. The source gives no lower figure.
    strong: Unexplained deposits suggest omitted income approaching 25 percent of the gross income stated
      on the return.
    textbook: Omitted income is in excess of 25 percent of the amount of gross income stated in the return.
      This is the statutory level that extends the IRS assessment period to 6 years.
    threshold_source: https://www.law.cornell.edu/uscode/text/26/6501
    threshold_note: 'The IRS IRM 25.1.2 badge of fraud (''substantially exceeding reported income'') gives
      no figure. The closest published US number for unreported income is the 26 U.S.C. 6501(e)(1)(A)
      substantial-omission rule: an omission over 25 percent of stated gross income extends the assessment
      window from 3 to 6 years. It is a statute-of-limitations trigger, not a fraud finding. The FIAU
      Malta factsheet gives no number.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Transfers between a person's own accounts counted twice
  - Loan proceeds or repayments
  - Customer deposits held on trust
  version: 2
- id: FR-004
  name: Hidden domestic, foreign or digital-asset accounts
  definition: Bank, brokerage or crypto accounts are kept from the tax authority, often abroad or in uncooperative
    jurisdictions.
  areas:
  - FR
  - ML
  typology: Offshore concealment
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Concealing domestic or foreign bank accounts, brokerage accounts, digital assets such as convertible…
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: 'FIAU Intelligence Factsheet: Tax-Related ML'
    publisher: Financial Intelligence Analysis Unit, Malta
    url: https://fiaumalta.org/wp-content/uploads/2021/12/FIAU-Intelligence-Factsheet-Tax-Related-ML-final.pdf
    locator: Annex I, Section 3, pp. 20-21
    quote: The customer opens an account and funds are transferred to/from non-cooperative jurisdictions…
    quote_verified: true
    licence: Not stated
    checked: '2026-10-09'
  - title: Report of Foreign Bank and Financial Accounts (FBAR)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar
    quote: the aggregate value of those foreign financial accounts exceeded $10,000 at any time during
      the calendar year reported.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  examples:
  - Customer failed to disclose dual citizenship or tax residence (FIAU Annex I s.1)
  - UBS staff opening accounts in the names of nominees or sham entities for US clients (DOJ 2009)
  cases:
  - name: UBS AG deferred prosecution agreement
    year: '2009'
    jurisdiction: United States (S.D. Florida)
    what_happened: UBS admitted helping US taxpayers hide accounts from the IRS, including opening accounts
      in the names of nominees and/or sham entities, and agreed to pay $780 million in fines, penalties,
      interest and restitution under a deferred prosecution agreement.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/2009/February/09-tax-136.html
    source_title: DOJ press release 09-tax-136, 18 Feb 2009
  - name: United States v. Paul Manafort (EDVA)
    year: '2018'
    jurisdiction: United States (E.D. Virginia)
    what_happened: Convicted on false tax return counts and one count of not filing a required IRS form;
      prosecutors alleged $65 million hidden in overseas bank accounts.
    outcome: convicted
    outcome_verified: true
    source_url: https://abajournal.com/news/article/jury_finds_paul_manafort_guilty_on_eight_counts_judge_declares_mistrial_on
    source_title: ABA Journal
  data_needed:
  - Person
  - BankAccount
  - CryptoWallet
  - Company
  - Ownership
  - Address
  - Document
  checkable: lookups
  lookup_sources:
  - Offshore leak databases (e.g. ICIJ Offshore Leaks)
  - Company registries in offshore jurisdictions
  - Court records
  - Blockchain explorers for crypto
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: A US person with foreign accounts whose combined value exceeded $10,000 during the year
      and no FBAR filed (FBAR filing duty per IRS); otherwise meets the published definition as worded
    threshold_source: https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: FIAU lists funds moving to or from non-cooperative jurisdictions as a tax-related money laundering
      red flag.
    source_url: https://fiaumalta.org/wp-content/uploads/2021/12/FIAU-Intelligence-Factsheet-Tax-Related-ML-final.pdf
  innocent_explanations:
  - Dual nationals or expatriates with ordinary local accounts abroad
  - Unaware of reporting duty (non-wilful)
  - Account was reported but the record is not public
  jurisdictions: US (FBAR); international (FIAU, Malta)
  version: 1
- id: FR-005
  name: Large unexplained cash in a business that does not normally use cash
  definition: Big sums of cash are handled or spent without explanation, especially in a business that
    does not normally deal in cash.
  areas:
  - FR
  - ML
  typology: Cash skimming / cash concealment
  status: verified
  sources:
  - title: IRM 25.1.2.3 Indicators of Fraud (Income)
    publisher: US Internal Revenue Service
    url: https://www.irs.gov/irm/part25/irm_25-001-002
    locator: IRM 25.1.2.3(2)
    quote: Consistent concealment of unexplained currency, especially in a business not routinely requiring
      large cash transactions.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: 'FIAU Intelligence Factsheet: Tax-Related ML'
    publisher: Financial Intelligence Analysis Unit, Malta
    url: https://fiaumalta.org/wp-content/uploads/2021/12/FIAU-Intelligence-Factsheet-Tax-Related-ML-final.pdf
    locator: Annex I, Section 2, pp. 19-20
    quote: Use of material levels of cash in a non-cash intensive business without a commercial or reasonable
      justification.
    quote_verified: true
    licence: Not stated
    checked: '2026-10-09'
  - title: IRS Form 8300 Reference Guide
    publisher: US Internal Revenue Service
    year: '2026'
    url: https://www.irs.gov/businesses/small-businesses-self-employed/irs-form-8300-reference-guide
    locator: Introduction; also 'If the same payer makes two or more transactions totaling more than $10,000
      in a 24-hour period,' and 'The business may voluntarily file a Form 8300 in those situations where
      the transaction is $10,000 or less and suspicious.'
    quote: The law requires trades and businesses report cash payments of more than $10,000 to the federal
      government
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-10'
  examples:
  - Inadequately explaining dealings in large sums of currency, or the unexplained expenditure of currency
    (IRM 25.1.2.3(2))
  - Health care provider making significant cash withdrawals with no apparent business purpose (FinCEN
    FIN-2026-A001, p.10)
  cases: []
  data_needed:
  - BankAccount
  - Payment
  - Company
  - Person
  checkable: records
  lookup_sources: []
  levels:
    faint: A suspicious cash transaction of $10,000 or less, for which the IRS allows a voluntary Form
      8300.
    strong: Cash from the same payer, in two or more transactions, totalling more than $10,000 in a 24-hour
      period, or further cash payments over $10,000 within a 12-month period.
    textbook: A business receives cash payments of more than $10,000, which it must report to the federal
      government on Form 8300.
    threshold_source: https://www.irs.gov/businesses/small-businesses-self-employed/irs-form-8300-reference-guide
    threshold_note: This is a US federal reporting threshold (26 U.S.C. 6050I / 31 U.S.C. 5331, Form 8300).
      It applies to businesses receiving cash and does not by itself show evasion. The same $10,000 figure
      is the bank Currency Transaction Report threshold. The FIAU Malta factsheet ('material levels of
      cash') and IRS IRM 25.1.2 give no figure.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Business has legitimately cash-paying customers or suppliers
  - Cash payroll in some trades
  - Cultural preference for cash
  version: 2
