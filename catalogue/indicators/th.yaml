key: TH
name: Organised theft and fencing
scope: 'Organised retail crime, online fencing, cyber-enabled cargo theft, ATM jackpotting, and the unsourced
  gaps: robbery, burglary, livestock theft, electricity theft and payment-card skimming.'
indicators:
- id: TH-001
  name: Wholesaler or trading company paying many unrelated individuals
  definition: A company that calls itself a wholesaler, distributor or trading business sends cheques
    or transfers to many private individuals instead of to recognisable suppliers, which can mean it is
    paying thieves (boosters) for stolen goods.
  areas:
  - TH
  typology: 'Organised retail crime: fencer paying boosters'
  status: verified
  sources:
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with Homeland Security Investigations (HSI)
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine, Red Flag Indicators Related to Transactions (pp. 33-35)
    quote: Unusually large number of beneficiaries receiving funds from one company. This may be indicative
      of payment to fencers.
    quote_verified: true
    checked: '2026-10-10'
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine, cash, check and money order (p. 33)
    quote: Check payments issued to multiple individuals for which no relationship or lawful purpose can
      be established.
    quote_verified: true
    checked: '2026-10-10'
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine (p. 33)
    quote: Checks written to individuals, as opposed to legitimate business suppliers.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - A health-and-beauty wholesaler's account shows weekly even-amount cheques to dozens of individuals
    and almost no payments to manufacturers (pattern described in Operation King of Thieves and Operation
    At the Card Wash, ACAMS/HSI 2022, Section Eight).
  cases:
  - name: Operation At the Card Wash (HSI Long Beach and HSI Los Angeles)
    year: '2021'
    jurisdiction: United States (California)
    what_happened: HSI reported a national network of wholesale electronics distributors that it said
      bought consumer electronics with gift cards obtained from phone-scam victims and exported goods
      declared at over US$13 million; four defendants were federally indicted. The report gives no conviction.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    source_title: ACAMS/HSI report on ORC, Section Eight (pp. 29-31)
  data_needed:
  - Company
  - Person
  - Payment
  - Ownership
  - Directorship
  - Document
  checkable: records
  lookup_sources:
  - Bank records or court exhibits
  - State business registries
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: The ACAMS/HSI guide frames these payments as laundering of theft proceeds through wholesale
      front companies.
    source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
  - target_area: FR
    reason: Operation At the Card Wash linked electronics wholesalers to gift cards taken from phone-scam
      victims.
    source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
  innocent_explanations:
  - Buying from individual resellers, estate sales or consignors is a legitimate model for liquidators
    and second-hand dealers.
  - Paying commission-only sales agents or gig workers as individuals.
  - Refunds or rebates to retail customers.
  jurisdictions: United States (guidance written for US financial institutions)
  version: 1
- id: TH-002
  name: Round-sum payments to 'liquidator' or 'wholesale' companies
  definition: Money moves in large, even, repeated amounts between companies whose names contain words
    like liquidator or wholesale, or that appear to be both suppliers and buyers, without invoices that
    explain it.
  areas:
  - TH
  typology: 'Organised retail crime: diverter and fencer layering'
  status: verified
  sources:
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
