      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine, ACH (p. 34)
    quote: Large volume of credit transactions from online marketplaces for sale of stolen goods.
    quote_verified: true
    checked: '2026-10-10'
