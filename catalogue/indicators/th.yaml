    locator: Section Nine (p. 33)
    quote: Check payments issued to multiple companies with "liquidator" or "wholesale" in their name.
      Overall funds may be co-mingled.
    quote_verified: true
    checked: '2026-10-10'
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Eight, Operation At the Card Wash characteristics (p. 31)
    quote: Large, even-numbered fund transfers to entities appearing to be suppliers or buyers
    quote_verified: true
    checked: '2026-10-10'
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine, wire transactions (p. 34)
    quote: Wire transfers sent in large, round dollar, repetitive amounts on a consistent date (e.g. weekly
      or monthly).
    quote_verified: true
    checked: '2026-10-10'
  - title: Detecting and Reporting the Illicit Financial Flows Tied to Organized Theft Groups and Organized
      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Nine, bank statements (p. 35)
    quote: Even dollar payments between illicit wholesaler and diverter.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Weekly US$50,000 transfers from an electronics wholesaler to a 'liquidation' company that also sells
    inventory back to it.
  cases: []
  data_needed:
  - Company
  - Payment
  - Contract
  - Ownership
  - Address
  checkable: records
  lookup_sources:
  - Bank records or court exhibits
  - State business registries
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Round, repetitive, undocumented transfers are listed as laundering red flags in the guide.
    source_url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
  innocent_explanations:
  - Liquidation and closeout buying is a lawful, large industry that buys surplus and returned stock.
  - Retainer or instalment payments under a supply contract are often round and regular.
  - Related companies in one group settle intercompany balances in round sums.
  jurisdictions: United States
  version: 1
- id: TH-003
  name: Online-marketplace payouts without a real sales business
  definition: An account receives large or frequent payouts from online marketplaces or payment apps,
    but the holder has no visible retail, online shop or supplier purchases that would explain the sales.
  areas:
  - TH
  typology: E-fencing
  status: verified
  sources:
