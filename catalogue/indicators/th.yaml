      Retail Crime
    publisher: ACAMS with HSI
    year: '2022'
    url: https://www.icsc.com/uploads/gpp/ACAMS_-_HSI_Report_on_ORC.pdf
    locator: Section Twelve, Due Diligence and Transaction Monitoring (pp. 49-50)
    quote: If the customer only had credits for sales, that is a red flag.
    quote_verified: true
    checked: '2026-10-10'
  - title: Organized Retail Crime (GAO-11-675)
    publisher: US Government Accountability Office
    year: '2011'
    url: https://www.gao.gov/products/gao-11-675
    locator: Highlights
    quote: These stolen goods can also be sold on online marketplaces, a practice known as "e-fencing."
