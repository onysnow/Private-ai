- id: MA-004
  name: Officers or service providers with misconduct records or many penny-stock ties
  definition: Executives, lawyers, auditors, transfer agents or promoters linked to the company have regulatory
    or criminal histories, or keep turning up at other low-priced issuers.
  areas:
  - MA
  typology: Pump and dump (repeat players)
  status: verified
  sources:
