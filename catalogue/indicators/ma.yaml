key: MA
name: Securities market abuse
scope: 'Securities market abuse (manipulation and insider trading). FINRA Regulatory Notice 21-03 (10
  Feb 2021). Manipulation: reverse or forward splits that concentrate shares among a few holders; marking
  the close (buying just before market close); small buys by a customer with a very large position, apparently
  to move the price; customers suddenly trading a thinly traded stock on both sides of the market; sell-only
  routing through omnibus or DVP/RVP accounts. Insider-related: officers, former officers, significant
  shareholders or their families trading before an announcement or a promotion campaign. Issuer and customer
  flags: abrupt changes of name, ticker or business model; current or past shell status; unsupported revenue
  or partnership claims; large deposits of thinly traded shares; several new overseas accounts depositing
  the same issuer''s shares.'
indicators:
- id: MA-001
  name: Abrupt or repeated changes of company name, ticker or business model
  definition: The company keeps changing its name, ticker or line of business, often to jump on whatever
    trend is popular, which can hide the lack of a real business ahead of a pump-and-dump.
  areas:
  - MA
  typology: Pump and dump (issuer-side)
  status: verified
  sources:
  - title: 'Regulatory Notice 21-03: FINRA Shares Observations and Guidance on Fraud Involving Low-Priced
      Securities'
    publisher: FINRA
    year: '2021'
    url: https://www.finra.org/rules-guidance/notices/21-03
    locator: Potential Indicators of Fraud Involving Low-Priced Securities > Issuers
    quote: abrupt or frequent changes of issuer name, ticker symbol or business model, or abrupt expansion
      of an existing business model, often to benefit from the latest trend
    quote_verified: true
    checked: '2026-10-09'
  - title: Microcap Fraud
    publisher: SEC Office of Investor Education (Investor.gov)
    url: https://www.investor.gov/protect-your-investments/fraud/types-fraud/microcap-fraud
    quote: Frequent changes in company name or business plan may suggest no real business operations.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Regulatory Notice 19-18: FINRA Provides Guidance to Firms Regarding Suspicious Activity Monitoring
      and Reporting Obligations'
    publisher: FINRA
    year: '2019'
    url: https://www.finra.org/rules-guidance/notices/19-18
    locator: II. Potential Red Flags in Deposits of Securities
    quote: were issued by a company that has been through several recent name changes or business combinations
      or recapitalizations;
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A former cannabis company renames itself and announces COVID-19 test kits (FINRA's own example).
  cases: []
  data_needed:
  - Company (name, previousName, incorporationDate, status)
  - Security (ticker, issuer)
  - Document (filings, press releases, with dates)
  checkable: lookups
  lookup_sources:
  - SEC EDGAR filing history
  - OTC Markets issuer pages and compliance flags
  - Company registry (name-change history)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: AF
    reason: Repeated reinvention of the business model often comes with revenue or partnership claims
      the accounts cannot support.
    source_url: https://www.finra.org/rules-guidance/notices/21-03
  innocent_explanations:
  - Genuine pivot after a failed product
  - Rebranding after a merger or acquisition
  - Name change after a change of control in a real business
  jurisdictions: US (FINRA/SEC guidance); pattern applies generally
  version: 1
