    publisher: FINRA
    year: '2021'
    url: https://www.finra.org/rules-guidance/notices/21-03
    locator: Issuers
    quote: who have a history of regulatory or criminal violations, or are associated with multiple low-priced
      stock issuers;
    quote_verified: true
    checked: '2026-10-09'
  - title: Regulatory Notice 19-18
    publisher: FINRA
    year: '2019'
    url: https://www.finra.org/rules-guidance/notices/19-18
    locator: II. Deposits of Securities
    quote: were issued by a company whose officers or insiders have a history of regulatory or criminal
      violations, or are associated with multiple low-priced stock issuers.
    quote_verified: true
    checked: '2026-10-09'
  - title: Disqualification of Felons and Other "Bad Actors" from Rule 506 Offerings and Related Disclosure
      Requirements (Small Entity Compliance Guide)
    publisher: US Securities and Exchange Commission
    year: '2013'
    url: https://www.sec.gov/resources-small-businesses/small-business-compliance-guides/disqualification-felons-other-bad-actors-rule-506-offerings-related-disclosure-requirements
    locator: Disqualifying Events, 'Criminal convictions'; general look-back sentence in the same section
    quote: The criminal conviction must have occurred within ten years of the proposed sale of securities,
      or five years in the case of the issuer and its predecessors and affiliated issuers.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-10'
  examples:
  - The same transfer agent, auditor and promoter appear across several issuers that were later suspended.
  cases: []
  data_needed:
  - Person
  - Company
  - Directorship (director, organization, role)
  - Employment
  - Representation (agent, client)
  - Sanction / court records
  checkable: lookups
  lookup_sources:
  - FINRA BrokerCheck
  - SEC litigation releases and trading suspensions
  - Court records (PACER)
  - Company registries
  levels:
    faint: An officer, promoter or service provider has a securities-related conviction, injunction or
      regulatory order older than the published look-back periods, or is tied to several other low-priced
      issuers.
    strong: A securities-related regulatory order against a linked person was issued within the last ten
      years, or a court injunction within the last five years.
    textbook: A director, executive officer or promoter has a securities-related criminal conviction within
      ten years of the offering (five years for the issuer itself). This is an SEC Rule 506(d) 'bad actor'
      disqualifying event.
    threshold_source: https://www.sec.gov/resources-small-businesses/small-business-compliance-guides/disqualification-felons-other-bad-actors-rule-506-offerings-related-disclosure-requirements
    threshold_note: 'Countable by the age of misconduct events. The same page also says: ''Many disqualifying
      events include a look-back period (for example, a court injunction that was issued within the last
      five years or a regulatory order that was issued within the last ten years).'' The other half of
      the pattern, the number of low-priced issuers a person is tied to, has no published count (FINRA
      19-18 and 21-03 say only ''multiple'').'
  threshold_verified: true
  cross_hints:
