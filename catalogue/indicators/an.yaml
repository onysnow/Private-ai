key: AN
name: Animal cruelty and welfare abuse
scope: Neglect, hoarding, dogfighting, puppy mills, roadside zoos, abuse of lab and farm animals.
indicators:
- id: AN-001
  name: Fighting-type dogs with multiple scars or torn ears and lips
  definition: Several dogs of fighting breeds on one property show repeated scarring or injuries of the
    kind fighting produces.
  areas:
  - AN
  typology: Organised animal fighting
  status: verified
  sources:
  - title: Dogfighting
    publisher: ASPCA
    url: https://www.aspca.org/animal-cruelty/dogfighting
    locator: How to Spot Signs of Dogfighting
    quote: Pit bull-mix-type dogs with multiple scars, possibly with lips or ears ripped off
    quote_verified: true
    checked: '2026-10-10'
  - title: Georgia Man Guilty of 69 Counts in Dog Fighting Case
    publisher: US Department of Justice
    year: '2025'
    url: https://www.justice.gov/opa/pr/georgia-man-guilty-69-counts-dog-fighting-case
    quote: Many of the dogs had recent injuries and scars consistent with dog fighting.
    quote_verified: true
    checked: '2026-10-10'
  examples:
  - Neighbour photos or rescue intake records showing many scarred pit bull-type dogs at one address
  cases:
  - name: United States v. Dun Bradford
    year: '2025'
    jurisdiction: US federal (Middle District of Georgia)
    what_happened: Found guilty of 67 counts of possessing dogs for use in an animal fighting venture
      plus drug and firearm counts; 67 dogs rescued, many with injuries and scars consistent with dog
      fighting.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/georgia-man-guilty-69-counts-dog-fighting-case
    source_title: Georgia Man Guilty of 69 Counts in Dog Fighting Case
