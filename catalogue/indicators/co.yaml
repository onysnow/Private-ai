- id: CO-019
  name: Wealth out of proportion to lawful income (illicit enrichment)
  definition: A public official's assets grow far beyond what their known lawful income could pay for,
    and they cannot reasonably explain it.
  areas:
  - CO
  - ML
  typology: Illicit enrichment; unexplained wealth
  status: verified
  sources:
  - title: United Nations Convention against Corruption
    publisher: United Nations Office on Drugs and Crime
    year: '2004'
    url: https://www.unodc.org/documents/brussels/UN_Convention_Against_Corruption.pdf
    locator: Article 20, 'Illicit enrichment'
    quote: a significant increase in the assets of a public official that he or she cannot reasonably
      explain in relation to his or her lawful income.
    quote_verified: true
    licence: © United Nations
    checked: '2026-10-08'
  - title: 'Proceeds of Crime Act 2002, section 362B (Unexplained wealth orders: requirements)'
    publisher: UK Parliament (legislation.gov.uk)
    year: 2017 (inserted by Criminal Finances Act 2017)
    url: https://www.legislation.gov.uk/ukpga/2002/29/section/362B
    locator: s. 362B
    quote: the value of the property is greater than £50,000
    quote_verified: true
    licence: Open Government Licence v3.0
    checked: '2026-10-08'
  examples:
  - An official on less than $100,000 a year who amassed over $300 million in assets (DOJ, Obiang).
  - A mayor's family buys several flats in cash during his term.
  cases:
  - name: United States v. assets of Teodoro Nguema Obiang Mangue (civil forfeiture settlement)
    year: '2014'
    jurisdiction: United States
    what_happened: DOJ said Equatorial Guinea's Second Vice President, on an official salary of less than
      $100,000, amassed more than $300 million in assets through corruption and money laundering; under
      a settlement he agreed to sell a $30 million Malibu mansion, a Ferrari and memorabilia, with proceeds
      to benefit the people of Equatorial Guinea.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/second-vice-president-equatorial-guinea-agrees-relinquish-more-30-million-assets-purchased
    source_title: Second Vice President of Equatorial Guinea Agrees to Relinquish More Than $30 Million
      of Assets
  data_needed:
  - Person
  - Occupancy (holder, post, declarationDate)
  - Position
  - Asset
  - RealEstate
  - Ownership
  - Payment
  - Vehicle
  - Airplane
  checkable: lookups
  lookup_sources:
  - Public salary scales and asset declarations
  - Property, vehicle, aircraft and vessel registries
  - Company registries
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'UK: property worth more than £50,000 held by a PEP (or person involved in serious crime)
      where there are reasonable grounds to suspect known lawful income would have been insufficient to
      obtain it (POCA s.362B). Elsewhere: meets UNCAC Art. 20 definition as worded.'
    threshold_source: https://www.legislation.gov.uk/ukpga/2002/29/section/362B
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Corruption proceeds were used to buy US real estate and luxury goods through intermediaries
      and corporate entities.
    source_url: https://www.justice.gov/opa/pr/second-vice-president-equatorial-guinea-agrees-relinquish-more-30-million-assets-purchased
  innocent_explanations:
  - Inheritance, gifts from family, or a spouse's business income.
  - Wealth earned before entering office.
  - Investment gains or lottery winnings, which should be documentable.
  jurisdictions: Global (UNCAC Art. 20 is optional for states; UK UWO thresholds apply in the UK)
  version: 1
