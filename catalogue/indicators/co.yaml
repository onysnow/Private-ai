- id: CO-007
  name: Intermediary is an offshore shell company
  definition: The agent or consultant is a company with no real operations, registered in an offshore
    jurisdiction.
  areas:
  - CO
  - ML
  typology: Concealment of beneficial ownership
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, p. 23, 'Common red flags associated with third parties'
    quote: the third party is merely a shell company incorporated in an offshore jurisdiction; and
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: Advisory on Human Rights Abuses Enabled by Corrupt Senior Foreign Political Figures and their
      Financial Facilitators (FIN-2018-A003)
    publisher: FinCEN, U.S. Department of the Treasury
    year: '2018'
    url: https://www.fincen.gov/sites/default/files/advisory/2018-06-12/PEP%20Facilitator%20Advisory_FINAL%20508.pdf
    locator: p. 4, 'Use of Shell Companies'
    quote: PEP facilitators commonly use shell companies to obfuscate ownership and mask the true source
      of the proceeds of corruption.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - A BVI company with nominee directors invoices for 'consulting' on an African mining licence.
  - Odebrecht's bribe system paid through shell companies and offshore accounts.
  cases:
  - name: Odebrecht S.A. and Braskem S.A. guilty pleas
    year: '2016'
    jurisdiction: United States (with Brazil and Switzerland)
    what_happened: Both companies pleaded guilty to conspiracy to violate the FCPA, with combined penalties
      of at least $3.5 billion; DOJ described a 'Division of Structured Operations', a hidden business
      unit that paid about $788 million in bribes through shell companies, off-book transactions and offshore
      accounts.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/odebrecht-and-braskem-plead-guilty-and-agree-pay-least-35-billion-global-penalties-resolve
    source_title: Odebrecht and Braskem Plead Guilty and Agree to Pay at Least $3.5 Billion in Global
      Penalties
  data_needed:
  - Company (jurisdiction, incorporationDate, address)
  - Ownership
  - Directorship
  - Address
  - Payment
  - BankAccount
  checkable: lookups
  lookup_sources:
  - Offshore company registries
  - ICIJ Offshore Leaks database
  - OpenCorporates
  - Beneficial ownership registers
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Shell companies are the main tool for hiding who owns corruption proceeds once paid.
    source_url: https://www.fincen.gov/sites/default/files/advisory/2018-06-12/PEP%20Facilitator%20Advisory_FINAL%20508.pdf
  innocent_explanations:
  - Holding and treasury companies are often offshore for tax or legal reasons.
  - FinCEN notes shell companies are often formed for legitimate purposes such as holding assets or facilitating
    mergers.
  jurisdictions: Global
  version: 1
