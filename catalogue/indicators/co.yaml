    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Petty cash and cash wages are normal in some sectors and countries.
  - Poor bookkeeping in small subsidiaries rather than concealment.
  jurisdictions: Global
  version: 1
- id: CO-013
  name: Non-existent expenses or false invoices
