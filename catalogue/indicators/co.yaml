  version: 1
- id: CO-009
  name: Lavish gifts, travel or hospitality to officials
  definition: Officials receive expensive gifts, trips, entertainment or cash 'spending money', especially
    from parties with business before them.
  areas:
  - CO
  typology: Bribery in kind
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, 'Gifts, Travel, Entertainment, and Other Things of Value', p. 15
    quote: The larger or more extravagant the gift, however, the more likely it was given with an improper
      purpose.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: p. 25, safeguards list for travel and expenses
    quote: Do not advance funds or pay for reimbursements in cash.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - '''Training trips'' for officials that are mostly sightseeing (the FCPA Guide cites trips costing
    $25,000-$55,000 each).'
  - Gold bars and cash found at a senator's home (Menendez trial evidence as reported).
  cases:
  - name: Leonard Glenn Francis and Glenn Defense Marine Asia guilty pleas (Navy bribery)
    year: '2015'
    jurisdiction: United States
    what_happened: Francis and his company pleaded guilty to bribery, conspiracy to commit bribery and
      conspiracy to defraud the US; DOJ said he gave Navy officials cash, travel, luxury lodging and sexual
      services in exchange for classified and confidential Navy information including ship schedules,
      and inflated billings.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/defense-contractor-and-its-ceo-plead-guilty-corruption-conspiracy-involving-scores-navy
    source_title: Defense Contractor and Its CEO Plead Guilty to Corruption Conspiracy Involving Scores
      of Navy Officials
  - name: United States v. Robert Menendez, Wael Hana and Fred Daibes
    year: '2024'
    jurisdiction: United States
    what_happened: A jury convicted Senator Menendez and two businessmen on all charges in a bribery and
      foreign influence scheme; reported trial evidence included about $150,000 in gold and over $480,000
      in cash found at his home.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/nsd-fara/recent-cases
    source_title: Recent FARA Cases (DOJ National Security Division)
  data_needed:
  - Payment
  - Trip
  - Asset
  - Person
  - Occupancy
  - Position
  - Document
  checkable: records
  lookup_sources:
  - Gift and hospitality registers
  - Officials' financial disclosure filings
  - Expense records
  - Travel and hotel records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The FCPA Guide says items of nominal value such as cab fare, reasonable meals and promotional items
    are unlikely to improperly influence an official.
  - Genuine training or product demonstrations can require travel.
  - Gifts may be culturally customary and properly recorded.
  jurisdictions: Global
  version: 1
