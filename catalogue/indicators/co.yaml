key: CO
name: Corruption and influence
scope: bribery, kickbacks, conflicts of interest, the revolving door, lobbying and undisclosed influence,
  foreign influence, politically exposed persons, state capture, nepotism and cronyism.
indicators:
- id: CO-001
  name: Excessive commission to an agent or consultant
  definition: A company pays a third-party agent or consultant a commission that is far above what the
    work would normally earn, which can leave room to pass part of it on as a bribe.
  areas:
  - CO
  typology: Bribery through intermediaries
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, 'How Are Payments to Third Parties Treated?', p. 23, 'Common red flags associated
      with third parties'
    quote: excessive commissions to third-party agents or consultants;
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: SFO enters into €991m Deferred Prosecution Agreement with Airbus as part of a €3.6bn global
      resolution
    publisher: UK Serious Fraud Office
    year: '2020'
    url: https://sfo-newsroom.prgloo.com/news/sfo-enters-into-991m-deferred-prosecution-agreement-with-airbus-as-part-of-a-3-6bn-global-resolution
    locator: Press release, 31 January 2020
    quote: paid bribes through agents around the world to stack the decks in its favour
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A sales agent receives 15-25% of a government contract value for introductions, when comparable agents
    in the sector receive a few percent.
  - Commission rates that rise with the size of a state contract without any matching increase in work.
  cases:
  - name: Airbus SE Deferred Prosecution Agreement (UK SFO)
    year: '2020'
    jurisdiction: United Kingdom
    what_happened: The SFO said Airbus paid bribes through agents in Sri Lanka, Malaysia, Indonesia, Taiwan
      and Ghana; Airbus agreed a DPA with €991m in UK fines and costs as part of a €3.6bn global resolution.
    outcome: settled
    outcome_verified: true
    source_url: https://sfo-newsroom.prgloo.com/news/sfo-enters-into-991m-deferred-prosecution-agreement-with-airbus-as-part-of-a-3-6bn-global-resolution
    source_title: SFO enters into €991m Deferred Prosecution Agreement with Airbus
  data_needed:
  - Payment (payer, beneficiary, amount, purpose, contract)
  - Contract (parties, amount, title)
  - ContractAward (amount, authority)
  - Representation (agent, client)
  - Company
  - Person
  checkable: records
  lookup_sources:
  - Company's agent and consultancy contracts and ledgers
  - Procurement portals for the underlying government contract
  - Industry benchmarks for commission rates
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Commission-only agents in hard markets sometimes carry real costs (offices, staff, long sales cycles)
    that justify higher rates.
  - Success fees on very long or risky bids can be legitimately high.
  - The commission may cover genuine after-sales service, logistics or local compliance work.
  jurisdictions: Global (FCPA guidance is US; UK SFO case)
  version: 1
- id: CO-002
  name: Unusually large discount to a distributor
  definition: A company sells to a distributor at a discount much larger than normal, which can create
    a cash cushion the distributor uses to pay officials.
  areas:
  - CO
  typology: Bribery through intermediaries
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, p. 23, 'Common red flags associated with third parties'
    quote: unreasonably large discounts to third-party distributors;
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 3, internal controls discussion, p. 40
    quote: The company also used artificial discounts or rebates on sales contracts to generate the money
      to pay the bribes.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - A distributor selling to a state hospital gets a 40% discount while other distributors get 10%.
  - Rebates are paid to a distributor after a government tender is won.
  cases: []
  data_needed:
  - Contract (parties, amount)
  - Payment (payer, beneficiary, amount, purpose)
  - Company
  - ContractAward
  checkable: records
  lookup_sources:
  - Company sales and pricing records
  - Procurement portals (end-buyer price)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Volume discounts for very large orders.
  - Clearing old stock or entering a new market.
  - The distributor carries warehousing, credit or warranty costs.
  jurisdictions: Global (US guidance)
  version: 1
- id: CO-003
  name: Vague or sham consulting agreement
  definition: A consultant or agent is paid under a contract that describes the services only vaguely,
    or that hides payments behind false invoices for work that was not done.
  areas:
  - CO
  typology: Bribery through intermediaries; false accounting
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, p. 23, 'Common red flags associated with third parties'
    quote: third-party “consulting agreements” that include only vaguely described services;
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: Glencore Entered Guilty Pleas to Foreign Bribery and Market Manipulation Schemes
    publisher: U.S. Department of Justice
    year: '2022'
    url: https://www.justice.gov/archives/opa/pr/glencore-entered-guilty-pleas-foreign-bribery-and-market-manipulation-schemes
    locator: Press release, 24 May 2022
    quote: Glencore concealed the bribe payments by entering into sham consulting agreements
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: Ericsson Agrees to Pay More Than $1 Billion to Resolve Foreign Corrupt Practices Act Case
    publisher: U.S. Attorney's Office, Southern District of New York
    year: '2019'
    url: https://www.justice.gov/usao-sdny/pr/ericsson-agrees-pay-more-1-billion-resolve-foreign-corrupt-practices-act-case
    locator: Press release, 6 December 2019
    quote: The agents were often engaged through sham contracts and paid pursuant to false invoices.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - A 'market advisory' contract with no deliverables, paid in lump sums timed to tender decisions.
  - Invoices describing 'services rendered' with no reports, emails or work product behind them.
  cases:
  - name: Glencore International A.G. and Glencore Ltd. FCPA guilty pleas
    year: '2022'
    jurisdiction: United States
    what_happened: Glencore entities pleaded guilty and agreed to pay over $1.1 billion; DOJ said bribes
      were concealed through sham consulting agreements and payments to intermediaries tied to Nigeria,
      Cameroon, Ivory Coast, Equatorial Guinea, the DRC, Venezuela and Brazil.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archives/opa/pr/glencore-entered-guilty-pleas-foreign-bribery-and-market-manipulation-schemes
    source_title: Glencore Entered Guilty Pleas to Foreign Bribery and Market Manipulation Schemes
  - name: Telefonaktiebolaget LM Ericsson FCPA resolution
    year: '2019'
    jurisdiction: United States
    what_happened: Ericsson entered a deferred prosecution agreement and its Egyptian subsidiary pleaded
      guilty; DOJ said agents in Djibouti, China, Vietnam, Indonesia and Kuwait were engaged through sham
      contracts and paid on false invoices. Total penalties about $1.06 billion.
    outcome: settled
    outcome_verified: true
    source_url: https://www.justice.gov/usao-sdny/pr/ericsson-agrees-pay-more-1-billion-resolve-foreign-corrupt-practices-act-case
    source_title: Ericsson Agrees to Pay More Than $1 Billion to Resolve FCPA Case
  data_needed:
  - Contract (title, summary, parties, amount)
  - Payment (payer, beneficiary, amount, purpose, contract)
  - Document
  - Company
  - Person
  checkable: person
  lookup_sources:
  - Company contract files and invoices
  - Company registry (consultant's age, size, line of business)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Some advisory work (relationship management, market intelligence) is hard to describe precisely.
  - Poor contract drafting by small firms.
  - Work product may exist but be held outside the reviewed files.
  jurisdictions: Global
  version: 1
- id: CO-004
  name: Consultant outside its own line of business
  definition: The third party hired for a deal normally works in an unrelated field, so it is unlikely
    to have the skills it is supposedly paid for.
  areas:
  - CO
  typology: Bribery through intermediaries
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, p. 23, 'Common red flags associated with third parties'
    quote: the third-party consultant is in a different line of business than that for which it has been
      engaged;
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - A travel agency or car dealer paid as a 'technical consultant' on a power-plant contract.
  - A newly formed company with a generic name and no staff paid for engineering advice.
  cases: []
  data_needed:
  - Company (sector, classification, incorporationDate)
  - Contract (title, summary)
  - Payment
  - Representation
  checkable: lookups
  lookup_sources:
  - Company registry (registered activity codes, incorporation date)
  - Web and trade directories
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Diversified local conglomerates often hold registrations unrelated to a specific project.
  - Registry activity codes are often out of date.
  - Consultants may subcontract specialist work.
  jurisdictions: Global
  version: 1
- id: CO-005
  name: Third party linked to the deciding official
  definition: The agent, consultant or partner on a deal is a relative, friend or close associate of the
    official who decides the deal.
  areas:
  - CO
  typology: Bribery through intermediaries; conflict of interest
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: Chapter 2, p. 23, 'Common red flags associated with third parties'
    quote: the third party is related to or closely associated with the foreign official;
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - The local partner on a ministry contract is owned by the minister's brother-in-law.
  - A consultant shares an address or directors with a company owned by the procurement chief.
  cases: []
  data_needed:
  - Person
  - Family (person, relative, relationship)
  - Associate
  - Ownership
  - Directorship
  - Occupancy (holder, post)
  - Position
  - Address
  - Contract
  - ContractAward
  checkable: lookups
  lookup_sources:
  - Company registry and beneficial ownership register
  - PEP and relatives databases
  - Asset and interest declarations
  - Civil and marriage records, social media
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: FATF lists use of family members or close associates as legal owners as a PEP red flag for
      hiding ownership of illicit wealth.
    source_url: https://www.fatf-gafi.org/content/dam/fatf-gafi/guidance/Guidance-PEP-Rec12-22.pdf
  innocent_explanations:
  - In small markets, qualified local firms are often connected to political families.
  - Shared surnames or addresses can be coincidental.
  - The relationship may have been disclosed and the official recused.
  jurisdictions: Global
  version: 1
- id: CO-006
  name: Third party added at the official's request
  definition: The official who controls the decision insists that a particular agent, partner or subcontractor
    be brought into the deal.
  areas:
  - CO
  typology: Bribery through intermediaries; solicitation
  status: verified
  sources:
