- id: CO-084
  name: Licence or stake resold for a large profit soon after award, with little work done (flipping)
  definition: A company that won a licence or contract cheaply resells it, or its owners sell their shares,
    for a large profit shortly after the award without having done substantial work on it.
  areas:
  - CO
  - EN
  typology: Licence flipping
  status: verified
  sources:
  - title: Twelve Red Flags
    publisher: NRGI
    year: '2017'
    url: https://resourcegovernance.org/sites/default/files/documents/corruption-risks-in-the-award-of-extractive-sector-licenses-and-contracts.pdf
    locator: p.40, Red flag 12
    quote: In the first, a company that won a license or contract for a relatively low upfront cost resells,
      or "flips" it for a big return without having worked to develop the underlying asset.
    quote_verified: true
    checked: '2026-10-09'
  - title: Twelve Red Flags
    publisher: NRGI
    year: '2017'
    url: https://resourcegovernance.org/sites/default/files/documents/corruption-risks-in-the-award-of-extractive-sector-licenses-and-contracts.pdf
    locator: p.40, Red flag 12
    quote: In the second, the company's shareholders sell their equity for large profits shortly after
      the award, suggesting they acquired the license or contract merely to boost the sales price.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A company pays USD 2 million for an oil block and sells it 13 years later for USD 1.1 billion with
    no development.
  cases:
  - name: BSGR / Beny Steinmetz, Simandou iron ore (Guinea)
    year: '2022'
    jurisdiction: Switzerland (Geneva) / Guinea
    what_happened: BSGR obtained Simandou permits in 2008, reportedly spent USD 165 million, and sold
      51 percent to Vale in 2010 for USD 2.5 billion. A Geneva court convicted Steinmetz in 2021 of bribing
      foreign public officials over the mining rights, and the Geneva appeals court upheld that conviction
      (sentence cut to three years).
    outcome: convicted
    outcome_verified: true
    source_url: https://news.yahoo.com/geneva-appeals-court-upholds-conviction-114801630.html
    source_title: NRGI, Twelve Red Flags, p.40; Yahoo News (AP), Geneva appeals court upholds conviction
      of Israeli tycoon
  - name: OPL 245 resale (Malabu to Shell and Eni)
    year: '2021'
    jurisdiction: Nigeria / Italy
    what_happened: Malabu acquired the block in 1998 for USD 2 million up front and received USD 1.1 billion
      via the Nigerian government in 2011 after doing nothing substantial. The Milan tribunal acquitted
      all defendants in the bribery trial in March 2021.
    outcome: acquitted
    outcome_verified: true
    source_url: https://en.wikipedia.org/wiki/OPL_245_bribery_affair
    source_title: NRGI, Twelve Red Flags, p.40; Wikipedia, OPL 245 bribery affair
  - name: Uranex / Resource Generation, Cameroon
    year: '2016'
    jurisdiction: Cameroon / Australia
    what_happened: A 2016 investigative report found that Uranex shareholders, including a former parliamentarian,
      a ruling-party mayor and a general's son, earned a 37,900 percent one-year return when selling to
      ResGen months after receiving uranium licences, with no evidence of substantial development spending.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://resourcegovernance.org/sites/default/files/documents/corruption-risks-in-the-award-of-extractive-sector-licenses-and-contracts.pdf
    source_title: NRGI, Twelve Red Flags, p.41
  data_needed:
  - License (awards, amount, date)
  - Ownership (startDate, endDate, shareValue)
  - Payment
  - Company
  checkable: lookups
  lookup_sources:
  - Licensing cadastre
  - Stock exchange announcements
  - Company registry
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Resale profits can be the route by which value from a corrupt award is paid out to hidden
      owners through offshore structures.
    source_url: https://resourcegovernance.org/sites/default/files/documents/corruption-risks-in-the-award-of-extractive-sector-licenses-and-contracts.pdf
  - target_area: EN
    reason: Flipping means resources are not developed and public revenue is lost; NRGI cites an estimated
      USD 1.36 billion loss to DRC from five discounted asset sales.
    source_url: https://resourcegovernance.org/sites/default/files/documents/corruption-risks-in-the-award-of-extractive-sector-licenses-and-contracts.pdf
  innocent_explanations:
  - NRGI notes there is nothing inherently suspect about selling assets for profit
  - Junior explorers' business model is to sell after a discovery
  - Commodity prices rose sharply
  jurisdictions: Global
  version: 1
not_reached:
- 'FinCEN Advisory FIN-2018-A003 red-flag list: the bullets sit in an image box on p. 5 and could not
  be extracted as text (the rest of the advisory was read).'
- 'OECD Bribery and Corruption Awareness Handbook for Tax Examiners and Tax Auditors (2013): full PDF
  blocked by robots.txt; OECD iLibrary chapter pages showed only introductions, not the indicator lists.'
- 'OECD Foreign Bribery Report (2014): PDF not reachable (404/403); only secondary summaries found, so
  its statistics (e.g. share of cases using intermediaries) were not used.'
- 'OECD Recommendation on Transparency and Integrity in Lobbying (OECD-LEGAL-0379): legalinstruments.oecd.org
  page needs JavaScript; text not read.'
- 'Transparency International Corruptionary entries for ''state capture'' and ''kickback'': fetch errors;
  other sources used instead.'
- Zondo (State Capture) Commission Parts 2-6 (Transnet, Eskom, Denel etc.) and the Part 1 sections on
  The New Age newspaper were not read; only Part 1 Vol. 1 text was reached.
- 'World Bank ''Warning Signs of Fraud and Corruption in Procurement'' brochure and World Bank INT ''Fraud
  and Corruption Awareness Handbook'': PDFs not located/opened.'
- 'Fazekas & Kocsis full article and appendix (paywalled): only the abstract was read, so their specific
  red-flag list and thresholds are not included.'
- 'SFO and CPS DPA guidance pages: robots/fetch errors; DPA defined from the FCPA Resource Guide instead.'
- 'US DOJ press releases for the Menendez verdict (SDNY) and Manafort plea: fetch errors / not found;
  Menendez outcome taken from DOJ NSD ''Recent FARA Cases'' page; Manafort not included.'
- 'Wolfsberg Group PEP guidance and FATF 2011/2012 corruption typology reports: not reached.'
- 'UK ACOBA business appointment rules (two-year period): about page did not state the period, so no UK
  threshold was used.'
- The gap note says FIN-2022-A001 lists 'golden passports', third-party payments for high-value assets,
  and facilitator transactions shortly before or after sanctions. I read the full advisory text and these
  are NOT in its red-flag list (pp.8-9). It mentions bribes to get passports or visas only as a typology
  on p.4. Those items may come from another FinCEN alert, such as the March 2022 alert on Russian elites'
  real estate and high-value assets, which I did not open.
- FinCEN Advisory FIN-2018-A003 (Human Rights Abuses and Corruption) red flags were not re-examined.
- The primary Independent Inquiry Committee (Volcker) Oil-for-Food final report was not opened. The outcome
  rests on NRGI and NPR.
- Primary court documents for the Statoil, Griffiths, PDVSA (Shiera/Rincón), Rubiandini, Petrobras and
  Sphynx/Kensington cases were not opened. Their outcomes come from NRGI's summaries.
- The Geneva appeal ruling in Steinmetz has no exact date in the source I read. It was in 2022 per the
  Al Jazeera and Fortune headlines from August 2022, which I did not open.
