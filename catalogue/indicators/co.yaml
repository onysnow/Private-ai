- id: CO-015
  name: '''Facilitating payment'' used for a discretionary decision'
  definition: A payment labelled as a small 'grease' or facilitating payment was actually made to influence
    a discretionary decision such as awarding business or ignoring a breach.
  areas:
  - CO
  typology: Facilitation payments
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: p. 25, 'What Are Facilitating or Expediting Payments?'
    quote: Routine government action does not include a decision to award new business or to continue
      business with a particular party.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: p. 26
    quote: Labeling a bribe as a “facilitating payment” in a company’s books and records does not make
      it one.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - Payments to customs officials for reduced duties booked in a 'facilitating payment' account.
  - Paying an inspector to ignore a missing permit.
  cases: []
  data_needed:
  - Payment (purpose, amount)
  - PublicBody
  - Person
  - Document
  checkable: records
  lookup_sources:
  - Company ledgers
  - Customs and permit records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Official, published expedite fees (e.g. fast-track visa fees) are lawful.
  - Payments made under threat to personal safety are generally treated differently from bribes.
  jurisdictions: Global (US exception; many countries, e.g. the UK, allow no such exception)
  version: 1
