    year: '2008'
    jurisdiction: United States (with Germany)
    what_happened: Siemens AG pleaded guilty to FCPA internal controls and books-and-records violations
      and three subsidiaries pleaded guilty; DOJ said payment mechanisms included cash desks and slush
      funds and some bribes ran through purported business consultants. Combined fines, penalties and
      disgorgement exceeded $1.6 billion.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archive/opa/pr/2008/December/08-crm-1105.html
    source_title: Siemens AG and Three Subsidiaries Plead Guilty to FCPA Violations
  data_needed:
