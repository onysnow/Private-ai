- id: CO-011
  name: Charitable donation linked to a deciding official
  definition: A company gives to a charity that an official is connected to, at the official's request,
    or on condition of receiving business.
  areas:
  - CO
  typology: Bribery disguised as charity
  status: verified
  sources:
  - title: A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition
    publisher: U.S. Department of Justice and U.S. Securities and Exchange Commission
    year: '2020'
    url: https://www.justice.gov/criminal-fraud/file/1292051/download
    locator: p. 19, 'Five Questions to Consider When Making Charitable Payments in a Foreign Country'
    quote: Is a foreign official associated with the charity and, if so, can the foreign official make
      decisions regarding your business in that country?
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - A donation to a foundation chaired by a minister's spouse shortly before a licence decision.
  cases: []
  data_needed:
  - Payment (payer, beneficiary, purpose, date)
  - Organization
  - Directorship
  - Family
  - Occupancy
  - Position
  checkable: lookups
  lookup_sources:
  - Charity registers and filings
  - Corporate giving reports
  - PEP databases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Prominent people often sit on charity boards; companies give to well-known local causes.
  - Long-standing giving programmes that pre-date any business decision.
  jurisdictions: Global
  version: 1
- id: CO-012
  name: Off-the-books accounts, slush funds or cash desks
  definition: Money is held or moved outside the official accounts, or large cash is handed out, so payments
    cannot be traced in the books.
  areas:
  - CO
  - ML
  typology: False accounting to conceal bribes
  status: verified
  sources:
  - title: United Nations Convention against Corruption
    publisher: United Nations Office on Drugs and Crime
    year: '2004'
    url: https://www.unodc.org/documents/brussels/UN_Convention_Against_Corruption.pdf
    locator: Article 12(3)(a)-(b)
    quote: (a) The establishment of off-the-books accounts; (b) The making of off-the-books or inadequately
      identified transactions;
    quote_verified: true
    licence: © United Nations
    checked: '2026-10-08'
  - title: Siemens AG and Three Subsidiaries Plead Guilty to Foreign Corrupt Practices Act Violations
    publisher: U.S. Department of Justice
    year: '2008'
    url: https://www.justice.gov/archive/opa/pr/2008/December/08-crm-1105.html
    locator: Press release, 15 December 2008
    quote: included cash desks and slush funds
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-08'
  examples:
  - Ledger accounts used to keep credit balances for officials (FCPA Guide p. 40).
  - Odebrecht's off-book 'Division of Structured Operations'.
  cases:
