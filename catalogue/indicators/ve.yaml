- id: VE-005
  name: Releasing a pre-attack manifesto, martyrdom video or final statement
  definition: The person publishes or sends a last statement, manifesto or martyrdom video that shows
    an attack is about to happen.
  areas:
  - VE
  typology: 'Mobilization stage; type: Intent'
  status: verified
  sources:
  - title: US Violent Extremist Mobilization Indicators, 2021 Edition
    publisher: NCTC, FBI and DHS
    year: '2021'
    url: https://archive.dni.gov/files/NCTC/documents/news_documents/Mobilization_Indicators_Booklet_2021.pdf
    locator: p. 8, Mobilization indicator 3
    quote: Disseminating one's own martyrdom or last will video or statement (for example, a pre-attack
      manifesto or final statement)
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Manifesto uploaded minutes before an attack
  - Manifesto emailed to a public body just before an attack
  cases:
  - name: El Paso Walmart attack (Patrick Crusius)
    year: '2023'
    jurisdiction: US (W.D. Texas, federal)
    what_happened: Pleaded guilty to 90 counts and received 90 consecutive life sentences; he admitted
      he uploaded a manifesto to the internet minutes before the August 2019 attack.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/texas-man-sentenced-90-consecutive-life-sentences-2019-mass-shooting-walmart-el-paso-texas
    source_title: Texas Man Sentenced to 90 Consecutive Life Sentences for 2019 Mass Shooting at Walmart
      in El Paso, Texas
  - name: Christchurch masjidain attack (referred to as 'the individual')
    year: '2020'
    jurisdiction: New Zealand
    what_happened: The Royal Commission found the critical information about the attack was in a 74-page
      manifesto attached to an email sent to the Parliamentary Service just after 1.32pm on 15 March 2019.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://chchroyalinquiry.cwp.govt.nz/the-report/executive-summary-2/executive-summary
    source_title: 'Royal Commission of Inquiry into the terrorist attack on Christchurch masjidain: Executive
      summary'
  - name: Buffalo Tops supermarket attack (Payton Gendron)
    year: '2022'
    jurisdiction: US (New York)
    what_happened: The NY Attorney General's investigative report quotes his manifesto and finds he invited
      users to his Discord diary shortly before 2:00 p.m. on the day of the attack.
    outcome: found_by_official_inquiry
    outcome_verified: true
    source_url: https://ag.ny.gov/sites/default/files/buffaloshooting-onlineplatformsreport.pdf
    source_title: Investigative Report on the role of online platforms in the tragic mass shooting in
      Buffalo on May 14, 2022
