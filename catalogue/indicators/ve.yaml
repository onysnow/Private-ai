key: VE
name: Violent extremism and hate-motivated attacks
scope: 'Violent extremism and hate-motivated attacks (behavioural mobilisation). Non-financial behavioural
  indicators that a person is moving toward ideologically motivated violence: 42 indicators in three groups
  (Mobilization: travel to carry out violent extremist activity; Preparation: surveilling potential attack
  targets; Motivation: expressing willingness to die for a violent extremist ideology), each labelled
  by type such as Intent, Tactics or Travel. Published as ''US Violent Extremist Mobilization Indicators''
  (2021 edition) by NCTC, FBI and DHS.'
indicators:
- id: VE-001
  name: Travel to carry out violent extremist activity
  definition: The person actually travels, at home or abroad, in order to commit or take part in extremist
    violence.
  areas:
  - VE
  typology: 'Mobilization stage; type: Travel'
  status: verified
  sources:
  - title: US Violent Extremist Mobilization Indicators, 2021 Edition
    publisher: National Counterterrorism Center (NCTC), FBI and DHS
    year: '2021'
    url: https://archive.dni.gov/files/NCTC/documents/news_documents/Mobilization_Indicators_Booklet_2021.pdf
    locator: p. 6, Mobilization indicator 1
    quote: Traveling, within the United States or abroad, to carry out or participate in violent extremist
      activity
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Booking travel to a conflict zone held by a designated group, then departing
  cases: []
  data_needed:
  - Person
  - Event (date, location, involved)
  - Passport
  - Address
  - Document (tickets, itineraries)
  checkable: records
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Ordinary travel for family, work, tourism or religious pilgrimage
  - Humanitarian or journalistic travel to conflict areas
  jurisdictions: US (booklet); applicable generally
  version: 1
