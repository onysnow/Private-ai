    threshold_note: 'The figure is a count from the FBI Behavioral Analysis Unit''s study of US lone offenders
      (1972-2015): bystanders noticed ''at least 1 stressor'' in 90% of cases. It describes attackers
      studied after the fact. It is not a screening cut-off, and it applies to US lone-offender terrorism
      only. The same page gives how common each stressor type was: financial 48%, family 44%, mental health
      44%, employment 35%, criminal/legal 29%, partner/marital 27%, physical injury/illness 19%. It gives
      no time window beyond ''prior to the attack''. No average number of stressors per offender was found:
