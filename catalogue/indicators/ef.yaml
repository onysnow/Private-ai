- id: EF-005
  name: Sudden change of power of attorney, trust, will or estate plan
  definition: Control of the older person's money or estate suddenly passes to a different relative or
    a new person, especially where undue influence, coercion, forgery or lack of mental capacity is possible.
  areas:
  - EF
  typology: Abuse of power of attorney; undue influence; estate manipulation
  status: verified
  sources:
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: FinCEN
    year: '2022'
    url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: p. 10
    quote: An older customer’s financial management changes suddenly, such as through a change of power
      of attorney, trust, or estate planning vehicles, to a different family member or a new individual,
      particularly if such changes appear to be done under undue influence, coercion, or forgery or the
      customer has diminished cognitive abilities and is unable to agree to or understand the consequences
      of the new arrangement.
    quote_verified: true
    checked: '2026-10-09'
  - title: Red Flags of Elder Abuse
    publisher: US Department of Justice, Elder Justice Initiative
    year: '2023'
    url: https://www.justice.gov/elderjustice/red-flags-elder-abuse
    locator: Warning signs of financial exploitation
    quote: Abrupt changes in a will or other financial documents
    quote_verified: true
    checked: '2026-10-09'
  - title: FIN-2011-A003
    publisher: FinCEN
    year: '2011'
    url: https://www.fincen.gov/sites/default/files/shared/fin-2011-a003.pdf
    locator: p. 2
    quote: The elderly individual’s financial management changes suddenly, such as through a change of
      power of attorney to a different family member or a new individual;
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Codicils to Brooke Astor's will executed while she had dementia (People v Marshall).
  - An exterminator persuaded an 86-year-old widow to sign over her power of attorney (US v Hampton).
  cases:
  - name: People v Anthony Marshall and Francis Morrissey
    year: '2013'
    jurisdiction: 'New York, Appellate Division, First Department (trial: Supreme Court, New York County,
      2009)'
    what_happened: Brooke Astor's son and an attorney were convicted after codicils to her will were executed
      while she lacked capacity; the appeal largely affirmed the convictions, vacating one second-degree
      grand larceny count against Marshall.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.nycourts.gov/Reporter/3dseries/2013/2013_02032.htm
    source_title: People v Marshall, 2013 NY Slip Op 02032
  - name: United States v. Karl Hampton
    year: '2024'
    jurisdiction: US District Court, Middle District of Tennessee
    what_happened: An exterminator met an 86-year-old widow with dementia, persuaded her to sign over
      power of attorney in April 2019, drained her accounts and took a $500,000 line of credit in her
      name. Sentenced to 60 months and over $1.2 million restitution.
    outcome: convicted
    outcome_verified: true
    source_url: https://justice.gov/usao-mdtn/pr/chattanooga-man-sentenced-60-months-prison-defrauding-elderly-widow-dementia-12
    source_title: Chattanooga Man Sentenced to 60 Months in Prison for Defrauding Elderly Widow with Dementia
  data_needed:
  - Document (power of attorney, will, codicil, trust deed) with date
  - Representation (agent, client, startDate)
  - Succession (heir, predecessor)
  - Person (older adult, new agent) with birthDate
  - Event (diagnosis or capacity assessment date)
  checkable: lookups
  lookup_sources:
  - Probate court records
  - Land and deed registries
  - Medical capacity evidence (by interview or court record)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Legitimate estate planning after a death or family falling-out
  - Previous agent became unable or unwilling to serve
  - Planned succession as health declines
  version: 1
