key: EF
name: Elder financial exploitation
scope: 'Elder financial exploitation. FinCEN Advisory FIN-2022-A002 (15 June 2022). Behavioural red flags:
  caregiver shows excessive interest in the person''s finances, speaks for them or controls the conversation;
  new caretakers, relatives or friends carry out transactions without proper documentation; sudden changes
  to power of attorney, trusts or estate plans under apparent coercion or when the person lacks capacity;
  customer seems distressed, fearful or submissive; customer cannot be reached. Financial red flags: a
  dormant account with a large balance suddenly sees constant withdrawals; closing CDs or accounts regardless
  of penalties; repeated daily-maximum ATM withdrawals; uncharacteristic nonpayment for services; sudden
  non-sufficient-funds activity.'
indicators:
- id: EF-001
  name: Caregiver or companion controls the conversation about money
  definition: A caregiver or other person shows unusual interest in the older person's money, answers
    for them, or will not leave them alone with bank staff.
  areas:
  - EF
  typology: Elder theft by a trusted person
  status: verified
  sources:
  - title: Advisory on Elder Financial Exploitation (FIN-2022-A002)
    publisher: Financial Crimes Enforcement Network (FinCEN), US Treasury
    year: '2022'
    url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    locator: p. 9, Behavioral Red Flags
    quote: A caregiver or other individual shows excessive interest in the older customer’s finances or
      assets, does not allow the older customer to speak for himself or herself, or is reluctant to leave
      the older customer’s side during conversations.
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: Advisory to Financial Institutions on Filing Suspicious Activity Reports Regarding Elder Financial
      Exploitation (FIN-2011-A003)
    publisher: FinCEN
    year: '2011'
    url: https://www.fincen.gov/sites/default/files/shared/fin-2011-a003.pdf
    locator: p. 2, Interactions with customers or caregivers
    quote: A caregiver or other individual shows excessive interest in the elder’s finances or assets,
      does not allow the elder to speak for himself, or is reluctant to leave the elder’s side during
      conversations;
    quote_verified: true
    licence: US government work, public domain
    checked: '2026-10-09'
  - title: Red Flags (guardianship)
    publisher: Nevada Supreme Court / nvcourts.gov
    url: https://nvcourts.gov/__data/assets/pdf_file/0020/12854/red_flags.pdf
    locator: The Guardian
    quote: Excessively controls all access to the respondent and insists on being the sole provider of
      information to friends and family
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - In the Graves case (W.D.N.C.), housekeepers isolated a widow with dementia from friends and family
    before taking control of her affairs.
  cases:
  - name: United States v. Donna Graves (and co-conspirators Gerald Maxwell Harrison, Elizabeth Robin
      Williams)
    year: '2021'
    jurisdiction: US District Court, Western District of North Carolina
    what_happened: Housekeeping business owner and co-conspirators isolated a widow with dementia, fabricated
      a power of attorney, emptied her accounts and moved her between residences. Graves was convicted
      at trial and sentenced to 97 months; Harrison and Williams pleaded guilty.
    outcome: convicted
    outcome_verified: true
    source_url: https://fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
    source_title: FinCEN Advisory FIN-2022-A002, Case Study on Elder Theft, pp. 4-5
  data_needed:
  - Person (older adult; caregiver) with birthDate
  - Employment or Associate linking caregiver to the older adult
  - Representation (caregiver acting as agent)
  - 'Document or Note: bank staff or witness account of the interaction'
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Family member or carer legitimately helping a person with hearing, speech or memory problems
  - Older person asked the companion to speak for them
  - Cultural norms where an adult child handles a parent's affairs
  jurisdictions: United States (FinCEN guidance); pattern is general
  version: 1
