    year: '2025'
    jurisdiction: US federal
    what_happened: DOJ alleged Walgreens filled prescriptions for excessive opioid quantities, early fills
      and the 'trinity' despite red flags; Walgreens agreed to pay $300 million plus up to $50 million
      more; the release says there was no determination of liability.
    outcome: settled
    outcome_verified: true
    source_url: https://www.oig.dol.gov/public/Press%20Releases/Walgreens%20Agrees%20to%20Pay%20Up%20to%20$350M%20for%20Illegally%20Filling%20Unlawful%20Opioid%20Prescriptions%20and%20for.pdf
    source_title: Walgreens Agrees to Pay Up to $350M
  data_needed:
  - Document (prescriptions)
  - Person (patient, prescriber)
  checkable: records
  lookup_sources: []
  levels:
    faint: Opioid prescriptions for acute pain run longer than three days' supply
    strong: Opioid prescriptions for acute pain run longer than seven days' supply
    textbook: 'Meets the published wording: more than seven days for acute pain, which the guideline says
      ''will rarely be needed'', with no documented reason'
    threshold_source: https://www.cdc.gov/mmwr/volumes/65/rr/rr6501e1.htm
    threshold_note: 'The numbers come from CDC''s 2016 opioid prescribing guideline (Recommendation 6,
      acute pain). The same guideline also sets dose levels: reassess at 50 or more MME/day, and avoid
      or carefully justify 90 or more MME/day. The 2022 CDC guideline replaced the 2016 one and dropped
      these fixed day and dose limits, so the numbers are historical, though still widely cited. The cited
      DEA and NABP sources give no number for ''excessive quantity''. US only.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Opioid-tolerant cancer or palliative patients
  - Mail-order 90-day supplies
  - Patient lives far from pharmacy and fills less often
