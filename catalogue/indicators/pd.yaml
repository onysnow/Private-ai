  definition: A pain clinic is owned or financed by people who are not doctors, who push volume.
  areas:
  - PD
  typology: Pill mill business model
  status: verified
  sources:
  - title: Florida Statutes s. 458.3265 Pain-management clinics
    publisher: Florida Legislature
    url: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0458/Sections/0458.3265.html
    locator: s. 458.3265(1)(d) (grounds to deny registration)
    quote: not fully owned by a physician licensed under this chapter or chapter 459
    quote_verified: true
    checked: '2026-10-09'
  - title: Two Pill Mill Owners Convicted
    publisher: US Attorney's Office, Northern District of Georgia
    year: '2014'
    url: https://www.justice.gov/usao-ndga/pr/two-pill-mill-owners-convicted
    locator: press release, 26 March 2014 (owners pushed the doctor to see as many patients as possible)
    quote: month-long jury trial
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Muhammad Faridi, not a physician, owned McAllen Medical Clinic (NDTX).
  cases: []
  data_needed:
  - Company (clinic)
  - Ownership
  - Directorship
  - Person (owners, doctors)
  - Employment
  checkable: lookups
  lookup_sources:
  - Company registry
  - State clinic registration
  - Medical licence lookup
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: In Florida, a registered pain-management clinic not fully owned by licensed physicians (unless
      exempt) is grounds to deny registration; elsewhere meets the published definition as worded
    threshold_source: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0458/Sections/0458.3265.html
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Hospital systems and corporate practice where state law allows
  - Management companies with physician ownership of the clinical entity
  jurisdictions: US; Florida statute
  version: 1
- id: PD-049
  name: Pill-mill proceeds hidden in multiple or third-party accounts
  definition: Clinic profits are spread across many bank accounts, some in other people's names.
  areas:
  - PD
  typology: Proceeds laundering
  status: verified
  sources:
  - title: Two Pill Mill Owners Convicted
    publisher: US Attorney's Office, Northern District of Georgia
    year: '2014'
    url: https://www.justice.gov/usao-ndga/pr/two-pill-mill-owners-convicted
    locator: press release, 26 March 2014 (profits hidden in multiple bank accounts, many in third-party
      names)
    quote: federal drug and money laundering charges
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Atlanta Medical Group profits in third-party accounts.
  cases: []
  data_needed:
  - Person
  - Company
  - Payment
  - Ownership
  - Associate
  - Family
  checkable: lookups
  lookup_sources:
  - Bank records (subpoena)
  - Company registry
  - Property records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Third-party accounts to hide proceeds is a classic laundering typology; owners convicted of
      money laundering.
    source_url: https://www.justice.gov/usao-ndga/pr/two-pill-mill-owners-convicted
  innocent_explanations:
  - Ordinary business with multiple operating accounts
  - Family members legitimately co-owning accounts
  jurisdictions: US
  version: 1
- id: PD-050
  name: Missing, fictitious or faked medical records
  definition: No records are kept for controlled-drug visits, or records are invented or falsified, sometimes
    after an investigation starts.
  areas:
  - PD
  typology: Prescriber / patient fraud
  status: verified
  sources:
  - title: Doctor Receives 30 Years To Life In Prescription Drug Overdose Case
    publisher: US DEA
    year: '2016'
    url: https://www.dea.gov/press-releases/2016/02/05/doctor-receives-30-years-life-prescription-drug-overdose-case
    locator: press release, 5 February 2016
    quote: faked medical records when authorities began investigating
    quote_verified: true
    checked: '2026-10-09'
  - title: Preventing Diversion (DEA-DC-13)
    publisher: US DEA Diversion Control Division
    url: https://www.deadiversion.usdoj.gov/GDP/(DEA-DC-13) Preventing Diversion.pdf
    locator: Possible Signs of Drug-Seeking
    quote: Fictitious records
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Tseng sometimes kept no records of visits or prescriptions.
  cases: []
  data_needed:
  - Document (charts with metadata, audit trails)
  - Person
  checkable: person
  lookup_sources: []
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Poor record-keeping or system migration losses
  - Late but honest chart completion
  jurisdictions: US
  version: 1
