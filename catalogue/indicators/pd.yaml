key: PD
name: Prescription drug diversion
scope: 'Prescription drug diversion and pill mills (pharmaceutical crime). DEA red flags for prescribers:
  cursory or no medical exams; brief visits; multiple drugs in the same class or excessive quantities;
  starting patients on high-dose narcotics; ignoring signs of abuse or toxicology results; coaching patients
  on what to say; non-medical staff choosing the drug; patient overdose deaths. Pharmacy red flags from
  DEA''s Hills Pharmacy decision (81 FR 49816, 2016): many people bringing the same prescriptions in the
  same quantities from the same doctor; high cash prices for controlled substances; patients living far
  from the pharmacy; ''trinity'' combinations (an opioid, a benzodiazepine and a muscle relaxer); doses
  above recognised thresholds; pattern prescribing; several household members on the same drugs.'
indicators:
- id: PD-001
  name: Cursory or no medical examination before controlled-substance prescribing
  definition: The prescriber gives controlled drugs after a superficial exam, or none at all.
  areas:
  - PD
  typology: Prescriber / pill mill
  status: verified
  sources:
  - title: Preventing Diversion (DEA-DC-13)
    publisher: US DEA Diversion Control Division
    url: https://www.deadiversion.usdoj.gov/GDP/(DEA-DC-13) Preventing Diversion.pdf
    locator: 'Potential Diversion: Practitioners - Questions to Consider'
    quote: Does the practitioner conduct cursory medical exams or any medical exam at all?
    quote_verified: true
    licence: US federal government work (public domain)
    checked: '2026-10-09'
  - title: Three Defendants Sentenced in Opioid Pill Mill Case
    publisher: US Attorney's Office, Northern District of Texas
    year: '2017'
    url: https://www.justice.gov/usao-ndtx/pr/three-defendants-sentenced-opioid-pill-mill-case
    locator: press release, 26 May 2017
    quote: without conducting medical exams of patients
    quote_verified: true
    licence: US federal government work (public domain)
    checked: '2026-10-09'
  examples:
  - Dr. Richard Andrews signed oxycodone 30mg prescriptions without examining patients (NDTX, 2017).
  cases:
  - name: United States v. Faridi, Andrews and Kigham (McAllen Medical Clinic)
    year: '2017'
    jurisdiction: US, N.D. Texas
    what_happened: A doctor signed oxycodone prescriptions for recruited fake patients without exams;
      clinic owner, doctor and a pharmacist pleaded guilty (money laundering conspiracy, oxycodone distribution
      conspiracy, misprision of felony).
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/usao-ndtx/pr/three-defendants-sentenced-opioid-pill-mill-case
    source_title: Three Defendants Sentenced in Opioid Pill Mill Case
  data_needed:
  - Person (prescriber, patient)
  - Document (medical chart, visit notes, prescription)
  - Employment (prescriber at clinic Company)
  checkable: person
  lookup_sources:
  - Court records / indictments
  - State medical board disciplinary orders
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Established patient on a stable regimen seen for a routine renewal
  - Exam documented elsewhere (specialist, hospital) and relied on
  - Poor note-taking rather than no exam
  - Telehealth follow-ups allowed under rules in force at the time
  jurisdictions: US (DEA guidance); concept general
  version: 1
