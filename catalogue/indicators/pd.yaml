    publisher: US Department of Justice (reposted by DOL OIG)
    year: '2025'
    url: https://www.oig.dol.gov/public/Press%20Releases/Walgreens%20Agrees%20to%20Pay%20Up%20to%20$350M%20for%20Illegally%20Filling%20Unlawful%20Opioid%20Prescriptions%20and%20for.pdf
    locator: press release, 21 April 2025 (allegations)
    quote: excessive quantities of opioids
    quote_verified: true
    checked: '2026-10-09'
  - title: CDC Guideline for Prescribing Opioids for Chronic Pain — United States, 2016
    publisher: US Centers for Disease Control and Prevention (MMWR Recommendations and Reports)
    year: '2016'
    url: https://www.cdc.gov/mmwr/volumes/65/rr/rr6501e1.htm
    locator: Recommendation 6
    quote: When opioids are used for acute pain, clinicians should prescribe the lowest effective dose
      of immediate-release opioids and should prescribe no greater quantity than needed for the expected
      duration of pain severe enough to require opioids. Three days or less will often be sufficient;
      more than seven days will rarely be needed.
    quote_verified: true
    licence: US government work (public domain)
    checked: '2026-10-10'
  examples:
