  lookup_sources: []
  levels:
    faint: Two opioids are prescribed at once, one long-acting and one short-acting (close to the pattern,
      but not the published wording)
    strong: Two or more short-acting opioids, or two or more long-acting opioids, prescribed at the same
      time
    textbook: 'Meets the published definition as worded: therapeutic duplication of two or more long-acting
      and/or two or more short-acting opiates'
    threshold_source: https://www.ama-assn.org/media/7796/download
    threshold_note: The number comes from the cited NABP consensus document (hosted by the AMA). The DEA
      decision in the Federal Register (81 FR 49816, 2016) quotes a witness saying that prescribing two
      immediate-release opioids at once 'would be inappropriate therapy', which agrees with this. US only.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Long-acting plus short-acting breakthrough dosing is common and accepted
  - Transition between drugs (overlap during switch)
  - Cancer or palliative pain
