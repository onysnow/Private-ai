  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - The earlier reporter may have stopped for personal or funding reasons.
  - Publishing collaboratively and widely can reduce the benefit of silencing any one reporter.
  jurisdictions: Global
  version: 1
