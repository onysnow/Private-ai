key: SA
name: Safety of investigators, sources and witnesses
scope: 'warning signs that the people doing or helping an investigation (journalists, researchers, sources,
  whistleblowers, witnesses) may be in danger because of what is being uncovered. Include: subjects or
  networks linked to killings, disappearances, attacks, threats, imprisonment or suspicious deaths of
  journalists, activists or witnesses who looked into them (use the Committee to Protect Journalists database,
  Reporters Without Borders, UNESCO Observatory of Killed Journalists, IFJ, Forbidden Stories, Mapping
  Media Freedom); kinds of crime and actors that raise the danger (organised crime, cartels, armed groups,
  state security services, trafficking networks, extractive industries; cite the studies that show this);
  legal harassment and SLAPPs (CASE coalition, Council of Europe Safety of Journalists Platform); surveillance
  and spyware (Citizen Lab, Amnesty Security Lab, Pegasus Project); online harassment and doxxing; threats
  to witnesses and sources (UNODC Good practices for the protection of witnesses in criminal proceedings
  involving organized crime). Use safety guides from CPJ, GIJN, Rory Peck Trust, Freedom of the Press
  Foundation, IWMF and OCCRP for what each sign means. These indicators are about danger to the investigator
  or witness, not about wrongdoing by the subject; innocent explanations still apply (a death may be unrelated).
  Cases: documented attacks with sources, outcome stated exactly (convicted, found_by_official_inquiry,
  alleged_in_reporting and so on).'
indicators:
- id: SA-001
  name: Subject or network already linked to the killing of a journalist who reported on them
  definition: A person, company or group at the centre of the investigation has been charged, convicted,
    or credibly reported as connected to the murder of a journalist or media worker who was looking into
    them.
  areas:
  - SA
  status: verified
  sources:
  - title: Data methodology
    publisher: Committee to Protect Journalists
    year: current
    url: https://cpj.org/data-methodology/
    locator: Definition of 'Murder'
    quote: a targeted killing, whether premeditated or spontaneous, in direct reprisal for the journalist’s
      work.
    quote_verified: true
    checked: '2026-10-08'
  - title: Ján Kuciak (database entry)
    publisher: Committee to Protect Journalists
    url: https://cpj.org/data/people/jan-kuciak/
    locator: Case summary
    quote: reported on government corruption and investigated tax fraud
    quote_verified: true
    checked: '2026-10-08'
  - title: Businessman accused of masterminding Caruana Galizia assassination stands trial in Malta
    publisher: ICIJ
    year: '2026'
    url: https://www.icij.org/news/2026/07/businessman-accused-of-masterminding-caruana-galizia-assassination-stands-trial-in-malta/
    locator: On Alfred and George Degiorgio
    quote: are serving 40-year prison sentences
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - The subject's associates were convicted of killing a reporter who wrote about the subject's business
    deals.
  - A company director is named in court as having commissioned surveillance of a journalist who was later
    murdered.
  cases:
  - name: Murder of Daphne Caruana Galizia (Malta)
    year: '2017'
    jurisdiction: Malta
    what_happened: Journalist killed by car bomb while investigating a power-station deal involving businessman
      Yorgen Fenech and Panama Papers follow-ups. Alfred and George Degiorgio are serving 40 years, Vincent
      Muscat 15 years, and Robert Agius and Jamie Vella got life sentences for supplying the bomb. Fenech
      was acquitted by a jury on 2 September 2026.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.icij.org/news/2026/07/businessman-accused-of-masterminding-caruana-galizia-assassination-stands-trial-in-malta/
    source_title: 'ICIJ: Businessman accused of masterminding Caruana Galizia assassination stands trial
      in Malta'
  - name: Yorgen Fenech (alleged commissioner, Caruana Galizia murder)
    year: '2026'
    jurisdiction: Malta
    what_happened: A jury acquitted the businessman accused of commissioning the murder.
    outcome: acquitted
    outcome_verified: true
    source_url: https://forbiddenstories.org/actualites_posts/yorgen-fenech-acquitted-in-maltese-journalist-daphne-caruana-galizia-murder-case/
    source_title: 'Forbidden Stories: Yorgen Fenech acquitted'
  - name: Murder of Ján Kuciak and Martina Kušnírová (Slovakia)
    year: '2018'
    jurisdiction: Slovakia
    what_happened: Kuciak investigated tax fraud, corruption and the 'Ndrangheta in Slovakia. Shooter
      Tomáš Szabó (25 years), Miroslav Marček (25 years) and Zoltán Andruskó (15 years) were convicted.
      Marián Kočner was acquitted twice; the Supreme Court cancelled the acquittal in May 2025 and a retrial
      began in January 2026.
    outcome: convicted
    outcome_verified: true
    source_url: https://cpj.org/data/people/jan-kuciak/
    source_title: 'CPJ: Ján Kuciak'
  - name: Murder of Javier Valdez Cárdenas (Mexico)
    year: '2017'
    jurisdiction: Mexico
    what_happened: Co-founder of Riodoce, which covered organised crime and corruption in Sinaloa, was
      shot at least 12 times in Culiacán. Heriberto Picos Barraza got 14 years 8 months (2020) and Juan
      Francisco Picos Barrueta 32 years (2021).
    outcome: convicted
    outcome_verified: true
    source_url: https://cpj.org/data/people/javier-valdez-cardenas/
    source_title: 'CPJ: Javier Valdez Cárdenas'
  data_needed:
  - Person (the journalist and the subject)
  - Event (the killing, with date and place)
  - CourtCase and CourtCaseParty (charges, verdicts)
  - Associate / UnknownLink (subject to people charged)
  - Article and Mention (what the journalist published about the subject)
  checkable: lookups
  lookup_sources:
  - CPJ database of killed journalists
  - UNESCO Observatory of Killed Journalists
  - RSF Barometer
  - IFJ list of killed journalists
  - Court records in the relevant country
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Murdered journalists in this group were often investigating public-procurement and political
      corruption by the same subjects.
    source_url: https://cpj.org/2016/10/protecting-journalists-who-cover-corruption-is-goo/
  innocent_explanations:
  - The subject was named in reporting but never charged, and may have no connection to the killing.
  - The killing may have been unrelated to the journalist's work (CPJ separates 'confirmed' from 'suspected'
    work-related deaths).
  - An acquittal (for example Yorgen Fenech in 2026, Marián Kočner in 2020 and 2023) means the link was
    not proven in court.
  jurisdictions: Global
  version: 1
- id: SA-002
  name: Cluster of deaths, disappearances or attacks among people who looked into or testified against
    the same subject
  definition: Several journalists, lawyers, witnesses or relatives connected to the same subject or case
    have been killed, gone missing or been attacked, which suggests a pattern of reprisals rather than
    a one-off.
  areas:
  - SA
  status: verified
  sources:
  - title: 'Netherlands: RSF and FPU welcome convictions for the killing of journalist Peter R. de Vries'
    publisher: Reporters Without Borders
    year: '2024'
    url: https://rsf.org/en/netherlands-rsf-and-fpu-welcome-convictions-killing-journalist-peter-r-de-vries
    locator: Background paragraph (as summarised by fetch tool; RSF wording close to this)
    quote: From 2019 onwards, he became a trust person and advisor to crown witness Nabil B. in the turbulent
      "Marengo-trial".
    quote_verified: true
    checked: '2026-10-08'
  - title: Marked for Death
    publisher: Committee to Protect Journalists
    year: '2005'
    url: https://cpj.org/reports/2005/05/murderous-05.php
    locator: Philippines section
    quote: All had reported on government and police corruption, drug dealing, and the activities of crime
      syndicates.
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A cooperating witness's brother, then his lawyer, then his adviser are each killed over three years.
  - Three local reporters who covered the same mayor's links to traffickers are shot within two years.
  cases:
  - name: Killings around crown witness Nabil B. (Marengo trial)
    year: 2018-2021
    jurisdiction: Netherlands
    what_happened: Nabil B.'s brother was murdered in 2018, his lawyer Derk Wiersum in 2019, and his adviser,
      crime reporter Peter R. de Vries, in 2021. Two men got 30 years each for Wiersum's murder (11 October
      2021). For de Vries, two men got 28 years and a middleman 26 years (2024); the court found the alleged
      Marengo motive could not be proven.
    outcome: convicted
    outcome_verified: true
    source_url: https://rsf.org/en/netherlands-rsf-and-fpu-welcome-convictions-killing-journalist-peter-r-de-vries
    source_title: 'RSF: convictions for the killing of Peter R. de Vries'
  - name: Derk Wiersum murder
    year: '2021'
    jurisdiction: Netherlands
    what_happened: Amsterdam District Court jailed Giërmo B. and Moreno B. for 30 years each for killing
      the lawyer of state witness Nabil B.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.euronews.com/2021/10/11/two-men-found-guilty-of-murdering-dutch-lawyer-linked-to-organised-crime-trial
    source_title: 'Euronews: Two men found guilty of murdering Dutch lawyer'
  - name: Gauri Lankesh murder (India)
    year: '2017'
    jurisdiction: India (Karnataka)
    what_happened: A police Special Investigation Team charged 18 people, 16 allegedly part of Sanatan
      Sanstha, and invoked the organised-crime law KCOCA; one accused was also suspected in the murder
      of rationalist Narendra Dabholkar. The trial has not produced a verdict in the sources read.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://thenewsminute.com/article/gauri-lankesh-murder-sit-files-first-additional-chargesheet-names-18-accused-92108
    source_title: 'The News Minute: SIT files chargesheet naming 18 accused'
  data_needed:
  - Person (each victim)
  - Event (each attack, date, place)
  - Associate / Family / Representation (how each victim relates to the case)
  - CourtCase (the case they were connected to)
  - UnknownLink (victim to subject)
  checkable: lookups
  lookup_sources:
  - CPJ database
  - UNESCO Observatory
  - RSF Barometer
  - Court records
  - Local press archives
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: OC
    reason: Reprisal killings of witnesses, lawyers and reporters around one prosecution are a hallmark
      of organised criminal groups.
    source_url: https://rsf.org/en/netherlands-rsf-and-fpu-welcome-convictions-killing-journalist-peter-r-de-vries
  innocent_explanations:
  - In high-violence places, many people die violently for unrelated reasons; clusters can be coincidence.
  - Courts sometimes cannot prove the motive (the de Vries court found the Marengo motive unproven).
  - Deaths may be accidents, illness or suicide that look suspicious only in hindsight.
  jurisdictions: Global
  version: 1
- id: SA-003
  name: Earlier attacks on journalists in the same place or story went unpunished
  definition: Killings or attacks on journalists in the country, region or story have not led to convictions,
    so attackers have little reason to fear consequences.
  areas:
  - SA
  status: verified
  sources:
  - title: Haiti, Israel most likely to let journalists’ murders go unpunished, CPJ 2024 impunity index
      shows
    publisher: Committee to Protect Journalists
    year: '2024'
    url: https://cpj.org/special-reports/haiti-israel-most-likely-to-let-journalists-murders-go-unpunished-cpj-2024-impunity-index-shows/
    locator: Key findings / methodology
    quote: the vast majority – 77% – of journalists' murderers have escaped with full impunity.
    quote_verified: true
    checked: '2026-10-08'
  - title: 85 per cent of journalist killings go unpunished
    publisher: UN Geneva
    year: '2024'
    url: https://www.ungeneva.org/en/news-media/news/2024/11/99850/85-cent-journalist-killings-go-unpunished
    locator: News article on UNESCO report
    quote: around 85 percent of the cases did not make it to court
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - The country is on CPJ's Global Impunity Index.
  - Two earlier murders of reporters covering the same port have no convictions.
  cases: []
  data_needed:
  - Event (prior attacks)
  - CourtCase (status of each)
  - Address / jurisdiction of the investigation
  checkable: lookups
  lookup_sources:
  - CPJ Global Impunity Index
  - UNESCO Director-General report on safety of journalists and the danger of impunity
  - Council of Europe Safety of Journalists Platform (impunity alerts)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Country appears on CPJ's Global Impunity Index, which includes only countries with five
      or more unsolved journalist murders in the ten-year window
    threshold_source: https://cpj.org/special-reports/haiti-israel-most-likely-to-let-journalists-murders-go-unpunished-cpj-2024-impunity-index-shows/
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Weak courts or slow investigations affect all crimes, not only those against journalists.
  - Some cases have partial convictions (CPJ calls this 'partial impunity' and does not count them).
  jurisdictions: Global
  version: 1
