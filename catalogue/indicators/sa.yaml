      men were charged; CPJ reports no convictions as of late 2025.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://cpj.org/data/people/dom-phillips/
    source_title: 'CPJ: Dom Phillips'
  data_needed:
  - Person
