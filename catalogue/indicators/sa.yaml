    publisher: Forbidden Stories
    url: https://forbiddenstories.org/about-us/
    locator: Mission statement
    quote: to continue the investigations of other reporters who have been silenced.
    quote_verified: true
    checked: '2026-10-08'
  - title: About Green Blood
    publisher: Forbidden Stories
    year: '2019'
    url: https://forbiddenstories.org/about-green-blood/
    locator: Project description (citing CPJ)
    quote: at least 13 journalists have been killed after working on environment-related stories
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A team resumes a dead reporter's investigation into a mine's pollution.
  cases:
  - name: Cecilio Pineda (Mexico)
    year: '2017'
    jurisdiction: Mexico
    what_happened: Independent reporter who exposed ties between local officials and drug traffickers
      in Tierra Caliente was murdered in March 2017. Forbidden Stories reported that his number was selected
