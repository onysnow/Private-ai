- id: OC-007
  name: 'Funnel account: cash in one region, withdrawn in another'
  definition: An account receives many cash deposits, often below the reporting threshold, in one place
    and the money is quickly taken out somewhere else.
  areas:
  - ML
  - OC
  typology: Drug proceeds laundering
  status: verified
  sources:
  - title: 'Update on U.S. Currency Restrictions in Mexico: Funnel Accounts and TBML (FIN-2014-A005)'
    publisher: FinCEN (U.S. Treasury)
    year: '2014'
    url: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A005.pdf
    locator: Funnel account definition and red flags
    quote: An individual or business account in one geographic area that receives multiple cash deposits,
      often in amounts below the cash reporting threshold, and from which the funds are withdrawn in a
      different geographic area with little time elapsing between the deposits and withdrawals.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - An account opened near the US southwest border receives cash deposits under $10,000 from unidentified
    people at branches in other states.
  cases:
  - name: TD Bank, N.A. guilty plea
    year: '2024'
    jurisdiction: United States (D.N.J.)
    what_happened: TD Bank pleaded guilty to conspiring to fail to maintain an AML program and agreed
      to pay over $1.8 billion; DOJ said networks moved hundreds of millions including for international
      drug traffickers, one through cash deposits into nominee accounts.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/td-bank-pleads-guilty-bank-secrecy-act-and-money-laundering-conspiracy-violations-18b
    source_title: TD Bank Pleads Guilty to Bank Secrecy Act and Money Laundering Conspiracy Violations
  data_needed:
  - BankAccount
  - Payment
  - Person
  - Company
  - Address
  checkable: records
  lookup_sources:
  - Bank records (records)
  - Suspicious activity reporting (not public)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Multiple cash deposits below the $10,000 reporting threshold in one area, withdrawn quickly
      in another (FinCEN FIN-2014-A005).
    threshold_source: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A005.pdf
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Funnel accounts are a placement and layering method for drug cash.
    source_url: https://www.fincen.gov/sites/default/files/advisory/FIN-2014-A005.pdf
  innocent_explanations:
  - Families and businesses with staff in several regions deposit cash in one place for use in another.
  - Students or workers away from home may be supported by relatives depositing cash.
  jurisdictions: United States / Mexico corridor
  version: 1
