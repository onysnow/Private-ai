key: OC
name: Organised crime and illicit goods
scope: organised crime group structures, drug trafficking, arms trafficking, counterfeit goods, match-fixing
  and sports corruption, front businesses.
indicators:
- id: OC-001
  name: Group meets the legal definition of an organised criminal group
  definition: Three or more people work together over time to commit serious crimes for money or other
    material gain.
  areas:
  - OC
  typology: Organised crime group structure
  status: verified
  sources:
  - title: United Nations Convention against Transnational Organized Crime, Article 2
    publisher: United Nations (text hosted by University of Oslo Faculty of Law library)
    year: '2000'
    url: https://jus.uio.no/english/services/library/treaties/04/4-05/un-transnational-organized.html
    locator: Article 2(a), 2(b), 2(c)
    quote: '"Organized criminal group" shall mean a structured group of three or more persons, existing
      for a period of time and acting in concert with the aim of committing one or more serious crimes
      or offences'
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A cartel leader convicted of running a continuing criminal enterprise covering 26 drug violations
    (Guzmán, 2019).
  cases:
  - name: United States v. Joaquín Guzmán Loera
    year: '2019'
    jurisdiction: United States (E.D.N.Y.)
    what_happened: Jury convicted Guzmán on all 10 counts including a continuing criminal enterprise covering
      26 drug-related violations and a murder conspiracy; sentenced to life plus 30 years and $12.6 billion
      forfeiture.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/joaquin-el-chapo-guzman-sinaloa-cartel-leader-sentenced-life-prison-plus-30-years
    source_title: Joaquin 'El Chapo' Guzman, Sinaloa Cartel Leader, Sentenced to Life in Prison Plus 30
      Years
  - name: United States v. Viktor Bout
    year: '2011'
    jurisdiction: United States (S.D.N.Y.)
    what_happened: Arms dealer convicted on four conspiracy counts, including providing material support
      to a designated foreign terrorist organisation; sentenced to 25 years on 5 April 2012.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/archive/usao/nys/pressreleases/April12/boutviktorsentencing.html
    source_title: Viktor Bout sentencing press release, U.S. Attorney S.D.N.Y.
  data_needed:
  - Person
  - Associate
  - Family
  - UnknownLink
  - Employment
  - Directorship
  - Payment
  - Document (court records, indictments)
  checkable: person
  lookup_sources:
  - Court records and indictments
  - Sanctions lists (OFAC SDN, UN, EU)
  - Police and prosecutor press releases
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Three or more persons, existing for a period of time, acting together to commit offences
      punishable by at least four years' imprisonment, for financial or other material benefit (UNTOC
      Art. 2(a)-(b)).
    threshold_source: https://jus.uio.no/english/services/library/treaties/04/4-05/un-transnational-organized.html
  threshold_verified: true
  cross_hints:
  - target_area: SF
    reason: Arms-trafficking networks may supply designated terrorist organisations; Bout was convicted
      of conspiring to provide material support to one.
    source_url: https://www.justice.gov/archive/usao/nys/pressreleases/April12/boutviktorsentencing.html
  innocent_explanations:
  - Ordinary businesses, families and social groups also have three or more members working together over
    time; the definition only applies when the shared aim is serious crime.
  - People can be linked to a group by family, employment or neighbourhood without taking part in its
    crimes.
  jurisdictions: International (189+ States Parties to UNTOC); national definitions vary.
  version: 1
- id: OC-002
  name: Criminal network uses or owns legal businesses
  definition: A criminal network runs, owns or uses ordinary companies to commit crimes, hide them, or
    launder the money.
  areas:
  - ML
  - OC
  typology: Front businesses / abuse of legal business structures
  status: verified
  sources:
  - title: Council conclusions on mapping the most threatening criminal networks (summarising Europol,
      Decoding the EU's most threatening criminal networks, April 2024)
    publisher: Council of the European Union
    year: '2024'
    url: https://data.consilium.europa.eu/doc/document/ST-11153-2024-INIT/en/pdf
    locator: p. 4, point m
    quote: 86 % of the most threatening criminal networks make use of legal business structures (LBS)
    quote_verified: true
    checked: '2026-10-09'
  - title: Abuse of Legal Business Structures through Criminal Networks (on Europol, Leveraging legitimacy,
      18 Dec 2024)
    publisher: eucrim / Europol
    year: '2024'
    url: https://eucrim.eu/news/abuse-of-legal-business-structures-through-criminal-networks/
    locator: news summary
    quote: high-level infiltration or criminal ownership of legal business structures
    quote_verified: true
    checked: '2026-10-09'
  - title: Intellectual Property Crime Threat Assessment 2022
    publisher: Europol and EUIPO
    year: '2022'
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/Report. Intellectual property
      crime threat assessment 2022_2.pdf
    locator: p. 35
    quote: Legal business structures are an essential component of IP crime.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A cartel leader laundered money through insurance companies, debit cards and shell companies alongside
    bulk cash smuggling.
  cases:
  - name: United States v. Joaquín Guzmán Loera
    year: '2019'
    jurisdiction: United States (E.D.N.Y.)
    what_happened: DOJ states he laundered billions through bulk cash smuggling and other methods including
      insurance companies, debit cards and shell companies.
    outcome: convicted
    outcome_verified: true
    source_url: https://www.justice.gov/opa/pr/joaquin-el-chapo-guzman-sinaloa-cartel-leader-sentenced-life-prison-plus-30-years
    source_title: DOJ press release on sentencing
  data_needed:
  - Company
  - Ownership
  - Directorship
  - Person
  - Payment
  - BankAccount
  - Address
  checkable: lookups
  lookup_sources:
  - Company registries
  - Beneficial ownership registers
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Europol states legal business structures are integral to laundering criminal proceeds.
    source_url: https://eucrim.eu/news/abuse-of-legal-business-structures-through-criminal-networks/
  innocent_explanations:
  - Most people with a criminal record who own businesses run them lawfully.
  - Legitimate firms can be used unknowingly; Europol notes a range from criminal-owned firms to legitimate
    firms that unwittingly facilitate crime.
  jurisdictions: EU findings; pattern seen worldwide
  version: 1
- id: OC-003
  name: Front companies used to move illicit cargo through ports
  definition: Companies are set up so that drugs or other illicit goods travel inside normal commercial
    shipments.
  areas:
  - OC
  typology: Drug trafficking via maritime containers
  status: verified
  sources:
  - title: 'Criminal networks in EU ports: Risks and challenges for law enforcement'
    publisher: Europol and EMPACT (joint report)
    year: '2023'
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
    locator: p. 9
    quote: setting-up of front companies, and sending illicit cargo within the legitimate stream of commerce
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A newly formed importer receiving container loads of low-value goods from a cocaine-source country.
  cases: []
  data_needed:
  - Company
  - Ownership
  - Directorship
  - Address
  - Vessel
  - Document (bills of lading, customs declarations)
  checkable: lookups
  lookup_sources:
  - Company registry
  - Customs and trade data (bills of lading)
  - Ship tracking
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - New import businesses are created all the time and may have thin histories.
  - Small importers often use freight forwarders and have few staff or assets.
  jurisdictions: EU ports; general
  version: 1
- id: OC-004
  name: Corrupted insiders in ports, logistics or customs
  definition: Port, logistics or customs staff are bribed to let illicit shipments through or help retrieve
    them.
  areas:
  - CO
  - OC
  typology: Drug trafficking via maritime containers
  status: verified
  sources:
  - title: 'Criminal networks in EU ports: Risks and challenges for law enforcement'
    publisher: Europol and EMPACT
    year: '2023'
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
    locator: p. 13; p. 19
    quote: The insiders include corrupted port personnel but also extraction teams brought into the port
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A terminal worker with unexplained income who repeatedly accesses records of containers they do not
    handle.
  cases: []
  data_needed:
  - Person
  - Employment
  - Payment
  - BankAccount
  - Associate
  - Company
  checkable: person
  lookup_sources:
  - Court records
  - Employment records (person)
  - Asset and property records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Europol describes criminal networks infiltrating ports by corrupting port, logistics and customs
      personnel.
    source_url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
  innocent_explanations:
  - Port workers legitimately access many shipment records as part of their jobs.
  - Extra income can come from overtime, second jobs or family.
  jurisdictions: EU ports; general
  version: 1
- id: OC-005
  name: Container release codes misused or containers going missing
  definition: Release codes for containers are leaked or misused so criminals can collect a container
    while pretending to be the real client.
  areas:
  - OC
  typology: Drug trafficking via maritime containers (PIN code fraud)
  status: verified
  sources:
  - title: 'Criminal networks in EU ports: Risks and challenges for law enforcement'
    publisher: Europol and EMPACT
    year: '2023'
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
    locator: p. 6; p. 15; p. 17
    quote: the criminals retrieve the drugs container from the port terminal pretending to be the legitimate
      client
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A container reported as collected by a haulier the consignee never hired; containers delivered to
    wrong addresses or found in unexpected places (p. 15).
  cases: []
  data_needed:
  - Company
  - Vessel
  - Address
  - Person
  - Employment
  - Document (terminal release logs, delivery records)
  checkable: records
  lookup_sources:
  - Terminal operator records
  - Ship tracking
  - Court records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CY
    reason: Europol notes codes may also be obtained through hacking or phishing.
    source_url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
  innocent_explanations:
  - Containers are sometimes misrouted or delivered to wrong addresses through clerical error.
  - Codes are shared among many legitimate staff and hauliers for operational reasons.
  jurisdictions: EU ports; general
  version: 1
- id: OC-006
  name: Shipments routed through low-inspection channels with corrupted contacts
  definition: Criminals pick shipments and logistics firms that are unlikely to be inspected and where
    they have bribed contacts.
