  - Company registry (Mexico/US)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Cash over $10,000 moved across the US border must be reported on FinCEN Form 105 (CMIR);
      unexplained or unreported movements meet the alert's pattern.
    threshold_source: https://www.fincen.gov/system/files/shared/BCS-Alert-FINAL-508C.pdf
  threshold_verified: true
  cross_hints:
