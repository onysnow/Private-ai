- 'FATF, Money Laundering through the Football Sector (2009): fatf-gafi.org blocks automated fetching
  (robots disallowed), so its football and betting indicators are not included.'
- 'Europol, Decoding the EU''s most threatening criminal networks (2024) and Leveraging legitimacy (Dec
  2024): the Europol pages need JavaScript or returned errors. Used the Council of the EU summary and
  the eucrim summary instead.'
- 'Europol, The involvement of organised crime groups in sports corruption (2020): page needs JavaScript.
  Used the eucrim summary only.'
- 'UNODC Global Report on Corruption in Sport (2021): the site and the mirrored PDF did not return content.'
- 'UNTOC text on unodc.org and ohchr.org: fetch errors. Used the University of Oslo hosted text.'
- 'FinCEN FIN-2019-A006 fentanyl advisory: the MSB, structuring/funnel and shell-company red flags are
  in graphics that did not extract. Only the darknet red flags are quoted.'
- FINTRAC operational alert indicators are quoted from the start of each indicator only, because the fetch
  tool cut text at 125 characters. Full wording is on the source page.
- 'Arms trafficking financial red flags: no FATF, FinCEN or FINTRAC financial-indicator list for firearms
  trafficking was found or reached. The arms indicators come only from INTERPOL''s trace-based list and
  the ATF/DOJ time-to-crime figures.'
- 'ATF NFCTA Volumes II and III full reports: not opened. Only the DOJ press release was used.'
- 'OECD/EUIPO counterfeit trade reports (Mapping global trade in fakes): not reached.'
- 'Primary court documents for the Šapina (Bochum), Belgian club and Southern Stars cases: not reached.
  Outcomes are as stated in the UNODC Resource Guide (2016).'
- 'ESAAMLG, Smuggling of Cigarettes and Associated Money Laundering: the URL could not be found because
  the shared web-search budget for this run ran out. Tobacco indicators rely only on FATF Illicit Tobacco
  Trade (2012). The FATF 2012 report has no formal indicator annex; items OC-063 to OC-067 come from its
  methods paragraphs (24-25, 30, 35, 41, 86-87, 106).'
- 'FATF Illicit Tobacco Trade: the counterfeit-factory link and named defendants could not be confirmed.
  Box 12 (Hezbollah) does not name the subject, so no name was added from outside sources.'
- FATF Organised Maritime Piracy (2011) has no formal red-flag list. FATF says only that it 'could consider
  developing guidance and red flags' (para. 48). OC-068 to OC-072 come from its case studies and narrative.
- 'FATF Fentanyl (2022): the first part of the Customer Indicators list (pp. 36-37) was cut off at one
  indicator. Most of those items overlap with existing OC-012 to OC-018 and were not duplicated.'
- FATF Risks of Gaming and Gambling (2026) includes no named case studies with court or regulator outcomes,
  so gambling indicators OC-051 to OC-062 have no cases attached.
- 'Gambling enforcement cases (e.g. AUSTRAC v Crown Resorts): the AUSTRAC page blocked fetching (robots),
  and the search budget ran out, so these were not added.'
- 'County lines and cuckooing court cases (e.g. UK Modern Slavery Act convictions): not reached because
  the search budget ran out. OC-091 to OC-096 have no cases.'
- 'Somali pirate negotiator prosecution (US DOJ press release): the fetch failed, so it was not added.'
- FATF gambling, tobacco, piracy and fentanyl PDFs could not be downloaded directly with curl (bot challenge).
  They were read through WebFetch, which returned some quotes shortened with '...'. The quotes are copied
  as returned.
- Web search budget ran out partway through research (limit shared across agents). Several planned primary
  sources were not searched or opened.
- 'Stimson/UNIDIR 2020 ATT diversion report: the landing page had no indicators and no PDF link; the full
  report was not reached.'
- 'UNODC Global Study on Firearms Trafficking 2020 PDF: fetch failed.'
- 'ATF data on machinegun conversion devices (Glock switches): not reached. NFCTA Vol II Part III has
  no MCD findings; OC-104 relies on the PMF machine-gun share and an EU-SOCTA case.'
- 'Supreme Court Bondi v. VanDerStok (ghost-gun rule) opinion: fetch failed, so it is not cited.'
- 'EU-SOCTA 2025 firearms section (p. 61: alarm/flobert conversions, reactivated weapons): not in the
  extracted text.'
- 'Europol ''Stop criminal networks recruiting youngsters'' page: only the meta description loaded, which
  gives three signs. The ''They''ve got new...'' item and the rest are missing.'
- 'FBI insider threat / trade secret theft indicators page: fetch failed. Trade-secret theft has no indicators,
  and the IPCTA 2022 does not cover it.'
- 'DOJ Trade Fraud Task Force page: fetch failed. No transshipment court cases were sourced.'
- 'IMB Piracy Reporting Centre definitions page: fetch failed.'
- The CBP CTPAT transshipment alert itself was not opened; only the Thomson Reuters summary was used.
- 'Drug-lab site signs (e.g. DEA clandestine lab indicators): not sourced.'
- No sourced court cases for straw purchasing, piracy attacks, excise fraud or transshipment.
