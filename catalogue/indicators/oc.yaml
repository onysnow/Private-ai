  cases: []
  data_needed:
  - BankAccount
  - Payment
  - Person
  checkable: records
  lookup_sources:
  - Bank records
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Multiple cash transactions under $10,000, or altering/cancelling a transaction when told
      a CTR would be filed (FinCEN FIN-2024-A002, red flag 12).
    threshold_source: https://fincen.gov/sites/default/files/advisory/2024-06-20/FinCEN-Supplemental-Advisory-on-Fentanyl-508C.pdf
  threshold_verified: true
  cross_hints:
  - target_area: ML
    reason: Structuring is itself a reporting offence and a placement technique.
    source_url: https://fincen.gov/sites/default/files/advisory/2024-06-20/FinCEN-Supplemental-Advisory-on-Fentanyl-508C.pdf
  innocent_explanations:
  - Cash businesses bank daily takings that naturally fall below the limit.
