  jurisdictions: US ($10,000 CTR); Canada (C$10,000 large cash reporting)
  version: 1
- id: OC-009
  name: Bulk cash moved by armoured car and rapidly sent abroad
  definition: Large amounts of cash are delivered to a bank or money transmitter, often by armoured car,
