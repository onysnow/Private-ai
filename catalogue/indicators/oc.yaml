    publisher: FinCEN
    year: '2025'
    url: https://www.fincen.gov/system/files/shared/BCS-Alert-FINAL-508C.pdf
    locator: Red flags for depository institutions, 1-2
    quote: Large volumes of cash are transported by an ACS or passenger vehicles to an U.S.-based MSB
    quote_verified: true
    checked: '2026-10-08'
  - title: 'Operational Alert: Laundering the proceeds of illicit synthetic opioids'
    publisher: FINTRAC
    year: '2025'
    url: https://fintrac-canafe.canada.ca/intel/operation/iso-osi-eng
    locator: General money laundering indicators
    quote: Client makes use of armored car services that are not in line with expectations.
    quote_verified: true
    checked: '2026-10-08'
