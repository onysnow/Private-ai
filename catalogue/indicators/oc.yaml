    year: '2023'
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/Europol_Joint-report_Criminal
      networks in EU ports_Public_version.pdf
    locator: p. 10
    quote: less likely to be inspected
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - Repeated use of the same small forwarder for perishable goods from a source country.
  cases: []
