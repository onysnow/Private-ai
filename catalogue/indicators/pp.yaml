- id: PP-006
  name: Repeated single-source awards to the same supplier
  definition: One supplier receives several non-competitive contracts from the same buyer within a short
    time.
  areas:
  - PP
  typology: Unjustified sole source award / favouritism
  status: verified
  sources:
  - title: Red flags for integrity
    publisher: Open Contracting Partnership
    year: '2016'
    url: https://www.open-contracting.org/wp-content/uploads/2016/11/OCP2016-Red-flags-for-integrityshared-1.pdf
    locator: Table 1, p. 27 (Contract phase)
    quote: Supplier receives multiple single-source/noncompetitive contracts from a single procuring entity
      during a defined time period
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Red flags in public procurement: A guide to using data to detect and mitigate risks'
    publisher: Open Contracting Partnership
    year: '2024'
    url: https://www.open-contracting.org/wp-content/uploads/2024/12/OCP2024-RedFlagProcurement-1.pdf
    locator: R055 'Multiple direct awards above or just below competitive threshold', Methodology, PDF
      page 78 (R049 'Direct awards below threshold' is on PDF page 72 and uses the same 'more than 1 direct
      award' wording)
    quote: For each supplier k that has won more than 1 direct award from procuring entity j in period
      t, calculate the sum of all the direct awards.
    quote_verified: true
    licence: CC BY-NC-SA 4.0
    checked: '2026-10-10'
  examples:
  - A consultancy gets eight direct awards from one ministry in a year.
  cases: []
  data_needed:
  - ContractAward
  - Contract (procedure type)
  - Company
  - PublicBody
  checkable: records
  lookup_sources:
  - Procurement portal
  levels:
    faint: The supplier has won more than 1 direct (non-competitive) award from the same buyer in the
      period.
    strong: More than 1 direct award from the same buyer in the period, clustered just below the competitive
      threshold (OCP R049).
    textbook: More than 1 direct award from the same buyer in the period, and their combined value is
      above the competitive threshold (OCP R055, also in Cardinal).
    threshold_source: https://www.open-contracting.org/wp-content/uploads/2024/12/OCP2024-RedFlagProcurement-1.pdf
    threshold_note: OCP leaves the length of 'period t' and the competitive threshold to local rules,
      so they come from the jurisdiction's procurement law. The cited 2016 OCP guide states this flag
      only as 'during a defined time period', with no number.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Supplier holds exclusive licence or maintenance rights
  - Framework or follow-on work legitimately tied to one firm
  jurisdictions: Global
  version: 2
- id: PP-007
  name: Split purchases / awards just under thresholds
  definition: A purchase is divided into smaller contracts so each stays below the value that would require
    open competition or higher approval.
  areas:
  - PP
  typology: Split purchases
  status: verified
  sources:
  - title: Red Flags Listed by Project Cycle
    publisher: IACRC
    url: https://guide.iacrc.org/detection/red-flags-of-corruption-bid-rigging-and-other-schemes/red-flags-listed-by-project-cycle/
    locator: Contract awards stage
    quote: Contract Awards Just Under Procurement Thresholds
    quote_verified: true
    checked: '2026-10-09'
  - title: Red Flags Listed by Project Cycle
    publisher: IACRC
    url: https://guide.iacrc.org/detection/red-flags-of-corruption-bid-rigging-and-other-schemes/red-flags-listed-by-project-cycle/
    locator: Procurement planning stage
    quote: Manipulation of Procurement Thresholds
    quote_verified: true
    checked: '2026-10-09'
  - title: Fraud in Public Procurement – A collection of Red Flags and Best Practices
    publisher: European Commission (OLAF)
    year: '2017'
    url: https://sfc.ec.europa.eu/system/files/documents/sfc-files/fraud-public-procurement-final-20122017-ares20176254403.pdf
    locator: p. 21
    quote: Splitting items that are usually purchased together to keep the contract value below threshold;
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Red flags in public procurement: A guide to using data to detect and mitigate risks'
    publisher: Open Contracting Partnership
    year: '2024'
    url: https://www.open-contracting.org/wp-content/uploads/2024/12/OCP2024-RedFlagProcurement-1.pdf
    locator: R011 'Splitting purchases to avoid procurement thresholds', Methodology, PDF page 34
    quote: Two or more contracting procedures procuring the same item category are advertised in a short
      time period (e.g. three months) and fall just below the competitive threshold value. The time period
      and the distance to the threshold value (e.g. 1%, 2%) can be defined based on the context.
    quote_verified: true
    licence: CC BY-NC-SA 4.0
    checked: '2026-10-10'
  examples:
  - Five IT purchases from one vendor on the same week, each just below the direct-award limit.
  cases: []
  data_needed:
  - ContractAward (amount, date)
  - Company
  - PublicBody
  - Contract (subject)
  checkable: records
  lookup_sources:
  - Procurement portal
  - Published procurement thresholds
  levels:
    faint: A single award priced within 2% below the competitive threshold.
    strong: Two or more same-category purchases by one buyer, each within 2% below the competitive threshold,
      spread over more than three months.
    textbook: Two or more same-category purchases by one buyer within three months, each falling 1% to
      2% below the competitive threshold.
    threshold_source: https://www.open-contracting.org/wp-content/uploads/2024/12/OCP2024-RedFlagProcurement-1.pdf
    threshold_note: OCP gives three months and 1% or 2% as examples ('e.g.') to be set for each context,
      not fixed rules. The threshold value itself comes from local procurement law. The cited IACRC and
      OLAF sources describe splitting but give no number.
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: OLAF also flags work split between related operators to stay below thresholds, which points
      to hidden links between suppliers and officials.
    source_url: https://sfc.ec.europa.eu/system/files/documents/sfc-files/fraud-public-procurement-final-20122017-ares20176254403.pdf
  innocent_explanations:
  - Separate genuine needs arising at different times
  - Budget released in tranches
  - Different departments buying independently
  jurisdictions: Global
  version: 2
