    url: https://guide.iacrc.org/detection/red-flags-of-corruption-bid-rigging-and-other-schemes/red-flags-listed-by-project-cycle/
    locator: Prequalification and short listing
    quote: Unreasonable Prequalification Requirements
    quote_verified: true
    checked: '2026-10-09'
  examples:
