    publisher: Transparency International EU / Integrity Watch
    url: https://redflags-cz.integritywatch.eu/about.php
    locator: 'Contract notices: Too few evaluation criteria'
    quote: if the constituent factors are not defined in the notice, if no more than two are defined
    quote_verified: true
    checked: '2026-10-09'
  - title: Corruption risk measurement presentation
    publisher: Corruption Research Center Budapest
    year: '2015'
    url: https://www.crcb.eu/wp-content/uploads/2015/06/Fazekas_Czibik_Zagreb_TI_intpact_150609.pdf
    locator: Slide 6
    quote: Weight of non-price evaluation criteria
    quote_verified: true
    checked: '2026-10-09'
  - title: Red Flags Listed by Project Cycle
