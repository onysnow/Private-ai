  cases: []
  data_needed:
  - Document (tender notice, evaluation report)
  - Contract
  checkable: person
  lookup_sources:
  - Procurement portal documents
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Two or fewer award-criteria factors defined (Integrity Watch Red Flags)
    threshold_source: https://redflags-cz.integritywatch.eu/about.php
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
