- 'OECD Guidelines for Fighting Bid Rigging in Public Procurement (2009 and 2025 update) full text: oecd.org
  PDF blocked by robots; 2025 component page returned navigation only. Used DOJ Antitrust Division guide
  and an OECD presentation (slide 15) instead.'
- 'Fazekas & Kocsis, ''Uncovering High-Level Corruption'' (British Journal of Political Science, 2020):
  Cambridge page returned a server error; used QoG dataset description and Fazekas & Czibik 2015 presentation.'
- 'Open Contracting Partnership ''Red Flags in Public Procurement'' (2024, open-contracting.org/redflags)
  superseding guide: not opened; used the 2016 guide and Cardinal docs.'
- 'Individual Cardinal indicator pages (thresholds and settings for R003, R024, R025, R038, R048, R058):
  not opened.'
- 'FATF 2014 ''Risk of Terrorist Abuse in Non-Profit Organisations'' Chapter 6 indicator lists: fatf-gafi.org
  blocked by robots; the mirrored copy''s extracted text did not include Chapter 6. Used AUSTRAC NPO indicators
  instead.'
- 'FATF Recommendation 8 Interpretive Note and 2023 Best Practices paper: not opened directly.'
- 'Klimek et al. PNAS 2012 article page: fetch failed; used the arXiv version.'
- 'Erlam v Rahman [2015] EWHC 1215 (QB) full judgment conclusion: page text truncated before findings;
  used the 2017 High Court judgment''s summary.'
- 'BBC report on Tower Hamlets: site blocked.'
- 'FEC ''contributions in the name of another'' help page: fetch error; used the FEC update page.'
- 'North Carolina State Board of Elections order (primary source) on the 9th District: not opened; relied
  on NBC News reporting.'
- 'European Commission / OLAF case material on specific EU procurement cases (e.g. Hungary): not researched.'
- Integrity Watch Red Flags page lists 20 indicators but only 17 were visible.
- COCOF 09/0003/00, European Commission 'Information Note on Fraud Indicators for ERDF, ESF and CF' (2009).
  This is probably where the scheme list in the gap comes from (corrupt payments, mixing of contracts,
  defective pricing, product substitution). The known EC URL https://ec.europa.eu/regional_policy/sources/docoffic/cocof/2009/cocof_09_0003_00_en.pdf
  returned HTTP 500, and the web-search budget for this run was already used up, so no other copy could
  be found. I added nothing for 'mixing of contracts' (charging costs to the wrong contract) or 'defective
  pricing' (false cost or pricing data), because the 2017 OLAF document I opened does not cover them under
  those names.
- 'Carter Center DRC statement: the direct download (curl) redirected to a 404. The WebFetch tool could
  read the page, but its summariser caps quotes at about 125 characters, so the three quotes used may
  be shortened sentences rather than full ones. Please re-check them against the live page. The page shows
  no publication date; the URL suggests 10 Dec 2011 and the text says the results were announced on 9
