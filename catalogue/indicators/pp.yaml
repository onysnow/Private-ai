key: PP
name: Public procurement, non-profits and elections
scope: public procurement fraud and bid rigging (Open Contracting Partnership red flags and Cardinal,
  Integrity Watch Red Flags, European Commission, OECD bid-rigging guidelines, Fazekas corruption risk
  indicators), abuse of charities and non-profits (FATF Recommendation 8 typologies), election irregularities
  and election forensics, campaign finance violations.
indicators:
- id: PP-001
  name: Single bid received
  definition: Only one company submitted a bid for a contract that was supposed to be competitive.
  areas:
  - PP
  typology: Restricted competition / favoured bidder
  status: verified
  sources:
  - title: Cardinal red flags list
    publisher: Open Contracting Partnership
    url: https://cardinal.readthedocs.io/en/latest/cli/indicators/index.html
    locator: Red flags table, R018
    quote: Only one tenderer submitted a bid.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Red flags for integrity: Giving the green light to open data solutions'
    publisher: Open Contracting Partnership
    year: '2016'
    url: https://www.open-contracting.org/wp-content/uploads/2016/11/OCP2016-Red-flags-for-integrityshared-1.pdf
    locator: Table 1, p. 27 (Tender phase)
    quote: Single bid received
    quote_verified: true
    checked: '2026-10-09'
  - title: Corruption Risks Indicators (CRI) dataset
    publisher: Quality of Government Institute, University of Gothenburg (Fazekas et al.)
    url: https://datafinder.qog.gu.se/dataset/cri
    locator: Single bidding variable
    quote: Share of contracts with only one bid in total.
    quote_verified: true
    checked: '2026-10-09'
  - title: Corruption risk measurement presentation (Zagreb)
    publisher: Corruption Research Center Budapest (Fazekas & Czibik)
    year: '2015'
    url: https://www.crcb.eu/wp-content/uploads/2015/06/Fazekas_Czibik_Zagreb_TI_intpact_150609.pdf
    locator: Slide 6
    quote: Single bid submitted
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A road-maintenance tender in an open procedure attracts exactly one bid, from a firm that has won
    the same buyer's previous three tenders.
  cases: []
  data_needed:
  - ContractAward (amount, date)
  - Contract (authority, procedure, number of bids)
  - Company (winner)
  - PublicBody (buyer)
  checkable: records
  lookup_sources:
  - Procurement portal / OCDS feed
  - TED (EU Tenders Electronic Daily)
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: exactly one bid received in a competitive procedure'
    threshold_source: none
  threshold_verified: true
  cross_hints:
  - target_area: CO
    reason: Fazekas defines procurement corruption as steering a contract to a favoured bidder; single
      bidding is the core proxy for this.
    source_url: https://www.crcb.eu/wp-content/uploads/2015/06/Fazekas_Czibik_Zagreb_TI_intpact_150609.pdf
  innocent_explanations:
  - Highly specialised goods with only one capable supplier
  - Small or remote markets with few firms
  - Low contract value making bidding unattractive
  - Very tight but legitimate emergency timelines
  jurisdictions: Global (EU, OCDS publishers)
  version: 1
- id: PP-002
  name: Fewer bidders than expected
  definition: Fewer companies bid than usually bid for similar contracts, or fewer than a set minimum.
  areas:
  - PP
  typology: Bid suppression / restricted competition
  status: verified
  sources:
  - title: Integrity Watch Red Flags – About
    publisher: Transparency International EU / Integrity Watch
    url: https://redflags-cz.integritywatch.eu/about.php
    locator: 'Contract award notices: Number of tenderers received low'
    quote: this indicator signals less than three tenders received in a procedure (or a part thereof)
      as a risk
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Price Fixing, Bid Rigging, and Market Allocation Schemes: What They Are and What to Look For'
    publisher: U.S. Department of Justice, Antitrust Division
    url: https://www.justice.gov/atr/price-fixing-bid-rigging-and-market-allocation-schemes
    locator: 'Warning signs: bid patterns'
    quote: Fewer than the normal number of competitors submit bids.
    quote_verified: true
    checked: '2026-10-09'
  - title: Red flags for integrity
    publisher: Open Contracting Partnership
    year: '2016'
    url: https://www.open-contracting.org/wp-content/uploads/2016/11/OCP2016-Red-flags-for-integrityshared-1.pdf
    locator: Table 1, p. 27
    quote: Fewer than the expected or normal number of bidders, based on prior similar contracts, submit
      bids
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A cleaning contract that drew six bids each year for five years drew only two this year.
  cases: []
  data_needed:
  - Contract (number of tenderers)
  - ContractAward
  - PublicBody
  checkable: records
  lookup_sources:
  - Procurement portal history for the same buyer and category
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Fewer than three tenders received (Integrity Watch Red Flags threshold)
    threshold_source: https://redflags-cz.integritywatch.eu/about.php
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Market consolidation after mergers
  - Firms busy with other work
  - Changed requirements that fewer firms can meet
  - Economic downturn
  jurisdictions: EU, US, global
  version: 1
