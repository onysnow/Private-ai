- id: PP-004
  name: Tender not advertised or no prior publication
  definition: The buyer awarded the contract without publicly advertising it, so other firms could not
    compete.
  areas:
  - PP
  typology: Unjustified sole source award
  status: verified
  sources:
  - title: Red flags for integrity
    publisher: Open Contracting Partnership
    year: '2016'
    url: https://www.open-contracting.org/wp-content/uploads/2016/11/OCP2016-Red-flags-for-integrityshared-1.pdf
    locator: Table 1, p. 26
    quote: Failure to adequately advertise the request for bids or proposals
    quote_verified: true
    checked: '2026-10-09'
  - title: Integrity Watch Red Flags – About
    publisher: Transparency International EU / Integrity Watch
    url: https://redflags-cz.integritywatch.eu/about.php
    locator: 'Contract award notices: Procedure successful without prior publication'
    quote: signals a risk if the contracting authority opts for a procedure without prior publication
    quote_verified: true
    checked: '2026-10-09'
  - title: Corruption Risks Indicators (CRI) dataset
    publisher: Quality of Government Institute
    url: https://datafinder.qog.gu.se/dataset/cri
    locator: No call for tender variable
    quote: 'A contract is considered to have ''no call for tender'' red flag if two conditions are met:'
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - A software contract above the EU threshold appears only as an award notice, with no prior contract
    notice in TED.
  cases: []
  data_needed:
  - Contract (procedure type, notice publication)
  - ContractAward
  - PublicBody
  - Company
  checkable: records
  lookup_sources:
  - TED / national procurement gazette
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: award without prior publication outside the legally
      allowed exceptions'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Legal exceptions (extreme urgency, exclusive rights, follow-on works)
  - Contract below publication threshold
  - Notice published in a different outlet
  jurisdictions: EU, global
  version: 1
- id: PP-005
  name: Non-open, negotiated or accelerated procedure without justification
  definition: The buyer used a less competitive procedure type and did not give the legal reason for doing
    so.
  areas:
  - PP
  typology: Unjustified sole source award
  status: verified
  sources:
  - title: Integrity Watch Red Flags – About
    publisher: Transparency International EU / Integrity Watch
    url: https://redflags-cz.integritywatch.eu/about.php
    locator: 'Contract notices: Use of competitive negotiated procedure without justification'
