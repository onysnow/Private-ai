  - PP
  typology: Leaking of bid information / favoured bidder
  status: verified
  sources:
  - title: Cardinal red flags list
    publisher: Open Contracting Partnership
    url: https://cardinal.readthedocs.io/en/latest/cli/indicators/index.html
    locator: Red flags table, R003
    quote: The submission period is too short.
    quote_verified: true
    checked: '2026-10-08'
  - title: Red flags for integrity
    publisher: Open Contracting Partnership
    year: '2016'
    url: https://www.open-contracting.org/wp-content/uploads/2016/11/OCP2016-Red-flags-for-integrityshared-1.pdf
    locator: Table 1, p. 26
    quote: Short notice to bidders to submit expressions of interest or bids
    quote_verified: true
    checked: '2026-10-08'
  - title: Red Flags Listed by Project Cycle
    publisher: International Anti-Corruption Resource Center (IACRC)
    url: https://guide.iacrc.org/detection/red-flags-of-corruption-bid-rigging-and-other-schemes/red-flags-listed-by-project-cycle/
    locator: Advertisement stage
    quote: Short or Inadequate Notice to Bidders
    quote_verified: true
    checked: '2026-10-08'
  - title: Corruption risk measurement presentation
    publisher: Corruption Research Center Budapest
    year: '2015'
    url: https://www.crcb.eu/wp-content/uploads/2015/06/Fazekas_Czibik_Zagreb_TI_intpact_150609.pdf
    locator: Slide 6 (sic)
    quote: Lenght of advertisement period
    quote_verified: true
    checked: '2026-10-08'
  examples:
  - A tender published on 20 December with a 2 January deadline.
  cases: []
  data_needed:
  - Contract (publication date, tender deadline)
  - PublicBody
  checkable: records
  lookup_sources:
  - Procurement portal
  - National procurement law minimum periods
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded (period shorter than the legal minimum or a low
      outlier)
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Genuine emergency (disaster, health crisis)
  - Accelerated procedure legally allowed
  - Re-tender of a recently cancelled procedure where bidders already have documents
  jurisdictions: Global
  version: 1
- id: PP-004
