  - title: Integrity Watch Red Flags – About
    publisher: Transparency International EU / Integrity Watch
    url: https://redflags-cz.integritywatch.eu/about.php
    locator: 'Contract notices: Accelerated procedure without justification'
    quote: it signals a risk when the contracting authority opts for an accelerated procedure
