  - Product catalogues / industry experts
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: Meets the published definition as worded
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Compatibility with existing equipment
  - Genuine safety or quality needs
  - Inexperienced drafting
  jurisdictions: Global
  version: 1
- id: PP-009
  name: Evaluation criteria open to manipulation
