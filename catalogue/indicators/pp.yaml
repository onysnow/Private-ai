  sources:
  - title: Warning Signs of Fraud and Corruption in Procurement
    publisher: World Bank Group, INT
    year: '2019'
    url: https://documents.worldbank.org/curated/en/223241573576857116/text/Warning-Signs-of-Fraud-and-Corruption-in-Procurement.txt
    locator: Section 11, 'Poor quality of works or services'
    quote: Determining the right award decision also needs to be cognizant of abnormally low pricing,
      where a bid price is so low that it is questionable whether the contractor or supplier can deliver
      the contract for the price quoted.
    quote_verified: true
    checked: '2026-10-09'
  - title: 'Fraud in Public Procurement: A collection of Red Flags and Best Practices'
    publisher: European Commission, European Anti-Fraud Office (OLAF)
    year: '2017'
    url: https://sfc.ec.europa.eu/system/files/documents/sfc-files/fraud-public-procurement-final-20122017-ares20176254403.pdf
    locator: Section 2.3.2, general red flags for the tendering phase, p. 53
    quote: The bid price of a newcomer in a particular type of tender is significantly lower than the
      price of the experienced bidders;
    quote_verified: true
    checked: '2026-10-09'
  - title: Real Decreto 1098/2001, de 12 de octubre, por el que se aprueba el Reglamento general de la
      Ley de Contratos de las Administraciones Públicas
    publisher: Government of Spain, Boletín Oficial del Estado
    year: '2001'
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2001-19995
    locator: Artículo 85, Criterios para apreciar las ofertas desproporcionadas o temerarias en las subastas,
      points 1-3
    quote: 1. Cuando, concurriendo un solo licitador, sea inferior al presupuesto base de licitación en
      más de 25 unidades porcentuales. 2. Cuando concurran dos licitadores, la que sea inferior en más
      de 20 unidades porcentuales a la otra oferta. 3. Cuando concurran tres licitadores, las que sean
      inferiores en más de 10 unidades porcentuales a la media aritmética de las ofertas presentadas.
    quote_verified: true
    licence: Not stated on page (official Spanish legislation)
    checked: '2026-10-10'
  examples:
  - A first-time bidder wins a road contract at 40% below the engineer's estimate and then files large
    claims for 'unforeseen' costs.
  cases: []
  data_needed:
  - ContractAward (amount)
  - Contract (estimated value)
  - Company
  - Payment (later claims and change orders)
  checkable: records
  lookup_sources: []
  levels:
    faint: With three or more bidders, the bid is more than 10 percentage points below the arithmetic
      mean of the bids
    strong: With two bidders, the bid is more than 20 percentage points below the other bid
    textbook: With a single bidder, the bid is more than 25 percentage points below the base tender budget;
      Art. 85 also treats any discount above 25 percentage points as abnormally low
    threshold_source: https://www.boe.es/buscar/act.php?id=BOE-A-2001-19995
    threshold_note: 'Spain''s procurement regulation (Real Decreto 1098/2001, Art. 85) sets fixed percentage
      triggers for presuming a bid abnormally low (''desproporcionada o temeraria''). Point 5 lets the
      buyer cut these percentages by up to a third, with reasons. Spain only. Other sources: the EU Directive
      2014/24/EU (Art. 69) and the World Bank require checks but set no number. The OCP ''Red flags in
      public procurement'' guide (2024), R058 ''Heavily discounted bid'', which is also in Cardinal, flags
      a winning bid whose gap to the second-lowest valid bid is at or above the upper fence Q3 + 1.5(IQR).
      That is a statistical outlier rule, not a fixed percentage.'
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - A new entrant is buying market share.
  - The firm has spare capacity, its own materials or a cheaper method.
  - The cost estimate was too high.
  jurisdictions: World Bank projects; EU (Directive 2014/24/EU requires checks on abnormally low tenders)
  version: 2
