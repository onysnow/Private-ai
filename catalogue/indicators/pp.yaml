  - title: Fraud in Public Procurement – A collection of Red Flags and Best Practices
    publisher: European Commission (OLAF)
    year: '2017'
    url: https://sfc.ec.europa.eu/system/files/documents/sfc-files/fraud-public-procurement-final-20122017-ares20176254403.pdf
    locator: p. 20
    quote: The use of sole source procedure for a common type of good or service;
    quote_verified: true
    checked: '2026-10-09'
  - title: Corruption Risks Indicators (CRI) dataset
    publisher: Quality of Government Institute
    url: https://datafinder.qog.gu.se/dataset/cri
    locator: Non-open procedure variable
    quote: Whether a procedure is considered non-open depends on procedure type as well as specific country
      regulation.
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Office furniture bought through a negotiated procedure with a call sent to only one operator.
  cases: []
  data_needed:
  - Contract (procedure type, justification text)
  - PublicBody
  - Company
  checkable: records
  lookup_sources:
  - Procurement portal
  - National procurement law
  levels:
    faint: To be set by Ony
    strong: To be set by Ony
    textbook: 'Meets the published definition as worded: non-open procedure with missing or false legal
      grounds'
    threshold_source: none
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Real urgency
  - Technical or exclusive rights
  - Earlier open procedure failed with no suitable bids
  jurisdictions: EU, global
