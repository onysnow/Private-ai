- id: PP-052
  name: Turnout and vote-share 'fingerprint' skewed toward 100%
  definition: Plotting polling stations by turnout and winner's share shows a smear toward the top right
    and a cluster near 100% turnout with almost all votes for one party, the pattern of ballot stuffing.
  areas:
  - PP
  typology: Ballot stuffing / incremental and extreme fraud
  status: verified
  sources:
  - title: Statistical detection of systematic election irregularities
    publisher: Klimek, Yegorov, Hanel, Thurner (arXiv; PNAS 2012)
    year: '2012'
    url: https://arxiv.org/pdf/1201.3087
    locator: Parametric model, Figure 1 caption
    quote: The second peak is situated in the vicinity of the 100% turnout, 100% votes point.
    quote_verified: true
    checked: '2026-10-09'
  - title: Statistical detection of systematic election irregularities
    publisher: Klimek et al.
    year: '2012'
    url: https://arxiv.org/pdf/1201.3087
    locator: Parametric model
    quote: Extreme fraud corresponds to reporting a complete turnout and almost all votes for a single
      party.
    quote_verified: true
    checked: '2026-10-09'
  - title: Election Forensics Toolkit and Guide
    publisher: University of Michigan (Hicken & Mebane) / USAID, hosted by IIE
    url: https://www.iie.org/wp-content/uploads/2023/01/UM-Election-Forensics-Guide-FINAL.pdf
    locator: p. 10
    quote: fi is the probability of incremental fraud and fe is the probability of extreme fraud
    quote_verified: true
    checked: '2026-10-09'
  examples:
  - Hundreds of precincts report 99–100% turnout with 99% for the incumbent.
  cases:
  - name: Russian Duma election 2011 and presidential election 2012; Uganda 2011
    year: '2012'
    jurisdiction: Russia; Uganda
    what_happened: Klimek et al. found that 'for Russia and Uganda the shape of these fingerprints differ
      strongly from the other countries', and that reported Russian irregularities were well explained
      by systematic ballot stuffing. This is a statistical research finding, not a court or official ruling.
    outcome: alleged_in_reporting
    outcome_verified: true
    source_url: https://arxiv.org/pdf/1201.3087
    source_title: Statistical detection of systematic election irregularities
  data_needed:
  - 'Document (precinct-level results: registered voters, ballots cast, votes per party)'
  checkable: records
  lookup_sources:
  - Election commission precinct results
  levels:
    faint: The turnout-by-vote-share plot is smeared from the main cluster toward the upper right. The
      source gives no number for this
    strong: A separate cluster of polling units appears near 100% turnout with almost all votes going
      to one party
    textbook: A second peak appears in the vicinity of the 100% turnout, 100% votes point, and the model
      estimates extreme fraud above zero
    threshold_source: https://arxiv.org/pdf/1201.3087
    threshold_note: Applies to polling units' turnout and the winner's vote share. The 100%/100% point
      marks 'extreme fraud' in Klimek et al. For incremental and extreme fraud, the paper's cut-off is
      estimates 'significantly larger than zero', not a fixed number. As examples, the paper reports fe
      = 0.033 (Russia 2011) and fe = 0.021 (Russia 2012), and says these mean 'two to three percent of
      all electoral units experience extreme fraud'. The Michigan/USAID election forensics guide defines
      fi and fe but was not re-read for a fixed number.
  threshold_verified: true
  cross_hints: []
  innocent_explanations:
  - Real geographic heterogeneity, e.g. strongholds with high mobilisation
  - Closed communities (military bases, institutions) voting together
  - Strategic behaviour, which the guide notes can mimic fraud
  jurisdictions: Global
  version: 2
